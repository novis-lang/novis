# Two applications share this file. Each one has its own settings.
# The shop's settings apply only to programs in the `shop` folder.
[[app]]
root = "shop"

[app.settings]
admin_email = "owner@shop.example.com"

[app.settings.payment]
account = "shop-account-7"

# The blog is the attack program in this folder.
[[app]]
entry = "01-read-another-apps-settings.nvs"

[app.settings]
posts_per_page = 10
