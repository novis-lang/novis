# The attack writes files in new folders from `Core\IO::temporaryDir()`.
# The path of that folder is different on every computer, so these lines allow
# reading and writing files, and nothing else.
[capabilities.fs]
read = true
write = true

# The server allows at most 4 MiB of decompressed files for each archive.
[limits]
max_decompressed = "4M"
