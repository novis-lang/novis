# Each limit below except `memory` has the largest value its unit can hold.
# Novis should start the program anyway, and must not crash while it reads them.
[limits]
memory = "64M"
wall_time = "213503d"
cpu_time = "18446744073709551615ns"
max_tasks = "18446744073709551615"
max_output = "16777215T"
max_regex_steps = "18446744073709551615"
max_decompression_ratio = "18446744073709551615"

[limits.hard]
wall_time = "18446744073709551615ns"
max_tasks = false
