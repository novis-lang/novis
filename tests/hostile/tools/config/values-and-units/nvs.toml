# Each limit below except `memory` has a value that is far too large, or is not in its unit.
# Novis should start the program anyway, and must not crash while it reads them.
[limits]
memory = "64M"
wall_time = "99999999999999999d"
cpu_time = "18446744073709551616ns"
max_tasks = "99999999999999999999"
max_output = "16777216T"
max_regex_steps = "1e9"
max_decompression_ratio = "-1"

[limits.hard]
wall_time = "1m30s"
max_tasks = false
