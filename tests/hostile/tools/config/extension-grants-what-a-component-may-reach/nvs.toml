# The attacks call the extension `Geo\Atlas` from the examples of this feature.
# The extension may read and write the folder `data/geo/`, and connect to two hosts.
# It asks to read files and to connect to `tiles.example.com` and `routes.example.com`.
[[extension]]
path = "../../../../../docs/examples/tools/config/extension-grants-what-a-component-may-reach/atlas.nvsx"
sha256 = "8bb2081b5d76340eb1cdc2cf22b0eaa2144bb7851b83abb5662c1b369ce9694b"
grants = { read = ["data/geo/"], write = ["data/geo/"], connect = ["tiles.example.com", "maps.example.com"] }

# The fifth attack calls `Geo\Notes\Reader`, which comes with the extension `Geo\Notes`.
[[extension]]
path = "notes.nvsx"
sha256 = "b953d9caf0a98fa69bb6e4476edfd24be4fa51a8f876e0e2a208b51e0ecc61a4"

# The attacks may read and write the folder `data/`, and connect to any host.
[capabilities.fs]
read = ["data/"]
write = ["data/"]

[capabilities.net]
connect = true

# The third attack may only read the folder `data/geo/roads/`. It may not write or connect.
[[app]]
entry = "03-past-what-the-program-may-reach.nvs"

[app.capabilities.fs]
read = ["data/geo/roads/"]
write = false

[app.capabilities.net]
connect = false
