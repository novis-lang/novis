source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/parse.rs"
class = "wrong-output"
direction = "to-html"
input = ">\n\t>a\n\n>x\n\t>b"
html = "<blockquote>\n</blockquote>\n<pre><code>&gt;a\n</code></pre>\n<blockquote>\n<p>x\n&gt;b</p>\n</blockquote>\n"

# Found by the `markdown_comrak` differential fuzz target. cmark-gfm takes a table's header row from the
