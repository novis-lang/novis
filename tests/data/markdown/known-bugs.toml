# The known-bug catalogue of the `markdown` goal: bugs that major Markdown libraries shipped, each
# one a case `Core\Markdown` must pass. `crates/nvs-stdlib/tests/markdown_known_bugs.rs` reads this
# file, holds its shape, and fails naming each entry that does not render as expected.
#
# Every entry is one `[[bug]]` table:
#
#   id          unique lowercase slug, starting with the library's
#   library     the library that shipped the bug, one of the fourteen the test lists
#   source      the public advisory, CVE, issue, pull request or pinned test file that records it
#   class       slow | output-blowup | deep-nesting | crash | xss | url-scheme |
#               attribute-injection | wrong-output | markdown-injection
#   direction   to-html (Markdown in) or from-html (HTML in)
#   input       the minimal input
#   repeat      optional: a unit written n times after `input`; the test picks n
#   suffix      optional: written after the repeats
#
# and exactly one expectation:
#
#   html            the exact HTML; for from-html, the HTML the produced Markdown renders to
#   html_lacks      substrings the HTML never contains
#   markdown        the exact Markdown
#   markdown_lacks  substrings the Markdown never contains
#   work            "linear": work grows linearly with n
#   output          "bounded": output is at most the input's length plus 64 KiB
#
# `html_lacks` stands where the exact HTML depends on the sanitizer's rebuild, which the goal's
# stage 2 writes into the rules; stage 3 may turn one into an exact `html`. Every string is a TOML
# basic string, so a control character is written as an escape.

