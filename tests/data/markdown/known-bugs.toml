html = "<p>|\n:-:|\na|\n:-:|\nb</p>\n<p>|</p>\n<table>\n<thead>\n<tr>\n<th align=\"center\">a</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td align=\"center\">c</td>\n</tr>\n</tbody>\n</table>\n"

# Found by the `markdown_comrak` differential fuzz target. A block quote marker is indented three columns
