# Found by the `markdown_comrak` differential fuzz target: a single `~` inside a word does not open
# or close strikethrough, and a `~~` opens where it is not left-flanking. GFM reads both as `*`.
[[bug]]
id = "pulldown-cmark-issue-1078"
library = "pulldown-cmark"
source = "https://github.com/pulldown-cmark/pulldown-cmark/issues/1078"
class = "wrong-output"
direction = "to-html"
input = "j~o~ and a~o~b and 'a~~#~~"
html = "<p>j<del>o</del> and a<del>o</del>b and 'a~~#~~</p>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 inline pass counts tabs as well
# as spaces before a line ending, so two tabs make a hard line break, where the spec needs two spaces.
[[bug]]
id = "pulldown-cmark-tab-hard-break"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/firstpass.rs"
class = "wrong-output"
direction = "to-html"
input = "a\t\t\nb \t\nc\t  \nd"
html = "<p>a\nb\nc<br>\nd</p>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 heading scan takes a vertical
# tab or a form feed after `#` as the space an ATX heading needs.
[[bug]]
id = "pulldown-cmark-heading-vertical-tab"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/scanners.rs"
class = "wrong-output"
direction = "to-html"
input = "#\u000B)\n\n#\u000Ca\n\n# b"
html = "<p>#\u000B)</p>\n<p>#\u000Ca</p>\n<h1>b</h1>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 inline pass keeps one lower bound
# for `~` and `~~`, so a `~~` closer with no opener moves it past a `~` opener that a later `~` closes.
[[bug]]
id = "pulldown-cmark-tilde-lower-bound"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/parse.rs"
class = "wrong-output"
direction = "to-html"
input = "A~w~~A~w~~"
html = "<p>A<del>w~~A</del>w~~</p>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 inline pass lets a `~~` closer
# look past a nearer `~` opener. cmark-gfm matches the nearest `~` opener the rule of three allows, or
# none, and a closer of the other length is text. A `~~` after an escaped `\~` could always close,
# where GFM reads the `~` before it as punctuation.
[[bug]]
id = "pulldown-cmark-tilde-nearest-opener"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/parse.rs"
class = "wrong-output"
direction = "to-html"
input = "a ~~b ~c~~ d~\n\n~~:~::~:\n\nx\\~~~a x\\~~~b"
html = "<p>a ~~b <del>c~~ d</del></p>\n<p>~~:<del>::</del>:</p>\n<p>x~~~a x~~~b</p>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 block pass reads a list item with
# nothing after its task marker as one that starts with a blank line, so a lazy continuation line
# ends the list. In CommonMark `[ ]` is a paragraph, and the next line continues it.
[[bug]]
id = "pulldown-cmark-empty-task-item-laziness"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/firstpass.rs"
class = "wrong-output"
direction = "to-html"
input = "- [ ] \nfoo"
html = "<ul>\n<li><input disabled=\"\" type=\"checkbox\"> \nfoo</li>\n</ul>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 task marker scan needs a byte
# after `]`, so a task item at the very end of the document, with no line ending, is text.
[[bug]]
id = "pulldown-cmark-task-marker-at-end"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/scanners.rs"
class = "wrong-output"
direction = "to-html"
input = "- [x]"
html = "<ul>\n<li><input checked=\"\" disabled=\"\" type=\"checkbox\"> </li>\n</ul>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 task marker scan takes any
# whitespace but a line ending between the brackets, so `[\t]` is a box. cmark-gfm's pattern is
# `[ ]` or `[x]`, so a tab there is text.
[[bug]]
id = "pulldown-cmark-task-marker-tab"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/scanners.rs"
class = "wrong-output"
direction = "to-html"
input = "- [\t] a"
html = "<ul>\n<li>[\t] a</li>\n</ul>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 reference scan reads the
# second label from the node after the `]`, and the node after an escaped `\[` starts at the `[`.
# So `[]\[a]` was a full reference link with no text.
[[bug]]
id = "pulldown-cmark-escaped-second-label"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/parse.rs"
class = "wrong-output"
direction = "to-html"
input = "[a]: /u\n\n[]\\[a] [b]\\[a]"
html = "<p>[][a] [b][a]</p>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 table scan needs a pipe in the
# header row and in the delimiter row. GFM needs only as many header cells as the delimiter row has,
# so `a` over `-|` and over `-:` is a table. `a` over `---` is a setext heading, which comes first.
[[bug]]
id = "pulldown-cmark-table-header-without-pipe"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/firstpass.rs"
class = "wrong-output"
direction = "to-html"
input = "a\n-|\nb\n\nc\n-:\n\nd\n---"
html = "<table>\n<thead>\n<tr>\n<th>a</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>b</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th align=\"right\">c</th>\n</tr>\n</thead>\n</table>\n<h2>d</h2>\n"

# Found by the `markdown_comrak` differential fuzz target. The 0.13.6 delimiter-row scan takes a colon or
# a space anywhere in a cell. GFM allows a colon only at a cell's start or end, so `:-:-` is not a cell.
[[bug]]
id = "pulldown-cmark-table-delimiter-cell"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/scanners.rs"
class = "wrong-output"
direction = "to-html"
input = "|a|\n|:-:-|\n\n|b|\n|- -|"
html = "<p>|a|\n|:-:-|</p>\n<p>|b|\n|- -|</p>\n"

# Found by the `markdown_comrak` differential fuzz target. pulldown-cmark gives raw HTML inside an image's
# description as an inline HTML event, and its own writer puts that text into the `alt`, as cmark does.
# A renderer over its events that reads only text events loses the tag's source text from the `alt`.
[[bug]]
id = "pulldown-cmark-raw-html-in-image-alt"
library = "pulldown-cmark"
source = "https://docs.rs/crate/pulldown-cmark/0.13.6/source/src/html.rs"
class = "wrong-output"
direction = "to-html"
input = "![a<div>b</div>](c.png)"
html = "<p><img src=\"c.png\" alt=\"a<div>b</div>\"></p>\n"

# Found by the `markdown_comrak` differential fuzz target. pulldown-cmark 0.13.6 gives a loose task item's
# marker inside its first paragraph, so the box is written inside the `p`. cmark-gfm's tasklist extension
