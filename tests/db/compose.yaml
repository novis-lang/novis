# Every server a test needs, as one file: the five ADR 0067's *Verification* names, and the SMTP catcher
# goal `core-part-ii`'s stage 9 points `Core\Mail` at.
#
# `tools/loop.py` brings these up once per run -- `docker compose -f tests/db/compose.yaml up -d --wait
# <services>` -- from the current goal's `[docker]` block: goal `core-part-ii` names `redis` and `mailpit`, goal `database` the
# five database servers, and goal `server` reuses `postgres` and `redis` alone. `--wait` is why every service below
# carries a healthcheck: it makes "up" mean *healthy* rather than *started*, so a driver's first
# connection is not racing the server's own initialisation.
#
# Three standing decisions this file makes, each because rediscovering it costs an afternoon:
#
# * **Every image is pinned to a patch version.** A driver matrix that silently moved from MySQL 8.4.11 to
#   8.5 would report a protocol change as a regression in our own code.
# * **No data volumes.** A container's own filesystem holds the data, so `down` destroys it and every
#   `up` starts from a first-boot database. The alternative -- a named volume outliving a credential
#   change in this file -- is the classic "access denied for a password that is right there" hour.
# * **Host ports are non-standard and bound to `127.0.0.1`.** MySQL and MariaDB cannot both be 3306, a
#   developer machine often already runs one of these, and a test server must never answer the LAN.
#
# TLS is on for all of them, because ADR 0067 verifies it per driver and `Core\Mail`'s endpoint shape
# is 0067's:
#
# * MySQL 8.4 generates its own CA and leaf at first boot, in the data directory, and this file points it
#   at the `certs` volume's pair instead: the auto-generated leaf carries no `subjectAltName` at all, so a
#   client that verifies a name -- the only kind `nvs_host::tls` has -- refuses it however good the
#   anchor is. `/certs/ca.crt` is therefore its anchor too, exactly as PostgreSQL's is.
# * MariaDB 11.4 does NOT, as this file configures it -- `ssl_cert` comes back empty from the running
#   server, so it serves no certificate and nothing can verify it. Giving it the `certs` volume below is
#   Stage 6's own work; until then `tools/db-matrix.py` reports it `n/a` rather than running it.
# * SQL Server generates one too and encrypts the login packet regardless, but keeps it inside the
#   instance rather than on the filesystem, so there is no file to hand a client as an anchor.
# * PostgreSQL, Redis and Mailpit do not, so the `certs` service below issues them one in a shared
#   volume -- a private CA, and a leaf signed by it, which MySQL above is pointed at as well.
#
# No server here presents a certificate any public root vouches for, so a client verifies against a
# private anchor or it does not connect. For the four the `certs` service serves, that anchor is one
# command away:
#
#     docker compose -f tests/db/compose.yaml cp postgres:/certs/ca.crt tests/db/ca.crt
#
# Credentials are fixed and public on purpose -- these servers hold nothing, reach nothing, and listen on
# loopback. `python tools/db-matrix.py` is what points ADR 0067's per-driver list at them.

name: novis-db

services:
  # ---------------------------------------------------------------------------------------------------
  # A two-certificate chain for the servers that will not make their own: a CA, and a leaf signed by it.
  # It runs to completion before any of them starts, and is a no-op on every run after the first: the
  # volume already has the CA key.
  #
  # **The leaf and the anchor may not be the same certificate.** `openssl req -x509` issues one with
  # `CA:TRUE`, and a TLS client that verifies rather than merely encrypts refuses exactly that as an
  # end-entity -- rustls reports `CaUsedAsEndEntity`, which reads as a trust-store problem and is not
  # one. So `ca.crt` is its own certificate rather than a copy of `server.crt`, and the leaf is a
  # second `openssl x509 -req` against it. `-copy_extensions copyall` is what carries the CSR's SAN,
  # `CA:FALSE` and `serverAuth` onto the issued certificate; without it the leaf has no SAN at all and
  # no client will match a hostname to it.
  #
  # The guard file is the CA key, not the server key. A volume left over from the single self-signed
  # certificate has `server.key` and no `ca.key`, so it re-issues both rather than preserving the shape
  # that could not be verified.
  #
  # `chown 999` is not cosmetic. PostgreSQL refuses to start on a key with group or world access, and
  # both images run as uid 999, so the key is 0600 and owned by exactly that. The CA key stays root's:
  # nothing but this service ever reads it.
  #
  # `mssql.key` is that same key under a second name owned by uid 10001, because SQL Server runs as that
  # user and reads its key itself: one file cannot be 0600 for two uids, and a mode any other user could
  # read is one `sqlservr` refuses. Its three steps sit *outside* the guarded group on purpose, so a
  # volume generated before they existed gains the copy on the next `up` instead of only on a fresh one.
  # ---------------------------------------------------------------------------------------------------
  certs:
    image: alpine/openssl:3.5.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        test -f /certs/ca.key ||
        (openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj "/CN=Novis test CA"
        -addext "basicConstraints=critical,CA:TRUE"
        -addext "keyUsage=critical,keyCertSign,cRLSign"
        -keyout /certs/ca.key -out /certs/ca.crt
        && openssl req -new -newkey rsa:2048 -nodes
        -subj "/CN=localhost"
        -addext "basicConstraints=critical,CA:FALSE"
        -addext "keyUsage=critical,digitalSignature,keyEncipherment"
        -addext "extendedKeyUsage=serverAuth"
        -addext "subjectAltName=DNS:localhost,DNS:postgres,DNS:redis,IP:127.0.0.1"
        -keyout /certs/server.key -out /certs/server.csr
        && openssl x509 -req -in /certs/server.csr -days 3650
        -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial
        -copy_extensions copyall -out /certs/server.crt
        && chown 999:999 /certs/server.key /certs/server.crt /certs/ca.crt
        && chmod 600 /certs/server.key /certs/ca.key
        && chmod 644 /certs/server.crt /certs/ca.crt)
        && cp -f /certs/server.key /certs/mssql.key
        && chown 10001:10001 /certs/mssql.key
        && chmod 600 /certs/mssql.key
        && chown 999:999 /sock
    volumes:
      - certs:/certs
      # Not a certificate, and here anyway: the directory `redis` below publishes its Unix socket
      # into is a bind mount, so Docker creates it owned by root when it is missing and the redis
      # image drops to uid 999 before it binds. This service is already the root-owned thing that
      # runs to completion first, and the `chown` above is the whole of what it takes -- where a
      # second service, or a `user:` override the image's own entrypoint would undo, is two moving
      # parts for one directory. The source is the `redis` service's, whose comment owns the path.
      - ${NOVIS_SOCKET_DIR:-/mnt/host/wsl/novis-redis}:/sock

  # ---------------------------------------------------------------------------------------------------
  # MySQL. `executeMany`'s bulk path and `INSERT … ON DUPLICATE KEY UPDATE` reporting 2 for an updated
  # row are both verified here and against MariaDB, which is why the two are separate servers rather
  # than one with a flag -- ADR 0067 § 1.
  # ---------------------------------------------------------------------------------------------------
  mysql:
    image: mysql:8.4.11
    depends_on:
      certs:
        condition: service_completed_successfully
    # The `certs` leaf rather than the one MySQL issues itself at first boot. Both are signed by a CA
    # a client can be handed, and only this one carries a `subjectAltName`: MySQL's auto-generated
    # certificate has none at all, and a TLS client that verifies a name -- which is the only kind
    # `nvs_host::tls` has -- refuses it before any credential is offered. `--ssl-ca` is named too so
    # the server's own view of its chain is the same file the client verifies against.
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: Novis-Root-Pw1
      MYSQL_DATABASE: novis_test
      MYSQL_USER: novis
      MYSQL_PASSWORD: Novis-Test-Pw1
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - certs:/certs:ro

  # ---------------------------------------------------------------------------------------------------
  # MariaDB, on the 11.4 LTS line because that is the release that turns TLS on by itself.
  # `healthcheck.sh` ships in the image; `--innodb_initialized` is the difference between a listening
  # socket and a server that can serve.
  #
  # Turning TLS on by itself is not the same as being verifiable, which is why the `certs` leaf is
  # named here as it is for MySQL two blocks above: 11.4 generates its own certificate at first boot
  # with no `subjectAltName`, and a client that verifies a name -- the only kind `nvs_host::tls` has --
  # refuses it before any credential is offered. Naming the three files replaces that certificate with
  # the one `tools/db-matrix.py` hands the client as its anchor, and without them this server is one
  # the matrix reports `n/a` rather than runs.
  # ---------------------------------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4.13
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    ports: ["127.0.0.1:13307:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: Novis-Root-Pw1
      MARIADB_DATABASE: novis_test
      MARIADB_USER: novis
      MARIADB_PASSWORD: Novis-Test-Pw1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - certs:/certs:ro

  # ---------------------------------------------------------------------------------------------------
  # PostgreSQL -- the first driver, per goal `database`'s standing decisions, because its extended protocol pays
  # nothing extra for a prepare. It also carries the `::` cast and the jsonb `?` operator that the
  # placeholder rewriter has to leave alone.
  # ---------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: novis
      POSTGRES_PASSWORD: Novis-Test-Pw1
      POSTGRES_DB: novis_test
    volumes:
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novis -d novis_test"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------------------------------
  # SQL Server. The image has no `docker-entrypoint-initdb.d`, and the goal's `[docker]` block names
  # five services rather than six, so a one-shot init container would never be started by the driver.
  # The healthcheck creates the database instead: it is idempotent, it runs until it succeeds anyway,
  # and `--wait` returning means both "the server answers" and "the database is there".
  #
  # The certificate is the one place SQL Server is not like the other three. It has no `--ssl-cert`
  # equivalent and no environment variable for one: left alone it generates a certificate *inside the
  # instance*, which is presented at every handshake and cannot be copied out as a file, so there is
  # nothing `tools/db-matrix.py` could hand a client as an anchor. `mssql.conf`'s `[network]` section is
  # the only way to point it at one, and it is written here rather than mounted -- `mssql-conf` rewrites
  # that file in place during setup, which a bind-mounted host file cannot survive. Hence the entrypoint
  # override: write the section, then `exec` the server the image's own CMD names. `forceencryption`
  # makes a misconfigured certificate stop the server rather than quietly serving the instance's own
  # again, and the key is the `certs` job's second copy for the reason that job's header gives.
  # ---------------------------------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    depends_on:
      certs:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        printf '[network]\ntlscert = /certs/server.crt\ntlskey = /certs/mssql.key\nforceencryption = 1\n'
        > /var/opt/mssql/mssql.conf
        && exec /opt/mssql/bin/sqlservr
    ports: ["127.0.0.1:11433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Novis-Test-Pw1
      MSSQL_PID: Developer
    volumes:
      - certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
          -Q "IF DB_ID('novis_test') IS NULL CREATE DATABASE novis_test"
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ---------------------------------------------------------------------------------------------------
  # Redis, here because goal `core-part-ii`'s shared cache tier and goal `server`'s fleet lease both use it and one compose
  # file is better than two that drift. Both ports are open: 6379 plain and 6380 TLS, so a test can
  # assert the encrypted path without a second container.
  # ---------------------------------------------------------------------------------------------------
  redis:
    image: redis:8.2.9
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - redis-server
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
      # ADR 0142's second door onto the same store, which `examples/cache-shared-socket.nvs` is the
      # fixture for. It is a third listener and not a second service: the claim that fixture makes
      # is about the transport, so a socket onto a *different* store would be asserting the
      # transport and the store at once. `unixsocketperm` is world-writable because the process
      # that connects is a developer's own and the store holds nothing -- the same reading the
      # loopback bindings above are written under.
      - --unixsocket
      - /sock/redis.sock
      - --unixsocketperm
      - "777"
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:16380:6380"
    volumes:
      - certs:/certs:ro
      # A source under the tmpfs every WSL2 distro shares, because on Docker Desktop the daemon runs
      # in its own distro and a bind mount resolves inside *that* one. Its `/mnt/wsl` is a private
      # directory of its own root filesystem; the shared tmpfs is mounted there at `/mnt/host/wsl`,
      # so this is the one source spelling from Windows under which the socket the container
      # creates is the socket the WSL leg finds at `/mnt/wsl/novis-redis`. Docker Desktop's WSL
      # integration plays no part -- the daemon's mount table decides, not the leg's PATH. On a
      # Linux host the daemon and the client share one filesystem, so `NOVIS_SOCKET_DIR` names the
      # plain directory the client's URL spells. `examples/cache-shared-socket.toml` is where the
      # client half is written, and the check that reads it carries `needs = "af-unix"`.
      - ${NOVIS_SOCKET_DIR:-/mnt/host/wsl/novis-redis}:/sock
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------------------------------
  # Mailpit, the SMTP endpoint goal `core-part-ii`'s stage 9 points `Core\Mail` at. It is a catcher, not a relay: it
  # stores what it accepts and forwards NOTHING -- no `MP_SMTP_RELAY_*` is set, so no test can cause a
  # real email to leave this machine, and the loopback binding above means nothing off it can connect
  # anyway. Delivery is asserted over the HTTP API on 18025 (`GET /api/v1/messages`). STARTTLS serves
  # the shared self-signed certificate, and AUTH is fixed to the same public credentials the databases
  # use -- allowed on the plain connection too, so a test can exercise either path.
  # ---------------------------------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.0
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    environment:
      MP_SMTP_TLS_CERT: /certs/server.crt
      MP_SMTP_TLS_KEY: /certs/server.key
      MP_SMTP_AUTH: "novis:Novis-Test-Pw1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  certs:
