# Every server a test needs, as one file: the five database servers `Core\Db` speaks, `redis`, the
# SMTP catcher `Core\Mail` is tested against, and the Samba AD domain controller `Core\Ldap` is
# tested against.
#
# `docker compose -f tests/db/compose.yaml up -d --wait <services>` brings them up, and `bun nv
# db-matrix` runs it for the database servers. `--wait` is why every service below
# carries a healthcheck: it makes "up" mean *healthy* rather than *started*, so a driver's first
# connection is not racing the server's own initialisation.
#
# Three standing decisions this file makes, each because rediscovering it costs an afternoon:
#
# * **Every image is pinned to a patch version.** A driver matrix that silently moved from MySQL 9.7.2 to
#   9.8 would report a protocol change as a regression in our own code.
# * **No data volumes.** A container's own filesystem holds the data, so `down` destroys it and every
#   `up` starts from a first-boot database. The alternative -- a named volume outliving a credential
#   change in this file -- is the classic "access denied for a password that is right there" hour.
# * **Host ports are non-standard and bound to `127.0.0.1`.** MySQL and MariaDB cannot both be 3306, a
#   developer machine often already runs one of these, and a test server must never answer the LAN.
#
# TLS is on for all of them, because `rule:core-classes/db-safe-connection-defaults` is verified per
# driver and `Core\Mail`'s endpoint shape is `Core\Db`'s:
#
# * MySQL and MariaDB each generate their own CA and leaf at first boot, and this file points both at the
#   `certs` volume's pair instead: the auto-generated leaf carries no `subjectAltName` at all, so a
#   client that verifies a name -- the only kind `nvs_host::tls` has -- refuses it however good the
#   anchor is. `/certs/ca.crt` is therefore their anchor too, exactly as PostgreSQL's is.
# * SQL Server generates one too and encrypts the login packet regardless, but keeps it inside the
#   instance rather than on the filesystem, so there is no file to hand a client as an anchor.
# * PostgreSQL, Redis and Mailpit do not, so the `certs` service below issues them one in a shared
#   volume -- a private CA, and a leaf signed by it, which MySQL above is pointed at as well.
#
# No server here presents a certificate any public root vouches for, so a client verifies against a
# private anchor or it does not connect. For the four the `certs` service serves, that anchor is one
# command away:
#
#     docker compose -f tests/db/compose.yaml cp postgres:/certs/ca.crt tests/db/ca.crt
#
# Credentials are fixed and public on purpose -- these servers hold nothing, reach nothing, and listen on
# loopback. `bun nv db-matrix` is what points the per-driver list at them.

name: novis-db

services:
  # ---------------------------------------------------------------------------------------------------
  # A two-certificate chain for the servers that will not make their own: a CA, and a leaf signed by it.
  # It runs to completion before any of them starts, and is a no-op on every run after the first: the
  # volume already has the CA key.
  #
  # **The leaf and the anchor may not be the same certificate.** `openssl req -x509` issues one with
  # `CA:TRUE`, and a TLS client that verifies rather than merely encrypts refuses exactly that as an
  # end-entity -- rustls reports `CaUsedAsEndEntity`, which reads as a trust-store problem and is not
  # one. So `ca.crt` is its own certificate rather than a copy of `server.crt`, and the leaf is a
  # second `openssl x509 -req` against it. `-copy_extensions copyall` is what carries the CSR's SAN,
  # `CA:FALSE` and `serverAuth` onto the issued certificate; without it the leaf has no SAN at all and
  # no client will match a hostname to it.
  #
  # Two guards, one per certificate. The CA is made only when `ca.key` is missing, and making it deletes
  # the leaf, so a volume left over from the single self-signed certificate re-issues both. The leaf is
  # issued again whenever its SAN lacks `DNS:samba-ad`, the last name added to it, against the CA the
  # volume already has: an anchor a developer copied out of the volume stays valid. Adding a name to the
  # SAN means moving that check to the new name. The leaf keeps `server.key` when the volume has one.
  #
  # `chown 999` is not cosmetic. PostgreSQL refuses to start on a key with group or world access, and
  # both images run as uid 999, so the key is 0600 and owned by exactly that. The CA key stays root's:
  # nothing but this service ever reads it.
  #
  # `mssql.key` is that same key under a second name owned by uid 10001, because SQL Server runs as that
  # user and reads its key itself: one file cannot be 0600 for two uids, and a mode any other user could
  # read is one `sqlservr` refuses. Its three steps sit *outside* the guarded group on purpose, so a
  # volume generated before they existed gains the copy on the next `up` instead of only on a fresh one.
  # ---------------------------------------------------------------------------------------------------
  certs:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        (test -f /certs/ca.key ||
        (openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj "/CN=Novis test CA"
        -addext "basicConstraints=critical,CA:TRUE"
        -addext "keyUsage=critical,keyCertSign,cRLSign"
        -keyout /certs/ca.key -out /certs/ca.crt
        && chmod 600 /certs/ca.key
        && rm -f /certs/server.crt))
        && ((test -f /certs/server.crt
        && openssl x509 -in /certs/server.crt -noout -ext subjectAltName | grep -q DNS:samba-ad) ||
        ((test -f /certs/server.key || openssl genrsa -out /certs/server.key 2048)
        && openssl req -new -key /certs/server.key
        -subj "/CN=localhost"
        -addext "basicConstraints=critical,CA:FALSE"
        -addext "keyUsage=critical,digitalSignature,keyEncipherment"
        -addext "extendedKeyUsage=serverAuth"
        -addext "subjectAltName=DNS:localhost,DNS:postgres,DNS:redis,DNS:samba-ad,IP:127.0.0.1"
        -out /certs/server.csr
        && openssl x509 -req -in /certs/server.csr -days 3650
        -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial
        -copy_extensions copyall -out /certs/server.crt
        && chown 999:999 /certs/server.key /certs/server.crt /certs/ca.crt
        && chmod 600 /certs/server.key
        && chmod 644 /certs/server.crt /certs/ca.crt))
        && cp -f /certs/server.key /certs/mssql.key
        && chown 10001:10001 /certs/mssql.key
        && chmod 600 /certs/mssql.key
        && chown 999:999 /sock
        && mkdir -p /db-sock/mysql /db-sock/mariadb /db-sock/postgres
        && chown 999:999 /db-sock/mysql /db-sock/mariadb /db-sock/postgres
    volumes:
      - certs:/certs
      # Not certificates, and here anyway: the directories the servers below publish their Unix
      # sockets into are bind mounts, so Docker creates one owned by root when it is missing and
      # every one of those images drops to uid 999 before it binds. This service is already the
      # root-owned thing that runs to completion first, and the `chown`s above are the whole of what
      # that takes -- where a second service, or a `user:` override an image's own entrypoint would
      # undo, is two moving parts for one directory. The sources are `redis`'s and the three
      # database servers', whose own comments own the paths.
      #
      # The three database directories are *made* here and not only chowned, because Docker creates a
      # missing bind source at the moment the container wanting it starts -- which is after this
      # service has run, so a directory left to Docker would be root's for the whole of the run that
      # needed it.
      - ${NOVIS_SOCKET_DIR:-/mnt/host/wsl/novis-redis}:/sock
      - ${NOVIS_DB_SOCKET_DIR:-/mnt/host/wsl/novis-db}:/db-sock

  # ---------------------------------------------------------------------------------------------------
  # MySQL. `executeMany`'s bulk path and `INSERT … ON DUPLICATE KEY UPDATE` reporting 2 for an updated
  # row are both verified here and against MariaDB, which is why the two are separate servers rather
  # than one with a flag -- `rule:core-classes/db-one-api`.
  # ---------------------------------------------------------------------------------------------------
  mysql:
    # HOLD (revisit 2026-11-30): 9.7 is MySQL's LTS line, which the `lts` tag names at 9.7.4; 26.10.0 is an Innovation release, supported only until the next one.
    image: mysql:9.7.4
    depends_on:
      certs:
        condition: service_completed_successfully
    # The `certs` leaf rather than the one MySQL issues itself at first boot. Both are signed by a CA
    # a client can be handed, and only this one carries a `subjectAltName`: MySQL's auto-generated
    # certificate has none at all, and a TLS client that verifies a name -- which is the only kind
    # `nvs_host::tls` has -- refuses it before any credential is offered. `--ssl-ca` is named too so
    # the server's own view of its chain is the same file the client verifies against.
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: Novis-Root-Pw1
      MYSQL_DATABASE: novis_test
      MYSQL_USER: novis
      MYSQL_PASSWORD: Novis-Test-Pw1
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - certs:/certs:ro
      # `rule:core-classes/db-unix-socket-path`'s transport, published where the process running the
      # matrix can reach it. The directory is the server's own default one and the socket keeps the
      # name that server gives it, so nothing here is a spelling a deployment would not already have:
      # `bun nv db-matrix` hands the file to a second run of the TCP case list and the driver opens
      # it exactly as an operator's own `host` would be.
      #
      # A subdirectory per server rather than one shared directory, because each of these images
      # keeps its pid file and its lock beside the socket, and one directory would make three
      # servers' run-time state a single directory's. The `redis` service below owns why the source
      # is spelled `/mnt/host/wsl` and what a client on this host finds it as; `certs` above is what
      # makes it writable by the uid 999 all three of these images drop to.
      - ${NOVIS_DB_SOCKET_DIR:-/mnt/host/wsl/novis-db}/mysql:/run/mysqld

  # ---------------------------------------------------------------------------------------------------
  # MariaDB, on its LTS line. `healthcheck.sh` ships in the image; `--innodb_initialized` is the
  # difference between a listening socket and a server that can serve.
  #
  # Turning TLS on by itself is not the same as being verifiable, which is why the `certs` leaf is
  # named here as it is for MySQL two blocks above: MariaDB generates its own certificate at first boot
  # with no `subjectAltName`, and a client that verifies a name -- the only kind `nvs_host::tls` has --
  # refuses it before any credential is offered. Naming the three files replaces that certificate with
  # the one `bun nv db-matrix` hands the client as its anchor, and without them this server is one
  # the matrix reports `n/a` rather than runs.
  # ---------------------------------------------------------------------------------------------------
  mariadb:
    # HOLD (revisit 2026-11-30): 12.3 is MariaDB's LTS line, which the `lts` tag names at 12.3.3; 13.0.2 is a rolling release, supported only until the next one.
    image: mariadb:12.3.3
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    ports: ["127.0.0.1:13307:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: Novis-Root-Pw1
      MARIADB_DATABASE: novis_test
      MARIADB_USER: novis
      MARIADB_PASSWORD: Novis-Test-Pw1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - certs:/certs:ro
      # The socket leg, whose shape the `mysql` service above owns. `healthcheck.sh` reaches this
      # server through this very socket, so publishing it is also what keeps that check honest --
      # moving the server off its default path is what would have broken it.
      - ${NOVIS_DB_SOCKET_DIR:-/mnt/host/wsl/novis-db}/mariadb:/run/mysqld

  # ---------------------------------------------------------------------------------------------------
  # PostgreSQL -- the first driver, per goal `database`'s standing decisions, because its extended protocol pays
  # nothing extra for a prepare. It also carries the `::` cast and the jsonb `?` operator that the
  # placeholder rewriter has to leave alone.
  # ---------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: novis
      POSTGRES_PASSWORD: Novis-Test-Pw1
      POSTGRES_DB: novis_test
    volumes:
      - certs:/certs:ro
      # The socket leg, whose shape the `mysql` service above owns. PostgreSQL's `host` is the
      # directory and never the file -- `rule:core-classes/db-unix-socket-path` -- so this is the
      # one of the three whose published path is what a client is handed as written, and
      # `pg_isready` above reaches the server through the same socket.
      - ${NOVIS_DB_SOCKET_DIR:-/mnt/host/wsl/novis-db}/postgres:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novis -d novis_test"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------------------------------
  # SQL Server. The image has no `docker-entrypoint-initdb.d`, and the goal's `[docker]` block names
  # five services rather than six, so a one-shot init container would never be started by the driver.
  # The healthcheck creates the database instead: it is idempotent, it runs until it succeeds anyway,
  # and `--wait` returning means both "the server answers" and "the database is there".
  #
  # The certificate is the one place SQL Server is not like the other three. It has no `--ssl-cert`
  # equivalent and no environment variable for one: left alone it generates a certificate *inside the
  # instance*, which is presented at every handshake and cannot be copied out as a file, so there is
  # nothing `bun nv db-matrix` could hand a client as an anchor. `mssql.conf`'s `[network]` section is
  # the only way to point it at one, and it is written here rather than mounted -- `mssql-conf` rewrites
  # that file in place during setup, which a bind-mounted host file cannot survive. Hence the entrypoint
  # override: write the section, then `exec` the server the image's own CMD names. `forceencryption`
  # makes a misconfigured certificate stop the server rather than quietly serving the instance's own
  # again, and the key is the `certs` job's second copy for the reason that job's header gives.
  # ---------------------------------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    depends_on:
      certs:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        printf '[network]\ntlscert = /certs/server.crt\ntlskey = /certs/mssql.key\nforceencryption = 1\n'
        > /var/opt/mssql/mssql.conf
        && exec /opt/mssql/bin/sqlservr
    ports: ["127.0.0.1:11433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Novis-Test-Pw1
      MSSQL_PID: Developer
    volumes:
      - certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
          -Q "IF DB_ID('novis_test') IS NULL CREATE DATABASE novis_test"
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ---------------------------------------------------------------------------------------------------
  # Redis, here because goal `core-part-ii`'s shared cache tier and goal `server`'s fleet lease both use it and one compose
  # file is better than two that drift. Both ports are open: 6379 plain and 6380 TLS, so a test can
  # assert the encrypted path without a second container.
  # ---------------------------------------------------------------------------------------------------
  redis:
    image: redis:8.10.3
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - redis-server
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
      # The second door onto the same store, a socket as
      # `rule:config/unix-scheme-in-a-url-and-a-bare-path-in-a-host` spells it, which
      # `examples/cache-shared-socket.nvs` is the fixture for. It is a third listener and not a second service: the claim that fixture makes
      # is about the transport, so a socket onto a *different* store would be asserting the
      # transport and the store at once. `unixsocketperm` is world-writable because the process
      # that connects is a developer's own and the store holds nothing -- the same reading the
      # loopback bindings above are written under.
      - --unixsocket
      - /sock/redis.sock
      - --unixsocketperm
      - "777"
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:16380:6380"
    volumes:
      - certs:/certs:ro
      # A source under the tmpfs every WSL2 distro shares, because on Docker Desktop the daemon runs
      # in its own distro and a bind mount resolves inside *that* one. Its `/mnt/wsl` is a private
      # directory of its own root filesystem; the shared tmpfs is mounted there at `/mnt/host/wsl`,
      # so this is the one source spelling from Windows under which the socket the container
      # creates is the socket the WSL leg finds at `/mnt/wsl/novis-redis`. Docker Desktop's WSL
      # integration plays no part -- the daemon's mount table decides, not the leg's PATH. On a
      # Linux host the daemon and the client share one filesystem, so `NOVIS_SOCKET_DIR` names the
      # plain directory the client's URL spells. `examples/cache-shared-socket.toml` is where the
      # client half is written, and the check that reads it carries `needs = "af-unix"`.
      - ${NOVIS_SOCKET_DIR:-/mnt/host/wsl/novis-redis}:/sock
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------------------------------
  # Samba as an Active Directory domain controller, which goal `ldap`'s `Core\Ldap` is tested against.
  # The image is pinned by digest because it publishes `latest` only. The domain is `EXAMPLE.TEST`, so
  # the base DN is `DC=example,DC=test`, and the administrator is
  # `CN=Administrator,CN=Users,DC=example,DC=test` with the password below. Provisioning runs at every
  # first boot and takes about half a minute, which is the `start_period`.
  #
  # `hostname` is fixed because Samba names the domain controller after it, and a random container id
  # would change the DC's DN on every `up`. Samba's own certificate names that id too, so the
  # `/entrypoint.d` script written below points it at the `certs` leaf, whose SAN has `samba-ad` and
  # `localhost`. The script runs after provisioning and before Samba starts, which is the one moment
  # `smb.conf` exists and is not yet read. Its `[global]` is a second one, appended: Samba merges them,
  # and appending needs no edit of the provisioned file. The key is copied because Samba refuses a key
  # file it does not own, and `server.key` is uid 999's.
  #
  # The same script sets Samba's restart back-off for a crashed LDAP worker to one second. Some LDAP
  # attacks under `tests/hostile/` crash a worker with signal 11. Samba's default waits 10 s more after
  # each crash, up to 120 s, so once every worker is down the next proof's call waits past its
  # deadline. It ended a `changes` attack in a `Timeout` on every run. Each line has its own guard, so a
  # container that already has the TLS lines gains these on its next restart.
  #
  # The second script, `20-novis-seed`, writes one fixed directory into the provisioned domain, so a
  # proof program's output is the same on every boot. `samba-tool` writes the database files directly,
  # so the seed is done before Samba starts and healthy already means seeded. A marker file makes it
  # run once per container: a restart keeps the domain and skips it, and a recreated container
  # provisions and seeds again. Everything is under `OU=Company`, and no name in it is one a test
  # creates or counts: the tests write `OU=Shop`, `Staff` and more, and count what `CN=Users` holds.
  #
  # `CN=Reader,OU=Company,DC=example,DC=test`, password `Novis-reader-1`, is the account the root
  # `nvs.toml`'s `[ldap.corp]` binds as: an ordinary user, who can read the directory and change
  # nothing in it. The users `anna.berg`, `ben.kohl` (password never expires), `carla.diaz` (must
  # change the password, so AD computes the password as expired) and `dora.lind` (disabled), all with
  # the password `Novis-user-1`; the security groups `Employees` (all four, and `Managers` nested in
  # it) and `Managers` (`anna.berg`); and the distribution group `Newsletter` (`ben.kohl`,
  # `carla.diaz`). A user's DN is its full name, `CN=Anna Berg,OU=Company,DC=example,DC=test`. GUIDs,
  # SIDs and timestamps differ per boot and a search returns entries in no fixed order, so an
  # example's `.out` prints neither.
  #
  # `INSECURE_LDAP` sets `ldap server require strong auth = no`, so a simple bind on 389 without TLS is
  # accepted and `rule:security/ldap-cleartext-bind-is-granted-per-host`'s granted path can be tested.
  # Without it Samba answers that bind `strongerAuthRequired`. The health check binds over LDAPS and
  # verifies against `ca.crt` under the name `samba-ad`, so healthy means the leaf is the one served. It
  # calls `/usr/bin/ldapsearch` by its path, because the image's `ldapsearch` on `PATH` is a wrapper
  # that adds `-y /root/.ldappass`, which `-w` cannot be combined with.
  # ---------------------------------------------------------------------------------------------------
  samba-ad:
    image: smblds/smblds@sha256:b99c19f3ab7c79f4c5b25a484856eab7babf563f4eed0cbf3bb00026c013e47c
    hostname: samba-ad
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      REALM: EXAMPLE.TEST
      DOMAIN: EXAMPLE
      ADMINPASS: "Novis-test-1"
      INSECURE_LDAP: "true"
    entrypoint: ["/sbin/tini", "-g", "--", "/bin/sh", "-c"]
    command:
      - |
        cat > /entrypoint.d/10-novis-tls <<'EOF'
        #!/bin/sh
        set -e
        install -m 600 /certs/server.key /var/lib/samba/private/novis-tls.key
        grep -q novis-tls.key /etc/samba/smb.conf || printf '%s\n' '[global]' \
          'tls keyfile = /var/lib/samba/private/novis-tls.key' \
          'tls certfile = /certs/server.crt' \
          'tls cafile = /certs/ca.crt' >> /etc/samba/smb.conf
        grep -q 'prefork maximum backoff' /etc/samba/smb.conf || printf '%s\n' '[global]' \
          'prefork backoff increment = 1' \
          'prefork maximum backoff = 1' >> /etc/samba/smb.conf
        EOF
        chmod 755 /entrypoint.d/10-novis-tls
        cat > /entrypoint.d/20-novis-seed <<'EOF'
        #!/bin/sh
        set -e
        [ -f /var/lib/samba/private/novis-seeded ] && exit 0
        samba-tool ou add OU=Company --description="The company and the people who work there"
        samba-tool user add Reader Novis-reader-1 --userou=OU=Company \
          --description="Reads the directory for the proof programs"
        samba-tool user setexpiry Reader --noexpiry
        samba-tool group add Employees --groupou=OU=Company --description="Everyone who works here"
        samba-tool group add Managers --groupou=OU=Company --description="Employees who manage a team"
        samba-tool group add Newsletter --groupou=OU=Company --group-type=Distribution \
          --mail-address=newsletter@example.test --description="Receives the weekly newsletter"
        samba-tool user add anna.berg Novis-user-1 --userou=OU=Company --given-name=Anna --surname=Berg \
          --mail-address=anna.berg@example.test --department=Sales --job-title=Manager
        samba-tool user add ben.kohl Novis-user-1 --userou=OU=Company --given-name=Ben --surname=Kohl \
          --mail-address=ben.kohl@example.test --department=Warehouse
        samba-tool user setexpiry ben.kohl --noexpiry
        samba-tool user add carla.diaz Novis-user-1 --userou=OU=Company --given-name=Carla --surname=Diaz \
          --mail-address=carla.diaz@example.test --department=Sales --must-change-at-next-login
        samba-tool user add dora.lind Novis-user-1 --userou=OU=Company --given-name=Dora --surname=Lind \
          --mail-address=dora.lind@example.test --department=Warehouse
        samba-tool user disable dora.lind
        samba-tool group addmembers Employees anna.berg,ben.kohl,carla.diaz,dora.lind,Managers
        samba-tool group addmembers Managers anna.berg
        samba-tool group addmembers Newsletter ben.kohl,carla.diaz
        touch /var/lib/samba/private/novis-seeded
        EOF
        chmod 755 /entrypoint.d/20-novis-seed
        exec /entrypoint.sh
    ports:
      - "127.0.0.1:16389:389"
      - "127.0.0.1:16636:636"
    volumes:
      - certs:/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          LDAPTLS_CACERT=/certs/ca.crt LDAPTLS_REQCERT=demand
          /usr/bin/ldapsearch -H ldaps://samba-ad -x -D "CN=Administrator,CN=Users,DC=example,DC=test"
          -w "Novis-test-1" -b "DC=example,DC=test" -s base -LLL dn | grep -q "^dn:"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------------------------------
  # Mailpit, the SMTP endpoint goal `core-part-ii`'s stage 9 points `Core\Mail` at. It is a catcher, not a relay: it
  # stores what it accepts and forwards NOTHING -- no `MP_SMTP_RELAY_*` is set, so no test can cause a
  # real email to leave this machine, and the loopback binding above means nothing off it can connect
  # anyway. Delivery is asserted over the HTTP API on 18025 (`GET /api/v1/messages`). STARTTLS serves
  # the shared self-signed certificate, and AUTH is fixed to the same public credentials the databases
  # use -- allowed on the plain connection too, so a test can exercise either path.
  # ---------------------------------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.32.0
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    environment:
      MP_SMTP_TLS_CERT: /certs/server.crt
      MP_SMTP_TLS_KEY: /certs/server.key
      MP_SMTP_AUTH: "novis:Novis-Test-Pw1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  certs:
