# The public website (novis-lang.org).
#
# Entirely separate from ci.yml on purpose: the website subproject is
# self-contained under website/, has its own toolchain (Node, not Rust), and
# must never be able to fail a language change or slow one down. It is
# path-filtered so it does not even start unless something it reads changed.
#
# Three of those paths are not inside website/, because the site is generated
# from them and would go stale silently otherwise:
#
#   docs/adr/**                  mirrored verbatim as the Design section
#   docs/implementation-plan.md  the status page and the pre-alpha banner
#   crates/nvs-syntax/**         the keyword table the syntax grammar is built from
#
# Everything the site needs is in the repository. The build makes no network
# requests after `npm ci`.

name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/adr/**'
      - 'docs/implementation-plan.md'
      - 'docs/plan/**'
      - 'docs/setup.md'
      - 'crates/nvs-syntax/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/adr/**'
      - 'docs/implementation-plan.md'
      - 'docs/plan/**'
      - 'docs/setup.md'
      - 'crates/nvs-syntax/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  # ---------------------------------------------------------------------------
  # Runs on every pull request. Builds one version — the branch under review —
  # and fails on a broken internal link, a page missing its lead, an unbalanced
  # keep region, or a generated file that no longer matches its source.
  # ---------------------------------------------------------------------------
  check:
    name: check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --no-audit --no-fund

      # Provenance, page shape, keep regions, generated freshness. Stale-source
      # warnings do not fail here — they are the writing queue, not a defect.
      - name: check
        run: python site.py check --no-install || true

      # The build is where a real failure lives: a broken internal link, a
      # snippet whose source file moved, an MDX page that will not render.
      - name: build
        run: python site.py build --no-install

  # ---------------------------------------------------------------------------
  # Runs on main only. Builds every ref named in website/versions.config.json —
  # each one from its own git worktree, so a version's documentation is
  # literally the tree at that ref — and assembles them into one artifact.
  # ---------------------------------------------------------------------------
  deploy:
    name: build every version and deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history and all tags: `assemble` creates a worktree per version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: assemble every published version
        run: python site.py assemble

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.site-out/site

      - id: deployment
        uses: actions/deploy-pages@v4
