# Move the floating container tags when a release stops being a draft.
#
# `release.yml` pushes only immutable image tags — `0.4.1`, `sha-abc1234` and their `-debian`
# twins — because it finishes with a **draft**, and a draft's notes are readable by nobody. A
# `latest` that resolves to a version whose release notes do not exist yet is worse than a
# `latest` one release behind: the first is a support question, the second is a version number.
#
# So `latest` and the `MAJOR.MINOR` line move here, on the click that makes the release public.
#
# ## This rebuilds nothing
#
# `docker buildx imagetools create` writes a new tag against an existing manifest list. No image
# is pulled, no layer is copied and no binary is built, so `latest` and `0.4.1` are guaranteed to
# be the *same digest* rather than two builds that ought to agree. It follows that the build
# provenance `release.yml` attested against that digest covers this tag too, with nothing to
# re-attest.
#
# ## Why it is safe to run on an event this workflow does not control
#
# `on: release: published` fires for any release, including one published through the API or by
# an older draft being finished out of order. Two guards handle that:
#
#   * `if:` below refuses a prerelease outright.
#   * `bun nv release --docker-tags --floating` compares the version against every `v*` tag and
#     silently drops the moving tags when it is not the newest, so publishing a stale draft
#     cannot walk `latest` backwards. That check is in the script rather than here, with the rest
#     of the release arithmetic.
#
# Nothing in this file interpolates a `${{ }}` into a shell — the same posture release.yml's header
# sets out in full. `promote`'s only credential is the per-run `GITHUB_TOKEN`; `marketplace`'s is
# below.
#
# ## The website is deployed again
#
# The last step of `promote` dispatches `pages.yml` on `main`, so the site shows the version just
# published. That is the one use of `actions: write`.
#
# ## The VS Code extension goes to the Marketplace
#
# `marketplace` publishes the `nvs-<version>.vsix` the release already carries, after
# `gh attestation verify` has checked it was built by this repository's release run. Nothing is
# rebuilt, so the Marketplace lists the bytes `SHA256SUMS` names. It holds no stored secret:
# `vsce publish --oidc` exchanges the job's GitHub OIDC token, issued for the audience
# `marketplace.visualstudio.com`, for a Marketplace token that lasts at most 15 minutes. The
# `novis-lang` publisher's Trusted Publishing policy accepts that token only from this repository,
# this workflow file and the `marketplace` environment. That environment admits `v*` tags and
# `main` (a manual dispatch runs on `main`) and waits for a reviewer's approval.
#
# The same job then publishes the same file to Open VSX, the registry VSCodium, Cursor and the other
# VS Code forks install from. `ovsx publish --trusted-publishing` exchanges a second OIDC token, issued
# for the audience `https://open-vsx.org`, for an Open VSX token that lasts five minutes. The
# `novis-lang` namespace's trusted publisher names the same repository, workflow file and
# environment. One job holds both uploads, so a release waits for one approval and verifies the
# file once.
#
# `bun nv release --newest` skips a version that is not the newest tag, as `--floating` does for
# `latest`. `--skip-duplicate` on both uploads makes a rerun after a published upload a success, so
# a manual dispatch repairs whichever upload failed without a new release.

name: Promote release images

on:
  release:
    types: [published]
  # The images may exist and the promotion still not have run — an image build that failed and was
  # re-run by hand after the release was already published, say. This re-points the floating tags
  # at a version whose images are already in the registry, and never builds one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose images should become latest, e.g. v0.4.1'
        type: string
        required: true

permissions: {}

# Keyed on nothing, so two publishes in quick succession queue rather than race for `latest`.
concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    name: move latest
    runs-on: ubuntu-26.04
    # A prerelease is not what `latest` means. `github.event.release` is absent on a manual
    # dispatch, so the `||` is what lets that path through rather than a defaulting accident.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    permissions:
      contents: read
      packages: write
      # For the website dispatch below, and for nothing else.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # The whole tag list, for the "is this actually the newest release?" check.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tool dependencies
        run: bun install --frozen-lockfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the floating tags at this release
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          # The tag with its `v` stripped is the version, and `nv release` refuses anything that
          # is not MAJOR.MINOR.PATCH — so a tag this workflow should not act on fails here rather
          # than reaching the registry.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for variant in distroless debian; do
            # Every tag this variant claims, immutable ones included.
            mapfile -t all < <(
              bun nv release --docker-tags "$version" \
                --image "$IMAGE" --variant "$variant" --floating
            )
            # The source is the variant's own version tag, which `--docker-tags` always prints
            # first — taken from the list rather than rebuilt as "$IMAGE:$version", because that
            # spelling silently drops the `-debian` suffix and would point `latest-debian` at the
            # distroless image. The suffix has exactly one home, and it is `DOCKER_VARIANTS`.
            source_ref="${all[0]}"
            # Whatever is left is the destinations. `sha-...` is in there and re-pointing it at
            # itself is a no-op, so it costs nothing to leave in; when this release is not the
            # newest, `--floating` prints no moving tags at all and the list is empty.
            targets=()
            for tag in "${all[@]:1}"; do
              [ "$tag" = "$source_ref" ] || targets+=(--tag "$tag")
            done
            echo "::group::$variant"
            docker buildx imagetools inspect "$source_ref" >/dev/null \
              || { echo "::error::$source_ref is not in the registry; did the release run's docker job succeed?" >&2; exit 1; }
            if [ "${#targets[@]}" -eq 0 ]; then
              echo "no floating tags to move for $variant"
            else
              docker buildx imagetools create "${targets[@]}" "$source_ref"
            fi
            echo "::endgroup::"
          done

      - name: Summary
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### \`latest\` now points at \`$TAG\`"
            echo
            echo "    docker pull $IMAGE:latest"
          } >> "$GITHUB_STEP_SUMMARY"

      # The website reads the version from `Cargo.toml` when it is built. `publish` pushed the
      # release commit with the run's `GITHUB_TOKEN`, and such a push starts no workflow, so the
      # site would show the previous version until the next push to `main`. A dispatch is one of
      # the events that token may start, so the site is built and deployed again from `main` here,
      # once the tags have moved.
      - name: Deploy the website again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$REPO" --ref main

  # The header's last section says what this job trusts and why.
  marketplace:
    name: publish the VS Code extension
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    environment: marketplace
    permissions:
      contents: read
      # `gh attestation verify` reads the release run's attestation.
      attestations: read
      # The OIDC tokens `vsce publish --oidc` and `ovsx publish --trusted-publishing` exchange for
      # the Marketplace and Open VSX tokens.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # This workflow's own commit, not the tag's: the tag's commit for a release event, and `main`
      # for a dispatch, so `--newest` and the vsce pin exist even for a tag cut before they did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole tag list, for `--newest`.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tool dependencies
        run: bun install --frozen-lockfile

      - name: Is this the newest release?
        id: newest
        run: bun nv release --newest "${TAG#v}" --github-output

      - name: Download the release's extension and check its attestation
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="nvs-${TAG#v}.vsix"
          mkdir -p "$RUNNER_TEMP/vsix"
          gh release download "$TAG" --repo "$REPO" --pattern "$file" --dir "$RUNNER_TEMP/vsix"
          gh attestation verify "$RUNNER_TEMP/vsix/$file" --repo "$REPO"

      # `vsce` and `ovsx` at the versions the checked-out lockfile pins. `--ignore-scripts`, because
      # no install script should run in a job that is about to hold a publish credential, and
      # neither publish loads a package that has one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.newest.outputs.newest == 'true'
        with:
          node-version-file: editors/vscode/.nvmrc
      - name: Install vsce and ovsx
        if: steps.newest.outputs.newest == 'true'
        working-directory: editors/vscode
        run: npm ci --ignore-scripts

      - name: Publish to the Marketplace
        if: steps.newest.outputs.newest == 'true'
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          node_modules/.bin/vsce publish --oidc --skip-duplicate \
            --packagePath "$RUNNER_TEMP/vsix/nvs-${TAG#v}.vsix"
          {
            echo "### The VS Code extension \`${TAG#v}\` is on the Marketplace"
            echo
            echo "https://marketplace.visualstudio.com/items?itemName=novis-lang.nvs"
          } >> "$GITHUB_STEP_SUMMARY"

      # `--trusted-publishing` fails the step when no OIDC token can be had, so a missing
      # `id-token` permission never falls back to a stored token. No `OVSX_PAT` is set anywhere: a
      # token would take precedence over the trusted publisher.
      - name: Publish to Open VSX
        if: steps.newest.outputs.newest == 'true'
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          node_modules/.bin/ovsx publish --trusted-publishing --skip-duplicate \
            --packagePath "$RUNNER_TEMP/vsix/nvs-${TAG#v}.vsix"
          {
            echo "### The VS Code extension \`${TAG#v}\` is on Open VSX"
            echo
            echo "https://open-vsx.org/extension/novis-lang/nvs"
          } >> "$GITHUB_STEP_SUMMARY"
