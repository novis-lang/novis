name: Dev build

# Each push to `main` starts two runs of this file. The push's own run starts at the push, beside its
# CI run, and builds the commit's release binaries and the VS Code extension through `build.yml`,
# kept 30 days as that run's artifacts. CI itself builds neither: its cache stays its own. When the
# push's CI run finishes, a second run starts on `workflow_run`. It builds nothing. When CI is green,
# it waits for the push's run and publishes the `dev` image from that run's Linux archives through
# `image.yml`. A push that changed nothing
# the build reads since the newest dev build builds nothing, and that build's artifacts and image
# stay current. GitHub reads a `workflow_run` trigger only from the default branch, which is `main`.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# A push's build and a CI run's image each have a group of their own. A newer push cancels an older
# push's build that is still going, and the older commit then gets no image: the newer push's build
# replaces it. The images go one at a time, in push order. A newer CI run's image waits behind the
# running one, and replaces an older one that is still waiting.
concurrency:
  group: ${{ github.event_name == 'push' && 'dev-build-push' || 'dev-build' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    name: whether the push changed anything the build reads
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ github.sha }}
      build: ${{ steps.lanes.outputs.release }}
    steps:
      # The newest dev build that finished green and still has its artifacts is the base. A push that
      # changed only paths the build does not read keeps that build's binaries and its `dev` image,
      # and this run builds nothing (`UNBUILT` in `tools/nv/cmd/ci-changes.ts`). No such build, or one
      # whose artifacts expired, gives an empty base, and an empty base builds. A build a newer push
      # cancelled may have uploaded some archives and not others, so only a green run counts. The base
      # is not the push's `before`, because that push's build may have been cancelled, and its
      # changes still count.
      - id: base
        name: The commit the newest dev build artifacts are from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=""
          while read -r run sha; do
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '"\(.path) \(.conclusion)"' </dev/null)"
            if [ "$found" = ".github/workflows/dev-build.yml success" ]; then base="$sha"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=dist-linux-x86_64&per_page=20" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired | not) | "\(.workflow_run.id) \(.workflow_run.head_sha)"')
          echo "base=${base:-none}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tool dependencies
        run: bun install --frozen-lockfile
      - id: lanes
        name: Whether the push changed anything the build reads
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: bun nv ci-changes

  binaries:
    name: release binaries
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
    permissions:
      contents: read

  ci:
    name: whether CI passed, and the push's binaries
    # A push's CI run only. A pull request from a fork may name its branch `main`, and its run then
    # matches the filter above; its event is `pull_request`, so this stops it. A cancelled run gets
    # no image. A newer push replaced it, and that push's run diffs against the newest green commit,
    # so it tests this commit too and gets its own image. Or a release run of the same commit
    # replaced it, which `bun nv ci --dispatch` started and which also cancelled this commit's
    # build. A failed run that is run again and passes starts this again, and then gets its image.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-26.04
    # Most of this is the wait for the push's build, whose slowest leg may take up to `build.yml`'s
    # bound of 120 minutes.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      run: ${{ steps.binaries.outputs.run }}
      image: ${{ steps.binaries.outputs.image }}
    steps:
      - id: check
        name: The commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # `ahead` or `identical` means `main` contains the commit.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)"
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$SHA is not on main (compare says $status)"; exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" = success ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      # The push's own run of this file built the binaries. This waits until that run ends, polling
      # its status every 30 seconds, and the job's time limit bounds the wait. The image needs that
      # run green with both Linux archives. A push that built nothing, a build that failed and a build
      # a newer push cancelled all give no image.
      - id: binaries
        name: Wait for the push's build
        if: steps.check.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dev-build.yml/runs?head_sha=$SHA&event=push&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run" ]; then
            echo "::notice::$SHA has no push run of dev-build.yml, so there is no image"
            echo "image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" = completed ]; do
            sleep 30
          done
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
          archives="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name | select(. == "dist-linux-x86_64" or . == "dist-linux-aarch64")] | length')"
          echo "run $run: $conclusion, $archives of 2 Linux archives"
          if [ "$conclusion" = success ] && [ "$archives" = 2 ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::run $run gives no image: it ended $conclusion with $archives of 2 Linux archives"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: dev image
    needs: ci
    if: needs.ci.outputs.image == 'true'
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.ci.outputs.sha }}
      binaries-run: ${{ needs.ci.outputs.run }}
    permissions:
      contents: read
      packages: write
      # Reads the Linux archives from the push's run.
      actions: read
