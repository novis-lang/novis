# The container images, from Linux archives `build.yml` already made in the same run.
#
# `release.yml` calls this with the version it released. The dev build (`dev-build.yml`) calls it
# with none once a push's CI run on `main` is green, to publish the `dev` image.
# One file builds both, so the `dev` image is made the way a release's is: the same Dockerfile, the
# same staging, the same smoke test before any push.
#
# It compiles nothing: it packages the binaries `build.yml` produced, so the bytes in the image are
# the bytes in the archive. Each variant is built for amd64 first and run through
# `tests/docker/smoke.sh`, and nothing is pushed unless that passes.
#
# What differs without a version:
#
#   * The one tag is `dev` (`dev-debian` for the other variant), which each green push moves.
#     `bun nv release --docker-tags dev` says why there is no `sha-` tag.
#   * No provenance attestation. The dev build grants `packages: write` and nothing else to write
#     with.
#
# No job here declares `permissions:`, so each takes what its caller's job grants.

name: Image

on:
  workflow_call:
    inputs:
      version:
        description: 'The version released. Empty publishes the `dev` image.'
        type: string
        required: false
        default: ''
      ref:
        description: 'What to check out. Empty is the commit the run is for.'
        type: string
        required: false
        default: ''
      push:
        description: 'Push the images. False stops after the smoke test, and logs in nowhere.'
        type: boolean
        required: false
        default: true

jobs:
  docker:
    name: container images (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The archives' version slot, the label's version and the tag: the release's version, or `dev`.
      LABEL: ${{ inputs.version || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default tag: no shell, no package manager, nonroot. `docker/Dockerfile` owns why
          # `cc` and not `base` or `static`.
          - variant: distroless
          # `:X.Y.Z-debian` — the same binary, in an image you can get inside.
          - variant: debian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          # `--docker-tags` reads `git rev-parse` and the tag list, so the history has to be here.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tool dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-linux-*
          merge-multiple: true
          path: dist

      # The build context is `docker/`, and this fills `bin/` in it. Unpacking the archive rather
      # than rebuilding is the entire point of the job: `gh attestation verify` on a release's
      # tarball and on its image are then two statements about the same bytes.
      #
      # `linux-x86_64`/`linux-aarch64` are this repository's platform names and `amd64`/`arm64`
      # are what BuildKit calls the same two things in `TARGETARCH`. The rename happens here,
      # once, rather than being a second naming scheme the Dockerfile has to know about.
      - name: Stage the release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/bin/notices
          for pair in "linux-x86_64:amd64" "linux-aarch64:arm64"; do
            ours="${pair%%:*}"
            theirs="${pair##*:}"
            archive="dist/nvs-$LABEL-$ours.tar.gz"
            test -f "$archive" || { echo "::error::$archive is missing" >&2; exit 1; }
            mkdir -p "docker/bin/$theirs"
            tar -xzf "$archive" -C "docker/bin/$theirs" --strip-components=1
            # The notices every distribution carries
            # (`rule:packaging/the-third-party-notice-is-generated-never-written-by-hand`). Both archives hold identical
            # copies, so they are moved aside into one directory and the last writer wins.
            for notice in LICENSE THIRD-PARTY-LICENSES.txt README.md CHANGELOG.md; do
              mv "docker/bin/$theirs/$notice" docker/bin/notices/
            done
            test -x "docker/bin/$theirs/nvs"
          done
          find docker/bin -type f | sort

      # Only the `debian` stage's one `RUN` executes anything, and only for the foreign
      # architecture. The distroless stage copies and nothing else, so it builds for both at
      # native speed whether this is here or not.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The amd64 image alone, loaded into this runner's Docker under a local name, so the smoke
      # test runs the same Dockerfile stage and the same binary the push below publishes. The push
      # builds it again from the builder's cache.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          tags: novis-smoke:${{ matrix.variant }}
          provenance: false

      - name: Smoke test
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash tests/docker/smoke.sh "novis-smoke:$VARIANT"

      # The per-run token again, and the only registry authentication in this repository. No PAT:
      # `GITHUB_TOKEN` can write packages owned by this repository's owner, so there is no
      # long-lived registry credential to store, rotate or leak.
      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — its `tags` output is deliberately unused. This action's `type=semver`
      # implements SemVer, and under `rule:packaging/below-1-0-the-breaking-slot-moves-left` that would emit a bare `0` tag that follows
      # 0.0 → 0.1 across a breaking change. Labels have no such problem, and deriving them from
      # the repository is what keeps the source URL correct across the move to `novis-lang/novis`.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=Novis
            org.opencontainers.image.version=${{ env.LABEL }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.ref || github.sha }}/website/src/content/docs/guides/production/docker.mdx

      - id: tags
        if: inputs.push
        name: The tags this variant claims
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VARIANT: ${{ matrix.variant }}
        run: |
          bun nv release --docker-tags "$LABEL" \
            --image "$IMAGE" --variant "$VARIANT" --github-output

      - id: build
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit's own provenance is off and its SBOM is on, deliberately. Two provenance
          # statements about one digest, made by different mechanisms, are two things to keep
          # true and one more way to disagree; `attest-build-provenance` below is the one this
          # project already verifies binaries with. An SBOM competes with nothing.
          provenance: false
          sbom: true

      # The image digest, signed the same keyless way the archives are:
      #     gh attestation verify oci://ghcr.io/novis-lang/novis:0.1.0 --repo novis-lang/novis
      # `push-to-registry` stores it beside the image as an OCI referrer, so it travels with the
      # image instead of being something a user has to know to go and look up.
      - if: inputs.push && inputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: inputs.push
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Pushed \`$DIGEST\`"
            echo '```'
            echo "$TAGS"
            echo '```'
            if [ -n "$VERSION" ]; then
              echo "\`latest\` moves when the draft is published — see release-promote.yml."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
