name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental compilation is noise in CI
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The matrix that matters: Novis generates native code, so "it compiles" is not
  # the same claim on each platform. Windows uses SEH and a different calling
  # convention; aarch64 is a different backend in Cranelift entirely.
  # ---------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this action just honours it.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      # Doc tests are excluded from --all-targets and are real tests for a
      # library this API-heavy.
      - run: cargo test --workspace --doc

      # The `.nvst` conformance suite, on every platform for the reason the
      # cost guards below are: each case runs generated machine code, and code
      # generation is what differs per target. The *differential* suite is
      # deliberately not here — it needs PHP 8.5 on `PATH`, which a developer
      # machine is required to have (docs/setup.md) and a hosted runner image
      # does not.
      - name: Conformance suite
        run: cargo run --quiet -p nvs-cli -- test tests/conformance/

      # Runs on every platform on purpose. These are the invariants Novis's
      # execution model rests on, they are properties of native code generation,
      # and they differ per platform: Windows unwinds through SEH, and aarch64 is
      # a different Cranelift backend entirely. The cost guards only run in
      # release, because the baselines they compare against are release figures.
      - name: Architecture invariants and cost guards
        run: cargo test --release -p nvs-abi-probe

  # ---------------------------------------------------------------------------
  # Separated because it pulls in Wasmtime, which is minutes of build time that
  # the front-end crates should not pay on every run before M9.
  # ---------------------------------------------------------------------------
  extension-sandbox:
    name: extension sandbox probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-probe
      - name: Sandbox containment and boundary costs
        run: cargo test --release -p nvs-abi-probe --features wasm-probe
      - name: Lint with the feature enabled
        run: |
          cargo clippy --workspace --all-targets \
            --features nvs-abi-probe/wasm-probe -- -D warnings

  # There is deliberately no doc-size job. Length guidance for a status field, a
  # milestone heading or an ADR decision cell is in AGENTS.md, addressed to the
  # author — never a CI gate. A tripwire here bought nothing and cost whole
  # sessions spent trimming bytes to clear it; see AGENTS.md § Writing docs here.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every `[`Foo::bar`]` in a doc comment resolves. This crate set states its
      # architecture in its doc comments and cross-references it by name, and
      # `broken_intra_doc_links` is warn-by-default and invisible to both steps
      # above — so 391 warnings had accumulated, 96 of them naming an item that
      # does not exist. `private_intra_doc_links` is allowed rather than fixed:
      # these are internal crates nobody publishes, so a link to a crate-private
      # item is a correct reference rustdoc simply will not turn into an anchor.
      - name: rustdoc links
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -A rustdoc::private_intra_doc_links -D warnings

  # ---------------------------------------------------------------------------
  # Enforces the claims in docs/adr: no unsafe outside the audited modules, no
  # C dependencies sneaking into the trusted core, no yanked or vulnerable deps.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # The other half of `supply-chain`. `cargo deny` decides what Novis may link;
  # this decides what it must ship. Regenerating the notice and diffing it
  # catches a dependency added without its licence text — which fails silently
  # and only at distribution, unlike an unallowed licence, which fails loudly
  # the moment it enters the tree. Also fails on a licence the generator has no
  # policy for, so a new one is a decision someone makes rather than a line
  # that appears in a generated file. See ADR 0065.
  # ---------------------------------------------------------------------------
  attribution:
    name: third-party attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The generator reads each dependency's own LICENSE file out of its
      # source, so the sources have to be on disk. `cargo fetch` is enough —
      # nothing here compiles.
      - name: Fetch dependency sources
        run: cargo fetch --locked
      - name: THIRD-PARTY-LICENSES.txt matches Cargo.lock
        run: python tools/gen-attribution.py --check

  # ---------------------------------------------------------------------------
  # Every PHP built-in has exactly one recorded outcome, and every Core member a
  # row names still exists. Catches the case a review cannot: a member renamed
  # in docs/spec/01-core-library.md while the migration table still points at
  # the old name. Coverage is reported, not enforced, until the table's header
  # says Complete: yes. See ADR 0063 § 3.
  # ---------------------------------------------------------------------------
  migration-table:
    name: php migration table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Every PHP name is accounted for
        run: python tools/check-migration.py

  # ---------------------------------------------------------------------------
  # docs/novis.md is generated from the binary's own registry (`nvs meta
  # --json`) and the chapters under docs/reference/, and every example in it
  # runs against the binary -- so the check needs a built CLI, which is why
  # this is not a step of the `docs` job below. A stale committed file, or an
  # example the compiler no longer agrees with, fails here.
  # ---------------------------------------------------------------------------
  reference:
    name: docs/novis.md is current and its examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
      - uses: Swatinem/rust-cache@v2
        with:
          key: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo build -p nvs-cli
      - name: docs/novis.md matches the binary and the chapters, and every example holds
        run: python tools/reference.py --check

  # ---------------------------------------------------------------------------
  # The docs have linters of their own and, until this job existed, nothing ran
  # them — six findings had accumulated across four ADRs, including two links
  # citing files by names they were renamed out of. All four scripts are Python
  # only, need no toolchain and finish in about a second together, which is why
  # they are one job rather than steps bolted onto a build.
  #
  # Each of these gates on *structure* and never on a length: a stale index row,
  # a table row that does not parse, a playbook selector that resolves to two
  # bullets or none. Sizes stay reports in all four, for the reason
  # docs/agent/doc-style.md gives — a number is weighed, not enforced — so a
  # green run here never means the docs are short, only that the tools can still
  # read them and that what they derive still agrees with what is committed.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: ADR field set, heading order, cross-links and the derived index table
        run: python tools/adr.py --check
      - name: Every markdown link resolves, with matching case
        run: python tools/check-links.py
      - name: Every milestone row parses and agrees with the file it names
        run: python tools/plan.py --check
      - name: Every playbook bullet is reachable by exactly one selector
        run: python tools/playbook.py --check

  unsafe-audit:
    name: unsafe audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: none
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      # Informational for now. Becomes a hard gate once the unsafe modules in
      # nvs-runtime and nvs-codegen are written and their expected counts known.
      - name: Count unsafe
        run: cargo geiger --workspace --output-format GitHubMarkdown >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # libFuzzer isn't supported on Windows, so this only ever runs here (or in
  # a contributor's WSL/Linux/macOS setup — AGENTS.md's WSL section covers
  # first-time setup on Windows). A short bounded run on every push/PR catches
  # regressions continuously, per the plan's overall verification strategy;
  # it is not the full 1h M1 corpus/fuzz verification run itself, which is a
  # one-time gate recorded in docs/implementation-plan.md's status block.
  # ---------------------------------------------------------------------------
  fuzz-smoke:
    name: fuzz smoke / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 60s
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  # ---------------------------------------------------------------------------
  # Miri validates the safe subset; the audited unsafe modules get the ASAN job
  # below. TSAN is still owed, and arrives with M5's concurrency.
  # ---------------------------------------------------------------------------
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      # Cranelift-dependent crates cannot run under Miri (they execute JIT
      # code), so the front-end crates are tested here and the backend relies
      # on ASAN instead.
      - name: miri test (front end)
        run: |
          cargo +nightly miri test \
            -p nvs-diagnostics \
            -p nvs-syntax \
            -p nvs-hir \
            -p nvs-types \
            -p nvs-ir

  # ---------------------------------------------------------------------------
  # The half Miri cannot reach: the crates that execute generated machine code,
  # where the refcount and COW protocols compiled code manipulates by raw
  # pointer actually run. Nothing here overlaps the valgrind sweep in
  # `tools/loop.py` — that runs the `examples/` fixtures end to end through the
  # release binary, and never runs a crate's own tests.
  #
  # `nvs-codegen` and `nvs-stdlib` link `nvs-runtime` as an ordinary dependency,
  # so it compiles with `debug_assertions` on and `cfg(test)` off and takes the
  # platform heap — which is what ASAN has to interpose on to see anything.
  # `nvs-runtime`'s own test binary is the one build that does not: `cfg(test)`
  # installs `counting_alloc` over the size-class cache, and a recycled block is
  # never freed, so ASAN cannot poison it and a use-after-free reads live
  # memory. Hence `--features nvs-runtime/sanitizer`, which swaps that cache
  # back out for the platform heap. `counting_alloc`'s module doc is the home of
  # the reasoning; without the feature this job is silently weaker than it looks
  # on exactly the crate holding most of the unsafe.
  #
  # `--target` is load-bearing: without it, build scripts and proc macros are
  # instrumented too and the run dies before a test starts.
  #
  # Leak detection is off on purpose. LSAN is not what this job is for, the
  # valgrind sweep already owns leaks, and a JIT that holds its compiled code
  # for the life of the process reports as a leak either way — that noise would
  # bury the use-after-free signal this job exists for.
  # ---------------------------------------------------------------------------
  asan:
    name: asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: asan
      - name: ASAN test (runtime, backend and library)
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
        run: |
          cargo +nightly test --target x86_64-unknown-linux-gnu \
            --features nvs-runtime/sanitizer \
            -p nvs-runtime \
            -p nvs-codegen \
            -p nvs-stdlib
