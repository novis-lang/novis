name: Website

# `landing` is the default branch and holds no code; the workflow is `main`'s `.github/workflows/pages.yml`,
# and a push to `main` deploys the site without this file. This file exists so the "Run workflow" button
# appears: GitHub shows it only for a workflow the default branch has. Choose `main` in the button's
# branch list. A run started on `landing` stops here and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pick-main:
    name: choose main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::Run this workflow on the main branch: Run workflow -> Use workflow from -> main."
          exit 1
