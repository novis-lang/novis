[package]
name = "nvs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace, not a member of the root one — `libfuzzer-sys` needs
# nightly and pulls in its own dependency graph that the pinned-stable root
# workspace (see the top-level rust-toolchain.toml) should never have to
# resolve. cargo-fuzz's own convention.
[workspace]

[dependencies]
httparse = "1"
libfuzzer-sys = "0.4"
nvs-diagnostics = { path = "../crates/nvs-diagnostics" }
nvs-runtime = { path = "../crates/nvs-runtime" }
nvs-server = { path = "../crates/nvs-server" }
nvs-stdlib = { path = "../crates/nvs-stdlib" }
nvs-syntax = { path = "../crates/nvs-syntax" }

[[bin]]
name = "ast"
path = "fuzz_targets/ast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie"
path = "fuzz_targets/cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_path"
path = "fuzz_targets/image_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart"
path = "fuzz_targets/multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prefix"
path = "fuzz_targets/prefix.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reply_head"
path = "fuzz_targets/reply_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serialize"
path = "fuzz_targets/serialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri"
path = "fuzz_targets/uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml"
path = "fuzz_targets/xml.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# A separate workspace reads no `[patch]` table but its own, so the root one's
# rows are repeated here. Without them `nvs-stdlib` builds against the published
# `html5ever`, which does not have the fields `crates/nvs-stdlib/src/html.rs`
# sets. `crates/nvs-runtime/tests/manifest_policy.rs` checks the two agree.
[patch.crates-io]
html5ever = { path = "../vendor/html5ever" }
