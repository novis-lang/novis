[package]
name = "mwl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace, not a member of the root one — `libfuzzer-sys` needs
# nightly and pulls in its own dependency graph that the pinned-stable root
# workspace (see the top-level rust-toolchain.toml) should never have to
# resolve. cargo-fuzz's own convention.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
mwl-diagnostics = { path = "../crates/mwl-diagnostics" }
mwl-runtime = { path = "../crates/mwl-runtime" }
mwl-stdlib = { path = "../crates/mwl-stdlib" }
mwl-syntax = { path = "../crates/mwl-syntax" }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri"
path = "fuzz_targets/uri.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
