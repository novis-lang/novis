# The repository's own `nvs.toml` — ADR 0103 § 1 step 2's `./nvs.toml`, found
# in the working directory and nowhere else.
#
# Exactly one directive in it is read today: ADR
# 0102 § 6 makes `Core\Router::urlAbsolute`'s origin *configured* and refuses
# to derive one from `Host` or `X-Forwarded-Host`, so a program calling that
# member has no answer it is allowed to give until this key exists.
# `configured_origin` in `crates/nvs-cli/src/main.rs` is the reader and its doc
# comment owns why it is one key rather than a config format; M6 lands the real
# tree, with ADR 0064's syntax and ADR 0103's ownership check, and this file
# becomes an ordinary root of it.
#
# `examples/routes.nvs` is what reads it today, so `nvs run` from this
# directory prints an absolute link rather than throwing. Changing the value
# changes that program's expected output, which `docs/agent/loop-goal.toml`
# freezes.

# ADR 0104 § 1: an application is an entry file path, and the block naming it is
# `[[app]]` — an array of tables. There is no `[app]` table for a global origin
# to sit in, because TOML refuses `app` as both spellings in one file. `root`
# resolves against this file's own directory (ADR 0103 § 5), so this block is
# every `.nvs` in the repository, `examples/routes.nvs` included.
[[app]]
root = "."
origin = "https://example.test"

# ADR 0118 § 2 puts a `script.spawn` check inside the door `spawn script`
# resolves a target through, and ADR 0118 § 1 denies by default — so
# `examples/isolate.nvs` needs this grant to spawn anything at all. `true`
# rather than a list of roots: every example in this repository is one the
# checkout already trusts, and narrowing it here would only be a second
# spelling of "the repository".
[app.capabilities.script]
spawn = true

# `examples/capability.nvs` is the fixture ADR 0118 exists for, so its block is
# written to be *narrower* than the one above rather than wider: ADR 0104 § 2
# layers an exact `entry` over the `root = "."` block, and a block may take a
# capability away as well as grant one. What it demonstrates is a program
# meeting one grant and two refusals, so `fs.read` is scoped to the one
# directory holding its data, `fs.write` is never mentioned, and `script.spawn`
# is switched off again — `false` is `Grant::Nothing` in
# `nvs_config::capability`, which is how a narrowing block says no to something
# a broader one allowed.
[[app]]
entry = "examples/capability.nvs"

[app.capabilities.fs]
read = ["examples/capability"]

[app.capabilities.script]
spawn = false

# `examples/files.nvs` works inside `Core\IO::temporaryDir()`'s answer, and that
# path is the *host's* — `C:\Users\…\AppData\Local\Temp\nvs-…` on Windows,
# `/tmp/nvs-…` under WSL, and neither is a name this repository could write down
# without pinning the fixture to one machine. `true` is `Grant::Everything` in
# `nvs_config::capability`, and it is the honest spelling of what the fixture
# needs: a scratch directory it creates, fills, reads back and removes. Narrowing
# is what `examples/capability.nvs`'s block above exists to show; this one is
# about the members.
[[app]]
entry = "examples/files.nvs"

[app.capabilities.fs]
read = true
write = true

# `examples/tempdir.nvs` is the block above with one line fewer of program: it
# creates a directory, writes into it and stops, leaving ADR 0131 § 3's sweep to
# take it away. The grant is the same `true` for the same reason — the path is
# the host's and no checkout could write it down — and it stays `write = true`
# rather than being narrowed to the root, because the member asks the check of
# the *entry* it is about to create (§ 2), not of the root it creates under.
[[app]]
entry = "examples/tempdir.nvs"

[app.capabilities.fs]
read = true
write = true

# `examples/upload.nvs` is the same shape for the same reason — it receives a
# part into a directory `Core\IO::temporaryDir()` chose on the host — so its
# block is the one above rather than a narrower spelling of it. ADR 0105's rule
# is that the *destination* is the application's own call, and a grant naming a
# path this repository invented would be the host picking one after all.
[[app]]
entry = "examples/upload.nvs"

[app.capabilities.fs]
read = true
write = true

# `examples/process.nvs` runs this repository's own `nvs` binary and then asks
# to run a `.bat`, so its `process.exec` grant has to cover **both** targets:
# ADR 0044 § 4's refusal is by target kind and the door asks the capability
# first, so a grant that named only the binary would make the second call a
# capability denial and the fixture would still print `refused: no shell form`
# while proving nothing. Scoped to the two paths rather than `true` because
# that is the whole point of the member being path-scoped. `fs.read` is
# `Core\IO::exists`'s, which picks the platform's spelling of the binary.
[[app]]
entry = "examples/process.nvs"

[app.capabilities.fs]
read = ["target/debug", "examples/process"]

[app.capabilities.process]
exec = ["target/debug", "examples/process"]

# `examples/http.nvs` talks to an origin on the loopback, which ADR 0058 § 3
# denies by default — so this block is where that ADR's *other* half is written
# down: `net.connect` says which names the program may reach, and `net.internal`
# says which of § 3's denied addresses this deployment reaches anyway. Both
# names are granted and only one address is excepted, which is what the fixture
# is for: `169.254.169.254` is granted by name and still refused on its address,
# so the program's third line proves the policy is asked of the resolved address
# rather than of the name. An exception is a literal address and never a
# hostname (`nvs_config::tree::CapNet::internal` owns why), and it widens
# nothing on its own — an address named here is unreachable until a `connect`
# grant names the host as well.
[[app]]
entry = "examples/http.nvs"

[app.capabilities.net]
connect = ["127.0.0.1", "169.254.169.254"]
internal = ["127.0.0.1"]

# `examples/net-echo.nvs` binds a port and then dials it, and ADR 0162 § 8 is
# why that is three keys rather than one. `net.listen` is the bind, matched
# against the endpoint exactly; `net.connect` is the dial, matched against the
# host; and `net.internal` is ADR 0058 § 3's exception, because loopback is one
# of the ranges the address policy denies by default and the program supplies
# that address itself. None of the three widens either of the others, which is
# the whole of what the fixture demonstrates from the configuration's side.
#
# `listen` is `true` and not an endpoint literal because the program asks for
# port `0`: the endpoint it binds is picked by the operating system, and there
# is no `127.0.0.1:0` a reviewer could read as the port it ended up on. A
# deployment that binds a port it chose writes that endpoint out instead.
[[app]]
entry = "examples/net-echo.nvs"

[app.capabilities.net]
listen = true
connect = ["127.0.0.1"]
internal = ["127.0.0.1"]

# `examples/cache.nvs` reaches the store `[cache.shared] url` names at the foot of
# this file, and one line grants it: `cache.shared` names the *store* an operator
# configured, not the address it is at, which is ADR 0142 § 1. That the store is
# on the loopback costs this block nothing — neither the `net.connect` the block
# above needs for a name nor the `net.internal` it needs for an address in a
# range ADR 0058 § 3 denies, because neither question is asked of an endpoint an
# operator wrote. Nothing here mentions `Core\Cache::local()`, which needs no
# capability at all (ADR 0059 § 1) — the fixture's first two lines run under this
# block having said nothing about them, and its last two are
# `Core\RateLimit::consume` opening the same store through the same grant.
[[app]]
entry = "examples/cache.nvs"

[app.capabilities.cache]
shared = true

# ADR 0020 § 3's tier 3, as the operator decision it is: an uncaught throw out of this application
# runs `examples/logging/handler.nvs` as a `spawn script` isolate, and only if that handler is
# missing, refused or fails does the tier-4 floor write the record to `stderr` itself. `script.spawn`
# is the root block's, above — a handler is resolved through ADR 0118 § 2's spawn door like any other
# target, and being named here has never been permission to run.
#
# Keyed on `examples/logging.nvs` and not on the `examples/logging/throws.nvs` that actually throws:
# the child is an isolate, and an isolate reads the configuration in force where it was *spawned*
# rather than re-resolving the file (`nvs_runtime::Ctx::isolate` owns why that direction). So the
# block that reaches the child is the one the parent matched, which is this one. It is deliberately
# not `root = "examples"`: `examples/uncaught.nvs` is the fixture for the floor with no handler above
# it, and a handler in scope there would report in the floor's place and prove nothing.
[[app]]
entry = "examples/logging.nvs"

[app.log]
handler = "examples/logging/handler.nvs"

# ADR 0067 § 3's `db.connect` is granted by *name* and never by host: the endpoint lives in
# `[db.main]` at the foot of this file, written by the operator, so what a program asks for
# is permission to open that block and not permission to reach an address. That is also why
# neither block below says anything about `net` — an operator-written endpoint is
# pre-approved against ADR 0058 § 3's denied ranges, which `examples/cache.nvs`'s block
# above has to ask for explicitly because a program names that store's URL itself.
#
# One entry block per fixture rather than one `root = "examples"`: every other fixture in
# this repository runs with no database grant at all, and that is what makes these evidence
# that the check is asked rather than assumed.
[[app]]
entry = "examples/db.nvs"

[app.capabilities.db]
connect = ["main"]

[[app]]
entry = "examples/transaction.nvs"

[app.capabilities.db]
connect = ["main"]

# The streaming read, on the same block: ADR 0067 § 4's `stream` is a member of the
# connection `connect("main")` already hands back, so it needs no grant of its own and
# no second block. What it does need is an entry of its own, for the reason the header
# above gives -- a grant is per application entry, never per directory.
[[app]]
entry = "examples/stream.nvs"

[app.capabilities.db]
connect = ["main"]

# The database fixture whose grant names a *different* block: ADR 0067 § 13's
# pool key is the config block, so `[db.tight]` below is its own pool and nothing this program does
# to that pool's ceiling is reachable from the two fixtures above.
[[app]]
entry = "examples/pool.nvs"

[app.capabilities.db]
connect = ["tight"]

# ADR 0145 § 9's split, written as the two grants it is: `db.connect` is the whole of what
# `planAgainst` needs, and `db.schema` is the separate deny-by-default grant that lets this program
# issue the DDL its plan carries. Both name the `[db.schema]` block below, because both capabilities
# name blocks rather than hosts.
[[app]]
entry = "examples/schema.nvs"

[app.capabilities.db]
connect = ["schema"]
schema = ["schema"]

# The retention entry ADR 0153 § 5 is written around, and the only program in this repository that
# removes queue rows at all. `queue.purge` is deny-by-default and covers `Core\Queue`'s `delete` and
# `purge` together, because the authority the two need is the same one — permission to make a
# queue's rows stop existing — and one row at a time in a loop is that same answer at a different
# rate. It is the one grant `examples/queue-purge.nvs` needs: the connection its rows live on is the
# one `[queue] connection` names, opened on the program's behalf rather than by it, which is why
# `examples/queue.nvs` needs no block in this file at all.
#
# `true` rather than the list of queue names this capability is scoped by, and the fixture's own
# header says why: it draws its four names at run time, since a fixed name would count its own
# previous runs, so nothing written here could name them. The scoped spelling is what `nvs check`
# reads a *literal* queue name against under `E0637`, and `crates/nvs-types`' own cases are where
# that half is pinned — a program whose queues exist only while it runs is not where it could be.
[[app]]
entry = "examples/queue-purge.nvs"

[app.capabilities.queue]
purge = true

# The one block in this file that exists to be *read about* rather than to let a
# fixture run: `docs/examples/config/app/` is the website's page for the `[[app]]`
# directive, and its example prints the settings its own blocks put in force. So
# this block has to be narrower than the `root = "."` one at the top and has to
# disagree with it about something a program can print — `64M` against the `256M`
# `[limits]` sets below, which is the whole demonstration. It grants nothing: what
# the example shows about capabilities is `script.spawn` arriving from the wide
# block untouched, which only holds while this block stays silent about it.
[[app]]
entry = "docs/examples/config/app/01-settings-for-one-application.nvs"

[app.limits]
memory = "64M"

# The second block of that kind, and its grants are the whole page:
# `docs/examples/config/capabilities/` is the website's page for `[capabilities]`,
# and a page whose example prints `(nothing)` on every line teaches nothing about
# the block an operator is about to write. Every grant here is a boolean, which is
# the half a program can read back: `nvs_config::request`'s `as_text` hands
# `Core\Config::get` a scalar and `None` for a list, so a grant scoped to paths
# would print exactly as an absent one does and the example would teach the
# opposite of what the block says. `nvs config dump` is where a scoped grant is
# read, and `crate::audit` is what renders it.
#
# `read = true` is granted to a program that opens no file, and `spawn = false`
# takes back what the `root = "."` block at the top allows — one grant, one
# refusal and one narrowing, which is the whole of what the block does, with
# nothing reachable that was not reachable before.
[[app]]
entry = "docs/examples/config/capabilities/01-what-this-program-is-allowed-to-do.nvs"

[app.capabilities.fs]
read = true

[app.capabilities.script]
spawn = false

# The third block of that kind and the first written for an *attack* rather than
# for an example: `tests/hostile/config/debug-keep_temporary/` exists to make
# `rule:core-classes/temporary-dir-sweep`'s end-of-script sweep come apart, and a sweep has nothing to
# walk until the program has been allowed to create the directories it hoards.
# `write = true` rather than a path, for the reason `examples/files.nvs`' block
# above is written the same way: `Core\IO::temporaryDir` creates under the host's
# own temporary directory, and a grant naming `C:\Users\…\AppData\Local\Temp` or
# `/tmp` would pin the attack to one machine. `read = true` is the half that lets
# it read back what it left behind.
[[app]]
entry = "tests/hostile/config/debug-keep_temporary/01-hoarding-what-the-sweep-must-delete.nvs"

[app.capabilities.fs]
read = true
write = true

# The bound `examples/config.nvs` is written around: ADR 0005's `Runtime`
# directive moves freely up to a ceiling the operator keeps, so `512M` is
# the last value `Core\Config::set("memory", …)` accepts and `1G` is the
# first it refuses. Nothing reads these yet — Stage 3's snapshot is what
# makes them load-bearing — but the fixture's frozen output is derived from
# them, so they belong here rather than in that program's comments.
[limits]
memory = "256M"

[limits.hard]
memory = "512M"

# The other two tiers' blocks, written at exactly the figures `nvs_stdlib::cache`
# ships — 32 MiB a tier and a five-second fill wait — so this repository behaves
# the same with them as it did without them. They are here to be *read*:
# `docs/examples/config/cache-local/` and `docs/examples/config/cache-process/`
# are the website's pages for these two directives, and a page whose example
# prints `(unset)` teaches nothing about a key an operator is about to write.
# Changing either figure changes those programs' frozen output, which is the
# point — a value written down is a value a reader can see arriving.
[cache.local]
max_size = "32M"

[cache.process]
max_size = "32M"
fill_wait = "5s"

# ADR 0059 § 1's coherent tier, as the deployment decision it is: `Core\Cache::shared()`
# and `Core\RateLimit::consume` both open *this* store, and neither takes an argument
# saying where it is. The port is `tests/db/compose.yaml`'s `redis` service —
# `127.0.0.1:16379` rather than 6379, so a developer's own Redis is never the one a
# fixture writes to — and `docs/agent/loop-goal.toml`'s `[docker]` block is what brings
# it up for the acceptance sweep. `redis://` and not `rediss://`, because which
# certificates this binary trusts has no decision yet; `nvs_stdlib::cache`'s module doc
# is the home of that reasoning and of why there is no key for a password or a database
# index either.
[cache.shared]
url = "redis://127.0.0.1:16379"

# The control surface, written as the one value that turns it off, which is what
# this checkout already had: `nvs_config::control`'s `Address::of` reads an absent
# `[control]` block and a `socket = false` to the same `Disabled`, so this line
# creates nothing and changes nothing a fixture can observe. It is here to be
# *read* — `docs/examples/config/control-socket/` is the website's page for the
# directive, and `false` is the spelling a deployment uses to take a control
# surface away again, which no page can show against a block nobody wrote. A path
# here instead would create a socket on every `nvs serve` in this repository and
# put the trust check on this working directory, which is the opposite of leaving
# the tree as it was.
[control]
socket = false

# The end-of-script sweep's one switch, written as the value an absent `[debug]`
# block already means: `nvs_config::tree::Debug::keep_temporary` is `None` here
# and `Some(false)` there, and `rule:core-classes/temporary-dir-sweep`'s sweep asks the same question
# of both, so this line keeps nothing this checkout was deleting. It is here to be
# *read* — `docs/examples/config/debug-keep_temporary/` is the website's page for
# the directive, and a page whose example prints `(nothing)` on the line that
# matters teaches nothing about the key an operator is about to flip. `true` here
# instead would leave every temporary directory of every run in this repository on
# disk, which is the one value this file must not carry: the acceptance sweep runs
# hundreds of programs and nothing else deletes what it kept.
[debug]
keep_temporary = false

# ADR 0067 § 3's root-owned connection, and the block `Core\Db::connect("main")` opens —
# `examples/db.nvs`, `examples/transaction.nvs` and `examples/stream.nvs` are the fixtures
# that read it, and each says in its own header that this file owes it. The server is
# `tests/db/compose.yaml`'s `postgres` service, whose comments own the credentials and the
# reason the published port is 15432 rather than 5432: a fixture that drops and recreates an
# `accounts` table must never find a developer's own PostgreSQL on the other end.
#
# `driver` is written out even though PostgreSQL is the only one implemented.
# `nvs_db::PgTarget::resolve` refuses a block that names no driver rather than assuming the
# one it can speak, so the key is what makes the block openable at all — and when the other
# four land, this block does not change meaning under them.
#
# **`tls_ca_file` is why the fixtures can reach it.** § 3's upgrade has no spelling for turning
# TLS off, and `nvs_host::tls` verifies against anchors compiled into the binary; the compose
# PostgreSQL presents a certificate its own `certs` service issued, so this block names that
# service's CA and nothing else vouches for the server. The file is not in git — it belongs to
# a Docker volume and is remade whenever that volume is — and `tools/loop.py` copies it out as
# part of bringing the servers up. By hand, it is the one command
# `tests/db/compose.yaml`'s header names.
[db.main]
driver = "postgres"
host = "127.0.0.1"
port = 15432
user = "novis"
password = "Novis-Test-Pw1"
database = "novis_test"
tls_ca_file = "tests/db/ca.crt"

# The same server, under a second name, with ADR 0067 § 13's ceiling wound all the way down —
# `examples/pool.nvs` is the only program granted it. A second block rather than a `[db.main.pool]`
# on the one above, because § 13 keys a pool by the block: a `max` of 1 written on `[db.main]` would
# be a bound the other two fixtures run under as well, and the point of this one is that reaching
# the ceiling is *this* program's own business.
#
# `idle` is written because it has to be. It defaults to 2 and `nvs_config::db::pool_for` refuses an
# `idle` above `max` at boot, so a block that lowers `max` to 1 and says nothing else does not load
# at all — for every program, since this file is one snapshot.
#
# `acquire` is short for the fixture's sake and for no other reason: it is how long the second
# connect waits before it throws, and the default 5s would be five seconds of wall clock in the
# acceptance sweep to learn the same thing 500ms proves. It is comfortably longer than the 60ms of
# sleeps the sibling task spends, which is what makes the count that program prints a constant.
[db.tight]
driver = "postgres"
host = "127.0.0.1"
port = 15432
user = "novis"
password = "Novis-Test-Pw1"
database = "novis_test"
tls_ca_file = "tests/db/ca.crt"

[db.tight.pool]
max = 1
idle = 1
acquire = "500ms"

# ADR 0145 § 9's fixture, and the one `[db.<name>]` block in this file that names no server.
# `examples/schema.nvs` counts the steps of a plan exactly, and § 7 makes that count depend on every
# other table in the database — so it cannot share `main` with the queue, the transaction fixture and
# whatever an operator left there. SQLite needs no container, and `:memory:` gives each run of the
# acceptance sweep — Windows, WSL, and again under valgrind — a database in the same state, which is
# what makes four frozen lines of output a constant rather than a description of one machine.
[db.schema]
driver = "sqlite"
path = ":memory:"

# The backend `rule:core-classes/queue-storage-is-a-table`'s schema had no hand-written list for, and
# the reason this block is here at all: the queue's schema is one value `nvs_db::ddl` emits in every
# dialect, so `nvs queue migrate --connection mssql --dry-run` prints two tables for a driver nobody
# ever wrote a `create table` for. The dry run touches no port, which is why this block being a
# server only `tests/db/compose.yaml` starts costs the acceptance sweep nothing.
#
# The `mssql` service there is what it names. The image's only account is `sa` and the database is
# created by that service's own healthcheck rather than by its entrypoint, which is why this writes
# no other user and why `database` is the name that healthcheck creates.
[db.mssql]
driver = "mssql"
host = "127.0.0.1"
port = 11433
user = "sa"
password = "Novis-Test-Pw1"
database = "novis_test"
tls_ca_file = "tests/db/ca.crt"

# ADR 0084 § 2's queue, and `examples/queue.nvs` is the fixture it exists for. `connection = "main"`
# is the recommended configuration rather than a convenience: § 3's property — an enqueue commits
# with the write that caused it, or with neither — is only available to a queue whose rows live in
# the application's *own* database, so this names the block the two fixtures above already write to.
# A separate queue database is permitted and silently gives that up, which is why the ADR asks the
# documentation to say so where the option is offered, and this is that place.
#
# `workers = 1` rather than § 2's own example of `4`: the fixture asserts `claimed 1` about a single
# job, so a second worker is only a second chance to be the one that took it and proves nothing the
# first does not. `0` would be § 2's enqueue-only deployment, which is a real configuration and the
# wrong one here — nothing would ever claim, and the fixture's next four lines are about a job that
# ran.
#
# `max_attempts` and `visibility` are deliberately unwritten, so both keep `QueueBounds::DEFAULTS` in
# `nvs_config::queue` — § 2's own numbers. The retry ladder the fixture measures is the one it writes
# per push, as `maxAttempts: 2`, because that is a property of the job and not of the deployment.
[queue]
connection = "main"
workers = 1

# The after-response executor's cap, written at the number
# `rule:concurrency/deferred-is-bounded-by-two-directives` prints and
# `nvs_runtime::Ctx::deferred_max_concurrent` already answers where nothing is written — so this
# checkout holds exactly as much after-response work with the line as it did without it. It is here
# to be *read*: `docs/examples/config/deferred-max_concurrent/` is the website's page for the
# directive, and a page whose example prints `(nothing)` on the one line the whole page is about
# teaches nothing about the number an operator sizes a machine with.
#
# The block's other half stays unwritten on purpose. `deferred.deadline` is one of the few keys in
# this file a program may set for itself, and `docs/examples/config/deferred-deadline/` is the page
# that shows it arriving as the built-in default and being changed from code — which only holds
# while nothing here writes it.
[deferred]
max_concurrent = 256

# The outbound pool's two caps, written at the numbers `nvs_stdlib::http`'s `DEFAULT_POOL_IDLE` and
# `DEFAULT_POOL_IDLE_TIMEOUT` already apply where nothing is written — so this checkout holds exactly
# as many idle connections per core with the two lines as it did without them. They are here to be
# *read*: `docs/examples/config/http-client-pool_idle/` and `.../http-client-pool_idle_timeout/` are
# the website's pages for the pair, and a page whose example prints `(nothing)` on the one line the
# whole page is about teaches nothing about the memory an operator sizes a host with.
#
# The rest of `[http.client]` stays unwritten on purpose, and each half for its own reason.
# `connect_timeout`, `deadline`, `idle`, `max_duration` and `max_redirects` are bounds over the one
# call a request is making, which a program names at the call site instead. `[http.client.socket]` is
# the same, and `docs/examples/config/http-client-socket/` is the page that shows its bound arriving
# as the built-in default and then being changed from code — which only holds while nothing here
# writes it. And an absent `[http.client.proxy]` is how a deployment says it wants no proxy at all
# (`rule:http-server/an-outbound-proxy-is-operator-configured`), so writing one to make a page print
# would send every outbound byte this checkout sends through a host that is not there.
[http.client]
pool_idle = 16
pool_idle_timeout = "30s"
