[[app]]
entry = "tests/hostile/config/debug-keep_temporary/01-hoarding-what-the-sweep-must-delete.nvs"

[app.capabilities.fs]
read = true
write = true

# `lang:errors/capability-denials-are-catchable`'s second example, and the only
# one of its three that needs a grant at all: the other two are written around a
# call nobody allowed, which is what every entry in this file already has by
# saying nothing. What this one shows is the *pair* — `fs.read` scoped to the one
# directory holding its data, and `fs.write` never mentioned — so a reader sees
# that a grant is per capability rather than per program, and the denial it
