# The repository's own `nvs.toml` — ADR 0103 § 1 step 2's `./nvs.toml`, found
# in the working directory and nowhere else.
#
# Exactly one directive in it is read today: ADR
# 0102 § 6 makes `Core\Router::urlAbsolute`'s origin *configured* and refuses
# to derive one from `Host` or `X-Forwarded-Host`, so a program calling that
# member has no answer it is allowed to give until this key exists.
# `configured_origin` in `crates/nvs-cli/src/main.rs` is the reader and its doc
# comment owns why it is one key rather than a config format; M6 lands the real
# tree, with ADR 0064's syntax and ADR 0103's ownership check, and this file
# becomes an ordinary root of it.
#
# `examples/routes.nvs` is what reads it today, so `nvs run` from this
# directory prints an absolute link rather than throwing. Changing the value
# changes that program's expected output, which `docs/agent/loop-goal.toml`
# freezes.

# ADR 0104 § 1: an application is an entry file path, and the block naming it is
# `[[app]]` — an array of tables. There is no `[app]` table for a global origin
# to sit in, because TOML refuses `app` as both spellings in one file. `root`
# resolves against this file's own directory (ADR 0103 § 5), so this block is
# every `.nvs` in the repository, `examples/routes.nvs` included.
[[app]]
root = "."
origin = "https://example.test"

# ADR 0118 § 2 puts a `script.spawn` check inside the door `spawn script`
# resolves a target through, and ADR 0118 § 1 denies by default — so
# `examples/isolate.nvs` needs this grant to spawn anything at all. `true`
# rather than a list of roots: every example in this repository is one the
# checkout already trusts, and narrowing it here would only be a second
# spelling of "the repository".
[app.capabilities.script]
spawn = true

# `examples/capability.nvs` is the fixture ADR 0118 exists for, so its block is
# written to be *narrower* than the one above rather than wider: ADR 0104 § 2
# layers an exact `entry` over the `root = "."` block, and a block may take a
# capability away as well as grant one. What it demonstrates is a program
# meeting one grant and two refusals, so `fs.read` is scoped to the one
# directory holding its data, `fs.write` is never mentioned, and `script.spawn`
# is switched off again — `false` is `Grant::Nothing` in
# `nvs_config::capability`, which is how a narrowing block says no to something
# a broader one allowed.
[[app]]
entry = "examples/capability.nvs"

[app.capabilities.fs]
read = ["examples/capability"]

[app.capabilities.script]
spawn = false

# `examples/files.nvs` works inside `Core\IO::temporaryDir()`'s answer, and that
# path is the *host's* — `C:\Users\…\AppData\Local\Temp\nvs-…` on Windows,
# `/tmp/nvs-…` under WSL, and neither is a name this repository could write down
# without pinning the fixture to one machine. `true` is `Grant::Everything` in
# `nvs_config::capability`, and it is the honest spelling of what the fixture
# needs: a scratch directory it creates, fills, reads back and removes. Narrowing
# is what `examples/capability.nvs`'s block above exists to show; this one is
# about the members.
[[app]]
entry = "examples/files.nvs"

[app.capabilities.fs]
read = true
write = true

# `examples/process.nvs` runs this repository's own `nvs` binary and then asks
# to run a `.bat`, so its `process.exec` grant has to cover **both** targets:
# ADR 0044 § 4's refusal is by target kind and the door asks the capability
# first, so a grant that named only the binary would make the second call a
# capability denial and the fixture would still print `refused: no shell form`
# while proving nothing. Scoped to the two paths rather than `true` because
# that is the whole point of the member being path-scoped. `fs.read` is
# `Core\IO::exists`'s, which picks the platform's spelling of the binary.
[[app]]
entry = "examples/process.nvs"

[app.capabilities.fs]
read = ["target/debug", "examples/process"]

[app.capabilities.process]
exec = ["target/debug", "examples/process"]

# `examples/http.nvs` talks to an origin on the loopback, which ADR 0058 § 3
# denies by default — so this block is where that ADR's *other* half is written
# down: `net.connect` says which names the program may reach, and `net.internal`
# says which of § 3's denied addresses this deployment reaches anyway. Both
# names are granted and only one address is excepted, which is what the fixture
# is for: `169.254.169.254` is granted by name and still refused on its address,
# so the program's third line proves the policy is asked of the resolved address
# rather than of the name. An exception is a literal address and never a
# hostname (`nvs_config::tree::CapNet::internal` owns why), and it widens
# nothing on its own — an address named here is unreachable until a `connect`
# grant names the host as well.
[[app]]
entry = "examples/http.nvs"

[app.capabilities.net]
connect = ["127.0.0.1", "169.254.169.254"]
internal = ["127.0.0.1"]

# The bound `examples/config.nvs` is written around: ADR 0005's `Runtime`
# directive moves freely up to a ceiling the operator keeps, so `512M` is
# the last value `Core\Config::set("memory", …)` accepts and `1G` is the
# first it refuses. Nothing reads these yet — Stage 3's snapshot is what
# makes them load-bearing — but the fixture's frozen output is derived from
# them, so they belong here rather than in that program's comments.
[limits]
memory = "256M"

[limits.hard]
memory = "512M"
