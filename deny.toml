# cargo-deny configuration. Run: cargo deny check
#
# The point of this file is that Novis's memory-safety and supply-chain claims are
# enforced by CI rather than by good intentions.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"
# No blanket ignores. An advisory that genuinely does not apply gets an entry
# here with a comment explaining why, and a date to revisit.
ignore = [
    # `paste` is unmaintained, not vulnerable. It is a proc-macro that `rav1d` and `rav1e` run at
    # compile time inside the image extension, and it never sees program input. Revisit 2027-04-01.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro of the image extension's AV1 codecs" },
    # `ttf-parser` is unmaintained, not vulnerable. The image extension parses fonts with it, and
    # `ab_glyph` parses through it too, so leaving it means replacing the font stack. The extension
    # runs in the wasm sandbox. Revisit 2027-04-01.
    { id = "RUSTSEC-2026-0192", reason = "font parsing inside the sandboxed image extension; no maintained drop-in" },
    # `rustybuzz` is unmaintained, not vulnerable. The pdf extension shapes text with it through
    # `krilla` 0.8.2 and `usvg` 0.47, the versions `krilla-svg` 0.8.1 needs, and no release of
    # either leaves it. The extension runs in the wasm sandbox. Revisit 2027-04-01.
    { id = "RUSTSEC-2026-0206", reason = "text shaping inside the sandboxed pdf extension, through krilla; no release leaves it" },
]

# ---------------------------------------------------------------------------
# Licences. Novis itself ships as MIT; anything we link must be compatible with
# distributing a permissively licensed binary. Apache-2.0 dependencies are
# fine (cranelift and wasmtime are Apache-2.0 WITH LLVM-exception).
#
# This list decides what Novis may *link*. What it must then *ship* — the
# reproduced notice for each component — is decided by its generator,
# `tools/nv/cmd/gen-attribution.ts`, whose `PREFERENCE` must name exactly the
# identifiers below, in preference order, plus the font-data licences of its
# `FONT_DATA` (OFL-1.1), which no crate may offer. The generator fails if the
# two ever drift, so edit both together.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",            # MIT without the attribution clause; `borrow-or-share`
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # a *data* license; `webpki-roots` carries Mozilla's CA set under it
    "MPL-2.0",          # file-level copyleft only; acceptable for unmodified deps
    "Unlicense",        # public-domain dedication; the `regex` family's other half
]
confidence-threshold = 0.93
# Copyleft that would infect Novis's own licensing is simply absent from `allow`,
# so it fails closed rather than needing an explicit deny list.

[[licenses.exceptions]]
# Cranelift and the wasmtime crates it pulls in.
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "cranelift-codegen"

# ---------------------------------------------------------------------------
# Dependency hygiene
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"      # tighten to "deny" once the tree settles
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, with the reason.
deny = [
    # A memory-safe runtime does not embed a C parser generator or C crypto.
    { name = "openssl-sys", reason = "use rustls; no C TLS in the trusted core" },
    { name = "openssl", reason = "use rustls; no C TLS in the trusted core" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
