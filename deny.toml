# cargo-deny configuration. Run: cargo deny check
#
# The point of this file is that MWL's memory-safety and supply-chain claims are
# enforced by CI rather than by good intentions.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"
# No blanket ignores. An advisory that genuinely does not apply gets an entry
# here with a comment explaining why, and a date to revisit.
ignore = []

# ---------------------------------------------------------------------------
# Licences. MWL ships as MIT OR Apache-2.0; anything we link must be compatible
# with distributing a permissively licensed binary.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",          # file-level copyleft only; acceptable for unmodified deps
]
confidence-threshold = 0.93
# Copyleft that would infect MWL's own licensing is simply absent from `allow`,
# so it fails closed rather than needing an explicit deny list.

[[licenses.exceptions]]
# Cranelift and the wasmtime crates it pulls in.
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "cranelift-codegen"

# ---------------------------------------------------------------------------
# Dependency hygiene
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"      # tighten to "deny" once the tree settles
wildcards = "deny"
highlight = "all"
# Crates we never want pulled in, with the reason.
deny = [
    # A memory-safe runtime does not embed a C parser generator or C crypto.
    { name = "openssl-sys", reason = "use rustls; no C TLS in the trusted core" },
    { name = "openssl", reason = "use rustls; no C TLS in the trusted core" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
