# looper's configuration for this repository. docs/agent/coordinator.md is what is specific to Novis, and
# the key names are looper's own, from its docs/design.md.

[project]
name = "mwl"
stacks = ["rust", "bun"]
goals_dir = "docs/goals"
playbook = "docs/agent/playbook.md"
playbook_dir = "docs/agent/playbook"
harvest = false           # Novis harvests nothing: a reached goal's decisions are already rules
carry_to_floor = false    # no check joins the floor when its goal is reached
scratch = ".agent-tmp"

[budget]                  # the ceilings of AGENTS.md § Session workflow step 2; no kill, as the old driver had none
hard = 200000
interactive = 250000
slice = 120000

[loop]
min_free_gb = 10          # `nv disk`'s MIN_FREE_GB
sweep = "every"

[verify]
run = [["bun", "nv", "verify"]]

# The generated files `.gitattributes` marks that the two commands below write without a built binary. A
# catch-up merge takes main's side of each, then renders them again from the merged sources.
# `website/src/data/core.json`, `reference.json` and `docs/novis.md` need the binary, so a conflict in
# one is a landing session.
[merge]
generated = [
  "data/schema/*.schema.json",
  "data/spec/core-members.json",
  "crates/nvs-stdlib/src/classes.rs",
  "website/config/novis.tmLanguage.json",
  "website/src/data/compare.json",
  "website/src/data/numbers.json",
  "docs/rules/*.md",
  "docs/ground-rules.md",
]
render = [["bun", "nv", "render"], ["bun", "nv", "rules", "--render"]]

# The Bash calls that take machine-wide heavy-job slots beside looper's built-in cargo and `bun test`. A
# pattern matches a command's first words, so a flag counts only where it comes first. The measuring
# commands take every slot, so no build runs beside them and skews what they record.
[jobs]
heavy = [
  "bun nv verify",
  "bun nv affected --run",
  "bun nv suite",
  "bun nv try",
  "bun nv proofs --run",
  "bun nv legs",
  "bun nv db-matrix",
]
exclusive = [
  "bun nv bench",
  "bun nv benches",
  "bun nv debt",
  "bun nv bench-load",
  "bun nv bench-proxied",
  "bun nv bench-compare",
  "bun nv scaling",
  "bun nv proofs --record-perf",
]

[checks]
timeout = 1800           # the acceptance runner's own
# Bun 1.3 prints only failing tests when `CLAUDECODE` is set, and a check's `tests` list is matched against
# the `(pass)` lines, so every check runs with it empty.
env = { CLAUDECODE = "" }

# `tools/nv/cmd/sweep.ts`: it sweeps the disk, the build only when the disk is low, and reads the nightly
# CI run back. It runs no check and pays no floor debt, which the floor check `floor-debt` pays once per
# goal. The timeout covers the cargo queries a low disk's sweep asks for the live set. The command exits 0
# whatever it finds, so only a timeout or a crash fails it, and that pauses the loop. It is attached, so
# the next session starts once it has ended.
[hooks]
after_session = [{ run = ["bun", "nv", "sweep"], timeout = 900, on_fail = "pause" }]
# `tools/nv/cmd/side.ts`: in a side loop's lane, it installs the tools' packages, copies in the git-ignored
# files and seeds the selection store, each only when it is missing; in any other loop it does nothing.
# The timeout covers its own 600-second cap on `bun install` and the copies.
before_run = [{ run = ["bun", "nv", "side", "--prepare", "--hook"], timeout = 900, on_fail = "pause" }]

# The project's own refusals, on top of looper guard's built-in rules. A pattern is a regex over the whole
# command and over each part between `;`, `&&`, `||`, `|` and newlines. Rust's regex has no lookahead, so a
# rule that excludes a flag lists the words a command may hold instead, and a command may start with
# `timeout`, `time`, `nice`, `nohup`, `env` or `NAME=value`. `tools/nv/test/guard-deny.test.ts` holds a
# command each rule refuses and a near miss it lets through.
[[guard.deny]]
pattern = '(?ms)(?:^|[;&|]\s*)(?:for|while|until|xargs)\b.*(?:\bnvs(?:\.exe)?\s+run\b.*(?:docs[/\\]examples|tests[/\\]hostile|benches[/\\]members)\b|(?:docs[/\\]examples|tests[/\\]hostile|benches[/\\]members)\b.*\bnvs(?:\.exe)?\s+run\b)|(?:docs[/\\]examples|tests[/\\]hostile|benches[/\\]members)\b.*(?:^|[;&|]\s*)(?:for|while|until|xargs)\b.*\bnvs(?:\.exe)?\s+run\b'
reason = "This runs `nvs run` in a loop over the feature proofs. `bun nv proofs --run --id <feature> --show` runs each of a feature's examples and attacks in one call and reports what each printed."

[[guard.deny]]
pattern = '^(?:(?:timeout(?:\s+-\S+)*\s+\S+|time|nice|nohup|env|[A-Za-z_]\w*=\S*)\s+)*cargo\s+(?:\+\S+\s+)?(?:build|test|clippy)(?:\s+(?:[^\s-]\S*|-[^\s\-r]\S*|-r\S+|--[^\s\-rp]\S*|--p[^\sr]\S*|--))*\s+(?:-p|--package)\S*(?:\s+(?:[^\s-]\S*|-[^\s\-r]\S*|-r\S+|--[^\s\-rp]\S*|--p[^\sr]\S*|--))*\s*$'
reason = "A debug `cargo build`, `cargo test` or `cargo clippy` with `-p` resolves features over one package and writes a second copy of every workspace crate (AGENTS.md rule 5). Leave out `-p` and narrow what runs with `--test <name>` or `--lib`, or run `bun nv verify -p <crate>`."

[[guard.deny]]
pattern = '^(?:(?:timeout(?:\s+-\S+)*\s+\S+|time|nice|nohup|env|[A-Za-z_]\w*=\S*)\s+)*bun\s+(?:run\s+)?(?:nv|\S*tools[/\\]nv[/\\]main\.ts)\s+(?:(?:sweep|debt)(?:\s+(?:[^\s-]\S*|-[^\s\-h]\S*|--[^\sh]\S*))*\s*$|benches\b|verify\b.*\s--no-cache\b|select\b.*\s--full\b|proofs(?:\s+(?:[^\s-]\S*|-[^\s-]\S*|--[^\sigo]\S*|--i[^\sd]\S*|--o[^\sn]\S*|--g[^\sr]\S*))*\s+--(?:run|verify)\b(?:\s+(?:[^\s-]\S*|-[^\s-]\S*|--[^\sigo]\S*|--i[^\sd]\S*|--o[^\sn]\S*|--g[^\sr]\S*))*\s*$)'
reason = "This runs more than your change reaches: `nv sweep` and `nv debt` are looper's hooks, `nv benches` is the release's, and `nv proofs` with no `--id`, `nv verify --no-cache` and `nv select --full` run every atom. `bun nv affected --run` runs exactly what your change reaches."

[[guard.deny]]
pattern = '^(?:(?:timeout(?:\s+-\S+)*\s+\S+|time|nice|nohup|env|[A-Za-z_]\w*=\S*)\s+)*looper\s+check(?:\s+(?:[^\s-]\S*|-[^\s-]\S*|--[^\sn]\S*|--n[^\sa]\S*))*\s*$'
reason = "`looper check` with no `--name` runs the live goal's whole acceptance, whatever your change reaches. Name the check with `looper check --name <text>`."

[prose]
scope = "Text an end user reads"
paths = [
  "website/**/*.mdx",
  "website/**/*.md",
  "**/about.md",
]

[sync]
skip = [
  "docs/decisions/README.md",    # the template writes it, and `bun nv rules --check` fails on a decision record directory
  "docs/agent/commands.md",
  "docs/agent/conventions.md",
  "docs/agent/doc-style.md",
  "docs/agent/playbook.md",      # `looper lint` reads the template block's own list as bullets and refuses them
  "tools/git-hooks/commit-msg",  # Novis's hook passes a merge and git's `fixup!` subjects, which the template refuses
]

[commits]
subject_max = 120
types = ["feat", "fix", "docs", "refactor", "perf", "test", "chore", "build"]
