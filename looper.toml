# looper's configuration for this repository. docs/agent/coordinator.md is what is specific to Novis, and
# the key names are looper's own, from its design document.

[project]
name = "mwl"
stacks = ["rust", "bun"]
goals_dir = "docs/goals"
playbook = "docs/agent/playbook.md"
playbook_dir = "docs/agent/playbook"
harvest = false           # Novis harvests nothing: a reached goal's decisions are already rules
carry_to_floor = false    # no check joins the floor when its goal is reached
scratch = ".agent-tmp"
design = ""               # no architecture doc: the rules and each crate's module doc hold the design

[budget]                  # the ceilings of AGENTS.md § Session workflow step 2, with no kill
hard = 200000
interactive = 250000
slice = 120000

[orient]
traps = 8                 # the most playbook bullets the pack prints, nearest the next anchors first

[loop]
min_free_gb = 10          # `nv disk`'s MIN_FREE_GB
sweep = "done"           # a goal is verified once, at its end, so its checks run only on a DONE claim

[verify]
run = [["bun", "nv", "verify"]]

# The generated files `.gitattributes` marks that the two commands below write without a built binary. A
# catch-up merge takes main's side of each, then renders them again from the merged sources.
# `website/src/data/core.json`, `reference.json` and `website/public/llms-full.txt` need the binary, so a conflict in
# one is a landing session.
[merge]
generated = [
  "data/schema/*.schema.json",
  "data/spec/core-members.json",
  "crates/nvs-stdlib/src/classes.rs",
  "website/config/novis.tmLanguage.json",
  "website/src/data/compare.json",
  "website/src/data/numbers.json",
  "docs/rules/*.md",
  "docs/ground-rules.md",
]
render = [["bun", "nv", "render"], ["bun", "nv", "rules", "--render"]]

# The Bash calls that take machine-wide heavy-job slots beside looper's built-in cargo and `bun test`. A
# pattern matches a command's first words, so a flag counts only where it comes first. The measuring
# commands take one slot like any other: a wait for every slot never ends while other projects build, and
# the perf ledgers count work rather than time.
[jobs]
heavy = [
  "bun nv verify",
  "bun nv affected --run",
  "bun nv suite",
  "bun nv try",
  "bun nv proofs --run",
  "bun nv valgrind",
  "bun nv db-matrix",
  "bun nv bench",
  "bun nv benches",
  "bun nv debt",
  "bun nv bench-load",
  "bun nv bench-proxied",
  "bun nv bench-compare",
  "bun nv scaling",
  "bun nv proofs --record-perf",
]
# The commands that drive Docker. An image build runs in Docker's VM, whose CPU the watch cannot see,
# and `bench-compare` builds Novis's image in release without printing for minutes. `docker build` is
# the same wait run by hand, as `docker/README.md` builds a Linux `nvs`.
hang_exempt = ["^bun nv bench-(compare|proxied)\\b", "\\bdocker build\\b"]

[checks]
timeout = 1800           # the acceptance runner's own
# Bun 1.3 prints only failing tests when `CLAUDECODE` is set, and a check's `tests` list is matched against
# the `(pass)` lines, so every check runs with it empty.
env = { CLAUDECODE = "" }

# `tools/nv/cmd/sweep.ts`: it sweeps the disk, its stale build caches included, and reads the nightly
# CI run back. It runs no check and pays no floor debt, which the floor check `floor-debt` pays once per
# goal. The timeout covers the cargo queries the sweep asks for the live set after a manifest changes. The command exits 0
# whatever it finds, so only a timeout or a crash fails it, and that pauses the loop. It is attached, so
# the next session starts once it has ended.
[hooks]
after_session = [{ run = ["bun", "nv", "sweep"], timeout = 900, on_fail = "pause" }]
# `tools/nv/cmd/side.ts`: in a side loop's lane, it installs the tools' packages, copies in the git-ignored
# files and seeds the selection store, each only when it is missing; in any other loop it does nothing.
# The timeout covers its own 600-second cap on `bun install` and the copies.
before_run = [{ run = ["bun", "nv", "side", "--prepare", "--hook"], timeout = 900, on_fail = "pause" }]
# `tools/nv/lib/site-roadmap.ts`: once a goal is retired, it drops the goal from the public roadmap and
# commits that, because the retirement commits only the goals directory. A failure pauses the loop,
# because the roadmap check stays red until it is fixed.
# `tools/nv/cmd/ci.ts`: then it runs the pre-push checks and pushes `main`, and the push starts the CI
# runs the `ci-green` goal's loop watches. A failed or refused push only warns, so the next goal still
# starts: a refused push leaves its red checks where `ci-green`'s watch reports them, and that loop
# fixes them and pushes. The timeout covers a cold `cargo build`, the checks, a fetch and a push.
# `tools/nv/cmd/relink.ts`: then it rebuilds `target/release/nvs`, the binary the user's editor and
# terminal run, so every goal end leaves it current. It is attached, so the next session's timing checks
# never share the machine with a release build. A failed build only warns. The timeout covers a cold
# release build with thin LTO.
# `tools/nv/cmd/vsix.ts`: last, it rebuilds `editors/vscode/nvs.vsix`, the file the user installs the
# extension from, when the extension's tree changed since the last build, and builds nothing otherwise.
# A failed build only warns. The timeout covers an `npm ci` into an empty `node_modules/` and a package.
after_retire = [
  { run = ["bun", "nv", "site", "--roadmap", "--retired"], timeout = 120, on_fail = "pause" },
  { run = ["bun", "nv", "ci", "--push"], timeout = 2400, on_fail = "warn" },
  { run = ["bun", "nv", "relink", "--build", "--hook"], timeout = 3600, on_fail = "warn" },
  { run = ["bun", "nv", "vsix", "--hook"], timeout = 1200, on_fail = "warn" },
]

# `scope` is the words looper writes into `docs/agent/prose.md`. The files the prose check reads and its
# rules are `tools/nv/cmd/prose.ts`'s.
[prose]
scope = "Text an end user reads"

# Each gate is the project's own command, which runs the same without looper: `looper links`, `layout`
# and `prose` run it in place of looper's check. `looper guard` runs `guard` after its claims, in place of
# its built-in rules, and `tools/nv/cmd/guard.ts` says how the settings' one hook reaches it.
[gates]
links = ["bun", "nv", "links"]
layout = ["bun", "nv", "layout", "--check"]
prose = ["bun", "nv", "prose"]
guard = ["bun", "tools/nv/main.ts", "guard", "--gate"]  # not `bun nv`, whose script line would open every reason

[sync]
skip = [
  "docs/decisions/README.md",    # the template writes it, and `bun nv rules --check` fails on a decision record directory
  "docs/agent/commands.md",
  "docs/agent/conventions.md",
  "docs/agent/doc-style.md",
  "docs/agent/playbook.md",      # `looper lint` reads the template block's own list as bullets and refuses them
  "docs/agent/prose.md",         # names `bun nv prose`, the command `[gates] prose` runs
  "docs/agent/testing.md",       # names `bun nv affected`, which a session without looper runs
  "tools/git-hooks/commit-msg",  # Novis's hook passes a merge and git's `fixup!` subjects, which the template refuses
]

[commits]
subject_max = 120
types = ["feat", "fix", "docs", "refactor", "perf", "test", "chore", "build"]

# The programs a person starts by hand, which looper's UI starts and stops. Each runs `bun astro` in
# `website/`, as `website/README.md` § Commands names it. A server is ready once Astro prints its local
# address, and takes no heavy slot: it sits idle between page loads.
[[launch]]
name = "website-dev"
title = "Website: dev server"
about = "Serves the website with live reload, rendering each page from the repository's sources when it is opened."
run = ["bun", "astro", "dev", "--port", "{port}"]
cwd = "website"
kind = "service"
port = 4321
open = "http://localhost:{port}/"
ready = "localhost:\\d+"
heavy = false

[[launch]]
name = "website-build"
title = "Website: build"
about = "Builds the static website into website/dist/. Extra arguments follow `astro build`, such as `--base /novis/`."
run = ["bun", "astro", "build", "{args}"]
cwd = "website"
kind = "task"
args = true

[[launch]]
name = "website-preview"
title = "Website: preview the build"
about = "Serves website/dist/ as the last build left it. Run the build first."
run = ["bun", "astro", "preview", "--port", "{port}"]
cwd = "website"
kind = "service"
port = 4322
open = "http://localhost:{port}/"
ready = "localhost:\\d+"
heavy = false
