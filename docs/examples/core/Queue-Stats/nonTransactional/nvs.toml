# The `jobs` database is kept in memory. It is deleted when the program ends.
[db.jobs]
driver = "sqlite"
path = ":memory:"

# The `shop` database is a second database in memory, for the orders of a shop.
[db.shop]
driver = "sqlite"
path = ":memory:"

# The program may open both databases itself, to create the tables.
[capabilities.db]
connect = ["jobs", "shop"]

# `Core\Queue` saves its jobs in the `jobs` database.
# `workers = 0` starts no workers, so no job is started.
[queue]
connection = "jobs"
workers = 0
