# The examples start servers on socket files and connect to them.
# These lines allow those socket files, and nothing else.
[capabilities.net]
local = ["/tmp/novis-greeter.sock", "/tmp/novis-worker.sock"]

# The examples delete their socket files when they are done.
[capabilities.fs]
write = ["/tmp/novis-greeter.sock", "/tmp/novis-worker.sock"]
