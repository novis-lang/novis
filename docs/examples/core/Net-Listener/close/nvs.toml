# The examples open a server on this computer and connect to it.
# These lines allow a server only at `127.0.0.1`. One example uses the fixed port 47123,
# and the others use a port the system picks.
# A program run with `nvs run` may connect to this computer without a grant.
[capabilities.net]
listen = ["127.0.0.1:0", "127.0.0.1:47123"]
