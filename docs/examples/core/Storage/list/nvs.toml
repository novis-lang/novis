# The `files` disk reads its files from the `disk` folder next to these examples.
# The path is relative to the folder you run `nvs` from.
[storage.files]
root = "docs/examples/core/Storage/list/disk"

# The program may read files in that folder, and nowhere else.
# A path in `[capabilities]` is relative to this file.
[capabilities.fs]
read = ["disk"]
