# The `jobs` database is kept in memory. It is deleted when the program ends.
[db.jobs]
driver = "sqlite"
path = ":memory:"

# The program may open the `jobs` database itself, to create the tables.
[capabilities.db]
connect = ["jobs"]

# The program may delete the jobs of the `mail` and `exports` queues.
# Without this list, `Core\Queue::delete` throws an error.
[capabilities.queue]
purge = ["mail", "exports"]

# `Core\Queue` saves its jobs in the `jobs` database.
# `workers = 0` starts no workers, so no job is started.
[queue]
connection = "jobs"
workers = 0
