# The extension `Geo\Atlas` is a `.nvsx` file that `nvs ext build` made.
# `sha256` is the line that `nvs ext build` printed. The extension may read the folder `data/`.
[[extension]]
path = "../../config/extension-grants-what-a-component-may-reach/atlas.nvsx"
sha256 = "e05d5aefc48218c936ce53aa42030872f4e16f4687284a00df8bc6be9a2af72a"
grants = { read = ["data/"] }

# The program in this folder may read the folder `data/` too.
[capabilities.fs]
read = ["data/"]
