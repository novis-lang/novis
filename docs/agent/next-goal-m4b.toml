# M4B's acceptance test, as data. STAGED -- this is not the running goal.
#
# `tools/goal-switch.py` copies the live `loop-goal.toml`'s checks in here as Stage 1's floor and
# writes the result; see `next-goal-m4b.md` § *Switching to this goal*. Do not hand-merge them.
#
# `tools/loop.py` runs the checks below in order, short-circuiting on the first failure, so the ledger
# line each iteration writes says exactly how far the loop got. Every check must pass. Nothing else
# counts as done -- not a passing unit test, not a session claiming DONE.
#
# `next-goal-m4b.md` is the prose: the target, the stages, the standing decisions. It does not restate
# this list and this file does not restate its reasoning. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A CASE'S *SOURCE* IS NOT. A `.lspt` case's document, cursor or
# request may be corrected freely -- whoever wrote it was writing against a server that did not exist.
# What may never change is its `--EXPECT--`, or its reason for existing.

# Every fixture the run touches. Stage 1's floor brings its own list; `goal-switch.py` unions them.
files = [
  "examples/hello.mwl", "examples/calls.mwl", "examples/throw.mwl", "examples/arith.mwl",
  "examples/trace.mwl", "examples/uncaught.mwl", "examples/fatal.mwl",
  "examples/objects.mwl", "examples/arrays.mwl", "examples/errors.mwl", "examples/hooks.mwl",
  "examples/enums.mwl", "examples/iterate.mwl", "examples/core.mwl", "examples/report.mwl",
  "examples/nullable.mwl", "examples/match.mwl",
  "examples/text.mwl", "examples/numbers.mwl", "examples/dates.mwl", "examples/json.mwl",
  "examples/collect.mwl",
]

# What a session of this goal READS. `python tools/orient.py` slices exactly these out of the live
# files and prints nothing else. Every entry is a SELECTOR, never a copy; a wrong one is a loud
# warning. loop-authoring.md § 2 is the rules, `python tools/orient.py --audit` is the price.
#
# THIS BLOCK STARTS NARROW ON PURPOSE and is expected to move through the goal, because M4B's stages
# sit in genuinely different file sets -- Stage 2 is `mwl-syntax`, Stage 3 is a crate that does not
# exist yet, Stage 5 is TypeScript. Naming all three up front prints two unread module maps every
# session. The commented blocks below are the selectors each later stage wants; a session that opens
# the first slice of a stage moves the comment markers and says so in the handoff.
[context]

modules = [
  # Stage 0 and Stage 2. The lexer is where trivia lands, `parser/mod.rs` holds the entry points and
  # the recovery contract, `parser/expr.rs` is where the synthesized member name is made, `ast.rs` is
  # what gains `MemberName::Missing`.
  "crates/mwl-syntax/src/lexer.rs",
  "crates/mwl-syntax/src/parser/mod.rs",
  "crates/mwl-syntax/src/parser/expr.rs",
  "crates/mwl-syntax/src/ast.rs",
  # Stage 0 only -- drop these two once the catch-up list is empty.
  "crates/mwl-ir/src/lower.rs",

  # -- Stage 3 (uncomment when item 10 opens; drop Stage 2's parser files at the same time) --
  # "crates/mwl-lsp/src/**",
  # "crates/mwl-diagnostics/src/source.rs",
  # "crates/mwl-types/src/expr_table.rs",
  # "crates/mwl-stdlib/src/registry.rs",

  # -- Stage 5 (uncomment when item 21 opens) --
  # `orient.py` reads `editors/*/src/**/*.ts` for its first `//`/JSDoc line the same way it reads a
  # crate's `//!`. If this prints nothing, that tooling change did not land -- say so in the handoff.
  # "editors/vscode/src/**",
]

# The decisions this goal's work sits inside, by ADR number. One-sentence bullet each, out of
# ground-rules.md -- the index, not the rule.
rules = ["0040", "0099", "0016", "0039", "0009", "0007"]

# ADR sections sliced live into the pack. `NNNN` alone is the In short block; `NNNN §N` is one
# section. Name only what EVERY session of this goal needs -- a per-item section prints unread.
adrs = [
  # The tree and the case format: every stage reads one of these two.
  "0099 §1",
  "0099 §5",
  # -- Stage 3 (uncomment with the modules block above) --
  # "0099 §2",
  # "0099 §3",
  # -- Stage 5 --
  # "0099 §4",   # the colour lists, which item 22 must not re-derive
  # "0099 §6",
]

# Headings of docs/agent/conventions.md naming shapes this goal will write.
shapes = ["A `.lspt` case", "A `.mwlt` test case", "A commit message", "A diagnostic"]

# Traps from docs/agent/playbook.md. An entry is a `##` heading (the whole section) or ONE bullet
# named by its bold lead-in after a `>`. This is the pack's largest section and the only one that
# grows on its own, so name bullets. `python tools/playbook.py --goal` ranks them against `modules`
# above -- re-run it after the modules block moves to a new stage.
playbook = [
  # The process traps, by hand. These name no crate and rank zero against any file set, so they
  # never come out of `--goal`; they apply to every session of every goal.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole adr',
  'Tooling > never plan.py',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
  'Tooling > a loop-goal.toml',
  'Running things > target/release/mwl.exe is',
  'Running things > verify.py never',
]

plan = ["Open now", "Blocking"]

# M4B whole, not `:verify`. It is about a page, and unlike a `Core` milestone it is the actual
# specification of what each item builds -- a session that reads only the acceptance paragraph
# re-derives the request set and the colour list, which is the expensive half.
milestones = ["M4B"]

[valgrind]
skip = ["examples/fatal.mwl", "examples/uncaught.mwl"]

[wsl]
target_dir = "/tmp/mwl-target-wsl"


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- CATCH-UP. Four M4 language holes, each of which silently limits what a case can be
# written in. Runs BEFORE the program legs, so an unfinished item here is what the ledger names.
# The ordered list and what "done" means for each is next-goal-m4b.md § Stage 0.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-ir (the four holes)"
args = ["test", "-p", "mwl-ir"]
tests = [
  # Item 1 -- ADR 0027's first-class callable reaches lowering instead of panicking.
  "a_first_class_callable_lowers",
  # Item 2 -- a closure called through the variable holding it.
  "a_closure_variable_is_callable",
  # Item 3 -- the one M4 control-flow statement that did not lower.
  "a_do_while_loop_lowers",
  # Item 4 -- ADR 0007 § 2's two bool rows, `false as string` rendering "" and not nothing.
  "a_bool_converts_to_int_and_string",
]


# ---------------------------------------------------------------------------------------------------
# Stage 1 -- THE NON-REGRESSION FLOOR. Every check of the M4S goal, verbatim, relabelled to this
# stage. `tools/goal-switch.py` writes them here; this marker is where they go and it must not be
# deleted, because an empty floor is a run with nothing under it.
# ---------------------------------------------------------------------------------------------------

# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- THE KEYSTONE. One lossless tree, and the case format that can check anything at all.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 keystone"
name = "mwl-syntax (the lossless tree)"
args = ["test", "-p", "mwl-syntax"]
tests = [
  # Item 5 -- the property the whole design rests on, over the corpus rather than one file.
  "tokens_and_trivia_reproduce_every_source_byte",
  "a_comment_survives_in_the_trivia_layer",
  # Item 6 -- a synthesized member name is distinguishable from one the user wrote.
  "a_missing_member_name_is_explicit_not_an_empty_span",
  # Item 7 -- the index, and the promise that the strict path did not change.
  "the_syntax_index_answers_the_innermost_node_at_an_offset",
  "the_strict_entry_point_reports_exactly_what_it_reported_before",
  # Item 8 -- the core claim of ADR 0040, mechanized: every prefix of every example.
  "every_prefix_of_every_example_parses_without_panicking",
  "an_incomplete_prefix_still_reports_a_diagnostic",
]

[[check]]
kind = "cargo-named"
stage = "2 keystone"
name = "mwl-test (the shared section lexer)"
args = ["test", "-p", "mwl-test"]
tests = [
  # Item 9 -- one section parser, two formats. A `.mwlt` case must be unaffected by the extraction.
  "the_section_lexer_reads_both_case_formats",
]


# ---------------------------------------------------------------------------------------------------
# Stage 3 -- THE SERVER. Six requests, two code actions, and the guard that says the trade Stage 2
# made is still paying. Every request slice ships its own `.lspt` cases; the suite below is how that
# is enforced, and the coverage guard is how "enough cases" is decided by the grammar rather than by
# a number somebody picked.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "mwl-suite"
stage = "3 server"
name = "lsp cases"
args = ["lsp-test", "tests/lsp/"]
# A floor, not the gate. The gate is `every_request_answers_every_construct` below: a count can be
# satisfied by six hundred cases about one construct, and that test cannot.
min_passing = 120

[[check]]
kind = "cargo-named"
stage = "3 server"
name = "mwl-lsp"
args = ["test", "-p", "mwl-lsp"]
tests = [
  # Item 10 -- the one that is invisible on ASCII and wrong on every other file.
  "a_position_round_trips_through_utf16_and_utf8",
  "the_negotiated_encoding_is_the_one_the_client_offered",
  # Item 11 -- an unsaved buffer is what the graph resolves against, and a stale analysis is dropped.
  "an_unsaved_buffer_shadows_the_file_on_disk",
  "an_analysis_for_a_superseded_version_is_cancelled",
  # Item 18 -- the boundary: a code action exists only where the diagnostic already carries the fix.
  "a_code_action_comes_from_a_suggestion_the_diagnostic_already_carried",
  # Item 9's guard, and this goal's real definition of done.
  "every_request_answers_every_construct",
  # Item 19 -- Stage 2 gave up incremental reparse; this is the measurement that says it still pays.
  "a_full_reanalysis_of_a_thousand_lines_stays_under_the_bound",
]

[[check]]
kind = "cargo-named"
stage = "4 cli"
name = "mwl-cli (ast --json)"
args = ["test", "-p", "mwl-cli"]
tests = [
  # Item 20 -- ADR 0040 § 3 assumed this existed. A frozen schema, and the resilient tree by default.
  "ast_json_matches_its_frozen_schema",
  "ast_json_renders_a_file_that_does_not_compile",
]


# ---------------------------------------------------------------------------------------------------
# Stage 5 -- THE EXTENSION. Two tiers. A `command` check is not a PROGRAM_KIND, so it runs ONCE
# between the legs rather than per leg -- which is right: a TextMate grammar has no calling
# convention, and the WSL leg exists for the one thing that does. So the distro needs no Node.
# The headless tier runs every iteration; the extension-host one is memoized against the green tree
# the way the valgrind sweep is, because it needs a display and a downloaded VS Code build and
# neither belongs on the per-iteration path.
#
# `kind = "command"` runs an argv in `cwd`, requires exit 0, and checks `want` as ordered substrings
# across stdout+stderr. `memoize = true` remembers a pass against the exact tree in
# `.loop/goal-green.json`, like the WSL leg and the valgrind sweep.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 extension"
name = "vscode (headless)"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "test:headless"]
# Three suites behind one script: the TextMate grammar snapshots, the contributions/allowlist test,
# and the protocol round-trip against the real `mwl lsp` binary. Each names itself so a ledger line
# says which one broke.
want = ["grammar:", "contributions:", "protocol:", "0 failing"]

[[check]]
kind = "command"
stage = "5 extension"
name = "vscode (extension host)"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "test:host"]
memoize = true
want = ["0 failing"]

[[check]]
kind = "command"
stage = "5 extension"
name = "vsix packages"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "package"]
memoize = true
want = [".vsix"]


# ---------------------------------------------------------------------------------------------------
# Stage 6 -- THE STANDING GUARDS. Not M4B's work, but M4B is where they would break.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 guards"
name = "mwl-runtime (manifest policy)"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # `tokio` does not enter this workspace -- ADR 0099 § 2, asserted rather than remembered, in the
  # same test shape that already holds `[profile.release] overflow-checks`.
  "the_workspace_has_no_async_runtime",
]
