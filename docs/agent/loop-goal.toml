  "a_task_all_field_holding_a_callable_variable_is_a_compile_error",
  "a_task_all_binds_each_fields_own_type",
  # § 3 -- one options shape, and no `timeout` wrapper to reach for.
  "a_limit_and_deadline_options_shape_is_the_only_spelling",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/tasks.nvs"
