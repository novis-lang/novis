# A caught throw's own trace, read back from Novis through its backtrace property.
[[check]]
kind = "ordered"
stage = "1 floor"
file = "examples/trace.nvs"
stream = "stdout"
want = ["#0 Deep::inner()", "#1 Deep::outer()"]

# An uncaught throw: non-zero exit plus `rule:errors/log-write`'s tier-4 floor record on stderr. The floor writes the
# record `Core\Log::write` writes, and `rule:errors/renderings`'s log target renders it as JSON Lines by default, so the
# Novis-level backtrace arrives as that record's `backtrace` field rather than as a bare block of text.
[[check]]
kind = "ordered"
stage = "1 floor"
file = "examples/uncaught.nvs"
stream = "stderr"
exit = "nonzero"
want = ['"level":"error"', '"msg":"unhandled"', '"class":"LogicError"', "#0 Boom::inner()", "#1 Boom::outer()"]

# A contained helper panic: FATAL, non-zero, and the output produced before it survives.
[[check]]
kind = "contains"
stage = "1 floor"
file = "examples/fatal.nvs"
args = ["--fault-inject=helper-panic"]
exit = "nonzero"
stderr_contains = ["FATAL"]
stdout_contains = ["start"]

# --dump-asm prints generated code instead of running, the way --dump-ir already does.
[[check]]
kind = "min-bytes"
stage = "1 floor"
file = "examples/arith.nvs"
args = ["--dump-asm"]
stream = "stdout"
min_bytes = 200

