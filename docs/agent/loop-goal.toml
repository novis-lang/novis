# ---------------------------------------------------------------------------------------------------
# Stage 2 -- Stage 0's item list as one program. Separate from Stage 0 so the ledger tells "the unit
# guards are green" apart from "the program runs".
#
# `mixed=2.5`: ADR 0007 § 4's promotion, item 1. `avg=3.5` and `whole=two`: integer division as a union,
# item 2. `guarded=overflow`: item 3, over i64::MAX. `counted=5`: item 7, both positions. `bits=22` and
# `not=-1`: item 4, five binary rows plus the unary one, four of them reached through their compound
# spelling. `pow=1048576`: item 5. `cmp=-1,0,1`: item 6.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/operators.nvs"
want = [
  "mixed=2.5", "avg=3.5", "whole=two", "guarded=overflow",
  "counted=5", "bits=22", "not=-1", "pow=1048576", "cmp=-1,0,1",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- control flow and calls. Two fixtures, because the two halves share no file set: `control.nvs`
# is `control.rs`/`exception.rs`/`generator.rs`, `callable.nvs` is `call.rs`/`closure.rs`/`mod.rs`.
#
# `control.nvs`: `digits` is item 9's `do`/`while`, `scan` item 10's `break 2`, `label` item 11's two-
# representation ternary, the two `cleanup` lines item 12 (the second reached through a `catch` body that
# throws), and `closed` before `taken=3` is item 13 -- the generator is abandoned by the `break` and runs
# the `finally` it is suspended inside, where PHP runs it.
#
# `callable.nvs`: `direct` is item 15, `spread`/`named` item 16, `elements` item 17, `byref` item 18 (the
# second read is in the SAME statement as the call, which is what the copy-back at the enclosing statement
# gets wrong), `scaled` item 20.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/control.nvs"
want = [
  "digits=01234", "scan=1235", "label=0",
  "cleanup return", "handled=handled",
  "cleanup rethrow", "rethrown=second",
  "closed", "taken=3",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/callable.nvs"
want = [
  "twice=10", "direct=13", "spread=10", "named=hi!hi!",
  "elements=4", "byref=7 then 7", "scaled=60",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (control flow)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # Item 9's `do`/`while` and item 12's `finally`-through-a-throwing-`catch` are owned by the
  # conformance cases of the same names, already listed in the `nvs-suite` check below: `nvs-ir` has
  # no lowering test for either, and the observable order is what both guards were about.
  "a_multi_level_break_leaves_the_loop_its_level_names",
  "a_ternary_with_mismatched_branch_types_joins_at_the_tagged_representation",
  "an_abandoned_generator_resumes_into_the_finally_it_is_suspended_inside",
  # Item 14. The first now covers the two producers that used to release only on the normal edge --
  # a `match` subject and its labels, and an `unset` target's rendered key; the second is the one
  # shape the owned-temporaries stack still misses, named in its own field doc.
  "an_inline_producer_releases_its_value_on_the_throw_path",
  "a_transferred_argument_is_released_when_a_later_one_throws",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (calls)"
args = ["test", "-p", "nvs-ir"]
tests = [
  "a_closure_is_called_through_the_variable_holding_it",
  "a_named_argument_lowers_to_its_declared_position",
  "a_spread_argument_lowers_to_the_positions_it_fills",
  "a_spread_argument_through_a_callable_becomes_one_array",
  "a_spread_array_element_lowers",
  "a_reference_argument_lowers_in_any_expression_position",
  "a_closure_capturing_a_by_reference_parameter_snapshots_the_cell",
