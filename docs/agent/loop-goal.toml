# ---------------------------------------------------------------------------------------------------
# Stage 0 -- THE OPERATOR TABLE. `tools/loop.py` runs a `stage = "0..."` cargo check BEFORE the program
# legs, which is what this stage is for: every fixture and every case in every stage below is written
# against these rules, so one written while an item here is open is written AROUND it -- and a case that
# spells `0.0 - 1.5` to dodge an int/float mix reads as deliberate and nobody re-checks it.
#
# Every test named below must EXIST and pass. Most do not exist yet; writing one is how the loop finishes
# its item. Do not rename one to something already green.
# ---------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------
# Stage 00 -- THE SHAPES A PROGRAM REACHES FOR ON ITS FIRST PAGE. Items 44-49 in loop-goal.md, and the
# first block in this file on purpose: `loop.py` runs a stage whose name starts with "0" in the catch-up
# class, ahead of the program legs, and within that class the run order is this file's own order.
#
# Ahead of stage 0 and of stage 0a for a sharper version of stage 0's reason. Stage 0's items make a case
# subtly wrong -- a fixture that spells `0.0 - 1.5` to dodge an int/float mix reads as deliberate. These
# make one unwritable: `for (int $i = 0; ...)` does not parse and `Limits::MAX` panics the compiler, so
# every case in every stage below is written around them, and item 44 carries the migration of the ones
# already written that way.
#
# Every test and case named below must EXIST and pass, and none of them exists yet -- writing one is how
# the loop finishes its item. Until then this file's first check fails, which is the point: the ledger
# names the basics while they are open rather than reporting how far past them it got.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-syntax (the for header)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  # ADR 0109 § 1 -- the init clause's two alternatives, and the trial parse that tells them apart.
  "a_for_init_clause_declares_one_typed_local",
  "a_for_init_clause_is_still_a_list_of_expressions",
  # ADR 0109 § 3 -- the two shapes that still do not parse, each by its own code.
  "a_for_init_clause_mixing_a_declaration_and_an_expression_is_e0124",
  "a_for_init_clause_with_two_declarations_is_e0125",
  # Item 50 -- PHP's enum body, answered the way `trait` and `(int)` already are.
  "a_php_shaped_enum_case_is_refused_naming_the_spelling_that_works",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (constants, `static` and `instanceof`)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 45 -- the checker half: a class constant's own declared type at a read.
  "a_user_declared_class_constant_reads_at_its_declared_type",
  # Item 46 -- ADR 0008's late static binding, as a type rather than as a dispatch.
  "a_static_return_type_resolves_to_the_called_class",
  # Item 47 -- the direction a program written against an abstraction actually uses.
  "an_instanceof_test_narrows_its_subject_to_an_interface",
  # Item 48 -- one arity rule, both sides of the `Core`/user-class line.
  "a_core_class_with_no_constructor_refuses_arguments",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (the shape table)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # Item 45 -- the lowering half.
  "a_user_declared_class_constant_lowers_to_its_value",
  # Item 49 -- the table widened past declared types. `every_spellable_type_reaches_a_diagnostic_or_an_ir`
  # is Stage 8's and stays there; this is its expression-and-statement half.
  "every_spellable_expression_reaches_a_diagnostic_or_an_ir",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/lang/a-for-header-declares-its-own-counter.nvst",
  "tests/conformance/lang/a-class-constant-is-read-at-its-declared-type.nvst",
  "tests/conformance/lang/new-static-through-two-levels-returns-the-called-class.nvst",
  "tests/conformance/lang/an-instanceof-guard-narrows-to-an-interface.nvst",
]

# ---------------------------------------------------------------------------------------------------
# Stage 0a -- ADR 0107's `inout` spelling. Named to start with "0" deliberately: that is what puts a
# check in `loop.py`'s catch-up class, which runs before everything else so the ledger names this while
# it is unfinished. Ahead of stage 0 for stage 0's own reason applied to the surface -- a case written
# in the old spelling is written twice. Items 18-20 in loop-goal.md.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-syntax (the inout spelling)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  # ADR 0107 -- the modifier slot, in all three declaration positions, and the call-site marker on `Arg`.
  "an_inout_parameter_parses_in_the_modifier_slot",
  "an_inout_foreach_binding_and_destructuring_leaf_parse",
  "an_inout_argument_parses_at_a_call_site",
  # ADR 0107 -- `&` is refused wherever it meant by-reference, and kept wherever it did not.
  "an_ampersand_by_reference_marker_is_refused_naming_inout",
  "an_ampersand_still_parses_as_bitwise_and_and_as_an_intersection",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (the call-site marker)"
args = ["test", "-p", "nvs-types"]
tests = [
  # ADR 0107 -- both directions of the call-site rule.
  "an_inout_argument_is_required_where_the_parameter_declares_one",
  "an_inout_argument_is_refused_where_the_parameter_is_by_value",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (the promotion table)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 1 -- ADR 0007 § 4: a mixed-representation arithmetic or ordering pair has a result type AND
  # a stated widening, which is the half `arithmetic_result` records nothing for today.
  "a_mixed_numeric_pair_widens_the_narrower_operand",
  "a_mixed_numeric_comparison_widens_the_same_way",
  # Item 2 -- `int / int` is `int|float`, widened to `float` where a binding declares one.
  "an_integer_division_is_a_union_widened_at_its_binding",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (the operator rows)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # Item 1 -- the widening is a conversion in `lower_binary`, not a backend repair.
  "a_mixed_numeric_pair_converts_before_the_operator",
  # Item 4 -- five binary rows and one unary one, and the compound forms they carry with them.
  "every_bitwise_operator_lowers",
  "a_bitwise_compound_assignment_lowers_through_its_binary_form",
  # Item 5
  "a_power_operator_lowers_over_every_numeric_row",
  # Item 6
  "the_spaceship_operator_is_the_compare_to_result_itself",
  # Item 7 -- both positions, and the address computation split out of `lower_reassignment` so a
  # re-evaluable target is read once.
  "an_increment_lowers_in_either_position",
  "a_compound_assignment_evaluates_its_target_once",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-codegen (the operator rows)"
args = ["test", "-p", "nvs-codegen"]
tests = [
  # Item 2 -- the union result picks its instruction at runtime.
  "an_integer_division_emits_both_of_its_representations",
  # Item 3 -- ADR 0007 § 4's overflow throw, at the three arithmetic sites, over `Inst::on_error`.
  "an_integer_addition_traps_on_overflow",
  "an_integer_subtraction_and_multiplication_trap_on_overflow",
  # Item 8 -- `Enum(Int)` reaches the integral compare rows.
  "two_enum_values_compare_as_their_backing_integer",
]

