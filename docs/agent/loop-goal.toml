args = ["test", "tests/conformance/"]
min_passing = 1350
cases = [
  "tests/conformance/db/a-prepared-statement-binds-by-name-and-by-position.nvst",
  "tests/conformance/db/a-transaction-is-a-closure-that-rolls-back-on-a-throw.nvst",
  "tests/conformance/db/a-roll-back-survives-a-catch-of-throwable.nvst",
  "tests/conformance/db/a-typed-row-throws-naming-the-column.nvst",
  "tests/conformance/reject/a-tainted-value-at-a-query-text-parameter-is-refused.nvst",
  "tests/conformance/reject/a-two-statement-literal-query-is-refused.nvst",
  "tests/conformance/reject/a-host-on-a-sqlite-settings-literal-is-refused.nvst",
  "tests/conformance/db/an-enqueue-commits-with-the-write-that-made-it.nvst",
  "tests/conformance/db/an-exhausted-job-is-dead-lettered-and-not-discarded.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "10 corpus"
name = "differential"
args = ["test", "tests/differential/"]
