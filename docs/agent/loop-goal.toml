# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 750
cases = [
  # Stage 0
  "tests/conformance/lang/every-arithmetic-row-promotes-the-narrower-operand.nvst",
  "tests/conformance/lang/an-integer-division-is-exact-only-where-it-divides.nvst",
  "tests/conformance/lang/an-integer-overflow-throws-rather-than-wrapping.nvst",
  "tests/conformance/lang/the-bitwise-operators-answer-over-every-row.nvst",
  "tests/conformance/lang/an-increment-answers-the-same-in-either-position.nvst",
  "tests/conformance/lang/a-spaceship-orders-every-scalar-the-relational-operators-do.nvst",
  # Stage 3
  "tests/conformance/lang/a-do-while-runs-its-body-before-its-condition.nvst",
  "tests/conformance/lang/a-break-leaves-the-level-it-names.nvst",
  "tests/conformance/lang/a-break-level-that-names-no-target-is-a-diagnostic.nvst",
  "tests/conformance/lang/a-ternarys-two-arms-widen-to-one-value.nvst",
  "tests/conformance/error/a-finally-runs-when-its-catch-body-throws.nvst",
  "tests/conformance/iter/an-abandoned-generator-runs-the-finally-it-is-suspended-inside.nvst",
  "tests/conformance/lang/a-closure-is-called-through-the-variable-holding-it.nvst",
  "tests/conformance/lang/a-named-argument-binds-by-name-and-a-spread-by-position.nvst",
  "tests/conformance/lang/a-reference-argument-is-written-back-before-the-next-read.nvst",
  "tests/conformance/array/a-foreach-by-reference-writes-through-to-its-array.nvst",
  # Stage 4
  "tests/conformance/array/a-nested-element-write-separates-only-the-inner-array.nvst",
  "tests/conformance/class/a-static-property-is-written-and-read-through-its-class.nvst",
  "tests/conformance/lang/a-mixed-value-answers-arithmetic-truth-and-a-subscript.nvst",
  "tests/conformance/lang/an-operator-agrees-whether-its-operand-is-typed-or-tagged.nvst",
  "tests/conformance/lang/as-bytes-over-a-tagged-operand-is-decided-by-its-runtime-tag.nvst",
  "tests/conformance/lang/every-remaining-conversion-row-runs-or-throws.nvst",
  # Stage 5
  "tests/conformance/class/a-property-observer-sees-every-write-its-class-makes.nvst",
  "tests/conformance/class/a-delegated-interface-forwards-to-the-object-it-names.nvst",
  # `rule:classes/delegation-by-field`'s other half: the forward exists for every member, so a field that cannot answer one
  # of them is refused where the `by` is written rather than at the call.
  "tests/conformance/class/a-delegate-field-must-be-able-to-answer-the-interface.nvst",
  # `rule:attributes/structural-retrieval` and `rule:attributes/retrieval-folds-while-checking` match a payload *structurally* rather than by the attribute's name, so the case
  # is named for the shape it satisfies; "its own type" was the nominal reading that ADR refuses.
  "tests/conformance/core/an-attribute-is-retrieved-by-the-shape-it-satisfies.nvst",
  # The refusal half of the same rule, and the only place the explicit call-site type argument
  # `Core\Attributes::get<T>(…)` is both accepted and refused in one program: § 5's two-match
  # ambiguity is E0728 here, decided at compile time rather than by a test run.
  "tests/conformance/reject/an-attribute-retrieval-is-refused-where-it-cannot-be-folded.nvst",
  # `rule:errors/diagnostic-record`'s two halves, which one `.nvst` cannot hold: § 3's plaintext view over every node kind,
  # and § 5's redaction row, whose value never reaches the record at all.
  "tests/conformance/core/a-dump-renders-one-record-through-one-plaintext-view.nvst",
  "tests/conformance/core/a-secret-typed-property-is-redacted-wherever-it-is-dumped.nvst",
  "tests/conformance/lang/inline-html-at-file-scope-is-echoed-in-place.nvst",
  "tests/conformance/lang/a-required-file-runs-its-own-top-level-statements.nvst",
  # `rule:statements/a-require-expression-is-mixed`'s value form, which is a separate program from the statement form above.
  "tests/conformance/lang/a-required-file-hands-a-value-back.nvst",
  # Stage 6. Four rules whose assertion is a program rather than a checker unit test, so the
  # `cargo-named` entries that used to name them are gone -- see guard-name-debt.md's cause 2.
  # `rule:types/unions-and-mixed`'s fourth narrowing spelling, and the reachability half that a body can satisfy:
  "tests/conformance/lang/a-match-and-a-switch-over-true-narrow-per-arm.nvst",
  "tests/conformance/lang/a-for-body-that-always-returns.nvst",
  "tests/conformance/lang/a-method-returns-early-from-inside-a-loop.nvst",
  "tests/conformance/class/a-promoted-constructor-parameter-is-a-property.nvst",
  # `rule:types/grammar`: a key is a `string` and nothing else, and a `&` binding agrees on the element type.
  "tests/conformance/lang/a-foreach-key-binding-is-a-string-and-nothing-else.nvst",
  "tests/conformance/array/a-by-reference-binding-needs-a-variable-and-the-element-type.nvst",
  # Stage 7. `rule:testing/test-attribute`'s surface landed -- `#[Test]`, `#[Fixture]` and `#[TestWith]` are on
  # `nvs_types::derive::ATTRIBUTES`, `Core\Test` is `crate::test::CLASS` in `nvs_stdlib::registry`,
  # and the runner reads the table back -- so these five are the cases that own what the deleted
  # `nvs-stdlib (the assertion roster)` check named in Rust: § 5's ledger, § 5's catchable failure,
  # and § 22's three renderings (human by default, then the two machine twins).
  "tests/conformance/lang/a-test-attribute-builds-a-table-the-runner-reports.nvst",
  "tests/conformance/core/test-three-assertions-agree-on-what-reaches-the-ledger.nvst",
  "tests/conformance/core/a-failed-assertion-is-caught-by-name.nvst",
  "tests/conformance/lang/a-test-run-reports-a-versioned-json-document.nvst",
  "tests/conformance/lang/a-test-run-reports-the-junit-xml-ci-ingests.nvst",
  # Stage 0a -- `rule:statements/inout-is-the-by-reference-spelling`. The 14 cases that spelled `&$` moved to `inout` with their expected output
  # unchanged, which is the check that `rule:statements/inout-is-the-by-reference-spelling` changed no semantics; this one pins the new shapes.
  "tests/conformance/lang/a-by-reference-argument-is-written-inout-at-both-ends.nvst",
  # Item 29's two write shapes, both cause-2 moves out of `nvs-types (targets and refusals)`: each
  # refusal was already landed in `expr/assign.rs` with a case pinning every spelling that reaches
  # it, and a multi-diagnostic program is what asserts them, not a checker unit test.
  "tests/conformance/class/a-nullsafe-assignment-target-is-refused.nvst",
  "tests/conformance/array/an-element-write-through-a-hooked-property-is-refused.nvst",
  # Item 27's pair, and one case owns both: `rule:expressions/nullable-conversion-availability` is refused at both ends -- `E0709` for a row
