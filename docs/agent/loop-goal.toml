  # of them is refused where the `by` is written rather than at the call.
  "tests/conformance/class/a-delegate-field-must-be-able-to-answer-the-interface.nvst",
  # ADR 0046 §§ 4-5 match a payload *structurally* rather than by the attribute's name, so the case
  # is named for the shape it satisfies; "its own type" was the nominal reading that ADR refuses.
  "tests/conformance/core/an-attribute-is-retrieved-by-the-shape-it-satisfies.nvst",
  # The refusal half of the same rule, and the only place the explicit call-site type argument
  # `Core\Attributes::get<T>(…)` is both accepted and refused in one program: § 5's two-match
