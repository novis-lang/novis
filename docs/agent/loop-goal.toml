stage = "9 check and trace"
name = "nvs-db (the span carries no value)"
args = ["test", "-p", "nvs-db"]
tests = ["a_query_span_contains_no_parameter_value_anywhere"]

[[check]]
kind = "exact"
stage = "9 check and trace"
file = "examples/db.nvs"
want = [
  "rows=3", "ada", "grace", "alan",
  # § 9's structured half: the four `Db\Row` readers whose answer is a class
  # instance the driver cannot build, so `nvs-stdlib` builds it out of the
  # components `PgColumn::scalar` hands over.
  "day=2024-03-05", "clock=13:45:30", "at=2024-03-05T13:45:30Z",
  "id=4f9d5e2c-1a3b-4c7d-8e9f-0a1b2c3d4e5f",
  "affected=1", "typed row ok",
  # The same five classes on the hydration side: a `#[Db\Derive]` field may be
  # declared as one, and the instance the driver's components built is checked
  # against it rather than refused.
  "typed day=2024-03-05",
  # § 8's kind on a real refusal: the primary key refuses a second write of row
  # 1, and the thrown `Db\DbError` carries the normalised case rather than
  # `23505`, so the `match` in the fixture is the branch an application writes.
  "kind=UniqueViolation",
  # And § 8's raw half beside it: `sqlState` is the code the server itself sent,
  # so the normalisation above is checked against the thing it normalised. This
  # line is PostgreSQL-specific by construction -- `23505` is that server's
  # unique violation, where MySQL's is `1062` -- which is the whole reason the
  # normalised `kind` exists and this property does not replace it.
  "sqlState=23505",
  # § 8's third raw value: the primary key the second write broke, by its own
  # name. `people_pkey` is PostgreSQL's default name for `people`'s primary key
  # -- the fixture never spells it -- so this line also pins that the driver
  # reports the server's `C` field rather than parsing it out of the message.
  "constraint=people_pkey",
  # § 8's fifth property, and the one that pins *which* spelling of the
  # statement rides the throw: the caller's, with `?` markers, rather than § 5's
  # rewrite of it into the `$1` this driver sent. A property of a normalised
  # error that read `$1` here and `?` on MySQL would be the vendor detail
  # `kind` exists to spare an application. The bound `1` and `"ada"` are absent
  # from it, which is the half of § 8 that is a security rule.
  "sql=insert into people (id, name) values (?, ?)",
]


# ---------------------------------------------------------------------------------------------------
# Stage 10 -- the corpus and the migration floor, and this is the second-largest jump in the program.
# The oracle build gained `mysqli`, `pgsql` and `sqlite3` on 2026-08-29, so the three APIs ADR 0067
# replaces are now IN the inventory rather than a named hole beside it: 227 names, a fifth of the whole
# table, all of them this goal's. Modelled at 98%; the floor is 94.
# 1-core-depth.toml's Stage 7 comment derives the whole curve.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
