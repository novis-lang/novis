# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the corpus and the guards. `mwl test <dir>` must exit 0 AND print an "N passed, M failed"
# summary: a suite that silently collected nothing exits 0 too. These run once, not per leg.
#
# `cases` is the `.mwlt` twin of `cargo-named`: each file must exist, run, and not be skipped. Most do
# not exist yet -- writing one is how an item above finishes.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "mwl-suite"
stage = "8 corpus and guards"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 750
cases = [
  # Stage 0
  "tests/conformance/lang/every-arithmetic-row-promotes-the-narrower-operand.mwlt",
  "tests/conformance/lang/an-integer-division-is-exact-only-where-it-divides.mwlt",
  "tests/conformance/lang/an-integer-overflow-throws-rather-than-wrapping.mwlt",
  "tests/conformance/lang/the-bitwise-operators-answer-over-every-row.mwlt",
  "tests/conformance/lang/an-increment-answers-the-same-in-either-position.mwlt",
  "tests/conformance/lang/a-spaceship-orders-every-scalar-the-relational-operators-do.mwlt",
  # Stage 3
  "tests/conformance/lang/a-do-while-runs-its-body-before-its-condition.mwlt",
  "tests/conformance/lang/a-break-leaves-the-level-it-names.mwlt",
  "tests/conformance/lang/a-ternarys-two-arms-widen-to-one-value.mwlt",
  "tests/conformance/error/a-finally-runs-when-its-catch-body-throws.mwlt",
  "tests/conformance/iter/an-abandoned-generator-runs-the-finally-it-is-suspended-inside.mwlt",
  "tests/conformance/lang/a-closure-is-called-through-the-variable-holding-it.mwlt",
  "tests/conformance/lang/a-named-argument-binds-by-name-and-a-spread-by-position.mwlt",
  "tests/conformance/lang/a-reference-argument-is-written-back-before-the-next-read.mwlt",
  "tests/conformance/array/a-foreach-by-reference-writes-through-to-its-array.mwlt",
  # Stage 4
  "tests/conformance/array/a-nested-element-write-separates-only-the-inner-array.mwlt",
  "tests/conformance/class/a-static-property-is-written-and-read-through-its-class.mwlt",
  "tests/conformance/lang/a-mixed-value-answers-arithmetic-truth-and-a-subscript.mwlt",
  "tests/conformance/lang/every-remaining-conversion-row-runs-or-throws.mwlt",
  # Stage 5
  "tests/conformance/class/a-property-observer-sees-every-write-its-class-makes.mwlt",
  "tests/conformance/class/a-delegated-interface-forwards-to-the-object-it-names.mwlt",
  "tests/conformance/lang/an-attribute-is-retrieved-by-its-own-type.mwlt",
  "tests/conformance/lang/a-dump-renders-one-record-and-redacts-a-secret.mwlt",
  "tests/conformance/lang/inline-html-at-file-scope-is-echoed-in-place.mwlt",
  "tests/conformance/lang/a-required-file-runs-its-own-top-level-statements.mwlt",
  # Stage 7
  "tests/conformance/lang/a-test-attribute-builds-a-table-the-runner-reports.mwlt",
]

[[check]]
kind = "mwl-suite"
stage = "8 corpus and guards"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 165
cases = [
  # The rows PHP itself is the only authority on. Each is an item above whose answer is "whatever
  # PHP prints", and each is worth a differential case rather than a frozen one for that reason.
  "tests/differential/lang/an-integer-division-matches-phps.mwlt",
  "tests/differential/lang/the-bitwise-operators-match-phps.mwlt",
  "tests/differential/lang/a-mixed-numeric-promotion-matches-phps.mwlt",
  "tests/differential/iter/an-abandoned-generators-finally-matches-phps.mwlt",
  "tests/differential/lang/a-named-and-spread-argument-match-phps.mwlt",
  "tests/differential/lang/a-reference-argument-matches-phps.mwlt",
]

# A named test must both EXIST and pass -- `cargo test` is green on a suite that never ran the guard.
[[check]]
kind = "cargo-named"
stage = "8 corpus and guards"
name = "mwl-stdlib (Part I)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
]

# The mechanical end gate. It reads `mwl-ir`'s and `mwl-codegen`'s own sources for refusal sites -- a
# panic naming an unsupported shape -- and fails naming every one that is not on the allowlist frozen in
# the test. THE ALLOWLIST MAY NEVER GROW: every entry is a bullet in loop-goal.md § Standing decisions,
# and adding one to make a run go green is the single move this goal forbids outright. A count of
# conformance cases is a proxy for "the language is finished"; this is not.
[[check]]
kind = "cargo-named"
stage = "8 corpus and guards"
name = "mwl-ir (no refusal left)"
args = ["test", "-p", "mwl-ir"]
tests = ["every_refusal_is_a_diagnostic_or_decided"]


# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the named guard tests, carried whole from the previous goal.
# ---------------------------------------------------------------------------------------------------

# `--test perf_guards` and not the whole package, which is a MEASUREMENT and not a narrowing. The
# release profile is `lto = "thin"` with `codegen-units = 1`, so a one-line change to any crate this
# reaches costs a thin-LTO relink of every binary the package holds -- measured on this tree, after
# touching `mwl-runtime`: 200s for the package's five test binaries, 133s for this one. Every `#[test]`
# in `perf_guards.rs` carries `#[cfg_attr(debug_assertions, ignore)]`, so the two halves partition the
# package exactly: this one runs the guards and skips nothing, the debug one runs everything else and
# skips the guards.
[[check]]
kind = "cargo-named"
stage = "9 guards"
name = "abi-probe"
args = ["test", "--release", "-p", "mwl-abi-probe", "--test", "perf_guards"]
tests = [
  "a_typed_arithmetic_loop_contains_no_call",
  "a_typed_arithmetic_loop_stays_in_the_native_cost_class",
  "a_refcount_one_array_member_mutates_in_place",
  # Carried from the previous goal's Stage 0, into this block rather than beside it: the two used to
  # share one cargo run only by having word-for-word identical `args`, and one list cannot diverge.
  "an_allocation_round_trip_stays_in_the_pooled_cost_class",
  # Item 30 lands `PropertyObserver`; this is the guard that says a class WITHOUT one still pays
  # nothing for its existence, which is the whole shape of ADR 0014's decision.
  "a_class_without_a_property_observer_costs_nothing_extra",
  "a_grapheme_index_costs_more_than_a_code_point_index",
]

# The architecture invariants ADR 0003 rests on -- a result and a throw travelling up through many JIT
# frames, a runtime panic contained and reported, a helper suspending with JIT frames live above it, and
# native unwinding through those frames still being unavailable. Correctness, not cost, so debug is the
# right profile and not merely the cheap one: `overflow-checks` and `debug_assert!` are on.
[[check]]
kind = "cargo-named"
stage = "9 guards"
name = "abi-probe (invariants)"
args = ["test", "-p", "mwl-abi-probe"]
tests = [
  "a_throw_propagates_through_every_frame",
  "a_runtime_panic_is_contained_and_reported",
  "a_helper_can_suspend_with_jit_frames_live_above_it",
  "native_unwinding_through_jit_frames_is_still_unavailable",
]

[[check]]
kind = "cargo-named"
stage = "9 guards"
name = "mwl-codegen"
args = ["test", "-p", "mwl-codegen"]
tests = ["a_second_script_runs_after_a_contained_helper_panic"]

[[check]]
kind = "cargo-named"
stage = "9 guards"
name = "mwl-runtime"
args = ["test", "-p", "mwl-runtime"]
tests = ["an_acyclic_object_graph_releases_every_allocation"]
