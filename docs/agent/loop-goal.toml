# The loop's acceptance test, as data.
#
# `tools/loop.py` runs the checks below in order, short-circuiting on the first failure, so the ledger
# line each iteration writes says exactly how far the loop got. Every check must pass. Nothing else
# counts as done -- not a passing unit test, not a session claiming DONE.
#
# `loop-goal.md` is the prose: what the goal is, why, and the standing decisions already settled with the
# user. It does not restate this list, and this file does not restate its reasoning. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT. A fixture may be corrected to a
# spelling the docs already fix -- its author had to write it without being able to compile it, and an
# error there is a bug in the fixture, not a decision. What may never change is the expected output, or a
# fixture's reason for existing. Re-freeze, say why in the commit message, move on. That is not licence to
# weaken a check to make it pass.
#
# `cases = [...]` on an `mwl-suite` check names `.mwlt` files that must EXIST, run, and not be skipped --
# the `.mwlt` twin of `cargo-named`. A suite that is green because a case was never written is the failure
# it guards against; `min_passing` cannot see that, and neither can a SKIP line.

# Every fixture the run touches. Missing one fails before anything is built, naming the file.
files = [
  "examples/hello.mwl", "examples/calls.mwl", "examples/throw.mwl", "examples/arith.mwl",
  "examples/trace.mwl", "examples/uncaught.mwl", "examples/fatal.mwl",
  "examples/objects.mwl", "examples/arrays.mwl", "examples/errors.mwl", "examples/hooks.mwl",
  "examples/enums.mwl", "examples/iterate.mwl", "examples/core.mwl", "examples/report.mwl",
  "examples/nullable.mwl", "examples/match.mwl",
  "examples/text.mwl", "examples/numbers.mwl", "examples/dates.mwl", "examples/json.mwl",
  "examples/collect.mwl",
  # The four this goal adds. Each is one stage's item list written as one program.
  "examples/operators.mwl", "examples/control.mwl", "examples/callable.mwl", "examples/targets.mwl",
]

# What a session of this goal READS. `python tools/orient.py` slices exactly these out of the live
# files and prints nothing else, so a session starts at a fraction of the unscoped orientation.
#
# Nothing below is a copy -- each entry is a *selector*. A wrong one is a loud warning from
# orient.py, never silence. Rewrite this block with the rest of the goal; the rules for doing that
# are in loop-authoring.md § 2, and `python tools/orient.py --audit` prints what it costs.
#
# If a session finds it needs something this does not print, that is a gap here: the session says
# so in the handoff, and the next one that touches the goal adds the selector.
[context]

# Modules whose map line a session needs, as globs under crates/.
#
# This goal's file set is NOT the previous one's. The work is lowering and checking rather than
# `Core` members, so `mwl-stdlib`'s per-class modules came out whole and `mwl-ir`'s `lower/` came in
# file by file -- `expr.rs`, `stmt.rs` and `control.rs` are three of the four groups' shared set, and
# almost every item names one of them.
#
# `mwl-stdlib/src/registry.rs` stays: items 28 and 32 both ask it a question, and a Stage 8 `Core`
# depth slice still starts there. Its 30 sibling modules do not -- put one back the session a group
# needs it, and take it out again when that group lands.
modules = [
  "crates/mwl-ir/src/lower/expr.rs",
  "crates/mwl-ir/src/lower/stmt.rs",
  "crates/mwl-ir/src/lower/control.rs",
  "crates/mwl-ir/src/lower/mod.rs",
  "crates/mwl-ir/src/ir.rs",
  "crates/mwl-codegen/src/emit.rs",
  "crates/mwl-types/src/expr/operators.rs",
  # Named per-stage rather than always. `closure.rs`, `generator.rs`, `call.rs` and `exception.rs`
  # are Stage 3's; `locals.rs` and `members.rs` are Stage 6's. They are here because four of the
  # eight stages name one, and the alternative measured worse: a session that greps for
  # `lower_try` pays the discovery bucket twice over what the map line costs.
  "crates/mwl-ir/src/lower/call.rs",
  "crates/mwl-ir/src/lower/closure.rs",
  "crates/mwl-ir/src/lower/generator.rs",
  "crates/mwl-ir/src/lower/exception.rs",
  "crates/mwl-types/src/locals.rs",
  "crates/mwl-stdlib/src/registry.rs",
]

# The decisions this goal's work sits inside, by ADR number. orient.py prints the one-sentence
# bullet for each out of docs/adr/ground-rules.md -- the index, not the rule.
rules = ["0007", "0090", "0035", "0053", "0031", "0066", "0014", "0043", "0046", "0028", "0021"]

# ADR sections sliced live into the pack. `NNNN` alone is the In short block; `NNNN §N` is that
# numbered section. Name only the sections the items actually need -- a whole ADR is 7k of context.
#
# The four below are the ones EVERY session of this goal reads: the conversion and promotion tables
# are the spine of Stages 0, 2 and 4, the truthy table is item 24's, and § 2's no-capture rule is
# what makes items 17 and 19 refusals rather than features. A per-item section does NOT belong here
# -- a session takes one item, so pre-printing all eight stages' ADRs prints seven unread sections
# every session. Items 30-35 each name their own ADR in loop-goal.md; read it at that heading.
adrs = [
  "0007 §2",
  "0007 §4",
  "0035 §4",
  "0031 §2",
]

# Headings of docs/agent/conventions.md naming shapes this goal will write.
shapes = ["A diagnostic", "A `.mwlt` test case", "A commit message"]

