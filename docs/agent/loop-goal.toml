[valgrind]
# Every fixture again under `valgrind --leak-check=full`, once the program legs are green. A hand-written
# refcount protocol is exactly where a leak hides. Cycles are out of scope by decision (loop-goal.md), so
# only *definite* losses fail. These two exit non-zero by design, so they are skipped.
#
# Items 14 and 36 are both leak items, so this sweep is the check for neither: a leak on a path no
# fixture takes is invisible to it. Each names its own `cargo-named` guard below.
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
# On Windows the second leg runs through WSL, because a JIT is exactly where a calling-convention
# divergence between two targets hides. On Linux the native leg already is that target, so there is no
# second leg -- only the valgrind sweep, run directly.
#
# `/var/tmp`, not `/tmp`: `D /tmp` in the distro's tmpfiles.d clears `/tmp` at every boot, and WSL boots
# again after every idle gap, so a target directory there is gone by the next run and the leg pays a cold
# build -- 32s measured, against 0.31s for the no-op rebuild it should have been. commands.md § *Fuzzing
# and callgrind on Windows* holds the measurement.
target_dir = "/var/tmp/nvs-target-wsl"


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- THE OPERATOR TABLE. `tools/loop.py` runs a `stage = "0..."` cargo check BEFORE the program
# legs, which is what this stage is for: every fixture and every case in every stage below is written
# against these rules, so one written while an item here is open is written AROUND it -- and a case that
# spells `0.0 - 1.5` to dodge an int/float mix reads as deliberate and nobody re-checks it.
#
# Every test named below must EXIST and pass. Most do not exist yet; writing one is how the loop finishes
# its item. Do not rename one to something already green.
# ---------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------
# Stage 0a -- ADR 0107's `inout` spelling. Named to start with "0" deliberately: that is what puts a
# check in `loop.py`'s catch-up class, which runs before everything else so the ledger names this while
# it is unfinished. Ahead of stage 0 for stage 0's own reason applied to the surface -- a case written
# in the old spelling is written twice. Items 44-47 in loop-goal.md.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0a inout"
name = "nvs-syntax (the inout spelling)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  # ADR 0107 -- the modifier slot, in all three declaration positions, and the call-site marker on `Arg`.
  "an_inout_parameter_parses_in_the_modifier_slot",
  "an_inout_foreach_binding_and_destructuring_leaf_parse",
  "an_inout_argument_parses_at_a_call_site",
  # ADR 0107 -- `&` is refused wherever it meant by-reference, and kept wherever it did not.
  "an_ampersand_by_reference_marker_is_refused_naming_inout",
  "an_ampersand_still_parses_as_bitwise_and_and_as_an_intersection",
]

[[check]]
kind = "cargo-named"
stage = "0a inout"
name = "nvs-types (the call-site marker)"
args = ["test", "-p", "nvs-types"]
tests = [
  # ADR 0107 -- both directions of the call-site rule.
  "an_inout_argument_is_required_where_the_parameter_declares_one",
  "an_inout_argument_is_refused_where_the_parameter_is_by_value",
]

[[check]]
kind = "cargo-named"
stage = "0 operators"
name = "nvs-types (the promotion table)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 1 -- ADR 0007 § 4: a mixed-representation arithmetic or ordering pair has a result type AND
  # a stated widening, which is the half `arithmetic_result` records nothing for today.
  "a_mixed_numeric_pair_widens_the_narrower_operand",
  "a_mixed_numeric_comparison_widens_the_same_way",
  # Item 2 -- `int / int` is `int|float`, widened to `float` where a binding declares one.
  "an_integer_division_is_a_union_widened_at_its_binding",
]

[[check]]
kind = "cargo-named"
stage = "0 operators"
name = "nvs-ir (the operator rows)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # Item 1 -- the widening is a conversion in `lower_binary`, not a backend repair.
  "a_mixed_numeric_pair_converts_before_the_operator",
  # Item 4 -- five binary rows and one unary one, and the compound forms they carry with them.
  "every_bitwise_operator_lowers",
  "a_bitwise_compound_assignment_lowers_through_its_binary_form",
  # Item 5
  "a_power_operator_lowers_over_every_numeric_row",
  # Item 6
  "the_spaceship_operator_is_the_compare_to_result_itself",
  # Item 7 -- both positions, and the address computation split out of `lower_reassignment` so a
  # re-evaluable target is read once.
  "an_increment_lowers_in_either_position",
  "a_compound_assignment_evaluates_its_target_once",
]

[[check]]
kind = "cargo-named"
stage = "0 operators"
name = "nvs-codegen (the operator rows)"
args = ["test", "-p", "nvs-codegen"]
tests = [
  # Item 2 -- the union result picks its instruction at runtime.
  "an_integer_division_emits_both_of_its_representations",
  # Item 3 -- ADR 0007 § 4's overflow throw, at the three arithmetic sites, over `Inst::on_error`.
  "an_integer_addition_traps_on_overflow",
  "an_integer_subtraction_and_multiplication_trap_on_overflow",
  # Item 8 -- `Enum(Int)` reaches the integral compare rows.
  "two_enum_values_compare_as_their_backing_integer",
]


