  "tests/conformance/lang/a-foreach-key-binding-is-a-string-and-nothing-else.nvst",
  "tests/conformance/array/a-by-reference-binding-needs-a-variable-and-the-element-type.nvst",
  # Stage 7. ADR 0079's surface landed -- `#[Test]`, `#[Fixture]` and `#[TestWith]` are on
