# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the M4 features with no slice at all. Each is proved by a `.mwlt` case rather than by an
# examples fixture: they are corpus-visible behaviour, Stage 8 counts the corpus, and the case is the
# artefact M4's own Verify paragraph asks for.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 declared features"
name = "mwl-types (the declared features)"
args = ["test", "-p", "mwl-types"]
tests = [
  # Item 30 -- ADR 0014 §§ 2-3. The interface is known to `mwl-syntax` and `mwl-hir` and to no other
  # crate today: no checker rule, no lowering, no runtime.
  "a_property_observer_is_resolved_and_its_signature_checked",
  # Item 31 -- ADR 0043's delegation, the half that did not land with its syntax.
  "a_by_delegation_supplies_every_member_of_the_interface_it_names",
  # Item 32 -- ADR 0046 §§ 4-6.
  "an_attribute_is_retrieved_by_its_own_type",
  "an_ambiguous_attribute_retrieval_is_a_compile_error",
  "an_explicit_call_site_type_argument_parses_and_checks",
]

[[check]]
kind = "cargo-named"
stage = "5 declared features"
name = "mwl-ir (the declared features)"
args = ["test", "-p", "mwl-ir"]
tests = [
  "a_property_observer_runs_after_the_hook_or_the_storage",
  "a_delegated_call_reaches_the_object_it_names",
  # Item 34
  "inline_html_at_file_scope_lowers_to_an_echo",
  # Item 35 -- one frame per file, called from the require site, and ADR 0021 § 3's value form.
  "a_required_file_runs_its_own_top_level_statements",
  "a_require_in_value_position_answers_the_files_result",
]

[[check]]
kind = "cargo-named"
stage = "5 declared features"
name = "mwl-stdlib (dump)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  # Item 33 -- ADR 0092's one record and its renderings, plus ADR 0033's redaction, which that ADR's
  # own Verification section defers to M4 by name.
  "a_dump_builds_one_diagnostic_record",
  "a_dump_redacts_a_secret_qualified_property",
]

[[check]]
kind = "cargo-named"
stage = "5 declared features"
name = "mwl-codegen (fatal locals)"
args = ["test", "-p", "mwl-codegen"]
tests = [
  # Item 36 -- a THROWN releases the frame's locals and a FATAL does not. The valgrind sweep cannot
  # see this: `examples/fatal.mwl` is on its skip list, because it exits non-zero by design.
  "a_fatal_releases_the_frames_locals",
]


# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the checker and the front end. Nothing here is a panic below the checker; each is a program
# the checker accepts and should not, or refuses without saying which rule.
# ---------------------------------------------------------------------------------------------------

