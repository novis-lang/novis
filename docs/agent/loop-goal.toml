# ---------------------------------------------------------------------------------------------------
# Stage 3 -- ADR 0057's intrinsic folding. The soundness rule is the item: the prepared path and the
# runtime path are ONE implementation, so a fold can produce an earlier answer and never a different one.
# The pair of cases below is what asserts that -- the same malformed literal, once as a compile error and
# once, behind a variable, as the identical runtime throw.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (folding at the call site)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_literal_date_format_is_validated_while_checking",
  "a_literal_regex_pattern_is_prepared_while_checking",
  "a_literal_format_template_checks_its_placeholder_count_and_types",
  "a_literal_uri_is_validated_while_checking",
  # The closed list is closed: a member not on it folds nothing however literal its argument.
  "a_member_outside_the_intrinsic_list_is_never_folded",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (one implementation, two entry points)"
args = ["test", "-p", "nvs-stdlib"]
tests = ["a_prepared_literal_and_its_runtime_twin_share_one_implementation"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/intrinsics.nvs"
want = ["2026-08-28", "matched", "total: 42", "host=example.test"]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- ADR 0085's emitter. `nvs build --openapi` and `nvs api diff` are one slice: the diff's
# classification is mechanical over two emitted documents, so it costs a comparison rather than a design.
#
# `kind = "command"` runs an arbitrary argv and checks its exit code and output. `{nvs}` is substituted
# with the CLI the leg already built, so this does not pay for a second build.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "command"
stage = "1 floor"
name = "nvs build --openapi emits 3.1"
argv = ["{nvs}", "build", "--openapi", "examples/routes.nvs"]
want = ['"openapi": "3.1', '"/users/{id}"', '"operationId"']

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (determinism and the diff)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # § 3 -- deterministic means byte-identical, and the cheapest way for it not to be is a hash map.
  "an_openapi_document_is_byte_identical_across_two_emissions",
  # § 2 -- `#[Api]` supplies only what the types cannot say, and its four contradictions are errors.
  "an_api_attribute_contradicting_its_own_signature_is_a_diagnostic",
  # § 4 -- the gate: breaking, compatible, or no change, decided mechanically over two documents.
  "an_api_diff_classifies_a_removed_route_as_breaking",
  "an_api_diff_classifies_an_added_optional_parameter_as_compatible",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the depth pass and the qualifier classification. This is where the goal spends most of its
# sessions, and it is the fallback whenever another stage's group is blocked.
#
# `min_passing` is a corpus figure and `cases` is the worklist; a check whose worklist IS its case list
# omits the threshold. Both are here because this stage is measured both ways: the floor test says every
# class is exercised, and the count says the corpus grew with the members rather than around them.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (the coverage gates)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # Carried from M4's floor, and they stay: registered is the precondition for everything below.
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
  # Item 10 -- the FLOOR, not the median. A median rises by writing more cases for members that already
  # have some, which is the metric a corpus grows around rather than into.
  "every_core_class_has_a_conformance_floor_of_three",
  # Item 12 -- ADR 0088 § 2. An unclassified `string`/`bytes` parameter refuses `tainted`, and this test
  # is the "fails on any member that ships without one" half.
  "every_member_parameter_carries_a_qualifier_classification",
  # Item 11 -- every `Fault::thrown` site is caught by a case, or carries a comment saying no program
  # reaches it. Judged per site; the test only asserts that one of the two is true of each.
  "every_error_path_is_asserted_or_declared_unreachable",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 950
cases = [
  # Stage 0
  "tests/conformance/core/program-implementing-enumerates-every-implementor.nvst",
  "tests/conformance/reject/an-implementor-without-a-no-argument-constructor-is-named.nvst",
  # Stage 2. ADR 0071's three gaps, each refused where the class is declared.
  "tests/conformance/reject/a-derive-field-with-no-codec-is-refused-at-its-declaration.nvst",
  "tests/conformance/core/a-route-table-answers-a-url-for-every-route-it-holds.nvst",
  "tests/conformance/reject/a-route-table-refuses-its-seven-contradictions.nvst",
  "tests/conformance/core/a-command-table-answers-its-own-help.nvst",
  # Stage 3. The pair that asserts the soundness rule -- one malformed literal, two entry points.
  "tests/conformance/core/a-literal-intrinsic-is-validated-while-checking.nvst",
  "tests/conformance/reject/a-malformed-literal-intrinsic-is-a-compile-error.nvst",
  # Stage 6.
  "tests/conformance/core/a-repeated-grapheme-count-agrees-with-the-first.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 200
cases = [
  # The rows PHP itself is the only authority on, in the domains this goal audits.
  "tests/differential/lang/every-str-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/every-arr-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/every-math-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/a-date-format-string-renders-as-phps-does.nvst",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the string header. ADR 0009 § 2's cached grapheme count, and the O(1) boundary correction a
# concatenation needs at the seam.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime (the cached count)"
args = ["test", "-p", "nvs-runtime"]
tests = [
  "a_repeated_grapheme_count_is_answered_from_the_header",
  "a_concatenation_corrects_the_boundary_without_rescanning",
  # The cache may never disagree with a fresh scan -- the failure mode is a wrong index, not a slow one.
  "a_cached_count_equals_a_fresh_scan_over_the_corpus",
]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the migration rows. The parity program's own measure, raised one goal at a time.
#
# EVERY FLOOR IN THIS PROGRAM IS MEASURED, NOT GUESSED, AND THIS COMMENT IS THE ONE HOME FOR HOW.
# The 860 names `check-migration.py --report` listed on 2026-08-29 were attributed to the goal that
# owns each family, by prefix, against the 291 already classified (25% of 1151):
#
#     goal 1  strings, arrays, numbers, dates, regex, encoding, JSON, paths     108 names   -> 35%
#     goal 2  serialize, unserialize, the task surface                            8 names   -> 35%
#     goal 3  ini_*, gc_*, opcache_*, set_time_limit, memory_*                   34 names   -> 38%
#     goal 4  streams, files, hashes, reflection, output, process, crypto       458 names   -> 78%
#     goal 5  mysqli, pg_*, sqlite3, PDO                                        227 names   -> 98%
#     goal 6  sessions, headers, request input                                   33 names   -> 100%
#
# THE DENOMINATOR IS 1151 AND NOT 925 because the oracle build gained `mysqli`, `pgsql` and `sqlite3`
# on 2026-08-29 and the inventory was regenerated: +226 functions, +13 types, none removed. Two of this
# program's floors were wrong by more than ten points before that, in opposite directions -- goal 5 owns
# a fifth of the whole table now, where against the old build it owned almost nothing.
#
# The prefix pass cannot be exact: a family it attributes to one goal may turn out to belong to another.
# So each floor is set two to four points BELOW its modelled figure, which is what makes it a floor
# rather than a prediction -- a boundary guessed wrong must not fail a run. A goal that lands its domains
# and comes out higher raises the next goal's floor in the same commit, and says so.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "command"
stage = "1 floor"
name = "check-migration at 33%"
argv = ["python", "tools/check-migration.py", "--min", "33"]
want = ["inventory:", "classified:"]

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- THE KEYSTONE. No task, no isolate and no `Core\Task` member is written until this is green.
# Four goals are written against the stream item 4 builds, so a shape that is wrong here is wrong four
# times.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (the scheduler)"
args = ["test", "-p", "nvs-host"]
tests = [
  "one_core_runs_one_scheduler_and_a_task_never_migrates",
  "a_refcount_is_still_non_atomic_under_the_scheduler",
  "many_tasks_can_be_created_and_driven",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (the parking stream)"
args = ["test", "-p", "nvs-host"]
tests = [
  # The whole program rests on this pair: the caller sees a blocking `read`, and the core does not block.
  "a_socket_read_that_would_block_parks_its_coroutine",
  "a_parked_coroutine_resumes_when_its_descriptor_is_ready",
  "a_core_serves_another_task_while_one_is_parked",
  # It is a plain `std::io` stream, which is the entire reason goal 5's drivers and rustls compose.
  "a_stream_satisfies_std_io_read_and_write",
  "a_rustls_session_streams_over_it_unmodified",
  # Item 5 -- a sleep and a deadline are one mechanism.
  "a_timer_and_a_deadline_are_the_same_wheel",
  # Item 6 -- ADR 0106 § 6's bound is per worker and never grows with requests served.
  "a_blocking_call_goes_to_a_pool_bounded_at_twice_the_core_count",
  # Item 7 -- it reads state the deadline mechanism already keeps; a per-request heartbeat is the bug.
  "the_watchdog_reports_a_wedged_worker_without_a_heartbeat",
]

# The invariant that must survive the move out of the spike and into the crate. These four are M4's and
# stay green; the point of naming them here is that Stage 2 is where they would break.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "abi-probe (coroutine invariants)"
args = ["test", "-p", "nvs-abi-probe"]
tests = [
  "a_helper_can_suspend_with_jit_frames_live_above_it",
  "repeated_suspends_leave_the_frames_intact",
  "a_throw_still_propagates_inside_a_coroutine",
  "many_coroutines_can_be_created_and_driven",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3-4 -- `spawn`/`await`, the task tree, and ADR 0072's roster.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (spawn and await lower)"
args = ["test", "-p", "nvs-ir"]
tests = ["a_spawn_lowers_to_a_task_on_the_current_core", "an_await_suspends_until_its_task_completes"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (structured concurrency)"
args = ["test", "-p", "nvs-host"]
tests = [
  # ADR 0072 § 4 -- the promise the whole roster is built on.
  "no_call_returns_with_a_child_still_running",
  "a_task_tree_dies_with_its_parent_and_leaves_no_orphan",
  # § 5 -- native teardown runs, user code does not. The intuitive implementation is the wrong one.
  "a_cancelled_task_runs_no_catch_and_no_cleanup_block",
  "a_cancelled_tasks_arena_is_released",
  # Item 11.
  "a_bounded_channel_send_suspends_rather_than_growing",
