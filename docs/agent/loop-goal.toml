# Goal 1 of the parity program -- `Core`'s pure half, finished. The acceptance test, as data.
#
# `tools/loop.py` runs the checks below in order, short-circuiting on the first failure, so the ledger
# line each iteration writes says exactly how far the loop got. Every check must pass. Nothing else
# counts as done -- not a passing unit test, not a session claiming DONE.
#
# `1-core-depth.md` is the prose: what the goal is, why, and the standing decisions already settled.
# It does not restate this list, and this file does not restate its reasoning. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT. A fixture may be corrected to a
# spelling the docs already fix -- its author had to write it without being able to compile it. What may
# never change is the expected output, or a fixture's reason for existing.

# The fixtures this goal adds. `goal-switch.py` unions this with the floor's own list, so the twenty-odd
# fixtures M4 froze do not appear here and are not missing.
files = [
  # ADR 0061 § 3's enumeration and the three tables built from it, as one program each.
  "examples/program.nvs",
  "examples/routes.nvs",
  "examples/commands.nvs",
  # ADR 0102 § 6's origin has to be configured somewhere for `routes.nvs` to print an absolute link, and
  # ADR 0103 § 1 step 2 says where: `./nvs.toml`, the working directory and no walk upward. One key.
  "nvs.toml",
  # ADR 0057's folding: a literal date format, a literal pattern and a literal template, each validated
