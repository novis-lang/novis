# The loop's acceptance test, as data.
#
# `tools/loop.py` runs the checks below in order, short-circuiting on the first failure, so the ledger
# line each iteration writes says exactly how far the loop got. Every check must pass. Nothing else
# counts as done -- not a passing unit test, not a session claiming DONE.
#
# `loop-goal.md` is the prose: what the goal is, why, and the standing decisions already settled with the
# user. It does not restate this list, and this file does not restate its reasoning. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT. A fixture may be corrected to a
# spelling the docs already fix -- its author had to write every `Core` signature, every enum's namespace
# and every options bag from the spec, and an error there is a bug in the fixture, not a decision. What may
# never change is the expected output, or a fixture's reason for existing. Re-freeze, say why in the commit
# message, move on. That is not licence to weaken a check to make it pass.

# Every fixture the run touches. Missing one fails before anything is built, naming the file.
files = [
  "examples/hello.mwl", "examples/calls.mwl", "examples/throw.mwl", "examples/arith.mwl",
  "examples/trace.mwl", "examples/uncaught.mwl", "examples/fatal.mwl",
  "examples/objects.mwl", "examples/arrays.mwl", "examples/errors.mwl", "examples/hooks.mwl",
  "examples/enums.mwl", "examples/iterate.mwl", "examples/core.mwl", "examples/report.mwl",
  "examples/nullable.mwl", "examples/match.mwl",
  "examples/text.mwl", "examples/numbers.mwl", "examples/dates.mwl", "examples/json.mwl",
  "examples/collect.mwl",
]

# What a session of this goal READS. `python tools/orient.py` slices exactly these out of the live
# files and prints nothing else, so a session starts at a fraction of the unscoped orientation.
#
# Nothing below is a copy -- each entry is a *selector*. A wrong one is a loud warning from
# orient.py, never silence. Rewrite this block with the rest of the goal; the rules for doing that
# are in loop-authoring.md § 2, and `python tools/orient.py --audit` prints what it costs.
#
# If a session finds it needs something this does not print, that is a gap here: the session says
# so in the handoff, and the next one that touches the goal adds the selector.
[context]

# Modules whose map line a session needs, as globs under crates/. The file set the handoff's
# `## Next group` names, plus anything those files call into.
modules = [
  "crates/mwl-stdlib/src/registry.rs",
  "crates/mwl-stdlib/src/lib.rs",
  "crates/mwl-stdlib/src/encoding.rs",
  "crates/mwl-stdlib/src/math.rs",
  # `Core\Str` is what `Core\Bytes` mirrors member for member (spec § 7, R6), and `Core\Hash` is the
  # only worked example of a `Core`-owned enum -- the `CoreEnum` roster, the Rust mirror its members
  # dispatch on, and the test pinning the two together. A slice adding either pays to rediscover them.
  "crates/mwl-stdlib/src/str.rs",
  "crates/mwl-stdlib/src/hash.rs",
  "crates/mwl-types/src/core_lib.rs",
  "crates/mwl-types/src/ty.rs",
  "crates/mwl-runtime/src/value.rs",
  "crates/mwl-runtime/src/string.rs",
  "crates/mwl-runtime/src/helpers.rs",
  "crates/mwl-runtime/src/release.rs",
  "crates/mwl-codegen/src/ty.rs",
  "crates/mwl-diagnostics/src/lib.rs",
]

# The decisions this goal's work sits inside, by ADR number. orient.py prints the one-sentence
# bullet for each out of docs/adr/ground-rules.md -- the index, not the rule.
rules = ["0090", "0094", "0069", "0047", "0007", "0035", "0010"]

# ADR sections sliced live into the pack. `NNNN` alone is the In short block; `NNNN §N` is that
# numbered section. Name only the sections the items actually need -- a whole ADR is 7k of context.
adrs = [
  "0009 §1",
  "0009 §3",
  "0051 §4",
  "0007 §3",
]

# Headings of docs/agent/conventions.md naming shapes this goal will write.
shapes = ["A diagnostic", "A `.mwlt` test case", "A commit message"]

# Headings of docs/agent/playbook.md whose traps apply to this file set.
playbook = ["Tooling", "Running things", "Adding a `Core` member", "Writing a test case"]

# Fields of the plan's status block worth printing. Default is these two.
plan = ["Open now", "Blocking"]

[valgrind]
# Every fixture again under `valgrind --leak-check=full`, once the program legs are green. A hand-written
# refcount protocol is exactly where a leak hides. Cycles are out of scope by decision (loop-goal.md), so
# only *definite* losses fail. These two exit non-zero by design, so they are skipped.
skip = ["examples/fatal.mwl", "examples/uncaught.mwl"]

[wsl]
# On Windows the second leg runs through WSL, because a JIT is exactly where a calling-convention
# divergence between two targets hides. On Linux the native leg already is that target, so there is no
# second leg -- only the valgrind sweep, run directly.
target_dir = "/tmp/mwl-target-wsl"


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- CATCH-UP. Work that a later ADR reopened inside a milestone already reported done, plus the
# milestone debt that never landed with it. `tools/loop.py` runs this stage BEFORE the program legs, so
# an unfinished item here is what the ledger names -- see loop-goal.md's own Stage 0 section for the
# ordered list, which milestone owns each item and what "done" is.
#
# Every test named below must EXIST and pass. Most do not exist yet; writing one is how the loop finishes
# its item. Do not rename them to something already green.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-syntax"
args = ["test", "-p", "mwl-syntax"]
tests = [
  # ADR 0087 -- built; this keeps it from regressing.
  "an_unterminated_bidi_control_is_rejected_in_every_source_span",
  # ADR 0090 § 1 -- the lexer must stop producing `===`/`!==`.
  "a_rejected_equality_spelling_is_a_compile_error",
  # ADR 0061 -- the two file-scope `autoload` declaration forms.
  "an_autoload_declaration_parses",
  # ADR 0094 -- a member declaration with no visibility is E0122, the `(set)` form is written as a
  # pair, a class-body `var` names the visibility rather than the local grammar, and a plain
  # constructor parameter stays exempt (the one case this rule could wrongly break).
  "a_member_without_visibility_is_a_compile_error",
  "a_bare_set_visibility_is_a_compile_error",
  "a_class_body_var_names_the_missing_visibility",
  "a_plain_constructor_parameter_needs_no_visibility",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-hir"
args = ["test", "-p", "mwl-hir"]
tests = [
  # ADR 0061 -- name-to-file resolution as a fixpoint over the require-graph worklist.
  "an_autoload_declaration_resolves_a_name_to_its_file",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-types"
args = ["test", "-p", "mwl-types"]
tests = [
  # ADR 0090 § 2 -- two statically disjoint operands do not compile, and § 3's null test narrows
  # through the one remaining spelling.
  "a_disjoint_equality_does_not_compile",
  "an_equality_null_test_narrows",
  # ADR 0047 § 4 -- the literal and enum-case type atoms are checked, not refused by name.
  "a_literal_type_atom_is_checked",
  # M2's own two gaps, both PHP-observable divergences rather than decisions.
  "a_private_member_is_refused_outside_its_class",
  "a_stringable_parameter_can_call_to_string",
  # ADR 0069 -- `array + array` does not compile, and neither does `+=` over two arrays.
  "two_arrays_do_not_combine_with_plus",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-runtime"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # ADR 0090 § 3's three non-scalar rows, one helper each.
  "equal_strings_compare_as_text_and_never_as_numbers",
  "equal_arrays_compare_ordered_and_element_wise",
  "equal_objects_compare_by_identity",
  # ADR 0090 § 3's numeric row, and § 5's "applies *3*'s table" -- one answer
  # however the row is reached, with the hash agreeing with it.
  "the_four_numeric_representations_are_one_domain",
  "an_integral_float_past_two_to_the_53_hashes_with_both_of_its_readings",
]


# ---------------------------------------------------------------------------------------------------
# Stage 1 -- what the previous loop reached, unchanged. This is the non-regression floor: nothing below
# may be traded for anything above it. `kind = "exact"` means: exit 0, and stdout line for line equal to
# `want`. A fixture that prints an extra line has failed.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/hello.mwl"
want = ["Hello, World!"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/calls.mwl"
want = ["quadruple(5) = 20"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/arith.mwl"
want = ["sum = 998000"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/throw.mwl"
want = ["caught: boom"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/objects.mwl"
want = [
  "cat has 4 legs", "rex has 4 legs, and barks", "Hello, rex!",
  "dog is an animal", "dog greets", "leaf", "leaf is a mid",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/arrays.mwl"
want = [
  "alpha=1;beta=2;gamma=3;", "alpha=1;gamma=3;", "alpha=1;gamma=3;beta=20;",
  "alpha=1;gamma=3;beta=20;", "alpha=99;gamma=3;beta=20;", "count=3", "total=10",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/errors.mwl"
want = [
  "checked host", "value-of-host", "checked bad", "config: bad key",
  "checked missing", "logic: no such key: missing", "backtrace present",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/hooks.mwl"
want = ["6", "20", "Counter(10)", "n=6"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/enums.mwl"
want = ["ana outranks bo", "gold=2", "ana,clone"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/iterate.mwl"
want = ["generator=15", "iterable=10"]

# A caught throw's own trace, read back from MWL through its backtrace property.
[[check]]
kind = "ordered"
stage = "1 floor"
file = "examples/trace.mwl"
stream = "stdout"
want = ["#0 Deep::inner()", "#1 Deep::outer()"]

# An uncaught throw: non-zero exit plus an MWL-level backtrace on stderr.
[[check]]
kind = "ordered"
stage = "1 floor"
file = "examples/uncaught.mwl"
stream = "stderr"
exit = "nonzero"
want = ["Uncaught Exception: unhandled", "#0 Boom::inner()", "#1 Boom::outer()"]

# A contained helper panic: FATAL, non-zero, and the output produced before it survives.
[[check]]
kind = "contains"
stage = "1 floor"
file = "examples/fatal.mwl"
args = ["--fault-inject=helper-panic"]
exit = "nonzero"
stderr_contains = ["FATAL"]
stdout_contains = ["start"]

# --dump-asm prints generated code instead of running, the way --dump-ir already does.
[[check]]
kind = "min-bytes"
stage = "1 floor"
file = "examples/arith.mwl"
args = ["--dump-asm"]
stream = "stdout"
min_bytes = 200


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. `nullable.mwl` is the whole point of this loop: a `?T` property, a `?T` return,
# a `?T` local, `??`, `?->` and ADR 0066's `as ?T`, plus the three `Core\Arr` members whose spec signature
# returns one. `match.mwl` is the surface the corpus cannot be written without: `match`, `switch`, `for`
# and compound assignment, none of which lowers today.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "exact"
stage = "2 keystone"
file = "examples/nullable.mwl"
want = [
  "host=example.test", "user=unset", "head=4 at=1", "empty=-1",
  "parsed=42", "refused=-1", "nullsafe=no lookup",
]

[[check]]
kind = "exact"
stage = "2 keystone"
file = "examples/match.mwl"
want = ["letters=ABCF", "passes=2", "sum=289", "tier=marginal"]


# ---------------------------------------------------------------------------------------------------
# Stage 3 -- `Core` Part I is real, across all twelve sections. One fixture per domain, each reaching
# members no unit test can prove reachable from MWL source. `report.mwl` keeps its frozen output while its
# source is rewritten against the finished library -- M4S's own Verify line asks for exactly that.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/core.mwl"
want = ["evens=5", "PEAR|APPLE|FIG|BANANA", "fig,pear,Apple,banana", "a+b+c", "007", "Mwl runs"]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/report.mwl"
want = ["the...3", "quick.1", "brown.1", "fox...2", "lazy..1", "dog...1", "distinct=6"]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/text.mwl"
want = [
  "tidy=[The Quick,  brown FOX]", "words=4", "slug=the-quick-brown-fox",
  "id=4711 region=eu", "digits=3", "wrapped=one two/three/four",
  "reversed=desserts", "formatted=fox has 2", "where=12", "before=The Quick",
]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/numbers.mwl"
want = [
  "abs=7", "clamp=10", "gcd=12", "intDiv=3", "hex=beef", "back=48879",
  "root=1.5", "even=2", "money=1,234,567.89", "pi=3.1416",
  "total=24.94", "sum=14", "max=5",
]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/dates.mwl"
want = [
  "start=2024-02-28 23:30", "nextDay=2024-02-29", "nextMonth=2024-03-28",
  "endOfMonth=2024-02-29", "later=2024-02-29 01:30", "spanSeconds=7200",
  "duration=5400", "berlin=2024-02-29 02:30",
]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/json.mwl"
want = [
  "{\"name\":\"ada\",\"age\":36,\"is_admin\":true}",
  "decoded=grace/45",
  "{\"a\":1,\"b\":2}",
  "[1,2,3]",
  "valid=yes",
  "malformed rejected",
  "issues=3",
]

[[check]]
kind = "exact"
stage = "3 Core Part I"
file = "examples/collect.mwl"
want = [
  "set=2", "weight=3", "absent=-1",
  "sha256=8a9c20f311cc8a96246da473515e5593e01889928ef1d7925df62438794044ba",
  "base64=bXds", "dice=5", "uuid=valid",
  "path=srv/app/index.mwl", "stem=index", "ext=mwl",
  "queryKeys=a,b,c", "rows=2", "first=figx2",
  "email=valid", "captured=[inner]",
]


# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the two suites, plus the mechanical spec-coverage gates behind them. `mwl test <dir>` must
# exit 0 AND print an "N passed, M failed" summary: a suite that silently collected nothing exits 0 too,
# and that is the failure this guards against. These run once, not per leg.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-suite"
stage = "4 suites"
name = "conformance"
args = ["run", "--quiet", "-p", "mwl-cli", "--", "test", "tests/conformance/"]
min_passing = 600

[[check]]
kind = "cargo-suite"
stage = "4 suites"
name = "differential"
args = ["run", "--quiet", "-p", "mwl-cli", "--", "test", "tests/differential/"]
min_passing = 150

# A named test must both EXIST and pass -- `cargo test` is green on a suite that never ran the guard.
# The first of these already exists and keeps the *registered* half honest. The second does not exist yet,
# and writing it is this loop's real definition of "Part I is complete": it reads the member rows out of
# docs/spec/01-core-library.md's sections 1-12 and fails naming every one with no registry entry.
[[check]]
kind = "cargo-named"
stage = "4 suites"
name = "mwl-stdlib"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
]


# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the named guard tests.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "abi-probe"
args = ["test", "--release", "-p", "mwl-abi-probe"]
tests = [
  "a_typed_arithmetic_loop_contains_no_call",
  "a_typed_arithmetic_loop_stays_in_the_native_cost_class",
  "a_refcount_one_array_member_mutates_in_place",
  "a_class_without_a_property_observer_costs_nothing_extra",
  "a_grapheme_index_costs_more_than_a_code_point_index",
]

[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "mwl-codegen"
args = ["test", "-p", "mwl-codegen"]
tests = ["a_second_script_runs_after_a_contained_helper_panic"]

[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "mwl-runtime"
args = ["test", "-p", "mwl-runtime"]
tests = ["an_acyclic_object_graph_releases_every_allocation"]
