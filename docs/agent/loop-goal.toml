[context]

# `nvs-db` is new and is created by Stage 2, so orient.py warns that its pattern matches nothing until
# it exists. `src/*.rs` and not `src/**/*.rs` -- fnmatch's `*` crosses a `/` already.
modules = [
  "crates/nvs-db/src/*.rs",
  # The stream every driver is written over, the TLS client that layers on it (ADR 0132 § 3), and
  # the pool a blocking SQLite call goes to. `net.rs` is the stream's file -- there is no
  # `stream.rs`, which this list named until ADR 0132's session found the warning.
  "crates/nvs-host/src/net.rs",
  "crates/nvs-host/src/tls.rs",
  "crates/nvs-host/src/blocking.rs",
  # Stage 0's pass, and the one it copies.
  "crates/nvs-types/src/derive.rs",
  # § 10's compile-time diagnostics on a literal query, and the qualifier half beside them.
  "crates/nvs-types/src/expr/quals.rs",
  # `Core\Db`, `Core\Queue` and the row types are registered here.
  "crates/nvs-stdlib/src/registry.rs",
  # The two things the type map borrows: Time's types for date columns, Json's for the JSON ones.
  "crates/nvs-stdlib/src/time.rs",
  "crates/nvs-stdlib/src/json.rs",
  # Stage 0 item 1's two files, and ONLY that item's. Take both back out of this list -- and `0133` out
  # of `rules` and `adrs` below -- in the wrap that lands it, the way stage "0 casing" already did.
  # Nothing else in this goal opens either file, so every later session is paying for them.
  "crates/nvs-stdlib/src/html.rs",
  "crates/nvs-types/src/expr/operators.rs",
]

rules = ["0067", "0084", "0071", "0051", "0058", "0024", "0133", "0054", "0063", "0082"]

# The sections EVERY session of this goal reads. § 1 is why there is no escaping API to reach for, § 9's
# map is the one every driver item is measured against, and § 13's reset is a security boundary that a
# pool implementation gets wrong by default. § 3, § 7 and § 8 joined them after four consecutive sessions
# sliced one of the three by hand and asked in the handoff for it to be added: **this list is the only
# selector**, and an item that names `ADR 0067 § 7` in its own text does not get § 7, because nothing
# parses the item. The sections not here are still one `sed -n` around the heading away.
adrs = [
  # Stage 0 item 1's whole decision. Out of this list once the item lands.
  "0133 §1",
  "0133 §2",
  "0133 §3",
  "0067 §1",
  "0067 §3",
  "0067 §7",
  "0067 §8",
  "0067 §9",
  "0067 §13",
  # `Db\Settings` is the goal's one shape parameter, so every remaining `open`
  # item is measured against these three: § 1 is the row's shape, § 2 the arm
  # selection still unwritten, § 3 the ABI its helper reads. Added after two
  # sessions in a row sliced § 3 by hand and asked for it in the handoff.
  "0135 §1",
  "0135 §2",
  "0135 §3",
]

shapes = ["A `Core` member — the five edits", "A `.nvst` test case", "A diagnostic", "An ADR", "A commit message"]

