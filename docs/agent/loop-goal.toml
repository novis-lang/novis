# ---------------------------------------------------------------------------------------------------
# Stage 3 -- control flow and calls. Two fixtures, because the two halves share no file set: `control.mwl`
# is `control.rs`/`exception.rs`/`generator.rs`, `callable.mwl` is `call.rs`/`closure.rs`/`mod.rs`.
#
# `control.mwl`: `digits` is item 9's `do`/`while`, `scan` item 10's `break 2`, `label` item 11's two-
# representation ternary, the two `cleanup` lines item 12 (the second reached through a `catch` body that
# throws), and `closed` before `taken=3` is item 13 -- the generator is abandoned by the `break` and runs
# the `finally` it is suspended inside, where PHP runs it.
#
# `callable.mwl`: `direct` is item 15, `spread`/`named` item 16, `elements` item 17, `byref` item 18 (the
# second read is in the SAME statement as the call, which is what the copy-back at the enclosing statement
# gets wrong), `scaled` item 20.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "exact"
stage = "3 control and calls"
file = "examples/control.mwl"
want = [
  "digits=01234", "scan=1235", "label=0",
  "cleanup return", "handled=handled",
  "cleanup rethrow", "rethrown=second",
  "closed", "taken=3",
]

[[check]]
kind = "exact"
stage = "3 control and calls"
file = "examples/callable.mwl"
want = [
  "twice=10", "direct=13", "spread=10", "named=hi!hi!",
  "elements=4", "byref=7 then 7", "scaled=60",
]

[[check]]
kind = "cargo-named"
stage = "3 control and calls"
name = "mwl-ir (control flow)"
args = ["test", "-p", "mwl-ir"]
tests = [
  "a_do_while_lowers_its_condition_below_its_body",
  "a_multi_level_break_leaves_the_loop_it_names",
  "a_two_representation_ternary_widens_to_one",
  "a_finally_runs_when_its_catch_body_throws",
  "an_abandoned_generator_resumes_to_unwind",
  # Item 14 -- the two shapes the owned-temporaries stack still misses.
  "an_inline_producer_releases_its_value_on_the_throw_path",
  "a_transferred_argument_is_released_when_a_later_one_throws",
]

[[check]]
kind = "cargo-named"
stage = "3 control and calls"
name = "mwl-ir (calls)"
args = ["test", "-p", "mwl-ir"]
tests = [
  "a_closure_is_called_through_the_variable_holding_it",
  "a_named_argument_lowers_to_its_declared_position",
  "a_spread_argument_lowers_to_the_positions_it_fills",
  "a_spread_array_element_lowers",
  "a_reference_argument_lowers_in_any_expression_position",
  "a_closure_capturing_a_reference_parameter_captures_its_value",
  "a_foreach_by_reference_writes_through_to_its_array",
]

[[check]]
kind = "cargo-named"
stage = "3 control and calls"
name = "mwl-types (calls and loops)"
args = ["test", "-p", "mwl-types"]
tests = [
  # Item 16's half, which lands FIRST -- a lowering with no resolved per-argument type is how that
  # gap got here in the first place (loop-goal.md § Standing decisions).
  "a_named_argument_is_checked_against_the_parameter_it_names",
  "a_spread_argument_is_checked_against_the_positions_it_fills",
  # Item 10's diagnostic half: `mwl_types` does not check loop nesting at all today.
  "a_break_past_its_nesting_is_a_compile_error",
  # Item 17's other half, refused by decision rather than built (ADR 0031 § 2).
  "a_reference_array_element_is_a_compile_error",
]


# ---------------------------------------------------------------------------------------------------
# Stage 4 -- assignment targets, `mixed`, and the rest of the conversion table.
#
# `hits=2,5` is item 21, `grid=93` item 22, `mixedSum`/`elem`/`flag` the three shapes of item 24 (arith-
