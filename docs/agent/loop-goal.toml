[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (calls and loops)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 16's half, which lands FIRST -- a lowering with no resolved per-argument type is how that
  # gap got here in the first place (loop-goal.md § Standing decisions).
  "a_named_argument_is_checked_against_its_own_parameter",
  # A spread fills only a variadic tail (rule 5 of `map_arguments`), so "the positions it fills" IS that
  # tail's element type -- the test the crate has, under the name the rule gave it.
  "a_spread_argument_is_checked_against_the_tail_element_type",
  # The same two spellings through a `callable`, which has no signature to map them against at all:
  # ADR 0031 § 1 refuses the name and admits the spread.
  "a_named_argument_through_a_callable_is_refused",
  "a_spread_argument_through_a_callable_is_accepted",
  # Item 10's diagnostic half landed as `nvs_types::locals::check_exit_level` (`E0475`), and no Rust
  # test names it -- `a-break-level-that-names-no-target-is-a-diagnostic.nvst` in the `nvs-suite`
  # check below owns it instead, over all five spellings the diagnostic refuses.
  # Item 17's other half, refused by decision rather than built (ADR 0031 § 2).
  "an_array_element_passed_by_reference_is_diagnosed",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- assignment targets, `mixed`, and the rest of the conversion table.
#
# `hits=2,5` is item 21, `grid=93` item 22, `mixedSum`/`elem`/`flag` the three shapes of item 24 (arith-
# metic on a tag, a subscript through one, and ADR 0035's truthy table over a `?bool`), `top=point` item
# 25, `asInt`/`asString` and `converted=3` item 26's three rows -- of which `asInt` is a *branch*,
# ADR 0007 § 2's grid giving a `bool` source the "anything -> `string`" row and no numeric one, so
# `$yes as int` is `E0708` where it is written and the fixture spells the predicate out loud.
# `converted=3` is the `array<T>` -> `array<U>` row, which that same grid makes a per-element *check*
# rather than a conversion -- so the fixture converts to `array<mixed>`, the one target every tag
# satisfies, and `as array<string>` over an `array<int>` would throw at element 0 instead.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/targets.nvs"
want = [
  "hits=2,5", "grid=93", "mixedSum=5", "elem=2", "flag=no",
  "top=point", "asInt=1 asString=1", "converted=3",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (targets and tags)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # A static property as an assignment target, the nested element write and the tag-dispatched
  # arithmetic are owned by the conformance cases of those names in the `nvs-suite` check below --
  # each landed with no `nvs-ir` test naming it, and each is an observable answer rather than a
  # lowering shape.
  "a_mixed_condition_dispatches_the_truthy_table_on_the_tag",
  "a_subscript_through_a_tagged_base_lowers",
  "the_object_top_type_erases_to_the_pointer_a_class_does",
  # ADR 0007 § 2's `array<T> as array<U>` row -- an agreement over its four spellings, the free
  # `array<mixed>` target included, since that one is asserted by a count and not by a line.
  "an_array_conversion_walks_its_elements",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (targets and refusals)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 24 -- a `mixed` base defers the subscript to its tag (ADR 0036 § 4), and every base whose
  # declared type has already answered keeps `E0482` where it is written.
  "an_array_index_through_a_mixed_base_defers_to_the_tag",
  "an_array_index_through_a_scalar_base_is_still_refused",
  # Item 23 -- every ADR 0046 § 2 compile-time constant is a legal *property* default, not just a
  # literal and `[]`. The parameter half is still a literal only, and `nvs_types::defaults`'s own
  # module doc owns why (the emitter would hand a `ConstArg::Int` to an enum-typed IR position).
  "a_property_default_accepts_every_compile_time_constant",
  # Item 28 -- a `Core` class stringifies where the spec gives it a `toString`, and is diagnosed at
  # the `echo` where it does not. Never a panic below.
  "a_core_class_stringifies_exactly_where_the_registry_says_so",
  # Item 26 -- both halves of ADR 0007 § 2's `bool` source at once, since either alone reads as an
  # accident. `nvs-ir` has nothing to test: the row that runs is `Helper::BoolToString`, already
  # pinned by `conversions-that-succeed.nvst`, and the refused one never reaches that crate.
  "a_bool_converts_to_a_string_and_not_to_an_int",
  # ADR 0007 § 4's arithmetic table closed at the operand end (`E0716`) and `%`'s missing `float`
  # row (`E0717`) -- together, what `emit_binop`'s operator catch-all used to be reachable through.
  "an_arithmetic_operand_with_no_row_is_a_compile_error",
  "a_float_modulo_is_a_compile_error",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the M4 features with no slice at all. Each is proved by a `.nvst` case rather than by an
# examples fixture: they are corpus-visible behaviour, Stage 8 counts the corpus, and the case is the
# artefact M4's own Verify paragraph asks for.
# ---------------------------------------------------------------------------------------------------

# Items 30, 31, 32, 34 and 35 landed as `.nvst` cases rather than as cargo tests, so the two blocks
# that named them by cargo test name are gone and the cases below own them -- see
# guard-name-debt.md's cause 2. What is left here is the one item whose assertion a case cannot make.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (dump)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # Item 33 -- ADR 0092's one record and its renderings. The record's own doc comment says why this
  # half cannot be a case: `--EXPECT-ERROR--` is how the runner is told a case should *fail*, so a
  # suite has no way to read standard error off a successful run. ADR 0033's redaction row, which
  # that ADR's Verification section defers to M4 by name, is a case and is listed below.
  "a_dump_writes_to_the_diagnostic_channel_and_not_to_the_output",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-codegen (fatal locals)"
args = ["test", "-p", "nvs-codegen"]
tests = [
  # Item 36 -- a THROWN releases the frame's locals and a FATAL does not. The valgrind sweep cannot
  # see this: `examples/fatal.nvs` is on its skip list, because it exits non-zero by design.
  "a_fatal_releases_the_frames_locals",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the checker and the front end. Nothing here is a panic below the checker; each is a program
# the checker accepts and should not, or refuses without saying which rule.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (narrowing and reachability)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 37 -- three of ADR 0007 § 6's four spellings, and the residue no longer restricted to a class.
  "an_instanceof_test_narrows_its_subject",
  "a_comparison_against_a_literal_narrows_its_subject",
  # Item 38. The `match (true)` arm is a case rather than a cargo test, and so is the reachability
  # half's accepting side. The refusal half landed as `E0739`: `nvs_types::returns` decides whether a
  # path reaches the end of a body, and `tests/returns.rs` pins it and every shape it must not report.
  "a_non_void_function_must_return_on_every_path",
  "a_switch_with_default_and_a_break_in_every_case_assigns_definitely",
  "a_trys_finally_assignment_reads_fine_after_it",
  # Item 39. The refusal lives in `expr/calls.rs`'s private
  # `reject_arguments_to_implicit_constructor`, and `tests/classes.rs` now calls it.
  "a_class_constant_folds_and_an_enum_case_narrows",
  "an_implicit_constructor_is_held_to_zero_arguments",
  # Item 40
  "a_disjoint_equality_does_not_compile",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-syntax (the last unparsed shapes)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  # Item 42 -- each of these parses or is refused by a diagnostic that names its rule. A generic
  # parse error is not a refusal; loop-goal.md § What "no holes" means says why.
  "a_grouped_use_parses_or_names_the_rule_that_refuses_it",
  "goto_is_diagnosed_but_still_parses",
  "shape_type_parses_in_every_declaration_slot",
  "an_enum_case_named_with_a_keyword_parses",
]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- ADR 0079's `#[Test]`. Last, because it is the only stage that adds a surface rather than
# closing a hole, and because every assertion in its roster is written against Stage 0's operator table.
# `.nvst` and `#[Test]` answer different questions and are never unified (that ADR § 23); `nvs-test` is
# built and is not this item.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (the test table)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_test_attribute_builds_a_table_of_its_cases",
  "a_fixture_attribute_builds_a_roster_keyed_by_what_it_returns",
  "each_test_with_is_a_row_folded_in_parameter_order",
]

# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the corpus and the guards. `nvs test <dir>` must exit 0 AND print an "N passed, M failed"
# summary: a suite that silently collected nothing exits 0 too. These run once, not per leg.
#
# `cases` is the `.nvst` twin of `cargo-named`: each file must exist, run, and not be skipped. Most do
# not exist yet -- writing one is how an item above finishes.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 750
cases = [
  # Stage 0
  "tests/conformance/lang/every-arithmetic-row-promotes-the-narrower-operand.nvst",
  "tests/conformance/lang/an-integer-division-is-exact-only-where-it-divides.nvst",
  "tests/conformance/lang/an-integer-overflow-throws-rather-than-wrapping.nvst",
  "tests/conformance/lang/the-bitwise-operators-answer-over-every-row.nvst",
  "tests/conformance/lang/an-increment-answers-the-same-in-either-position.nvst",
  "tests/conformance/lang/a-spaceship-orders-every-scalar-the-relational-operators-do.nvst",
  # Stage 3
  "tests/conformance/lang/a-do-while-runs-its-body-before-its-condition.nvst",
  "tests/conformance/lang/a-break-leaves-the-level-it-names.nvst",
  "tests/conformance/lang/a-break-level-that-names-no-target-is-a-diagnostic.nvst",
  "tests/conformance/lang/a-ternarys-two-arms-widen-to-one-value.nvst",
  "tests/conformance/error/a-finally-runs-when-its-catch-body-throws.nvst",
  "tests/conformance/iter/an-abandoned-generator-runs-the-finally-it-is-suspended-inside.nvst",
  "tests/conformance/lang/a-closure-is-called-through-the-variable-holding-it.nvst",
  "tests/conformance/lang/a-named-argument-binds-by-name-and-a-spread-by-position.nvst",
  "tests/conformance/lang/a-reference-argument-is-written-back-before-the-next-read.nvst",
  "tests/conformance/array/a-foreach-by-reference-writes-through-to-its-array.nvst",
  # Stage 4
  "tests/conformance/array/a-nested-element-write-separates-only-the-inner-array.nvst",
  "tests/conformance/class/a-static-property-is-written-and-read-through-its-class.nvst",
  "tests/conformance/lang/a-mixed-value-answers-arithmetic-truth-and-a-subscript.nvst",
  "tests/conformance/lang/an-operator-agrees-whether-its-operand-is-typed-or-tagged.nvst",
  "tests/conformance/lang/as-bytes-over-a-tagged-operand-is-decided-by-its-runtime-tag.nvst",
  "tests/conformance/lang/every-remaining-conversion-row-runs-or-throws.nvst",
  # Stage 5
  "tests/conformance/class/a-property-observer-sees-every-write-its-class-makes.nvst",
  "tests/conformance/class/a-delegated-interface-forwards-to-the-object-it-names.nvst",
  # ADR 0043 § 4's other half: the forward exists for every member, so a field that cannot answer one
  # of them is refused where the `by` is written rather than at the call.
  "tests/conformance/class/a-delegate-field-must-be-able-to-answer-the-interface.nvst",
  # ADR 0046 §§ 4-5 match a payload *structurally* rather than by the attribute's name, so the case
  # is named for the shape it satisfies; "its own type" was the nominal reading that ADR refuses.
  "tests/conformance/core/an-attribute-is-retrieved-by-the-shape-it-satisfies.nvst",
  # The refusal half of the same rule, and the only place the explicit call-site type argument
  # `Core\Attributes::get<T>(…)` is both accepted and refused in one program: § 5's two-match
  # ambiguity is E0728 here, decided at compile time rather than by a test run.
  "tests/conformance/reject/an-attribute-retrieval-is-refused-where-it-cannot-be-folded.nvst",
  # ADR 0092's two halves, which one `.nvst` cannot hold: § 3's plaintext view over every node kind,
  # and § 5's redaction row, whose value never reaches the record at all.
  "tests/conformance/core/a-dump-renders-one-record-through-one-plaintext-view.nvst",
  "tests/conformance/core/a-secret-typed-property-is-redacted-wherever-it-is-dumped.nvst",
  "tests/conformance/lang/inline-html-at-file-scope-is-echoed-in-place.nvst",
  "tests/conformance/lang/a-required-file-runs-its-own-top-level-statements.nvst",
  # ADR 0021 § 3's value form, which is a separate program from the statement form above.
  "tests/conformance/lang/a-required-file-hands-a-value-back.nvst",
  # Stage 6. Four rules whose assertion is a program rather than a checker unit test, so the
  # `cargo-named` entries that used to name them are gone -- see guard-name-debt.md's cause 2.
  # ADR 0007 § 6's fourth narrowing spelling, and the reachability half that a body can satisfy:
  "tests/conformance/lang/a-match-and-a-switch-over-true-narrow-per-arm.nvst",
  "tests/conformance/lang/a-for-body-that-always-returns.nvst",
  "tests/conformance/lang/a-method-returns-early-from-inside-a-loop.nvst",
  "tests/conformance/class/a-promoted-constructor-parameter-is-a-property.nvst",
  # ADR 0007 § 3: a key is a `string` and nothing else, and a `&` binding agrees on the element type.
  "tests/conformance/lang/a-foreach-key-binding-is-a-string-and-nothing-else.nvst",
  "tests/conformance/array/a-by-reference-binding-needs-a-variable-and-the-element-type.nvst",
  # Stage 7. ADR 0079's surface landed -- `#[Test]`, `#[Fixture]` and `#[TestWith]` are on
  # `nvs_types::derive::ATTRIBUTES`, `Core\Test` is `crate::test::CLASS` in `nvs_stdlib::registry`,
  # and the runner reads the table back -- so these five are the cases that own what the deleted
  # `nvs-stdlib (the assertion roster)` check named in Rust: § 5's ledger, § 5's catchable failure,
  # and § 22's three renderings (human by default, then the two machine twins).
  "tests/conformance/lang/a-test-attribute-builds-a-table-the-runner-reports.nvst",
  "tests/conformance/core/test-three-assertions-agree-on-what-reaches-the-ledger.nvst",
  "tests/conformance/core/a-failed-assertion-is-caught-by-name.nvst",
  "tests/conformance/lang/a-test-run-reports-a-versioned-json-document.nvst",
  "tests/conformance/lang/a-test-run-reports-the-junit-xml-ci-ingests.nvst",
  # Stage 0a -- ADR 0107. The 14 cases that spelled `&$` moved to `inout` with their expected output
  # unchanged, which is the check that ADR 0107 changed no semantics; this one pins the new shapes.
  "tests/conformance/lang/a-by-reference-argument-is-written-inout-at-both-ends.nvst",
  # Item 29's two write shapes, both cause-2 moves out of `nvs-types (targets and refusals)`: each
  # refusal was already landed in `expr/assign.rs` with a case pinning every spelling that reaches
  # it, and a multi-diagnostic program is what asserts them, not a checker unit test.
  "tests/conformance/class/a-nullsafe-assignment-target-is-refused.nvst",
  "tests/conformance/array/an-element-write-through-a-hooked-property-is-refused.nvst",
  # Item 27's pair, and one case owns both: ADR 0066 § 3 is refused at both ends -- `E0709` for a row
  # that cannot fail, `E0708` for a pair naming no row at all -- and a case asserting one end alone
  # cannot see the table drift open at the other.
  "tests/conformance/lang/the-nullable-conversion-table-is-closed-at-both-ends.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 165
cases = [
  # The rows PHP itself is the only authority on. Each is an item above whose answer is "whatever
  # PHP prints", and each is worth a differential case rather than a frozen one for that reason.
  "tests/differential/lang/an-integer-division-matches-phps.nvst",
  "tests/differential/lang/the-bitwise-operators-match-phps.nvst",
  "tests/differential/lang/a-mixed-numeric-promotion-matches-phps.nvst",
  "tests/differential/iter/an-abandoned-generators-finally-matches-phps.nvst",
  "tests/differential/lang/a-named-and-spread-argument-match-phps.nvst",
  "tests/differential/lang/a-reference-argument-matches-phps.nvst",
]

# A named test must both EXIST and pass -- `cargo test` is green on a suite that never ran the guard.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (Part I)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
]

# The mechanical end gate, in two halves that are blind in different places.
#
# The first reads `nvs-ir`'s and `nvs-codegen`'s own sources for refusal sites -- a panic naming an
# unsupported shape -- and fails naming every one that is not on the allowlist frozen in the test. THE
# ALLOWLIST MAY NEVER GROW: every entry is a bullet in loop-goal.md § Standing decisions, and adding one
# to make a run go green is the single move this goal forbids outright. A count of conformance cases is a
# proxy for "the language is finished"; this is not.
#
# The second exists because the first counts *arms* rather than *shapes*, and one catch-all arm is one
# site however many shapes fall into it. `lower_checked_ty` was exactly that: one site, claimed by item
# 25 because item 25 anchors that file, while three shapes item 25 is not about were reaching it and
# panicking a compiler that had type-checked them. `type_atoms.rs` walks every atom ADR 0007 § 3 spells
# through both declaration positions and names the shapes, so a hidden one is a row rather than a number.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (no refusal left)"
args = ["test", "-p", "nvs-ir"]
tests = [
  "every_refusal_is_a_diagnostic_or_decided",
  "every_spellable_type_reaches_a_diagnostic_or_an_ir",
]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the named guard tests, carried whole from the previous goal.
# ---------------------------------------------------------------------------------------------------

# `--test perf_guards` and not the whole package, which is a MEASUREMENT and not a narrowing. The
# release profile is `lto = "thin"` with `codegen-units = 1`, so a one-line change to any crate this
# reaches costs a thin-LTO relink of every binary the package holds -- measured on this tree, after
# touching `nvs-runtime`: 200s for the package's five test binaries, 133s for this one. Every `#[test]`
# in `perf_guards.rs` carries `#[cfg_attr(debug_assertions, ignore)]`, so the two halves partition the
# package exactly: this one runs the guards and skips nothing, the debug one runs everything else and
# skips the guards.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "abi-probe"
args = ["test", "--release", "-p", "nvs-abi-probe", "--test", "perf_guards"]
tests = [
  "a_typed_arithmetic_loop_contains_no_call",
  "a_typed_arithmetic_loop_stays_in_the_native_cost_class",
  "a_refcount_one_array_member_mutates_in_place",
  # Carried from the previous goal's Stage 0, into this block rather than beside it: the two used to
  # share one cargo run only by having word-for-word identical `args`, and one list cannot diverge.
  "an_allocation_round_trip_stays_in_the_pooled_cost_class",
  # Item 30 lands `PropertyObserver`; this is the guard that says a class WITHOUT one still pays
  # nothing for its existence, which is the whole shape of ADR 0014's decision.
  "a_class_without_a_property_observer_costs_nothing_extra",
  "a_grapheme_index_costs_more_than_a_code_point_index",
]

# The architecture invariants ADR 0003 rests on -- a result and a throw travelling up through many JIT
# frames, a runtime panic contained and reported, a helper suspending with JIT frames live above it, and
# native unwinding through those frames still being unavailable. Correctness, not cost, so debug is the
# right profile and not merely the cheap one: `overflow-checks` and `debug_assert!` are on.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "abi-probe (invariants)"
args = ["test", "-p", "nvs-abi-probe"]
tests = [
  "a_throw_propagates_through_every_frame",
  "a_runtime_panic_is_contained_and_reported",
  "a_helper_can_suspend_with_jit_frames_live_above_it",
  "native_unwinding_through_jit_frames_is_still_unavailable",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-codegen"
args = ["test", "-p", "nvs-codegen"]
tests = ["a_second_script_runs_after_a_contained_helper_panic"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime"
args = ["test", "-p", "nvs-runtime"]
tests = ["an_acyclic_object_graph_releases_every_allocation"]



# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the four attribute passes. One file set: a name on `nvs_types::derive::ATTRIBUTES`, a
# recognizing pass, and a table the compiler carries. `#[Json\Derive]` is already on disk and is the
# shape to copy.
#
# Every test named below must EXIST and pass. Most do not exist yet; writing one is how the loop finishes
# its item. Do not rename one to something already green.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 attributes"
name = "nvs-types (the derive gaps)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 2 -- ADR 0071 §§ 2 and 7, the three gaps derive.rs's own module doc lists. Each is a diagnostic
  # at the DECLARATION; a field with no decoder refused at the `decodeAs<T>` that runs is the bug.
  "a_derive_field_whose_type_has_no_codec_is_refused_where_it_is_declared",
  "a_class_that_hand_writes_both_codec_halves_is_refused",
  "a_derive_on_a_class_with_no_declared_properties_is_refused",
]

[[check]]
kind = "cargo-named"
stage = "2 attributes"
name = "nvs-types (the route table)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 3 -- ADR 0077 §§ 1-3, 5.
  "a_route_table_is_built_from_the_program_enumeration",
  "a_route_parameter_takes_its_type_from_the_method_that_declares_it",
  "a_duplicate_route_is_a_diagnostic",
  "a_path_capture_with_no_matching_method_parameter_is_a_diagnostic",
  "an_unknown_literal_url_name_is_a_diagnostic",
  # Item 4 -- ADR 0102 §§ 3, 4, 6. Four more errors on the same pass.
  "an_optional_capture_outside_the_last_position_is_a_diagnostic",
  "an_optional_capture_bound_to_a_parameter_with_no_default_is_a_diagnostic",
  "a_capture_or_query_parameter_outside_the_type_list_is_a_diagnostic",
  "a_url_key_that_is_neither_a_capture_nor_a_query_parameter_is_a_diagnostic",
]

[[check]]
kind = "cargo-named"
stage = "2 attributes"
name = "nvs-types (the command table)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 6 -- ADR 0086 § 6. The TABLE only; `Core\Command::run` is goal 4's.
  "a_command_table_is_built_from_the_program_enumeration",
  "a_duplicate_command_name_is_a_diagnostic",
  "two_options_sharing_a_spelling_are_a_diagnostic",
  "an_option_on_a_parameter_with_no_conversion_from_string_is_a_diagnostic",
]

[[check]]
kind = "exact"
stage = "2 attributes"
file = "examples/routes.nvs"
want = [
  "GET /users/{id} -> Users::show",
  "GET /users -> Users::index",
  "POST /users -> Users::create",
  "url=/users/7",
  "absolute=https://example.test/users/7",
]

[[check]]
kind = "exact"
stage = "2 attributes"
file = "examples/commands.nvs"
want = ["greet <name> [--loud]", "migrate [--pretend]", "commands=2"]


# ---------------------------------------------------------------------------------------------------
# Stage 3 -- ADR 0057's intrinsic folding. The soundness rule is the item: the prepared path and the
# runtime path are ONE implementation, so a fold can produce an earlier answer and never a different one.
# The pair of cases below is what asserts that -- the same malformed literal, once as a compile error and
# once, behind a variable, as the identical runtime throw.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 intrinsics"
name = "nvs-types (folding at the call site)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_literal_date_format_is_validated_while_checking",
  "a_literal_regex_pattern_is_prepared_while_checking",
  "a_literal_format_template_checks_its_placeholder_count_and_types",
  "a_literal_uri_is_validated_while_checking",
  # The closed list is closed: a member not on it folds nothing however literal its argument.
  "a_member_outside_the_intrinsic_list_is_never_folded",
]

[[check]]
kind = "cargo-named"
stage = "3 intrinsics"
name = "nvs-stdlib (one implementation, two entry points)"
args = ["test", "-p", "nvs-stdlib"]
tests = ["a_prepared_literal_and_its_runtime_twin_share_one_implementation"]

[[check]]
kind = "exact"
stage = "3 intrinsics"
file = "examples/intrinsics.nvs"
want = ["2026-08-28", "matched", "total: 42", "host=example.test"]


# ---------------------------------------------------------------------------------------------------
# Stage 4 -- ADR 0085's emitter. `nvs build --openapi` and `nvs api diff` are one slice: the diff's
# classification is mechanical over two emitted documents, so it costs a comparison rather than a design.
#
# `kind = "command"` runs an arbitrary argv and checks its exit code and output. `{nvs}` is substituted
# with the CLI the leg already built, so this does not pay for a second build.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "4 openapi"
name = "nvs build --openapi emits 3.1"
argv = ["{nvs}", "build", "--openapi", "examples/routes.nvs"]
want = ['"openapi": "3.1', '"/users/{id}"', '"operationId"']

[[check]]
kind = "cargo-named"
stage = "4 openapi"
name = "nvs-cli (determinism and the diff)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # § 3 -- deterministic means byte-identical, and the cheapest way for it not to be is a hash map.
  "an_openapi_document_is_byte_identical_across_two_emissions",
  # § 2 -- `#[Api]` supplies only what the types cannot say, and its four contradictions are errors.
  "an_api_attribute_contradicting_its_own_signature_is_a_diagnostic",
  # § 4 -- the gate: breaking, compatible, or no change, decided mechanically over two documents.
  "an_api_diff_classifies_a_removed_route_as_breaking",
  "an_api_diff_classifies_an_added_optional_parameter_as_compatible",
]


# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the depth pass and the qualifier classification. This is where the goal spends most of its
# sessions, and it is the fallback whenever another stage's group is blocked.
#
# `min_passing` is a corpus figure and `cases` is the worklist; a check whose worklist IS its case list
# omits the threshold. Both are here because this stage is measured both ways: the floor test says every
# class is exercised, and the count says the corpus grew with the members rather than around them.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 depth"
name = "nvs-stdlib (the coverage gates)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # Carried from M4's floor, and they stay: registered is the precondition for everything below.
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
  # Item 10 -- the FLOOR, not the median. A median rises by writing more cases for members that already
  # have some, which is the metric a corpus grows around rather than into.
  "every_core_class_has_a_conformance_floor_of_three",
  # Item 12 -- ADR 0088 § 2. An unclassified `string`/`bytes` parameter refuses `tainted`, and this test
  # is the "fails on any member that ships without one" half.
  "every_member_parameter_carries_a_qualifier_classification",
  # Item 11 -- every `Fault::thrown` site is caught by a case, or carries a comment saying no program
  # reaches it. Judged per site; the test only asserts that one of the two is true of each.
  "every_error_path_is_asserted_or_declared_unreachable",
]

[[check]]
kind = "nvs-suite"
stage = "5 depth"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 950
cases = [
  # Stage 0
  "tests/conformance/core/program-implementing-enumerates-every-implementor.nvst",
  "tests/conformance/reject/an-implementor-without-a-no-argument-constructor-is-named.nvst",
  # Stage 2. ADR 0071's three gaps, each refused where the class is declared.
  "tests/conformance/reject/a-derive-field-with-no-codec-is-refused-at-its-declaration.nvst",
  "tests/conformance/core/a-route-table-answers-a-url-for-every-route-it-holds.nvst",
  "tests/conformance/reject/a-route-table-refuses-its-seven-contradictions.nvst",
  "tests/conformance/core/a-command-table-answers-its-own-help.nvst",
  # Stage 3. The pair that asserts the soundness rule -- one malformed literal, two entry points.
  "tests/conformance/core/a-literal-intrinsic-is-validated-while-checking.nvst",
  "tests/conformance/reject/a-malformed-literal-intrinsic-is-a-compile-error.nvst",
  # Stage 6.
  "tests/conformance/core/a-repeated-grapheme-count-agrees-with-the-first.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "5 depth"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 200
cases = [
  # The rows PHP itself is the only authority on, in the domains this goal audits.
  "tests/differential/lang/every-str-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/every-arr-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/every-math-member-with-a-php-twin-agrees.nvst",
  "tests/differential/lang/a-date-format-string-renders-as-phps-does.nvst",
]


# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the string header. ADR 0009 § 2's cached grapheme count, and the O(1) boundary correction a
# concatenation needs at the seam.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 string header"
name = "nvs-runtime (the cached count)"
args = ["test", "-p", "nvs-runtime"]
tests = [
  "a_repeated_grapheme_count_is_answered_from_the_header",
  "a_concatenation_corrects_the_boundary_without_rescanning",
  # The cache may never disagree with a fresh scan -- the failure mode is a wrong index, not a slow one.
  "a_cached_count_equals_a_fresh_scan_over_the_corpus",
]


# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the migration rows. The parity program's own measure, raised one goal at a time.
#
# EVERY FLOOR IN THIS PROGRAM IS MEASURED, NOT GUESSED, AND THIS COMMENT IS THE ONE HOME FOR HOW.
# The 860 names `check-migration.py --report` listed on 2026-08-29 were attributed to the goal that
# owns each family, by prefix, against the 291 already classified (25% of 1151):
#
#     goal 1  strings, arrays, numbers, dates, regex, encoding, JSON, paths     108 names   -> 35%
#     goal 2  serialize, unserialize, the task surface                            8 names   -> 35%
#     goal 3  ini_*, gc_*, opcache_*, set_time_limit, memory_*                   34 names   -> 38%
#     goal 4  streams, files, hashes, reflection, output, process, crypto       458 names   -> 78%
#     goal 5  mysqli, pg_*, sqlite3, PDO                                        227 names   -> 98%
#     goal 6  sessions, headers, request input                                   33 names   -> 100%
#
# THE DENOMINATOR IS 1151 AND NOT 925 because the oracle build gained `mysqli`, `pgsql` and `sqlite3`
# on 2026-08-29 and the inventory was regenerated: +226 functions, +13 types, none removed. Two of this
# program's floors were wrong by more than ten points before that, in opposite directions -- goal 5 owns
# a fifth of the whole table now, where against the old build it owned almost nothing.
#
# The prefix pass cannot be exact: a family it attributes to one goal may turn out to belong to another.
# So each floor is set two to four points BELOW its modelled figure, which is what makes it a floor
# rather than a prediction -- a boundary guessed wrong must not fail a run. A goal that lands its domains
# and comes out higher raises the next goal's floor in the same commit, and says so.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "7 migration"
name = "check-migration at 33%"
argv = ["python", "tools/check-migration.py", "--min", "33"]
want = ["inventory:", "classified:"]
