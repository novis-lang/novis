plan = ["Open now", "Blocking"]
milestones = ["M8:verify"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The five servers ADR 0067's Verification names. Brought up ONCE per run rather than per iteration and
# memoized against `crates/nvs-db/**` the way the WSL leg is memoized against its own inputs -- the matrix
# costs minutes and identical bytes into a deterministic check cannot come out a different verdict.
[docker]
compose = "tests/db/compose.yaml"
services = ["mysql", "mariadb", "postgres", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "tests/db"]

# The `certs` service's CA, out of its volume and onto disk where `nvs.toml`'s `[db.main]
# tls_ca_file` names it. Destination on the left because it is the thing that has to be true; the
# right is where it comes from. It is regenerated whenever that volume is, so it is gitignored and
# copied here rather than committed.
[docker.copy]
"tests/db/ca.crt" = "postgres:/certs/ca.crt"


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- ADR 0133's carrier rule, accepted 2026-09-02, after M4 reported `Core\Html` done. It is
# FIRST in this file because the run order inside a class is this file's order: an escaper that answers a
# plain `string` is escaped a second time by ADR 0024 § 5's sink, and every `Core\Html` case written
# before the return type changes is written against the wrong rule. Item 1 in loop-goal.md.
#
# The two guard tests below must EXIST and pass. The `nvs-types` one is the half that cannot be read off
# the registry: `.` admits a `Stringable` object, so "`Markup` has no concat row" is a claim about the
# language and not about a signature.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 html carrier"
name = "nvs-stdlib (the escaped value is a carrier)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "html_escape_answers_the_markup_carrier",
  "every_launderer_for_an_auto_escaping_sink_answers_a_carrier",
  "to_source_is_the_only_way_out_of_markup_and_it_takes_a_reason",
]

[[check]]
kind = "cargo-named"
stage = "0 html carrier"
name = "nvs-types (markup does not concatenate)"
args = ["test", "-p", "nvs-types"]
tests = [
  "markup_is_not_stringable_and_has_no_concat_row",
  "markup_does_not_convert_to_string",
]


