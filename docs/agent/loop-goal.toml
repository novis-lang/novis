[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/arith.mwl"
want = ["sum = 998000"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/throw.mwl"
want = ["caught: boom"]

[[check]]
kind = "exact"
stage = "1 floor"
