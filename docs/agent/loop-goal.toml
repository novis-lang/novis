# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the two suites, plus the mechanical spec-coverage gates behind them. `mwl test <dir>` must
# exit 0 AND print an "N passed, M failed" summary: a suite that silently collected nothing exits 0 too,
# and that is the failure this guards against. These run once, not per leg.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "mwl-suite"
stage = "4 suites"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 600

[[check]]
kind = "mwl-suite"
stage = "4 suites"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 150

# A named test must both EXIST and pass -- `cargo test` is green on a suite that never ran the guard.
# The first of these already exists and keeps the *registered* half honest. The second does not exist yet,
# and writing it is this loop's real definition of "Part I is complete": it reads the member rows out of
# docs/spec/01-core-library.md's sections 1-12 and fails naming every one with no registry entry.
[[check]]
kind = "cargo-named"
stage = "4 suites"
name = "mwl-stdlib"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  "every_part_one_member_has_a_conformance_case",
  "every_part_one_spec_member_is_registered",
]


# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the named guard tests.
# ---------------------------------------------------------------------------------------------------

# `--test perf_guards` and not the whole package, which is a MEASUREMENT and not a narrowing. The
# release profile is `lto = "thin"` with `codegen-units = 1`, so a one-line change to any crate this
# reaches costs a thin-LTO relink of every binary the package holds -- measured on this tree, after
# touching `mwl-runtime`: 200s for the package's five test binaries, 133s for this one. The other four
# hold `tests/invariants.rs`, `tests/unwind_unavailable.rs` and the lib's own unit tests, none of which
# is a cost guard and none of which the release profile changes the answer to; they are run below, in
# debug, where they cost seconds. Nothing stopped running, and the cost classes are still measured
# against the profile MWL ships. Every `#[test]` in `perf_guards.rs` carries
# `#[cfg_attr(debug_assertions, ignore)]`, so the two halves partition the package exactly: this one
# runs the guards and skips nothing, the debug one runs everything else and skips the guards.
[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "abi-probe"
args = ["test", "--release", "-p", "mwl-abi-probe", "--test", "perf_guards"]
tests = [
  "a_typed_arithmetic_loop_contains_no_call",
  "a_typed_arithmetic_loop_stays_in_the_native_cost_class",
  "a_refcount_one_array_member_mutates_in_place",
  "a_class_without_a_property_observer_costs_nothing_extra",
  "a_grapheme_index_costs_more_than_a_code_point_index",
]

# The other half of that split: the architecture invariants ADR 0003 rests on -- a result and a throw
# travelling up through many JIT frames, a runtime panic contained and reported, a helper suspending
# with JIT frames live above it, and native unwinding through those frames still being unavailable.
# Correctness, not cost, so debug is the right profile and not merely the cheap one: `overflow-checks`
# and `debug_assert!` are on, which is strictly more checking than the release run gave them.
[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "abi-probe (invariants)"
args = ["test", "-p", "mwl-abi-probe"]
tests = [
  "a_throw_propagates_through_every_frame",
  "a_runtime_panic_is_contained_and_reported",
  "a_helper_can_suspend_with_jit_frames_live_above_it",
  "native_unwinding_through_jit_frames_is_still_unavailable",
]

[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "mwl-codegen"
args = ["test", "-p", "mwl-codegen"]
tests = ["a_second_script_runs_after_a_contained_helper_panic"]

[[check]]
kind = "cargo-named"
stage = "5 guards"
name = "mwl-runtime"
args = ["test", "-p", "mwl-runtime"]
tests = ["an_acyclic_object_graph_releases_every_allocation"]
