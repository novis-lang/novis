# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the testing surface the server unlocks. `rule:testing/inline-snapshots`, `rule:testing/db-transaction` and `rule:testing/in-process-request`.
#
# All four of these were filed `-p nvs-test` and not one of them could ever have run there:
# `crates/nvs-test/Cargo.toml` declares NO dependencies at all, on purpose -- a test runner that
# fails is indistinguishable from the thing it is testing failing -- so that crate holds the
# `.nvst` format and nothing that could build a request, a listener or a database. What
# implements all three ADR sections is `nvs_cli::runner`, which its own module doc calls the one
# place that can reach both halves at once: a checked program and a runtime context in one scope.
# Split into four so the ledger names which feature is still open rather than only the first.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's in-process request)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/in-process-request`: `Core\Test::request(...)` builds a request and runs it through `rule:routing/routes-are-compiled-not-registered`'s
  # compiled table and the real middleware chain -- no socket, no port. The synthetic request's
  # body and parameters arrive `tainted`, exactly as a real request's would.
  "test_request_dispatches_in_process_through_the_compiled_route_table",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's transaction)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/db-transaction`: `#[Test(db: "test")]` opens a transaction on the named connection before the
  # test and rolls it back after, so a transaction opened INSIDE the test is a savepoint. Needs
  # the same reachable PostgreSQL goals `core-part-ii` and `database` need.
  "a_test_with_db_runs_inside_a_transaction_that_is_rolled_back",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's ephemeral listener)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/in-process-request`'s second mechanism: `#[Test(server: true)]` starts a real listener on an
  # ephemeral port for the cases that genuinely need the wire. Two mechanisms are justified
  # there and the ADR says why, so this is not the row above under another name.
  "a_test_with_server_true_gets_an_ephemeral_listener",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (an inline snapshot's updater)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/inline-snapshots`. The ASSERTION half has landed -- `Core\Test::assertMatchesInline` is a
  # registry row over `Core\Debug::render`'s text, with three `.nvst` cases. What this check
  # names is the UPDATER: `nvs test --update` splices the produced value into the source
  # literal, and nothing else ever writes to a test's own file. It needs the literal's SPAN,
  # which no runtime record holds -- `nvs_stdlib::test`'s helper doc comment owns the design.
  "an_inline_snapshot_updates_its_own_source_when_asked_and_never_otherwise",
]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the load-bearing assertions, and the parity program's last gate.
#
# Item 26 is `rule:http-server/two-deployments-and-nothing-a-proxy-owns`'s governing rule stated as a test rather than as a suite of attempted escapes: the
# set of paths the server can execute after boot EQUALS the expanded mount table. A traversal suite proves
# that the escapes somebody thought of are refused; this proves the set is closed.
# ---------------------------------------------------------------------------------------------------

# m7.md's core requirement is filed here rather than under `nvs-server`, and that is not a slip being
# tidied: `rule:config/an-edit-reaches-the-next-request-without-a-restart`'s unit table is `crates/nvs-cli/src/script.rs` and there is no other in-memory cache of
# compiled units in the tree, so `-p nvs-server` could never have run either of these -- that crate's
# `Cargo.toml` names no crate that compiles a path, because the server is handed a program rather than
# resolving one. m7.md asks for the claim to be asserted "via a compile counter", which settles it: the
# test has to be able to see a compile, and only the crate holding the cache can.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (the hot-reload claims)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # The number the hot-reload design exists to make true, and the stall it must not buy it with.
  "ten_thousand_concurrent_cold_requests_compile_the_file_exactly_once",
  "no_request_stalls_while_the_file_is_compiled",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the load-bearing assertions)"
args = ["test", "-p", "nvs-server"]
tests = [
  # Item 25 -- a PARAMETERISATION, not a second suite. If it is two suites, item 2 was not done.
  "the_state_bleed_suite_passes_within_a_request_and_across_an_isolate_boundary",
  # Item 26 -- the governing rule, as a set equality.
  "the_executable_path_set_after_boot_equals_the_expanded_mount_table",
  # `rule:http-server/an-upload-is-received-only-through-files`'s load-bearing case, asserted against a high-water mark.
  "a_multipart_body_far_over_the_memory_bound_is_received_at_bounded_resident_memory",
  # The three suites, and the disconnect case.
  "the_path_traversal_suite_passes",
  "the_header_injection_suite_passes",
  "the_request_smuggling_suite_passes",
  "a_client_disconnect_leaves_no_isolate_behind",
]

# `rule:security/isolate-teardown-is-a-drain-then-a-sweep`'s teardown sweep, under load -- item 31, added late. The whole memory story in one
# assertion: a request's cycles die with the request, so live bytes track in-flight work, never traffic.
# Filed `-p nvs-host` and not `-p nvs-server`, since corrected: a request IS the isolate, and the
# arena whose teardown this asserts is `nvs_host::isolate`'s child -- but the cycle has to be built by
# hand, `NvsObj::new` is `unsafe`, and `crates/nvs-server` inherits the workspace's `unsafe_code =
# "forbid"`, which no `#[expect]` can open. The two tests' own doc comments carry this.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (the memory floor)"
args = ["test", "-p", "nvs-host"]
tests = [
  "live_bytes_are_flat_across_a_cycle_building_soak",
  "a_request_that_builds_cycles_returns_its_bytes_at_teardown",
]

# `--record` points at the IGNORED `benches/results/`, not at the tracked `benches/serve.json`.
# This check runs after the session's commits, so a row appended to a tracked file is a change no
# slice owns, nothing ever stages it, and it sat in the working tree from goal `server` onwards -- long
# enough that the driver's own "path(s) left uncommitted" report counted a clean session as dirty.
# The tracked artifact is the figure a human records deliberately; docs/agent/commands.md
# § *The server's throughput* is the home for that split.
[[check]]
kind = "command"
stage = "1 floor"
name = "throughput against PHP 8.5 + FPM + opcache, recorded"
argv = ["python", "tools/bench.py", "--serve-vs-fpm", "--record", "benches/results/serve.json"]
want = ["requests/sec", "recorded"]

# The eight claims a request has to answer, as `.nvst` cases. Seven were drafted under a
# `tests/conformance/http/` directory the corpus never adopted -- it is flat directories with a
# subsystem prefix on the FILE name -- and the paths are corrected here to the files that
# pin each claim. Three were already landed under the name the corpus took: the match a request carries
# is `an-in-process-request-carries-the-compiled-route-tables-own-match`, and the `404`/`405` pair is
# `methods-for-answers-nothing-for-an-unclaimed-path-and-every-verb-for-a-claimed-one`, whose own
# comment names the two answers as exactly those statuses. Five were written for this list.
#
# Two of them are pinned where a `.nvst` can be held to them rather than where the claim is worded.
# A session surviving a core is asserted at the BOOT -- `[session] backend = "local"` is refused, and
# `rule:concurrency/the-local-tier-cannot-hold-what-must-be-coherent` is the diagnostic's own note -- because a case running inside one request cannot be
# scheduled onto a second core, and a test that never happened to cross one would pass over a runtime
# that loses sessions in production. A deferred tree outliving its connection is asserted from the
# CALLER's side -- the answer is complete and carries none of the deferred bytes -- because the child's
# deferred output has nowhere left to go, which is the property itself.
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 1450
cases = [
  "tests/conformance/core/a-request-value-arrives-tainted-and-is-laundered-to-be-used.nvst",
  "tests/conformance/core/a-head-request-matches-a-get-route-and-is-head-says-so.nvst",
  "tests/conformance/reject/mixing-echo-with-a-typed-body-member-is-refused.nvst",
  "tests/conformance/core/an-in-process-request-carries-the-compiled-route-tables-own-match.nvst",
  "tests/conformance/core/methods-for-answers-nothing-for-an-unclaimed-path-and-every-verb-for-a-claimed-one.nvst",
  "tests/conformance/core/an-upload-is-received-only-through-files.nvst",
  "tests/conformance/core/a-session-survives-a-request-on-another-core.nvst",
  "tests/conformance/core/an-after-response-tree-outlives-its-connection.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 275

