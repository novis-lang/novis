# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the other four drivers, against real servers. MariaDB is a DISTINCT driver, argued at length
# in ADR 0067's Context and not a simplification to rediscover.
#
# Both of those servers now present the `certs` leaf PostgreSQL and MySQL do -- MariaDB by the same three
# flags, SQL Server through an `mssql.conf` its own compose comment explains -- so `tools/db-matrix.py`
# has an anchor to hand a client and both legs RUN. What they do not yet have is a driver: `MariaConn`
# and `MssqlConn` have no `connect`, so a leg reporting `ok` today asserts what the crate's cases reach
# without one. The remaining `n/a` is nothing; a leg that reports it again is a fixture regression.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the matrix"
name = "the five-driver matrix"
argv = ["python", "tools/db-matrix.py", "--all"]
want = ["mysql: ok", "mariadb: ok", "postgres: ok", "mssql: ok", "sqlite: ok"]

[[check]]
kind = "cargo-named"
stage = "6 the matrix"
name = "nvs-db (per-driver specifics)"
args = ["test", "-p", "nvs-db"]
tests = [
  # This name replaced `execute_many_uses_the_bulk_protocol_on_mariadb`, and the replacement IS the item:
  # ADR 0067 § 4 now runs `executeMany` as N executions on every driver and argues at length why a
  # bulk command cannot reproduce what the loop lets a caller observe. The ADR wins over this file.
  # Do not restore the old name expecting `COM_STMT_BULK_EXECUTE` to appear -- read § 4 first, and
  # note that it names the one fact (does `BULK_UNIT_RESULTS` continue past a refusal?) that reopens it.
  "execute_many_on_mariadb_is_n_executions_and_not_the_bulk_command",
  "mariadb_returning_is_available_and_mysqls_is_not",
  # ADR 0051 § 4 named this case in advance so it would be answered by the test, not by convenience.
  "the_mariadb_auth_plugins_are_implemented_in_rust_or_refused_by_name",
]


# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the pool. § 13's reset is a SECURITY BOUNDARY, and a connection returned carrying one
# request's state is one request reading another's.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "7 pool"
name = "nvs-db (the pool and its reset)"
args = ["test", "-p", "nvs-db"]
tests = [
  "the_pool_is_per_core_and_keyed_as_connect_and_open_key",
  "postgres_resets_without_losing_its_statement_cache",
  "mysql_and_mssql_reset_through_the_protocol_and_lose_theirs",
  "a_failed_reset_destroys_the_connection_rather_than_returning_it",
  "no_session_state_survives_a_return_to_the_pool",
  # The seam the four above cannot reach between them: `crates/nvs-db/tests/pool_reuse.rs` is an
  # integration test over a real server, and its assertion is `pg_backend_pid()` -- the identity of
  # the process on the other end, so an equal pid is one connection and not a second one that
  # answered as well. It runs on every leg and asserts only where `tools/db-matrix.py` pointed it at
  # a server, which is the skip rule the whole crate shares.
  "two_requests_on_one_core_share_one_connection",
  # The switch, asked the same question over the same socket: `pool = false` files nothing, so the
  # next request draws nothing and opens a backend of its own.
  "a_pool_that_is_off_hands_the_next_request_nothing",
  # The two bounds that decide what a pool *keeps*, over that same socket. `nvs-runtime`'s own cases
  # move a clock and count a store's entries over a `Fake`; what a server adds is that the retirement
  # and the release past `idle` are a **close**, so the next request is answered by a different
  # backend and the connection kept is the one released under the bound rather than the one past it.
  "a_connection_past_its_lifetime_is_not_the_one_the_next_request_draws",
  "a_release_past_the_idle_bound_closes_the_second_connection",
]

# § 13's other two bounds, from a program: `max` is a ceiling a request can *reach*, and `acquire` is
# how long reaching it costs before the refusal. Both are per core and neither is observable from
# `nvs-db`, which has no capability layer, no config block and no `Core\Db::connect` -- the ceiling is
# taken in `nvs-stdlib` before the handshake, so a fixture is the first place the two meet.
#
# The fourth line is the half elapsed time cannot reach: that the wait is a *park* and not a spin.
# The fixture asks for the held connection from inside a `Core\Task` child while a sibling child
# sleeps beside it, so a wait that kept the core would print how many milliseconds the two took in
# sequence instead of the verdict.
[[check]]
kind = "exact"
stage = "7 pool"
file = "examples/pool.nvs"
want = [
  "opened=1",
  "refused: waited `acquire` out, and named it",
  "usable=1",
  "parked: the core ran a sibling task while the request waited",
]


# ---------------------------------------------------------------------------------------------------
# Stage 8 -- ADR 0084's queue. The transactional-enqueue property is the reason for the whole design.
# ---------------------------------------------------------------------------------------------------

# `-p nvs-stdlib` and not `-p nvs-db`, which is where these names were first filed: what they assert
# is the statement roster in `crates/nvs-stdlib/src/queue.rs` -- ADR 0084 § 2's schema has one home
# and that is it -- and ADR 0132 § 1 fixes the crate graph so that `nvs-db` cannot name `nvs-stdlib`
# at all, in a test target or anywhere else. `crates/nvs-stdlib/tests/queue.rs` sees both crates and
# runs the statements a worker runs; `tools/db-matrix.py`'s `SUITES` is what points it at a server
# beside `nvs-db`'s own suite, and with no `NVS_DB_MATRIX_DRIVER` set every case there skips.
[[check]]
kind = "cargo-named"
stage = "8 queue"
name = "nvs-stdlib (Core\\Queue)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # § 3 -- a job never exists for a row that was rolled back. This is the property, not a feature.
  "an_enqueue_commits_with_the_write_that_made_it",
  "a_rolled_back_write_leaves_no_job",
  # § 4-6.
  "claiming_is_skip_locked_shaped_on_every_backend_that_has_it",
  "a_visibility_timeout_returns_an_abandoned_job_to_the_queue",
  "retries_are_bounded_and_backoff_is_jittered",
  "an_exhausted_job_reaches_the_dead_letter_table_and_is_not_discarded",
]

[[check]]
kind = "command"
stage = "8 queue"
name = "nvs queue migrate prints both tables"
argv = ["{nvs}", "queue", "migrate", "--connection", "main", "--dry-run"]
want = ["jobs", "dead_letter"]

# The applying half, and it has to run before the fixture below: `examples/queue.nvs` pushes a row into
# `nvs_jobs`, and nothing else in this sweep creates that table. Order here is run order (a `0`-prefixed
# stage is the only thing that jumps the queue), so this block staying above that one is load-bearing.
# It is also the assertion that the command is idempotent, since the sweep runs it against a server the
# previous iteration already migrated -- every statement carries `if not exists`.
[[check]]
kind = "command"
stage = "8 queue"
name = "nvs queue migrate creates both tables"
argv = ["{nvs}", "queue", "migrate", "--connection", "main"]
want = ["jobs: applied", "dead_letter: applied"]

[[check]]
kind = "exact"
stage = "8 queue"
file = "examples/queue.nvs"
want = ["enqueued", "claimed 1", "ran", "retried", "dead-lettered"]


# ---------------------------------------------------------------------------------------------------
# Stage 9 -- what `nvs check` proves about a literal query, and the trace event.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "9 check and trace"
name = "nvs-types (the literal-query diagnostics)"
args = ["test", "-p", "nvs-types"]
tests = [
  # § 10.
  "a_placeholder_count_mismatch_on_a_literal_is_a_diagnostic",
  "mixed_placeholder_styles_on_a_literal_are_a_diagnostic",
  "an_open_host_matching_no_grant_is_a_diagnostic",
  "a_two_statement_literal_query_is_a_diagnostic",
  # ADR 0024's own M8 item -- the pair that has to be checked together.
  "a_tainted_value_at_a_query_text_parameter_is_a_diagnostic",
  "the_same_tainted_value_at_a_bound_parameter_compiles",
  "a_tainted_settings_host_is_a_diagnostic_naming_assert_trusted",
