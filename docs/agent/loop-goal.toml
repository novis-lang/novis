  # assert anything. Stage 5's `cargo-named` check above already holds it, as the `nvs-stdlib` unit
  # test `a_live_region_is_scoped_and_restores_the_terminal_on_a_panic`.
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 250

# The largest single jump in the program, and it is the measure of the goal rather than a side effect:
# 458 of the 860 names still open on 2026-08-29 are this goal's -- the filesystem, streams, processes,
# crypto, hashing, output buffering, reflection and the `get_*`/`is_*` families. Modelled at 78%; the
# floor is 74, four points under, because a family this pass attributed to goal 4 and that turns out to
# belong elsewhere must not fail a run. 1-core-depth.toml's Stage 7 comment derives the whole curve.
[[check]]
kind = "command"
stage = "1 floor"
name = "check-migration at 74%"
argv = ["python", "tools/check-migration.py", "--min", "74"]
want = ["inventory:", "classified:"]

# ---------------------------------------------------------------------------------------------------
# Stage 11 -- the teardown sweep, added 2026-09-01 by the user's decision. ADR 0116 § 2's drain frees
# only what the refcounts say is dead, so a cyclic object graph survived request and isolate teardown
# for the life of the process -- in the server, a leak growing with requests served. Items 36-37 in
# loop-goal.md. Every test and fixture named below must EXIST and pass; writing one is how the loop
# finishes its item. The in-flight CLI collector is a separate open decision and has no check here.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime (the live list and the sweep)"
args = ["test", "-p", "nvs-runtime"]
tests = [
  # Item 36 -- the list is maintained at both ends, so an ordinary refcount death leaves it.
  "an_object_that_dies_by_refcount_leaves_the_live_list",
  # Item 36 -- the crossing relinks: an adopt at refcount 1 moves the object to the destination's
  # list, or the child's sweep dismantles what the parent still holds. The relink lives INSIDE
  # Live::adopt -- the one place ownership changes -- never at a call site.
  "an_adopted_object_moves_to_the_destinations_live_list",
  # Item 36 -- the debug-build owner stamp: dismantle and sweep assert that an object is linked on
  # the list it names, so a second place that moves one between lists panics in every test run
  # instead of corrupting a parent. NOT "the context releasing it is the one that made it": that is
  # routinely and legitimately false -- `nvs_host`'s `finish` drops a child's exception and copies
  # its answer out while the parent is the installed context.
  "dismantling_through_a_foreign_context_panics_in_debug",
  # Item 37 -- the claim itself, measured by the allocator the way the acyclic guard already is.
  "a_cyclic_object_graph_is_reclaimed_when_its_context_drops",
  # Item 37 -- the sweep dismantles rather than unmapping: a swept member's native drop runs.
  "a_swept_cycles_native_teardown_runs",
]

# The end-to-end half, and it springs item 36's trap on purpose: top-level cycles, plus an isolate
# that builds a cycle of its own AND returns an object by the refcount-1 move, which the parent reads
# after the child is gone -- the one program shape where a missed relink is a use-after-free. The WSL
# valgrind leg proves both halves: nothing leaked, nothing freed early -- a debug build is on the
# platform heap so the checker can see it.
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/cycles.nvs"
want = ["built=1000", "crossed=ok", "done"]

# ---------------------------------------------------------------------------------------------------
# Stage 12 -- the exit hook, added 2026-09-01 by the user's decision. ADR 0127: Core\Script::onExit
# runs a FIFO queue as the last user code at every non-fatal ending -- normal, exit, uncaught throw --
# never on a FATAL or a cancellation, after tier 2's onUncaughtThrow and before native teardown,
# observing the ending rather than changing it. Items 38-39 in loop-goal.md. Every test and fixture
# named below must EXIST and pass; writing one is how the loop finishes its item.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (the onExit queue)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # Item 39 -- FIFO at a clean end, and the report says Normal with status 0.
  "on_exit_hooks_run_in_registration_order_at_a_clean_end",
  # Item 39 -- the ending nothing could observe before: exit still drains the queue, reason ExitCall.
  "an_exit_call_still_drains_the_on_exit_queue",
  # Item 39 -- the throw path hands the real Throwable, after tier 2's handler has run.
  "an_uncaught_throw_reaches_the_queue_with_the_error",
  # Item 39 -- ADR 0127 § 3: a limit FATAL runs no hook; Core\Fatal::onLimit is the only observer.
  "a_limit_fatal_runs_no_on_exit_hook",
  # Item 39 -- ADR 0127 § 5: a hook's throw is logged and abandoned, and the rest of the queue runs.
  "a_hook_that_throws_is_abandoned_and_the_queue_continues",
]

# The end-to-end half: hooks registered early, work done, a clean end runs them in order.
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/onexit.nvs"
want = ["work done", "onExit: Normal 0", "second hook"]

# ---------------------------------------------------------------------------------------------------
# Stage 13 -- the bcrypt read-path, added 2026-09-01 by the user's decision. ADR 0129: verify and
# needsRehash read a PHP-stored bcrypt hash ($2y$/$2a$/$2b$, never $2x$) -- verify verifies it,
# needsRehash answers true for every one -- while hash still writes only Argon2id; a stored cost past
# 17 is refused before any work, and everything outside the roster keeps throwing. Item 40 in
# loop-goal.md. Every test and case named below must EXIST and pass; writing one is how the loop
# finishes its item.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (the bcrypt read roster)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # ADR 0129 § 1 -- a hash PHP wrote verifies, and the wrong password answers false rather than throwing.
  "a_php_stored_bcrypt_hash_verifies_and_the_wrong_password_does_not",
  # ADR 0129 § 3 -- every tag in the roster is marked for rehash; the upgrade loop is the migration path.
  "needs_rehash_answers_true_for_every_bcrypt_tag",
  # ADR 0129 § 4 -- the cost ceiling, refused before any work, in MAX_M_COST's shape.
  "a_bcrypt_cost_past_the_ceiling_is_refused_before_any_work",
  # ADR 0129 § 6 -- $2x$ and a foreign PHC algorithm still throw, and the message quotes no bytes.
  "a_2x_hash_and_a_foreign_phc_string_still_throw",
]

# The end-to-end half: ADR 0129 § 3's upgrade loop over a bcrypt row -- verify, needsRehash, hash,
# verify again -- beside the landed refusal case, which must pass unchanged.
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance (the bcrypt upgrade loop)"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/password-verify-reads-a-php-stored-bcrypt-hash-and-upgrades-it.nvst",
  "tests/conformance/core/password-refuses-a-stored-value-that-is-not-a-hash-it-wrote.nvst",
]



# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. PostgreSQL first and no second driver until it is green end to end: its
# extended protocol pays nothing extra for a prepare, so the first driver exercises the design rather
# than the driver's own quirks.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 first driver"
name = "nvs-db (a connection, over the parking stream)"
args = ["test", "-p", "nvs-db"]
tests = [
  "a_connection_is_opened_tls_wrapped_and_authenticated_over_the_parking_stream",
  "a_connection_read_parks_its_coroutine_rather_than_blocking_the_core",
  # § 1 -- emulated prepares do not exist in any form.
  "no_driver_path_interpolates_a_value_into_sql",
  # § 3 -- a property of the CLIENT, because a malicious server can request it at any time.
  "local_infile_is_refused_and_no_file_is_sent",
  "the_connection_charset_is_forced_to_utf8",
]

# § 2's memo is asked of `Core\Db::connect`, and that member is nvs-stdlib's. This check exists rather
# than a name in the block above because ADR 0132 § 1 points the crate edge nvs-stdlib -> nvs-db: the
# memo is a table on `nvs_runtime::Ctx` that `Core\Db::connect` reads, and no -p nvs-db test can see
# either half of that. Moving a name to the crate that owns the behaviour is the fix; inventing a test
# where the name was filed is not.
[[check]]
kind = "cargo-named"
stage = "2 first driver"
name = "nvs-stdlib (§ 2's memo and § 3's two capabilities)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # § 2 -- a second connect under one name in one request is one connection and one handshake.
  "a_named_connection_is_memoized_for_the_request",
  # § 3 -- the two capabilities answer different questions and collapsing them is the mistake.
  # Both names were filed against `-p nvs-types` and neither can be asked there: `nvs_types::
  # intrinsics`' own known gap 6 is that checking has no configuration in front of it at all --
  # `nvs_types::Env` carries no capability set and no capability is checked at check time -- so a
  # question about what a deployment granted has no `-p nvs-types` asker. The first is landed; the
  # second waits on `Core\\Db::open`, which `nvs_stdlib::db`'s known gap 1 blocks on a registry type
  # for a shape parameter.
  "a_connect_named_private_endpoint_needs_no_net_connect_grant",
  "a_db_open_target_in_a_denied_range_fails",
]

[[check]]
kind = "cargo-named"
stage = "2 first driver"
name = "nvs-types (the settings shape)"
args = ["test", "-p", "nvs-types"]
tests = [
  # § 2 -- SQLite has no host, and a host on its settings literal is a compile error. This one is
  # nvs-types' by rights: it is a claim about a literal and not about a deployment. It waits on
  # `Db\\Settings` existing at all, which `nvs_stdlib::db`'s known gap 1 owns.
  "a_host_on_a_sqlite_settings_literal_is_a_compile_error",
]


