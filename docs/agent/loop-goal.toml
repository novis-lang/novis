# The loop's acceptance test, as data.
#
# `tools/loop.py` runs the checks below in order, short-circuiting on the first failure, so the ledger
# line each iteration writes says exactly how far the loop got. Every check must pass. Nothing else
# counts as done -- not a passing unit test, not a session claiming DONE.
#
# `loop-goal.md` is the prose: what the goal is, why, and the standing decisions already settled with the
# user. It does not restate this list, and this file does not restate its reasoning. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT. A fixture may be corrected to a
# spelling the docs already fix -- its author had to write every `Core` signature, every enum's namespace
# and every options bag from the spec, and an error there is a bug in the fixture, not a decision. What may
# never change is the expected output, or a fixture's reason for existing. Re-freeze, say why in the commit
# message, move on. That is not licence to weaken a check to make it pass.

# Every fixture the run touches. Missing one fails before anything is built, naming the file.
files = [
  "examples/hello.mwl", "examples/calls.mwl", "examples/throw.mwl", "examples/arith.mwl",
  "examples/trace.mwl", "examples/uncaught.mwl", "examples/fatal.mwl",
  "examples/objects.mwl", "examples/arrays.mwl", "examples/errors.mwl", "examples/hooks.mwl",
  "examples/enums.mwl", "examples/iterate.mwl", "examples/core.mwl", "examples/report.mwl",
  "examples/nullable.mwl", "examples/match.mwl",
  "examples/text.mwl", "examples/numbers.mwl", "examples/dates.mwl", "examples/json.mwl",
  "examples/collect.mwl",
]

# What a session of this goal READS. `python tools/orient.py` slices exactly these out of the live
# files and prints nothing else, so a session starts at a fraction of the unscoped orientation.
#
# Nothing below is a copy -- each entry is a *selector*. A wrong one is a loud warning from
# orient.py, never silence. Rewrite this block with the rest of the goal; the rules for doing that
# are in loop-authoring.md § 2, and `python tools/orient.py --audit` prints what it costs.
#
# If a session finds it needs something this does not print, that is a gap here: the session says
# so in the handoff, and the next one that touches the goal adds the selector.
[context]

# Modules whose map line a session needs, as globs under crates/. The file set the handoff's
# `## Next group` names, plus anything those files call into.
modules = [
  # The work is `.mwlt` cases, so the file set is the two members' own implementations plus the
  # table their signatures come from -- not the runtime and codegen files a Stage 0 slice needed.
  # Everything dropped here was a module map printed unread every session: `mwl-runtime`'s
  # `value`/`string`/`helpers`/`release`/`ctx`, `mwl-types`' `core_lib`/`ty`, `mwl-codegen`'s `ty`,
  # `mwl-diagnostics`, and `encoding`/`math`/`hash`. Put one back the session a group needs it.
  "crates/mwl-stdlib/src/registry.rs",
  # These three follow the `--errors` worklist rather than the spec's section order, because that is
  # what the group is chosen from now. `str.rs`, `encoding.rs`, `path.rs`, `time.rs` and `math.rs`
  # came out when their last assertable site was asserted; put a module back the session a group
  # needs it, and take one out the session its last assertable site is asserted.
  "crates/mwl-stdlib/src/json.rs",
  "crates/mwl-stdlib/src/arr.rs",
  "crates/mwl-stdlib/src/regex.rs",
  # Stage 0 is closed, and the reason it added nothing here is worth keeping because it applies to
  # any item list: a session takes ONE item, so the union of six items' file sets prints five unread
  # module maps every session. Measured at +1,715 tokens for items 10-15, and items 18-22 sat in
  # five different crates and shared no file at all. A selector belongs here when the *file set* a
  # group shares is what the handoff names.
]

# The decisions this goal's work sits inside, by ADR number. orient.py prints the one-sentence
# bullet for each out of docs/adr/ground-rules.md -- the index, not the rule.
rules = ["0090", "0094", "0069", "0047", "0007", "0035", "0010"]

# ADR sections sliced live into the pack. `NNNN` alone is the In short block; `NNNN §N` is that
# numbered section. Name only the sections the items actually need -- a whole ADR is 7k of context.
adrs = [
  "0009 §1",
  "0009 §3",
  "0051 §4",
  "0007 §3",
  # `Core\Out::capture` shipped and Stage 3 is green, so 0088 §§ 3 and 5 -- the two sections that
  # member is specified by -- came out of this list. They were the per-item selector the block
  # below warns against, kept one goal past the item that needed them.
  # Stage 0's items deliberately added NOTHING here, and the rule behind that still holds: a session
  # takes ONE item, so pre-printing every item's ADR prints five unread sections every session --
  # measured at +9,154 tokens of pack for a session that reads one of them. A selector belongs here
  # when *every* session of this goal needs it, which is why the four above are all foundational
  # (the `string`/`bytes` pair, the dependency test, the type grammar) rather than per-item.
]

# Headings of docs/agent/conventions.md naming shapes this goal will write.
shapes = ["A diagnostic", "A `.mwlt` test case", "A commit message"]

# Traps from docs/agent/playbook.md that apply to this file set. An entry is either a `##` heading
# (the whole section) or ONE bullet, named by its bold lead-in after a `>`:
#
#   "Tooling"                  the whole section -- 11 KB, and growing every time a trap is added
#   "Tooling > A whole ADR"    just that bullet -- 310 B
#
# This is the pack's largest section by a wide margin, and the only one that grows on its own: the
# playbook is append-mostly by decision, so every trap a session writes down is charged to every
# session after it. A goal that needs three traps should name three traps. `orient.py --audit`
# prices whichever you pick.
#
# The four whole sections this used to name were 42,328 B -- 17k tokens of a 31k pack, over half of
# it, for a session that reads perhaps three bullets. The list below is bullet-level and was
# produced by `python tools/playbook.py --goal --min 3`: every bullet whose text names three or more
# of this goal's own `modules` above. Re-run that after the file set changes; `--min 2` widens it,
# `python tools/playbook.py --match <paths>` narrows it to one session's own next group.
#
# The second block is by hand and cannot be otherwise. Those traps are about how a session RUNS --
# how it ends, how it reads, what a commit may not carry, what to do when this pack is short -- so
# they name no crate and no file and rank zero against any file set. They apply to every session.
playbook = [
  # The traps of WRITING a case, 12 bullets. This block used to be the 19 that ranked against a
  # `modules` list aimed at Stage 0, and seven of those were `Adding a `Core` member` -- the traps
  # of *implementing* a member, which is not what this goal does any more. `never put` is the rule
  # the whole group now sits on: an `--ORACLE--` section in `tests/conformance/` makes CI skip the
  # whole case and subtract from the very count Stage 4 measures.
  'Writing a test case > never put',
  'Writing a test case > deepening a',
  'Writing a test case > a case that',
  'Writing a test case > a catch',
  "Writing a test case > a .mwlt case's",
  'Writing a test case > an array literal is',
  "Writing a test case > a property's",
  'Writing a test case > a named',
  'Writing a test case > "…" as',
  'Running things > target/release/mwl.exe is',
  'Running things > verify.py never',
  'Tooling > a loop-goal.toml',

  # The conformance-case traps, 12 bullets, 7,489 B. These arrived as a `python tools/playbook.py
  # --gap` block when the work in flight was mwl-ir/mwl-codegen; they are kept deliberately now that
  # it is not, because what follows Stage 0 is Stage 4's corpus -- conformance 436 of 600,
  # differential 90 of 150 -- and every bullet below is a shape that compiles and then does not run.
  # A session writing `.mwlt` cases pays for each of these exactly once if it has not read them.
  'Writing a test case > mwl-codegen has',
  'Writing a test case > a row',
  'Writing a test case > a case cannot',
  'Writing a test case > a ?array<t>',
  'Writing a test case > a multi-file',
  "Writing a test case > emitbinop's ordering",
  'Writing a test case > the php',
  'Running things > a field',
  'Running things > a scratch',
  'Running things > mwl run printing',
  'Tooling > a class',
  'Tooling > a python str.index',

  # the process traps, by hand, 9 bullets, 4,764 B
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole adr',
  'Tooling > never plan.py',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

# Fields of the plan's status block worth printing. Default is these two.
plan = ["Open now", "Blocking"]

# Milestones out of docs/plan/, one file each. `"M4S"` is the whole thing, `"M4S:verify"` its
# acceptance paragraph alone, `"M4S:lead"` its opening one. Empty on purpose: this goal's items name
# their own scope, and M4S whole is 6k of context for a session that is checking one member against
# the spec. Name `"M4S:verify"` here the session the goal starts asking "is this milestone done".
milestones = []

[valgrind]
# Every fixture again under `valgrind --leak-check=full`, once the program legs are green. A hand-written
# refcount protocol is exactly where a leak hides. Cycles are out of scope by decision (loop-goal.md), so
# only *definite* losses fail. These two exit non-zero by design, so they are skipped.
skip = ["examples/fatal.mwl", "examples/uncaught.mwl"]

[wsl]
# On Windows the second leg runs through WSL, because a JIT is exactly where a calling-convention
# divergence between two targets hides. On Linux the native leg already is that target, so there is no
# second leg -- only the valgrind sweep, run directly.
target_dir = "/tmp/mwl-target-wsl"


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- CATCH-UP. Work that a later ADR reopened inside a milestone already reported done, plus the
# milestone debt that never landed with it. `tools/loop.py` runs this stage BEFORE the program legs, so
# an unfinished item here is what the ledger names -- see loop-goal.md's own Stage 0 section for the
# ordered list, which milestone owns each item and what "done" is.
#
# Every test named below must EXIST and pass. Most do not exist yet; writing one is how the loop finishes
# its item. Do not rename them to something already green.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-syntax"
args = ["test", "-p", "mwl-syntax"]
tests = [
  # ADR 0087 -- built; this keeps it from regressing.
  "an_unterminated_bidi_control_is_rejected_in_every_source_span",
  # ADR 0090 § 1 -- the lexer must stop producing `===`/`!==`.
  "a_rejected_equality_spelling_is_a_compile_error",
  # ADR 0061 -- the two file-scope `autoload` declaration forms.
  "an_autoload_declaration_parses",
  # ADR 0094 -- a member declaration with no visibility is E0122, the `(set)` form is written as a
  # pair, a class-body `var` names the visibility rather than the local grammar, and a plain
  # constructor parameter stays exempt (the one case this rule could wrongly break).
  "a_member_without_visibility_is_a_compile_error",
  "a_bare_set_visibility_is_a_compile_error",
  "a_class_body_var_names_the_missing_visibility",
  "a_plain_constructor_parameter_needs_no_visibility",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-hir"
args = ["test", "-p", "mwl-hir"]
tests = [
  # ADR 0061 -- name-to-file resolution as a fixpoint over the require-graph worklist.
  "an_autoload_declaration_resolves_a_name_to_its_file",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-types"
args = ["test", "-p", "mwl-types"]
tests = [
  # ADR 0090 § 2 -- two statically disjoint operands do not compile, and § 3's null test narrows
  # through the one remaining spelling.
  "a_disjoint_equality_does_not_compile",
  "an_equality_null_test_narrows",
  # ADR 0047 § 4 -- the literal and enum-case type atoms are checked, not refused by name.
  "a_literal_type_atom_is_checked",
  # M2's own two gaps, both PHP-observable divergences rather than decisions.
  "a_private_member_is_refused_outside_its_class",
  "a_stringable_parameter_can_call_to_string",
  # ADR 0069 -- `array + array` does not compile, and neither does `+=` over two arrays.
  "two_arrays_do_not_combine_with_plus",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-runtime"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # ADR 0090 § 3's three non-scalar rows, one helper each.
  "equal_strings_compare_as_text_and_never_as_numbers",
  "equal_arrays_compare_ordered_and_element_wise",
  "equal_objects_compare_by_identity",
  # ADR 0090 § 3's numeric row, and § 5's "applies *3*'s table" -- one answer
  # however the row is reached, with the hash agreeing with it.
  "the_four_numeric_representations_are_one_domain",
  "an_integral_float_past_two_to_the_53_hashes_with_both_of_its_readings",
]

# ---------------------------------------------------------------------------------------------------
# Stage 0, items 10-15 -- the "now or never" set from the PHP-history review. Every one was settled
# with the user, is argued in `loop-goal.md` § *Stage 0*, and is here rather than scheduled to a
# milestone for one reason each: the emit site, the ABI or the member it changes is being written
# right now, and the same change costs an order of magnitude more once it is. The numbers quoted in
# that prose were measured on this tree, not estimated.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-runtime (overflow-checks)"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # Item 10 -- a release build checks integer overflow. Measured cost: inside run-to-run noise on
  # `decimal` arithmetic, array append and string construction alike, so nothing is traded for it.
  "the_release_profile_checks_integer_overflow",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-ir (secret equality)"
args = ["test", "-p", "mwl-ir"]
tests = [
  # Item 11 -- ADR 0033 x ADR 0090: `==` over two `secret` operands lowers to the constant-time
  # helper rather than the short-circuiting one, so a hand-written token comparison is not a timing
  # oracle. The equality lowering landed in item 4; this rides it while it is fresh.
  "a_secret_equality_lowers_to_the_constant_time_helper",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-types (a class is never a conversion target)"
args = ["test", "-p", "mwl-types"]
tests = [
  # Item 12 -- ADR 0066 § 3's class row, absolute: EVERY class or interface target is E0473,
  # `Core\Uri` and `Core\Uuid` included. An earlier revision of that ADR admitted those two as a
  # `as ?T` "parse roster"; it is withdrawn, and the first test names them so the exception cannot
  # grow back unnoticed. § 3a's `Core\Uri::tryParse` is the member that answers instead, and it
  # answers `?T` rather than `T` -- which is the half a `try...` name alone could not promise.
  "a_class_type_still_refuses_the_nullable_conversion",
  "a_try_parse_answers_the_nullable_of_its_class",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-stdlib (uri)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  # Item 12 -- with `tryParse` above, `Core\Uri::isValid` is the second spelling R17 forbids. Both
  # `isValid` members existed and are deleted (an earlier comment here said `Uri`'s was not written
  # yet; it was). The second test holds ADR 0066 3a's conditions on `tryParse` itself, and the
  # third holds that R5's `try.../...OrNull/...Safe/...Ex` ban is otherwise total.
  "core_uri_declares_no_is_valid_member",
  "a_try_parse_is_its_own_class_parse_made_nullable",
  "no_member_spells_a_banned_non_throwing_variant",
  # Item 13 -- `$uri->compareTo($other)` normalizes per RFC 3986 § 6.2.2 and then compares
  # components. NOT `==`, which ADR 0090 § 4 fixes as object identity for every class and which
  # names `compareTo(...) == 0` as the spelling for content equality; this comment used to say
  # `==` and was wrong about which operator carries the rule. `parse` still reports verbatim:
  # that is `uri.rs`'s own rule and this does not change it, because the normalization happens
  # at the comparison, not at the parse.
  "two_uris_compare_by_normalized_components",
  "a_parsed_uri_round_trips_through_its_own_text",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-codegen (stack limit)"
args = ["test", "-p", "mwl-codegen"]
tests = [
  # Item 14 -- the stack check rides the safepoint's existing emit site, which is why it is now:
  # the plan states that retrofitting that site means rewriting the backend.
  "a_function_entry_checks_the_stack_limit",
  "a_leaf_function_under_the_slack_emits_no_stack_check",
  "a_runaway_recursion_reports_a_limit_rather_than_faulting",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-runtime (packed arrays)"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # Item 15 -- a list-shaped array holds no index map and no key strings, an integer subscript
  # reaches it without allocating one, and the first key that breaks the invariant degrades it to
  # today's hash form with no observable difference.
  "a_list_shaped_array_holds_no_index_map",
  "an_integer_subscript_allocates_no_key",
  "a_non_sequential_key_degrades_the_packed_array",
  "both_representations_answer_every_primitive_alike",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-codegen (stack probes)"
args = ["test", "-p", "mwl-codegen"]
tests = [
  # Item 16 -- Cranelift defaults stack probes off, so a frame over the 4 KiB guard page could step
  # past it. Measured at no instruction-count change either way, so the flag is insurance bought for
  # nothing. Not item 14 under another name: that counts depth, this catches one oversized frame.
  "stack_probes_are_enabled",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-stdlib (allocation seam)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  # Item 17 -- one allocation guard, in `mwl_runtime::affordable`, rather than four hand-written
  # copies and three members with none. The test is the invariant, not the behaviour: it fails when
  # someone writes copy number five.
  "no_member_writes_its_own_allocation_guard",
]

# ---------------------------------------------------------------------------------------------------
# Stage 0, items 18-22 -- the bench review. Same "now or never" test as 10-15 and the same source of
# authority: `loop-goal.md` § *Stage 0* argues each one, and `docs/perf/userland-gap.md` holds every
# number and the attribution behind it. Nothing here is restated in either direction.
#
# THE ORDER OF THESE FIVE BLOCKS IS THE ORDER OF THE WORK, and it is not the order of payoff. The
# allocator is first because every measurement taken before it -- including the `history.ndjson`
# entry item 15 owed, which is append-only -- would be taken against the wrong baseline. That entry
# exists now and was taken after the allocator landed, so the file's first line is on the right one.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "abi-probe (the allocator)"
# `--release`, and the same invocation stage 5 uses so the two share one build rather than forcing a
# second. A cost-class guard in a debug build measures the assertions and not the allocator, which is
# the reason `tools/bench.py` refuses a `target/debug` binary by name. Word for word the same argv as
# stage 5's `abi-probe`, `--test perf_guards` included -- the two are memoized onto one cargo run by
# being identical, so a divergence here silently doubles the slowest check in the file.
args = ["test", "--release", "-p", "mwl-abi-probe", "--test", "perf_guards"]
tests = [
  # Item 18 -- MWL's own allocator, not the platform heap. A round trip is 28.7 ns here today; the
  # guard is a cost class rather than a number, the shape every other guard in this file uses.
  "an_allocation_round_trip_stays_in_the_pooled_cost_class",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-codegen (packed subscript)"
args = ["test", "-p", "mwl-codegen"]
tests = [
  # Item 19 -- item 15's other half. `mwl-runtime`'s own `an_integer_subscript_allocates_no_key`
  # already holds the primitive; this holds the path COMPILED CODE takes to it, which is the half
  # `lower_array_key` still renders a decimal for.
  "an_integer_subscript_reaches_the_packed_form_from_compiled_code",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-runtime (string capacity)"
args = ["test", "-p", "mwl-runtime"]
tests = [
  # Item 20 -- the three halves of one layout revision, each measured through
  # `counting_alloc::allocated_bytes`, which is the shape `an_integer_subscript_allocates_no_key`
  # established: a transient allocation has a zero LIVE delta and a non-zero TOTAL one.
  #
  # These are the names the tests landed under, and they are NOT the ones this list first
  # predicted. Each was renamed here rather than in `string.rs` because the tree's name states the
  # narrower, true claim: a uniquely owned string with no room left DOES reallocate, so
  # "does_not_reallocate" would have named something the doubling never promises. Spare capacity,
  # not unique ownership, is what makes an append free. See the handoff's own note.
  "appending_into_spare_capacity_allocates_nothing",
  "an_n_ary_concatenation_allocates_one_buffer",
  "an_immortal_string_is_never_written_freed_or_allocated_for",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-codegen (immortal literals)"
args = ["test", "-p", "mwl-codegen"]
tests = [
  # Item 20's codegen half -- `emit_const_str` used to call `mwl_str_new` on every EVALUATION, so a
  # literal in a loop allocated once an iteration. It is an address in the unit's data section now.
  # The name is the tree's: `mwl_runtime::counting_alloc` is that crate's own test build, so this
  # crate cannot count bytes at all and asserts POINTER IDENTITY instead -- which is the stronger
  # reading anyway, since two allocations cannot share an address.
  "a_string_literal_is_one_address_rather_than_an_allocation_per_evaluation",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-stdlib (callback keys)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  # Item 21 -- `map`/`filter`/`reduce`/`sort` render a decimal key per element and `call_closure`
  # drops it again when the callback declares one parameter. The arity is readable once, before the
  # loop. The second name covers `sort`'s own case: `preserveKeys = false` discards every key it built.
  "a_one_parameter_callback_synthesizes_no_key",
  "a_sort_that_renumbers_builds_no_keys",
]

[[check]]
kind = "cargo-named"
stage = "0 catch-up"
name = "mwl-stdlib (one write per result)"
args = ["test", "-p", "mwl-stdlib"]
tests = [
  # Item 22 -- `produced()` allocates a String and then copies it into an MwlStr, and `text()`
  # re-validates UTF-8 that ADR 0009 already guarantees. Both are the pattern the NEXT member copies,
  # which is the whole reason they are in this stage. Like item 17's, the second test is the
  # invariant rather than the behaviour.
  "a_str_member_allocates_its_result_once",
  "no_member_revalidates_a_string_argument",
]


# ---------------------------------------------------------------------------------------------------
