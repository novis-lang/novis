# ---------------------------------------------------------------------------------------------------
# Stage 0 -- `rule:security/launderer-answers-a-carrier`'s carrier rule, accepted 2026-09-02, after M4 reported `Core\Html` done. It is
# FIRST in this file because the run order inside a class is this file's order: an escaper that answers a
# plain `string` is escaped a second time by `rule:core-classes/html-auto-escape`'s sink, and every `Core\Html` case written
# before the return type changes is written against the wrong rule. Item 1 in loop-goal.md.
#
# The two guard tests below must EXIST and pass. The `nvs-types` one is the half that cannot be read off
# the registry: `.` admits a `Stringable` object, so "`Markup` has no concat row" is a claim about the
# language and not about a signature.
# ---------------------------------------------------------------------------------------------------
[[check]]
