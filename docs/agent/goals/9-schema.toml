# second query instead of refusing it. The held count is the *program's* own and says so in the fixture:
# no `Core` member answers what the connection is holding, so line 2 counts the rows this file has in
# hand and the connection's half of the promise is line 3. The fixture's source is written to produce
# these; they are not read off a first run.
