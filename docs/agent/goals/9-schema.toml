# Stage 6 -- the other four drivers, against real servers. MariaDB is a DISTINCT driver, argued at length
# in `rule:core-classes/db-one-api`'s Context and not a simplification to rediscover.
#
# Both of those servers now present the `certs` leaf PostgreSQL and MySQL do -- MariaDB by the same three
# flags, SQL Server through an `mssql.conf` its own compose comment explains -- so `tools/db-matrix.py`
# has an anchor to hand a client and both legs RUN. What they do not yet have is a driver: `MariaConn`
# and `MssqlConn` have no `connect`, so a leg reporting `ok` today asserts what the crate's cases reach
# without one. The remaining `n/a` is nothing; a leg that reports it again is a fixture regression.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "command"
stage = "1 floor"
name = "the five-driver matrix"
argv = ["python", "tools/db-matrix.py", "--all"]
want = ["mysql: ok", "mariadb: ok", "postgres: ok", "mssql: ok", "sqlite: ok"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-db (per-driver specifics)"
args = ["test", "-p", "nvs-db"]
tests = [
  # This name replaced `execute_many_uses_the_bulk_protocol_on_mariadb`, and the replacement IS the item:
  # `rule:core-classes/db-statement-members` now runs `executeMany` as N executions on every driver and argues at length why a
  # bulk command cannot reproduce what the loop lets a caller observe. The ADR wins over this file.
  # Do not restore the old name expecting `COM_STMT_BULK_EXECUTE` to appear -- read § 4 first, and
  # note that it names the one fact (does `BULK_UNIT_RESULTS` continue past a refusal?) that reopens it.
  "execute_many_on_mariadb_is_n_executions_and_not_the_bulk_command",
  "mariadb_returning_is_available_and_mysqls_is_not",
  # ADR 0051 § 4 named this case in advance so it would be answered by the test, not by convenience.
  "the_mariadb_auth_plugins_are_implemented_in_rust_or_refused_by_name",
]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the pool. § 13's reset is a SECURITY BOUNDARY, and a connection returned carrying one
# request's state is one request reading another's.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-db (the pool and its reset)"
args = ["test", "-p", "nvs-db"]
tests = [
  "the_pool_is_per_core_and_keyed_as_connect_and_open_key",
  "postgres_resets_without_losing_its_statement_cache",
  # § 13's asymmetry, which is the protocol's and not a choice: PostgreSQL's reset is a command list
  # picked to KEEP the statement cache, and the others reset through a primitive that drops it. Split
  # from `mysql_and_mssql_reset_through_the_protocol_and_lose_theirs`, which paired a landed half with
  # an unwritable one and so reported the whole claim open for twenty-five sessions. The MySQL half is
  # `crates/nvs-db/src/mysql.rs`'s, asserting `COM_RESET_CONNECTION` went out, that the cache emptied
  # with it, and that the same statement after it costs the prepare again; MariaDB's `reset` rides the
  # same `crate::mysql::reset_session`, so it is that function's case and not a second one.
  "a_reset_invalidates_the_statement_cache",
  # The MSSQL half, landed with the driver that made it writable: `crates/nvs-db/src/tds.rs`'s
  # `reset_session` and the `TdsPlan` cache it empties. MS-TDS spells the procedure as a header bit
  # rather than as a call, so what the test asserts is that `Status::RESET_CONNECTION` rode a message of
  # its own, that the cache emptied with it, and that the same statement then costs the prepare again.
  "mssql_resets_through_sp_reset_connection_and_loses_its_cache",
  "a_failed_reset_destroys_the_connection_rather_than_returning_it",
  "no_session_state_survives_a_return_to_the_pool",
  # The seam the four above cannot reach between them: `crates/nvs-db/tests/pool_reuse.rs` is an
  # integration test over a real server, and its assertion is `pg_backend_pid()` -- the identity of
  # the process on the other end, so an equal pid is one connection and not a second one that
  # answered as well. It runs on every leg and asserts only where `tools/db-matrix.py` pointed it at
  # a server, which is the skip rule the whole crate shares.
  "two_requests_on_one_core_share_one_connection",
  # The switch, asked the same question over the same socket: `pool = false` files nothing, so the
  # next request draws nothing and opens a backend of its own.
  "a_pool_that_is_off_hands_the_next_request_nothing",
  # The two bounds that decide what a pool *keeps*, over that same socket. `nvs-runtime`'s own cases
  # move a clock and count a store's entries over a `Fake`; what a server adds is that the retirement
  # and the release past `idle` are a **close**, so the next request is answered by a different
  # backend and the connection kept is the one released under the bound rather than the one past it.
  "a_connection_past_its_lifetime_is_not_the_one_the_next_request_draws",
  "a_release_past_the_idle_bound_closes_the_second_connection",
]

# § 13's other two bounds, from a program: `max` is a ceiling a request can *reach*, and `acquire` is
# how long reaching it costs before the refusal. Both are per core and neither is observable from
# `nvs-db`, which has no capability layer, no config block and no `Core\Db::connect` -- the ceiling is
# taken in `nvs-stdlib` before the handshake, so a fixture is the first place the two meet.
#
# The fourth line is the half elapsed time cannot reach: that the wait is a *park* and not a spin.
# The fixture asks for the held connection from inside a `Core\Task` child while a sibling child
# sleeps beside it, so a wait that kept the core would print how many milliseconds the two took in
# sequence instead of the verdict.
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/pool.nvs"
want = [
  "opened=1",
  "refused: waited `acquire` out, and named it",
  "usable=1",
  "parked: the core ran a sibling task while the request waited",
]

# ---------------------------------------------------------------------------------------------------
# Stage 8 -- ADR 0084's queue. The transactional-enqueue property is the reason for the whole design.
# ---------------------------------------------------------------------------------------------------

# `-p nvs-stdlib` and not `-p nvs-db`, which is where these names were first filed: what they assert
# is the statement roster in `crates/nvs-stdlib/src/queue.rs` -- `rule:core-classes/queue-storage-is-a-table`'s schema has one home
# and that is it -- and `rule:core-classes/db-crate-boundary` fixes the crate graph so that `nvs-db` cannot name `nvs-stdlib`
# at all, in a test target or anywhere else. `crates/nvs-stdlib/tests/queue.rs` sees both crates and
# runs the statements a worker runs; `tools/db-matrix.py`'s `SUITES` is what points it at a server
# beside `nvs-db`'s own suite, and with no `NVS_DB_MATRIX_DRIVER` set every case there skips.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (Core\\Queue)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # § 3 -- a job never exists for a row that was rolled back. This is the property, not a feature.
  "an_enqueue_commits_with_the_write_that_made_it",
  "a_rolled_back_write_leaves_no_job",
  # § 4-6.
  "claiming_is_skip_locked_shaped_on_every_backend_that_has_it",
  "a_visibility_timeout_returns_an_abandoned_job_to_the_queue",
  "retries_are_bounded_and_backoff_is_jittered",
  "an_exhausted_job_reaches_the_dead_letter_table_and_is_not_discarded",
]

[[check]]
kind = "command"
stage = "1 floor"
name = "nvs queue migrate prints both tables"
argv = ["{nvs}", "queue", "migrate", "--connection", "main", "--dry-run"]
want = ["jobs", "dead_letter"]

# The applying half, and it has to run before the fixture below: `examples/queue.nvs` pushes a row into
# `nvs_jobs`, and nothing else in this sweep creates that table. Order here is run order (a `0`-prefixed
# stage is the only thing that jumps the queue), so this block staying above that one is load-bearing.
# It is also the assertion that the command is idempotent, since the sweep runs it against a server the
# previous iteration already migrated -- every statement carries `if not exists`.
[[check]]
kind = "command"
stage = "1 floor"
name = "nvs queue migrate creates both tables"
argv = ["{nvs}", "queue", "migrate", "--connection", "main"]
want = ["jobs: applied", "dead_letter: applied"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/queue.nvs"
want = ["enqueued", "claimed 1", "ran", "retried", "dead-lettered"]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- what `nvs check` proves about a literal query, and the trace event.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (the literal-query diagnostics)"
args = ["test", "-p", "nvs-types"]
tests = [
  # § 10.
  "a_placeholder_count_mismatch_on_a_literal_is_a_diagnostic",
  "mixed_placeholder_styles_on_a_literal_are_a_diagnostic",
  "an_open_host_matching_no_grant_is_a_diagnostic",
  "a_two_statement_literal_query_is_a_diagnostic",
  # `rule:security/tainted-qualifier`'s own M8 item -- the pair that has to be checked together.
  "a_tainted_value_at_a_query_text_parameter_is_a_diagnostic",
  "the_same_tainted_value_at_a_bound_parameter_compiles",
  "a_tainted_settings_host_is_a_diagnostic_naming_assert_trusted",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-db (the span carries no value)"
args = ["test", "-p", "nvs-db"]
tests = ["a_query_span_contains_no_parameter_value_anywhere"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/db.nvs"
want = [
  "rows=3", "ada", "grace", "alan",
  # § 9's structured half: the four `Db\Row` readers whose answer is a class
  # instance the driver cannot build, so `nvs-stdlib` builds it out of the
  # components `PgColumn::scalar` hands over.
  "day=2024-03-05", "clock=13:45:30", "at=2024-03-05T13:45:30Z",
  "id=4f9d5e2c-1a3b-4c7d-8e9f-0a1b2c3d4e5f",
  "affected=1", "typed row ok",
  # The same five classes on the hydration side: a `#[Db\Derive]` field may be
  # declared as one, and the instance the driver's components built is checked
  # against it rather than refused.
  "typed day=2024-03-05",
  # § 8's kind on a real refusal: the primary key refuses a second write of row
  # 1, and the thrown `Db\DbError` carries the normalised case rather than
  # `23505`, so the `match` in the fixture is the branch an application writes.
  "kind=UniqueViolation",
  # And § 8's raw half beside it: `sqlState` is the code the server itself sent,
  # so the normalisation above is checked against the thing it normalised. This
  # line is PostgreSQL-specific by construction -- `23505` is that server's
  # unique violation, where MySQL's is `1062` -- which is the whole reason the
  # normalised `kind` exists and this property does not replace it.
  "sqlState=23505",
  # § 8's third raw value: the primary key the second write broke, by its own
  # name. `people_pkey` is PostgreSQL's default name for `people`'s primary key
  # -- the fixture never spells it -- so this line also pins that the driver
  # reports the server's `C` field rather than parsing it out of the message.
  "constraint=people_pkey",
  # § 8's fifth property, and the one that pins *which* spelling of the
  # statement rides the throw: the caller's, with `?` markers, rather than § 5's
  # rewrite of it into the `$1` this driver sent. A property of a normalised
  # error that read `$1` here and `?` on MySQL would be the vendor detail
  # `kind` exists to spare an application. The bound `1` and `"ada"` are absent
  # from it, which is the half of § 8 that is a security rule.
  "sql=insert into people (id, name) values (?, ?)",
]

# ---------------------------------------------------------------------------------------------------
# Stage 10 -- the corpus and the migration floor, and this is the second-largest jump in the program.
# The oracle build gained `mysqli`, `pgsql` and `sqlite3` on 2026-08-29, so the three APIs `rule:core-classes/db-one-api`
# replaces are now IN the inventory rather than a named hole beside it: 227 names, a fifth of the whole
# table, all of them this goal's. Modelled at 98%; the floor is 94.
# The `EVERY FLOOR IN THIS PROGRAM IS MEASURED` comment above derives the whole curve.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 1350
# The corpus is flat directories with a subsystem prefix on the *file* name, so `tests/conformance/db/`
# does not exist and never did; these names were drafted before that was settled. Three of the nine are
# also claims another check in this same file already measures, and a claim listed twice reads as open
# work forever while buying nothing:
#   * `a-two-statement-literal-query-is-refused` is stage 9's `a_two_statement_literal_query_is_a_diagnostic`.
#   * `an-enqueue-commits-with-the-write-that-made-it` and `an-exhausted-job-is-dead-lettered-and-not-discarded`
#     are stage 8's `an_enqueue_commits_with_the_write_that_made_it` and
#     `an_exhausted_job_reaches_the_dead_letter_table_and_is_not_discarded`, and neither is a claim a
#     `.nvst` case could ask: one needs two connections to one server, the other a worker loop.
cases = [
  "tests/conformance/core/db-a-prepared-statement-binds-by-name-and-by-position.nvst",
  # § 7's closure rolling back on a throw, with the nested level it also pins.
  "tests/conformance/core/db-a-sqlite-transaction-nests-as-a-savepoint.nvst",
  "tests/conformance/core/db-a-roll-back-survives-a-catch-of-throwable.nvst",
  "tests/conformance/core/db-a-typed-row-throws-naming-the-column.nvst",
  # `rule:security/sink-predicate`'s pair, the binding half included.
  "tests/conformance/core/db-query-refuses-a-tainted-statement-and-binds-one-freely.nvst",
  # `rule:core-api/shape-arms-are-disjoint`'s arm selection, of which a `host` written under `Driver::Sqlite` is the refusing half.
  "tests/conformance/core/db-settings-are-checked-against-the-one-arm-they-select.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 255

[[check]]
kind = "command"
stage = "1 floor"
name = "check-migration at 94%"
argv = ["python", "tools/check-migration.py", "--min", "94"]
want = ["inventory:", "classified:"]

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. A socket to a root isolate and back, and nothing else: no mount table, no
# routing, no response policy. Item 2 is stated as an item rather than assumed because a second isolation
# path makes Stage 9's state-bleed suite meaningless.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the connection seam)"
args = ["test", "-p", "nvs-server"]
tests = [
  # The ADR slot's own assertions: one polled future per connection, and not an executor.
  "a_connection_future_is_driven_by_block_on_over_the_parking_stream",
  "a_connection_never_blocks_the_core_it_runs_on",
  "no_task_is_spawned_to_serve_a_connection",
  # Item 2 -- goal 2's Isolate, not a second one.
  "a_request_is_the_root_isolate_of_a_request_tree",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (everything from outside is tainted)"
args = ["test", "-p", "nvs-types"]
tests = ["every_request_member_returning_outside_data_returns_it_tainted"]

# Item 4 -- the shapes that are rules rather than fields. Neither of these is a *type* question and
# neither ever could be: `method()` folding `HEAD` into `Get` is what a helper answers off an `Inbound`,
# and which host a request came from is decided before a program runs. Split rather than moved wholesale,
# because the name above really is `nvs-types`' -- it is a property of the registry's return types.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (a request line reports what a route table can match)"
args = ["test", "-p", "nvs-stdlib"]
tests = ["method_reports_get_for_a_head_request_and_is_head_carries_the_truth"]

# ADR 0097 § 6's forwarded walk: the effective scheme is `Scheme::Http` for every request until a
# *trusted* proxy asserts otherwise, and `trusted_proxies` is what decides whether a header may say so at
# all. Both names are this crate's -- the walk decides, and `serve_connection` hands its whole answer to
# the handler that builds the carrier (`nvs_runtime::Inbound::set_peer`), which is what
# `Core\Request::clientIp()` and `::scheme()` read back one crate up.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the peer, and who may speak for it)"
args = ["test", "-p", "nvs-server"]
tests = [
  "client_ip_and_scheme_come_from_the_peer_unless_a_trusted_proxy_asserted",
  "the_walks_answer_reaches_the_program_on_the_carrier",
]

# The manifest policy that has held since M0 and must survive hyper's arrival. `hyper` is not `tokio`;
# this is the check that keeps the distinction honest rather than assumed.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime (no async runtime)"
args = ["test", "-p", "nvs-runtime"]
tests = ["tokio_appears_in_neither_the_manifest_nor_the_lockfile"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the mount table. ADR 0097 § 3's globs expanded at boot, and § 4's five-step resolution.
# ---------------------------------------------------------------------------------------------------

# § 3's expansion is a configuration act and not a server one: it turns written blocks into resolved
# configuration, it is refused in the `E06xx` band beside every other `[server]` refusal, and it needs
# `nvs_config::resolve::Files` to be asked about a disk at all. `nvs_config::mount` is its home and
# `nvs_config::server::validate` runs the half of it that needs no disk, so both names live under
# this check rather than under the server one below.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-config (the mount table)"
args = ["test", "-p", "nvs-config"]
tests = [
  "a_mount_globs_is_expanded_against_disk_at_boot",
  # § 10 -- a mount that grows a limit has re-implemented the per-app block. What refuses one is a
  # key the block tree does not carry, so the claim is asserted where that tree is deserialized
  # rather than where a request is routed: `crates/nvs-config/tests/tree.rs`.
  "a_mount_carries_no_policy_of_its_own",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the table and the block)"
args = ["test", "-p", "nvs-server"]
tests = [
  "a_request_resolves_through_the_five_steps_in_order",
  "a_prefix_is_stripped_and_the_module_is_relocatable",
  "static_files_are_one_policy_in_both_deployments",
  # § 5, as amended by ADR 0106: an arithmetic against the memory budget, not a number someone picked.
  "max_in_flight_is_derived_from_the_memory_budget",
  "an_over_capacity_request_is_refused_with_503_before_it_is_allocated",
  "the_four_idle_timeouts_are_finite",
  "is_draining_answers_during_a_graceful_shutdown",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the response, and the sink binding. `rule:security/response-body-is-one-typed-member`'s five typed members, and § 3's table.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (mixing the two writers is an error)"
args = ["test", "-p", "nvs-types"]
tests = [
  "mixing_echo_with_a_typed_body_member_is_a_compile_error",
]

# § 4's other half is a *runtime* fact -- the one word a body member puts on the response head -- and
# `nvs_runtime::Ctx::declare_content_type` is where it lands. A `crates/nvs-types/tests/` case compiles
# source and reads diagnostics back, so no test there can watch a media type be declared: this name could
# never have run under `-p nvs-types` however § 4's table reads. Its home is the crate that owns the
# members, `crates/nvs-stdlib/src/response.rs`.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (each body member's own content type)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "each_body_member_sets_its_own_content_type",
]

# § 3's table is four rows and they are not one crate's. What *attaches* a sink is
# `nvs_host::Isolate`: an isolate handed a request takes the first row, every other one keeps the
# terminal sink -- so the isolate row is pinned where that `if` is, and the request row over a
# socket, which is the only place a request exists. The scheduled-script row has no home yet: ADR
# 0073's runner is not built, and until it is, a scheduled run *is* an isolate answering no request,
# which the `nvs-host` name below already pins. Restore the name when the runner lands rather than
# filing it against a crate that cannot start one.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the sink a request attaches, and the defaults)"
args = ["test", "-p", "nvs-server"]
tests = [
  # § 3 -- attached by a request and by nothing else.
  "the_html_sink_is_attached_by_a_request_and_by_nothing_else",
  # ADR 0074 §§ 1-4 -- with NOTHING configured. The shipped set is pinned twice on purpose: once
  # over the block that resolves it and once over the wire, which fail differently. The third name
  # is "set_header still wins", under the spelling the tree gave it.
  "nothing_configured_is_section_ones_shipped_set",
  "a_response_carries_section_ones_shipped_headers",
  "a_header_the_response_already_carries_is_left_alone",
  "cors_is_closed_with_nothing_configured",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (the sink every other context keeps)"
args = ["test", "-p", "nvs-host"]
tests = [
  "an_isolates_echo_takes_the_terminal_sinks_neutralization",
]

# ADR 0074 § 4's cookie is written by a `Core\Response` member, so its defaults are that member's
# and not the door's -- nothing in `nvs-server` is ever asked what a cookie's flags are.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (a cookie's defaults)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_cookie_is_secure_httponly_samesite_lax_by_default",
]

# The other half of a name that was a conjunction: "every response directive is runtime" is a
# question about the directive *registry* and `nvs-config` owns it -- one case over every `http.*`
# key a response reads, asserting the class rather than listing the keys.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-config (every http response directive is runtime)"
args = ["test", "-p", "nvs-config"]
tests = [
  "every_http_response_directive_is_runtime_class",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- routing, sessions, uploads.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (match once, at the door)"
args = ["test", "-p", "nvs-server"]
tests = [
  # ADR 0102 § 1 -- once, before the handler, travelling on the request.
  "a_request_is_matched_once_before_the_handler_and_route_returns_that_match",
  "the_csrf_check_and_the_route_label_read_the_match_rather_than_matching_again",
  # § 7 -- how one table serves many tenants. The door's half: the prefix step 2 stripped and
  # § 3's captures of the row that stripped it cross onto the carrier the isolate answers
  # (`nvs_server::mount::carry`).
  "a_mounts_captures_reach_the_request_the_handler_answers",
]

# § 7's other half, and it could never have been asserted in the check above: `tainted` is a
# qualifier on a registry row's signature, and `crates/nvs-server/Cargo.toml` names neither
# `nvs-stdlib` nor `nvs-types` -- the door writes two strings and has nothing to write a qualifier
# with. So one name was two claims: what the door carries, above, and what the member hands the
# program, here. `Core\Request::mount()` does not exist yet, and its open question is the return
# type -- § 7 spells a shape literal, `CoreTy::Shape` is a parameter-only spelling
# (`nvs_stdlib::registry`'s own doc: "no runtime representation of a shape appears anywhere"), and
# a `Ty::Shape` value erases to `Ty::Object`, so the member either gains a return-position shape or
# is spelled as an instance class the way `Core\Router\Match` already is.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (§ 7's mount, where the taint is declared)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "core_request_mount_answers_the_prefix_and_its_captures_as_tainted_strings",
]

# § 2's two answers were filed above, under `-p nvs-server`, and could not be asserted there: § 1 forbids
# the door to send either status ("the program may still serve the request however it likes, because
# nothing here dispatches"), and a door refusing a miss would refuse every request of a program that
# declares no `#[Route]` at all -- ADR 0077 § 5's opt-in rule inverted. The `404`/`405` decision is
# therefore a computation the *table* performs and the program sends, so the test asserts it where the
# walk is (`crates/nvs-runtime/src/routes.rs:573`) and names the statuses as what a sender does with the
# answer. `crates/nvs-server/src/route.rs` keeps § 1's half of the ADR and nothing of § 2.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime (§ 2's two answers, where the table computes them)"
args = ["test", "-p", "nvs-runtime"]
tests = [
  # § 2 -- a missing path and a refused verb are different answers.
  "no_methods_for_a_path_is_404_and_some_is_405_with_allow",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (session, and the tier it may not use)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # ADR 0059 § 4 -- a session that vanishes because a core evicted it is an authentication bug.
  "a_session_is_never_backed_by_the_local_cache_tier",
  "a_session_survives_a_request_landing_on_another_core",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (ADR 0105 -- what is landed)"
args = ["test", "-p", "nvs-stdlib"]
# THIS CHECK HOLDS ONLY NAMES THE TREE ALREADY HAS, and the one below holds only names it does not:
# a landed test bundled with unwritten ones reports nothing, so a session that writes one of the open
# names moves it up here in the same commit. That is what makes "did not run" mean work rather than
# filing.
tests = [
  # § 2 -- `filename` is the whole distinction between a file part and a form field, and the parse that
  # decides it is `nvs_stdlib::multipart` (`crates/nvs-stdlib/src/multipart.rs:635`).
  "a_part_is_a_file_part_iff_content_disposition_carries_a_filename",
  # § 1 -- lazy, and the one door: a part yielded from what arrived before the rest of the body failed,
  # and a count over the registry saying no second member answers a walk or a part
  # (`crates/nvs-stdlib/src/request.rs:3849`).
  "files_is_a_lazy_iterator_and_the_only_way_to_receive_an_upload",
]

# ADR 0105's surface is `Core\Request` and `Core\Request\Part`, and both live in `nvs_stdlib::request`.
# `crates/nvs-server/Cargo.toml` names four dependencies and `nvs-stdlib` is not among them, so no test
# that calls `files()` can run under `-p nvs-server` however end-to-end the claim reads. The server's own
# half of this ADR is § 5's refusal, which is the check after this one.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (ADR 0105 §§ 1-3 -- the walk, the part, and its consumers)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # § 1 -- the other half of "the only way in": there is no temp path to name and no `move_uploaded_file`
  # to call, which is asked of the registry's rosters rather than of a body.
  "there_is_no_temp_path_and_no_move_uploaded_file",
  # § 3 -- one part, three consumers, and each of them spends it.
  "a_part_is_consumed_by_read_all_by_iteration_or_by_save_to",
  # § 2 -- a part claiming no filename goes where `post()` will read it rather than to the caller.
  "a_non_file_part_is_buffered_into_post",
  # §§ 3, 6-8 -- exclusive with body and with files on one request, which `claim_body` decides
  # (`crates/nvs-runtime/src/ctx/inbound.rs:551`, wrapped at `crates/nvs-stdlib/src/request.rs:1194`).
  "body_stream_is_exclusive_with_body_and_with_files",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (ADR 0105 § 5 -- refused before an isolate exists)"
args = ["test", "-p", "nvs-server"]
tests = [
  # § 5 -- refused pre-dispatch when Content-Length already exceeds the cap. This one IS the server's:
  # it is answered at the door, before a program exists to ask anything of the body.
  "an_upload_total_over_the_cap_is_refused_before_dispatch",
]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/upload.nvs"
# A program leg answers no request, so a body's own facts -- how many parts, what a field was
# called, what a file claimed to be named -- cannot be among these: `Core\Request::files()` refuses
# where nothing is inbound (`rule:security/request-state-throws-in-an-isolate`), and that refusal is the first line here. The end-to-end
# half is the two `ADR 0105 §§ 1-3` checks above, which is where a real multipart body has
# somewhere to arrive from. What this leg pins is the surface a handler writes -- the walk, the
# launderer, `saveTo` -- plus § 4's `writeStream`, which a program *can* run.
want = ["no request", "streamed 10240 bytes", "escape refused", "removed"]

[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/session.nvs"
# A program leg is one run with no cookie round trip, so a visit counter rising *across requests* --
# `new session`, then `visits=1`, then `visits=2` -- is not something `nvs run` can ever print. That is a
# server fact, and the cross-request half is the two names in the `nvs-stdlib (session, and the tier it
# may not use)` check above, which is ADR 0059 § 4's rule and where `Core\Session` itself is still open
# work. What a program leg can pin is the carrier a session id rides on, and that is what this fixture
# runs: `rule:security/protocol-roster`'s ring is ordered, so a cookie sealed under the old key still opens across a
# rotation and is a forgery once that key is off the tail.
want = ["opened", "forgery refused", "opens across a rotation", "retired key refused"]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- what runs beside a request. Each of the three is a runtime half whose other half landed in
# an earlier goal, which is why none of them is a catch-up.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (schedule, deferred, metrics)"
args = ["test", "-p", "nvs-server"]
# ADR 0073's fleet half is deliberately not in this list, and that is a triage rather than an
# omission. `a_fleet_scoped_entry_fires_once_across_the_fleet_under_its_lease` stood here until the
# ADR's own *Verification* was read against it: "two hosts racing the same fleet-scoped interval
# produce exactly one run" is filed under **M8 (shared store)**, beside the lease's TTL-expiry
# bullet, while every M7 bullet in that same list is the ticker -- the clock, DST, overlap, the
# budget, and `nvs run` producing the identical fire. Two facts about the tree agree with the ADR.
# `crates/nvs-server/Cargo.toml` names `hyper`, `nvs-host`, `nvs-config` and `nvs-runtime`, so this
# crate cannot reach the store at all; and the store's whole wire is `Core\Cache`'s `put` and `get`
# (ADR 0059 § 2, `crates/nvs-stdlib/src/cache.rs`), neither of which is a compare-and-set, so no
# lease can be *taken* anywhere in the tree yet. Inverting the seam the way ADR 0139 § 4 inverts the
# session write-back -- an `fn` pointer through `nvs-runtime` -- would therefore carry an operation
# the store does not have, and widening the shared tier with an atomic acquire is an ADR-level
# decision this goal has no slot left for. The name belongs to whichever goal builds the shared
# store; the handoff's backlog carries it against ADR 0073 *Verification*'s M8 bullet. What M7 keeps
# of § 3 has landed instead: `[cache.shared] url` is that store,
# `nvs_config::schedule::configures_a_shared_store` reads it, and
# `a_fleet_scope_with_no_shared_store_refuses_the_boot` in `crates/nvs-config/tests/resolve.rs`
# holds both sides of the boot question.
tests = [
  # ADR 0073 § 5 -- a ROOT isolate, not a child of a connection.
  "a_schedule_entry_fires_as_a_root_isolate",
  # ADR 0072 §§ 6-7 is deliberately NOT here any more -- the two checks below are where it went
  # and why. Neither half of it is reachable from a crate that forbids `unsafe_code`.
  # ADR 0076 -- a trace id for EVERY request, sampled or not, and no probe on the measured path.
  "an_inbound_traceparent_is_continued_and_a_missing_one_is_generated",
  "a_trace_id_exists_whether_or_not_the_request_is_sampled",
  "the_default_metric_series_are_exported",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-codegen (ADR 0076 § 1 -- the export adds no site to the measured path)"
args = ["test", "-p", "nvs-codegen"]
# Moved off `-p nvs-server`, where it could not be honest. What § 1 forbids is an *effect* on emitted
# code -- "no probe site is added to the per-statement/per-call path `rule:testing/debug-probes` measures" -- and a probe
# site is something this crate emits; `crates/nvs-server/Cargo.toml` names neither `nvs-codegen` nor
# `nvs-ir`, so the door can see a header and a counter and never a site. The test that names the
# effect therefore lives beside `rule:testing/debug-probes`'s own probe fixtures and asserts the counts under § 2's trace
# identity against the same script without one, which is the shape that fails if either a new site is
# emitted to feed a series or the identity switches `rule:testing/debug-probes`'s sites on.
tests = ["no_probe_is_added_to_the_measured_path"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (ADR 0072 § 6 -- the connection ends, the request tree does not)"
args = ["test", "-p", "nvs-host"]
# Filed here rather than under `-p nvs-server`, where it stood until the seam was read. Two reasons,
# and the second is the one that would have cost a session: a registration is a `callable`, the only
# way to build one with no compiler in front of it is a leaked `ClassTable` carrying an `invoke`
# address, and `crates/nvs-server/Cargo.toml` inherits the workspace's `unsafe_code = "forbid"` on
# purpose (its own comment says why). And the connection never holds the request's context in the
# first place: a request is an isolate, its tree lives on the task `nvs_host::isolate` spawned, and
# what the connection does is join that task and then return. So the claim is about a task outliving
# the one that joined it -- the completion path that files the answer and the tree walk that cancels
# what a returning task left running are both this crate's.
tests = ["an_after_response_tree_outlives_its_connection"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-runtime (ADR 0072 § 7 -- max_concurrent counts trees)"
args = ["test", "-p", "nvs-runtime"]
# The other half of the same move. § 7's cap is a count of request trees per *core*, taken and given
# back by `Ctx::defer` and `Ctx::release_deferred_slot`, and the refusal is the `RuntimeError`
# `Core\Task::afterResponse` raises at the call site -- so the server contributes nothing to it, and
# a test filed there would sit one layer above the rule it asserts.
tests = ["the_deferred_queue_is_bounded_by_max_concurrent"]

# ---------------------------------------------------------------------------------------------------
# Stage 6b -- persistent connections. ADR 0083 whole: a connection is a ROOT isolate opened by a request
# that then ends, `receive()` is the one wait over the peer and its topics, and `Core\Topic` closes a
# slow subscriber rather than blocking a publisher. The entry rule is `rule:security/isolate-shares-nothing`'s and lands first at
# `spawn script`, which is why the first check here is not in nvs-server.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (`rule:security/isolate-shares-nothing` -- an isolate's entry is a path or a static method)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "spawn_script_runs_a_static_method_reference_in_a_fresh_isolate",
  "spawn_script_binds_args_to_the_entrys_parameters_by_name",
  "an_fn_literal_is_refused_as_a_spawn_target_naming_the_method_form",
  "a_callable_typed_variable_is_refused_as_a_spawn_target",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (ADR 0083 §§ 1 and 5 -- the upgrade, and the request that ends)"
args = ["test", "-p", "nvs-server"]
tests = [
  # § 1 -- a root isolate, and the request that upgraded it ends normally.
  "an_upgrade_opens_a_root_isolate_and_the_upgrading_request_ends",
  "the_upgrading_requests_arena_is_released_while_the_connection_is_open",
  "a_connection_isolate_cannot_read_the_upgrading_requests_state",
  # § 5 -- SSE is the same isolate with no receive.
  "sse_is_a_connection_isolate_with_no_receive",
]

# Split off the check above on 2026-09-05, and what decides which half a test is in is what crosses the
# boundary. § 1's hand-over is a `nvs_runtime::script::Program` and an already-crossed `Value` -- a
# boxed Rust closure and 16 bytes -- so a `-p nvs-server` test builds one by hand with no Novis
# compiler and no `unsafe`, which that crate forbids. §§ 2-3 are `Core` members: an entry form the
# compiler interned, `receive()`'s wait over two sources and `send()`'s timeout. `crates/nvs-server/
# Cargo.toml` names `hyper`, `nvs-host`, `nvs-config` and `nvs-runtime` and not `nvs-stdlib`, so none
# of those four could ever have run where they were filed, however end-to-end the check's name reads.
# The playbook's "a `-p <crate>` check is *impossible* rather than unwritten" bullet is the one call
# that settles it.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (ADR 0083 §§ 2-3 -- the entry form, and the one wait)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # § 2 -- the entry rule is spawn script's, at a second site.
  "an_upgrade_by_static_method_is_the_same_isolate_as_an_upgrade_by_path",
  # § 3 -- one wait, two sources; null when the peer closed.
  "receive_answers_a_peer_frame_and_a_topic_delivery_from_one_wait",
  "receive_answers_null_when_the_peer_closes",
  "send_throws_on_the_send_timeout_rather_than_waiting",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
# Moved off `-p nvs-server` on 2026-09-05: every name here is a claim about `Core\Topic::publish`, which
# lives in `nvs-stdlib`, and `crates/nvs-server/Cargo.toml` does not name that crate -- so none of the four
# could ever have run where they were filed. The crossing between cores is `nvs_stdlib::bus` and the two
# threads a case spawns are what two cores are, so the server is not in the picture at all.
name = "nvs-stdlib (`rule:core-classes/topic` -- Core\\Topic, across every core)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_publish_reaches_a_subscriber_on_another_core",
  "a_published_value_is_a_copy_shared_with_nobody",
  # `publish_returns_the_number_of_subscribers_delivered_to` as the corpus took the name.
  "a_publish_reaches_every_subscriber_on_this_core_and_answers_how_many",
  # The load-bearing one: a stalled subscriber among many is closed and the publisher does not feel it.
  "a_subscriber_that_never_reads_is_closed_and_the_publisher_is_unaffected",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (ADR 0083 -- the qualifiers at the connection boundary)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_received_frames_payload_is_tainted_until_laundered",
  "a_tainted_topic_name_fails_to_compile",
  "a_secret_fails_to_compile_through_upgrade_args_or_publish",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (ADR 0083 § 7 -- bounds, budgets and drain)"
args = ["test", "-p", "nvs-server"]
tests = [
  # The four bullets a connection keeps with no unit in sight: the finite bounds, the budget close, the
  # contained panic and the drain. A `-p nvs-server` test builds its `nvs_runtime::script::Program` by
  # hand -- a boxed Rust closure -- which is exactly why these four could be written where they are and
  # the two below could not.
  "every_connection_bound_is_finite_with_nothing_configured",
  "a_connection_over_its_budget_is_closed_with_the_defined_code_not_oom",
  "a_connection_whose_isolate_panics_is_contained",
  "reload_and_shutdown_close_every_connection_after_the_drain",
]

# Split off the check above on 2026-09-05, and what decides the boundary is the same thing it did for
# §§ 2-3 and § 4: whether a compiled unit is in the picture. § 7's second bullet is the only one that
# needs one -- "a connection isolate holds the compiled unit it started with; an edit swaps the pointer
# for *new* connections" -- and `crates/nvs-server/Cargo.toml` names `hyper`, `nvs-host`, `nvs-config`,
# `nvs-runtime` and `jiff`: no front end, no backend, and a door that takes a handler closure rather than
# a path. So neither name below could ever have run where it was filed, however end-to-end it reads.
# `nvs-cli` is the one crate where both halves exist: `src/script.rs`'s `Compiler` is the tree's only
# in-memory unit table (`crates/nvs-cli/src/script.rs:118`), `src/serve.rs` mounts one unit per entry and
# resolves it per request, and this crate depends on `nvs-server`, so a case here drives a real upgrade
# over a real unit rather than over a closure standing in for one.
#
# BOTH NAMES ARE BLOCKED ON THE SWAP, and that is a slice rather than a filing question. `Compiler::
# compiled` compiles once per written path and never revalidates -- `script.rs`'s own module doc states
# "one unit per written path, kept for the process" as the policy -- `nvs_config::cache::UnitKey`, the
# `{ path, content_hash, env_hash }` ADR 0017's revalidation keys on, has no caller outside
# `nvs-config`'s own tests, and `[opcache] validate` / `revalidate_freq` deserialize in
# `nvs_config::tree` with nothing reading either. A test written against that tree would pass by
# pinning the *absence* of the bullet: everything keeps its unit across an edit when nothing can notice
# one. ADR 0017 § *Decision* steps 1-5 is the specification, and stage 7's own `hot reload` check is
# where the mechanism's three names already sit -- misfiled `-p nvs-server` by this same argument.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (ADR 0083 § 7 -- the unit a connection keeps, and the one a new connection gets)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # § 7's second bullet, one name per half: an open connection runs to completion on the code it began
  # with, and the connection opened after the edit gets the new unit. Two functions and not one, because
  # they are two claims about two connections -- unlike the drain's name above, which is one mechanism
  # under two spellings.
  "an_open_connection_keeps_its_compiled_unit_across_an_edit",
  "a_connection_opened_after_the_swap_runs_the_new_unit",
]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the operator's surface: the socket, the service, and hot reload.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the control socket)"
args = ["test", "-p", "nvs-server"]
tests = [
  # ADR 0078 §§ 3, 6.
  "the_control_socket_is_created_0600",
  "a_world_writable_socket_directory_refuses_the_socket",
  "reload_is_the_sockets_only_operation",
  "there_is_no_network_reachable_control_surface",
  # ADR 0078 § 5 -- a reload reports what it did AND what it could not do.
  "a_changed_boot_key_is_reported_and_does_not_take_effect",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (nvs service, and it fails closed)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # ADR 0093 -- the installer is a sink.
  "the_installer_refuses_a_subcommand_outside_the_serve_and_run_allowlist",
  "the_installer_refuses_a_relative_path",
  "the_installer_refuses_a_password_on_a_command_line",
  "the_installer_refuses_an_install_whose_output_would_go_nowhere",
  "the_installer_refuses_to_install_from_a_bundle",
  "a_windows_image_path_is_quoted_and_absolute",
  "a_systemd_unit_is_printed_and_written_only_on_install",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (hot reload)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # ADR 0017 -- swapped WITHOUT ever blocking a request-serving core. Both live
  # in `crates/nvs-cli/src/script.rs`, which IS the cache ADR 0017 § *Decision*
  # describes: `crates/nvs-server` resolves through that compiler and owns none
  # of its own, so neither claim has a spelling under `-p nvs-server`.
  "a_swap_never_blocks_a_request_serving_core",
  "revalidation_is_lazy_and_rate_capped",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-config (the validate default)"
args = ["test", "-p", "nvs-config"]
tests = [
  # ADR 0017's `validate` STARTUP default is an ADR 0091 § 3a row, chosen by the
  # run mode before any request exists. It belongs to whichever module reads
  # `[opcache]` -- `nvs_config::cache` -- and NOT to `nvs_config::mode`, whose
  # own doc says § 3a's startup rows are deliberately outside its table.
  "the_validate_default_is_selected_by_the_run_mode",
]

# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the testing surface the server unlocks. `rule:testing/inline-snapshots`, `rule:testing/db-transaction` and `rule:testing/in-process-request`.
#
# All four of these were filed `-p nvs-test` and not one of them could ever have run there:
# `crates/nvs-test/Cargo.toml` declares NO dependencies at all, on purpose -- a test runner that
# fails is indistinguishable from the thing it is testing failing -- so that crate holds the
# `.nvst` format and nothing that could build a request, a listener or a database. What
# implements all three ADR sections is `nvs_cli::runner`, which its own module doc calls the one
# place that can reach both halves at once: a checked program and a runtime context in one scope.
# Split into four so the ledger names which feature is still open rather than only the first.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's in-process request)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/in-process-request`: `Core\Test::request(...)` builds a request and runs it through ADR 0077's
  # compiled table and the real middleware chain -- no socket, no port. The synthetic request's
  # body and parameters arrive `tainted`, exactly as a real request's would.
  "test_request_dispatches_in_process_through_the_compiled_route_table",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's transaction)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/db-transaction`: `#[Test(db: "test")]` opens a transaction on the named connection before the
  # test and rolls it back after, so a transaction opened INSIDE the test is a savepoint. Needs
  # the same reachable PostgreSQL goals 4 and 5 need.
  "a_test_with_db_runs_inside_a_transaction_that_is_rolled_back",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (a test's ephemeral listener)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/in-process-request`'s second mechanism: `#[Test(server: true)]` starts a real listener on an
  # ephemeral port for the cases that genuinely need the wire. Two mechanisms are justified
  # there and the ADR says why, so this is not the row above under another name.
  "a_test_with_server_true_gets_an_ephemeral_listener",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (an inline snapshot's updater)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # `rule:testing/inline-snapshots`. The ASSERTION half has landed -- `Core\Test::assertMatchesInline` is a
  # registry row over `Core\Debug::render`'s text, with three `.nvst` cases. What this check
  # names is the UPDATER: `nvs test --update` splices the produced value into the source
  # literal, and nothing else ever writes to a test's own file. It needs the literal's SPAN,
  # which no runtime record holds -- `nvs_stdlib::test`'s helper doc comment owns the design.
  "an_inline_snapshot_updates_its_own_source_when_asked_and_never_otherwise",
]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the load-bearing assertions, and the parity program's last gate.
#
# Item 26 is ADR 0097's governing rule stated as a test rather than as a suite of attempted escapes: the
# set of paths the server can execute after boot EQUALS the expanded mount table. A traversal suite proves
# that the escapes somebody thought of are refused; this proves the set is closed.
# ---------------------------------------------------------------------------------------------------

# m7.md's core requirement is filed here rather than under `nvs-server`, and that is not a slip being
# tidied: ADR 0017's unit table is `crates/nvs-cli/src/script.rs` and there is no other in-memory cache of
# compiled units in the tree, so `-p nvs-server` could never have run either of these -- that crate's
# `Cargo.toml` names no crate that compiles a path, because the server is handed a program rather than
# resolving one. m7.md asks for the claim to be asserted "via a compile counter", which settles it: the
# test has to be able to see a compile, and only the crate holding the cache can.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-cli (the hot-reload claims)"
args = ["test", "-p", "nvs-cli"]
tests = [
  # The number the hot-reload design exists to make true, and the stall it must not buy it with.
  "ten_thousand_concurrent_cold_requests_compile_the_file_exactly_once",
  "no_request_stalls_while_the_file_is_compiled",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-server (the load-bearing assertions)"
args = ["test", "-p", "nvs-server"]
tests = [
  # Item 25 -- a PARAMETERISATION, not a second suite. If it is two suites, item 2 was not done.
  "the_state_bleed_suite_passes_within_a_request_and_across_an_isolate_boundary",
  # Item 26 -- the governing rule, as a set equality.
  "the_executable_path_set_after_boot_equals_the_expanded_mount_table",
  # ADR 0105's load-bearing case, asserted against a high-water mark.
  "a_multipart_body_far_over_the_memory_bound_is_received_at_bounded_resident_memory",
  # The three suites, and the disconnect case.
  "the_path_traversal_suite_passes",
  "the_header_injection_suite_passes",
  "the_request_smuggling_suite_passes",
  "a_client_disconnect_leaves_no_isolate_behind",
]

# `rule:security/isolate-teardown-is-a-drain-then-a-sweep`'s teardown sweep, under load -- item 31, added 2026-09-01. The whole memory story in one
# assertion: a request's cycles die with the request, so live bytes track in-flight work, never traffic.
# Filed `-p nvs-host` and not `-p nvs-server`, corrected 2026-09-05: a request IS the isolate, and the
# arena whose teardown this asserts is `nvs_host::isolate`'s child -- but the cycle has to be built by
# hand, `NvsObj::new` is `unsafe`, and `crates/nvs-server` inherits the workspace's `unsafe_code =
# "forbid"`, which no `#[expect]` can open. The two tests' own doc comments carry this.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-host (the memory floor)"
args = ["test", "-p", "nvs-host"]
tests = [
  "live_bytes_are_flat_across_a_cycle_building_soak",
  "a_request_that_builds_cycles_returns_its_bytes_at_teardown",
]

# `--record` points at the IGNORED `benches/results/`, not at the tracked `benches/serve.json`.
# This check runs after the session's commits, so a row appended to a tracked file is a change no
# slice owns, nothing ever stages it, and it sat in the working tree from goal 6 onwards -- long
# enough that the driver's own "path(s) left uncommitted" report counted a clean session as dirty.
# The tracked artifact is the figure a human records deliberately; docs/agent/commands.md
# § *The server's throughput* is the home for that split.
[[check]]
kind = "command"
stage = "1 floor"
name = "throughput against PHP 8.5 + FPM + opcache, recorded"
argv = ["python", "tools/bench.py", "--serve-vs-fpm", "--record", "benches/results/serve.json"]
want = ["requests/sec", "recorded"]

# The eight claims a request has to answer, as `.nvst` cases. Seven were drafted under a
# `tests/conformance/http/` directory the corpus never adopted -- it is flat directories with a
# subsystem prefix on the FILE name -- and the paths are corrected here, 2026-09-05, to the files that
# pin each claim. Three were already landed under the name the corpus took: the match a request carries
# is `an-in-process-request-carries-the-compiled-route-tables-own-match`, and the `404`/`405` pair is
# `methods-for-answers-nothing-for-an-unclaimed-path-and-every-verb-for-a-claimed-one`, whose own
# comment names the two answers as exactly those statuses. Five were written for this list.
#
# Two of them are pinned where a `.nvst` can be held to them rather than where the claim is worded.
# A session surviving a core is asserted at the BOOT -- `[session] backend = "local"` is refused, and
# ADR 0059 § 4 is the diagnostic's own note -- because a case running inside one request cannot be
# scheduled onto a second core, and a test that never happened to cross one would pass over a runtime
# that loses sessions in production. A deferred tree outliving its connection is asserted from the
# CALLER's side -- the answer is complete and carries none of the deferred bytes -- because the child's
# deferred output has nowhere left to go, which is the property itself.
[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "conformance"
args = ["test", "tests/conformance/"]
min_passing = 1450
cases = [
  "tests/conformance/core/a-request-value-arrives-tainted-and-is-laundered-to-be-used.nvst",
  "tests/conformance/core/a-head-request-matches-a-get-route-and-is-head-says-so.nvst",
  "tests/conformance/reject/mixing-echo-with-a-typed-body-member-is-refused.nvst",
  "tests/conformance/core/an-in-process-request-carries-the-compiled-route-tables-own-match.nvst",
  "tests/conformance/core/methods-for-answers-nothing-for-an-unclaimed-path-and-every-verb-for-a-claimed-one.nvst",
  "tests/conformance/core/an-upload-is-received-only-through-files.nvst",
  "tests/conformance/core/a-session-survives-a-request-on-another-core.nvst",
  "tests/conformance/core/an-after-response-tree-outlives-its-connection.nvst",
]

[[check]]
kind = "nvs-suite"
stage = "1 floor"
name = "differential"
args = ["test", "tests/differential/"]
min_passing = 275

# ---------------------------------------------------------------------------------------------------
# THE PARITY PROGRAM'S STOP CONDITION. Every one of the oracle build's 1151 functions and 253 types is a
# `member`, `language` or `dropped` row; every `member` row's member is registered; every one of them has
# a conformance case. When this goes green the chain has no next goal.
#
# It was 25% the day the program was scheduled. A count of conformance cases is a proxy for parity; a
# table that enumerates the source of truth is not.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "command"
stage = "1 floor"
name = "check-migration at 100% -- PARITY"
argv = ["python", "tools/check-migration.py", "--min", "100"]
want = ["100% covered"]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (every member row is real)"
