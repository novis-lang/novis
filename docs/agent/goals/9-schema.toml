  # A spread fills only a variadic tail (rule 5 of `map_arguments`), so "the positions it fills" IS that
  # tail's element type -- the test the crate has, under the name the rule gave it.
  "a_spread_argument_is_checked_against_the_tail_element_type",
  # The same two spellings through a `callable`, which has no signature to map them against at all:
  # `rule:types/closure-literal` refuses the name and admits the spread.
  "a_named_argument_through_a_callable_is_refused",
  "a_spread_argument_through_a_callable_is_accepted",
  # Item 10's diagnostic half landed as `nvs_types::locals::check_exit_level` (`E0475`), and no Rust
  # test names it -- `a-break-level-that-names-no-target-is-a-diagnostic.nvst` in the `nvs-suite`
  # check below owns it instead, over all five spellings the diagnostic refuses.
  # Item 17's other half, refused by decision rather than built (`rule:types/implicit-capture`).
  "an_array_element_passed_by_reference_is_diagnosed",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- assignment targets, `mixed`, and the rest of the conversion table.
#
# `hits=2,5` is item 21, `grid=93` item 22, `mixedSum`/`elem`/`flag` the three shapes of item 24 (arith-
# metic on a tag, a subscript through one, and `rule:expressions/truthy-positions`'s truthy table over a `?bool`), `top=point` item
# 25, `asInt`/`asString` and `converted=3` item 26's three rows -- of which `asInt` is a *branch*,
# `rule:types/conversion`'s grid giving a `bool` source the "anything -> `string`" row and no numeric one, so
# `$yes as int` is `E0708` where it is written and the fixture spells the predicate out loud.
# `converted=3` is the `array<T>` -> `array<U>` row, which that same grid makes a per-element *check*
# rather than a conversion -- so the fixture converts to `array<mixed>`, the one target every tag
# satisfies, and `as array<string>` over an `array<int>` would throw at element 0 instead.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "exact"
stage = "1 floor"
file = "examples/targets.nvs"
want = [
  "hits=2,5", "grid=93", "mixedSum=5", "elem=2", "flag=no",
  "top=point", "asInt=1 asString=1", "converted=3",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-ir (targets and tags)"
args = ["test", "-p", "nvs-ir"]
tests = [
  # A static property as an assignment target, the nested element write and the tag-dispatched
  # arithmetic are owned by the conformance cases of those names in the `nvs-suite` check below --
  # each landed with no `nvs-ir` test naming it, and each is an observable answer rather than a
  # lowering shape.
  "a_mixed_condition_dispatches_the_truthy_table_on_the_tag",
  "a_subscript_through_a_tagged_base_lowers",
  "the_object_top_type_erases_to_the_pointer_a_class_does",
  # `rule:types/conversion`'s `array<T> as array<U>` row -- an agreement over its four spellings, the free
  # `array<mixed>` target included, since that one is asserted by a count and not by a line.
  "an_array_conversion_walks_its_elements",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (targets and refusals)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 24 -- a `mixed` base defers the subscript to its tag (`rule:types/erased-member-access`), and every base whose
  # declared type has already answered keeps `E0482` where it is written.
  "an_array_index_through_a_mixed_base_defers_to_the_tag",
  "an_array_index_through_a_scalar_base_is_still_refused",
  # Item 23 -- every `rule:attributes/payload-is-a-compile-time-constant` compile-time constant is a legal *property* default, not just a
  # literal and `[]`. The parameter half is still a literal only, and `nvs_types::defaults`'s own
  # module doc owns why (the emitter would hand a `ConstArg::Int` to an enum-typed IR position).
  "a_property_default_accepts_every_compile_time_constant",
  # Item 28 -- a `Core` class stringifies where the spec gives it a `toString`, and is diagnosed at
  # the `echo` where it does not. Never a panic below.
  "a_core_class_stringifies_exactly_where_the_registry_says_so",
  # Item 26 -- both halves of `rule:types/conversion`'s `bool` source at once, since either alone reads as an
  # accident. `nvs-ir` has nothing to test: the row that runs is `Helper::BoolToString`, already
  # pinned by `conversions-that-succeed.nvst`, and the refused one never reaches that crate.
  "a_bool_converts_to_a_string_and_not_to_an_int",
  # `rule:types/arithmetic`'s arithmetic table closed at the operand end (`E0716`) and `%`'s missing `float`
  # row (`E0717`) -- together, what `emit_binop`'s operator catch-all used to be reachable through.
  "an_arithmetic_operand_with_no_row_is_a_compile_error",
  "a_float_modulo_is_a_compile_error",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the M4 features with no slice at all. Each is proved by a `.nvst` case rather than by an
# examples fixture: they are corpus-visible behaviour, Stage 8 counts the corpus, and the case is the
# artefact M4's own Verify paragraph asks for.
# ---------------------------------------------------------------------------------------------------

# Items 30, 31, 32, 34 and 35 landed as `.nvst` cases rather than as cargo tests, so the two blocks
# that named them by cargo test name are gone and the cases below own them -- see
# guard-name-debt.md's cause 2. What is left here is the one item whose assertion a case cannot make.
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-stdlib (dump)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  # Item 33 -- `rule:errors/diagnostic-record`'s one record and its renderings. The record's own doc comment says why this
  # half cannot be a case: `--EXPECT-ERROR--` is how the runner is told a case should *fail*, so a
  # suite has no way to read standard error off a successful run. `rule:security/secret-qualifier`'s redaction row, which
  # that ADR's Verification section defers to M4 by name, is a case and is listed below.
  "a_dump_writes_to_the_diagnostic_channel_and_not_to_the_output",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-codegen (fatal locals)"
args = ["test", "-p", "nvs-codegen"]
tests = [
  # Item 36 -- a THROWN releases the frame's locals and a FATAL does not. The valgrind sweep cannot
  # see this: `examples/fatal.nvs` is on its skip list, because it exits non-zero by design.
  "a_fatal_releases_the_frames_locals",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the checker and the front end. Nothing here is a panic below the checker; each is a program
# the checker accepts and should not, or refuses without saying which rule.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (narrowing and reachability)"
args = ["test", "-p", "nvs-types"]
tests = [
  # Item 37 -- three of `rule:types/unions-and-mixed`'s four spellings, and the residue no longer restricted to a class.
  "an_instanceof_test_narrows_its_subject",
  "a_comparison_against_a_literal_narrows_its_subject",
  # Item 38. The `match (true)` arm is a case rather than a cargo test, and so is the reachability
  # half's accepting side. The refusal half landed as `E0739`: `nvs_types::returns` decides whether a
  # path reaches the end of a body, and `tests/returns.rs` pins it and every shape it must not report.
  "a_non_void_function_must_return_on_every_path",
  "a_switch_with_default_and_a_break_in_every_case_assigns_definitely",
  "a_trys_finally_assignment_reads_fine_after_it",
  # Item 39. The refusal lives in `expr/calls.rs`'s private
  # `reject_arguments_to_implicit_constructor`, and `tests/classes.rs` now calls it.
  "a_class_constant_folds_and_an_enum_case_narrows",
  "an_implicit_constructor_is_held_to_zero_arguments",
  # Item 40
  "a_disjoint_equality_does_not_compile",
]

[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-syntax (the last unparsed shapes)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  # Item 42 -- each of these parses or is refused by a diagnostic that names its rule. A generic
  # parse error is not a refusal; loop-goal.md § What "no holes" means says why.
  "a_grouped_use_parses_or_names_the_rule_that_refuses_it",
  "goto_is_diagnosed_but_still_parses",
  "shape_type_parses_in_every_declaration_slot",
  "an_enum_case_named_with_a_keyword_parses",
]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- `rule:testing/test-attribute`'s `#[Test]`. Last, because it is the only stage that adds a surface rather than
# closing a hole, and because every assertion in its roster is written against Stage 0's operator table.
# `.nvst` and `#[Test]` answer different questions and are never unified (that ADR § 23); `nvs-test` is
# built and is not this item.
# ---------------------------------------------------------------------------------------------------
[[check]]
kind = "cargo-named"
stage = "1 floor"
name = "nvs-types (the test table)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_test_attribute_builds_a_table_of_its_cases",
  "a_fixture_attribute_builds_a_roster_keyed_by_what_it_returns",
  "each_test_with_is_a_row_folded_in_parameter_order",
]

# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the corpus and the guards. `nvs test <dir>` must exit 0 AND print an "N passed, M failed"
# summary: a suite that silently collected nothing exits 0 too. These run once, not per leg.
#
# `cases` is the `.nvst` twin of `cargo-named`: each file must exist, run, and not be skipped. Most do
