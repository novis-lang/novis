[context]

modules = [
  # The vocabulary, the four emitters, the five introspectors and the diff. `schema.rs` is created by
  # stage 2, so orient.py warns that this line matches it only once it exists.
  "crates/nvs-db/src/schema.rs",
  # `Dialect` is already four values for five drivers, and the emitters follow it rather than `Driver`.
  "crates/nvs-db/src/sql.rs",
  # What a connection is, and the `Driver` the grade table is keyed on beside its server version.
  "crates/nvs-db/src/conn.rs",
  # The four hand-written MIGRATION_* lists stage 7 retires, and the guard test over them.
  "crates/nvs-stdlib/src/queue.rs",
  # `quoteIdentifier`'s judgement, which the identifier rule reuses rather than restating.
  "crates/nvs-stdlib/src/db/open.rs",
  # `Core\Db\Schema` and its plan types are registered here.
  "crates/nvs-stdlib/src/registry.rs",
  # `nvs queue migrate`, which stage 7 rewrites, and where `nvs schema` is wired in beside it.
  "crates/nvs-cli/src/queue.rs",
  "crates/nvs-cli/src/main.rs",
]

rules = ["0067", "0084", "0024", "0051", "0082", "0132", "0063", "0117", "0005"]

# 0067 whole -- its Revisiting item is what this goal closes, and its § 9 type map is the vocabulary
# read in the other direction. 0084 § 2 for the schema this goal takes over. 0082 § 7 for the design
# that stays blocked.
adrs = ["0067", "0084", "0082"]

shapes = ["A `Core` member — the five edits", "An ADR", "A `.nvst` test case", "A commit message"]

playbook = [
  'Writing Novis itself > core is',
  'Tooling > a core class',
  'Running things > adding a',
  'Running things > target/release/nvs.exe is',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole adr',
  'Tooling > a plan field is patched',
  'Tooling > plan.py --get',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Every backend, because stage 5's round-trip property is asserted against every backend. Same compose
# file and the same memoization as goal 5, whose driver checks the floor also carries.
[docker]
compose = "tests/db/compose.yaml"
services = ["mysql", "mariadb", "postgres", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib/src/queue.rs", "tests/db"]

# The `certs` service's CA, where `nvs.toml`'s `[db.main] tls_ca_file` names it. Gitignored and
# regenerated with its volume, so it is copied rather than committed -- goal 5's block, verbatim.
[docker.copy]
"tests/db/ca.crt" = "postgres:/certs/ca.crt"


