# Goal 122 -- the tools are one typed program over structured records, and every Markdown file a person reads is rendered from them
# The acceptance test, as data.
#
# `122-tooling-overhaul.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# Every check here states the END state, because the whole list runs again when the goal ends and is
# every later goal's floor from then on. The stage-internal proofs -- `bun nv import --check` and
# `bun nv parity <group>` -- compare against the legacy files and the Python tools this goal deletes,
# so they are session tools and never acceptance checks.

files = [
  # No fixture of this goal's own: every check is a named Rust test or a command over the tree. The
  # switch unions the previous goal's list into this one, so the key is what has to be here.
]

[context]

modules = [
  # The driver: the memo, `COMMAND_READS`, `plain_crate_test`, `observed_inputs`, the dossier half.
  "tools/loop.py",
  # The pack, the manifest merge, the playbook ranking, the playbook<->orient import cycle.
  "tools/orient.py",
  # The wrap: its sections, its gates, the handoff and plan splices.
  "tools/session.py",
  # The steps, the test pool, `RUST_TEST_THREADS`, the doc-test job.
  "tools/verify.py",
  # The tiers and `STEP_READS`; the card tier is added here.
  "tools/verify_keys.py",
  # Per-binary keys, `common()`, `--explain`; `--probe` goes where this goes.
  "tools/impact.py",
  # The roster, `--verify`, `--bless`, `current_binary`, `binary_key`, `impl_hash`, the generator.
  "tools/dossier.py",
  # Renumbering, the number gate, `--new`, and the front-matter bug at `--set`.
  "tools/chain.py",
  # The goal reader: front matter, `position: last`, side goals, `.loop/chain.json`.
  "tools/goals.py",
  # The floor copy this goal replaces with a view.
  "tools/goal-switch.py",
  # Bullets, `[until:]`, `--check`, `--dupes`, `--retire`; the triage tool's predecessor.
  "tools/playbook.py",
  # Rule JSON, fragments, chapters, citations.
  "tools/rules.py",
  # Record front matter, `changes:`, section citations.
  "tools/records.py",
  # The status block, the milestone table, `Carried by`.
  "tools/plan.py",
  # The bounded-units test.
  "crates/nvs-cli/src/script.rs",
]

# The rules the proof and key work is written inside. Stage 12 adds the rulebook edits it makes.
rules = [
  "testing/feature-proofs",
  "testing/member-perf-ledger",
  "core-api/reference-card",
]

adrs = []

shapes = ["A commit message", "A code comment"]

milestones = []

playbook = [
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a commit',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `122-tooling-overhaul.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' own `stage = "..."` labels, which may group several prose stages under one
# acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.4]
# The importer reads every legacy home, so it needs the shapes that describe them.
shapes = ["A rule fragment", "A decision record", "A playbook bullet", "A status-block field", "Citing a document"]

[context.stage.7]
# The perf-currency paragraph is rewritten whole, and one record states why.
shapes = ["A rule fragment", "A decision record", "Feature proofs — an example, an attack, a bench, a `covers:` marker"]

[context.stage.10]
shapes = ["A playbook bullet"]

[context.stage.12]
shapes = ["A rule fragment", "A decision record", "A playbook bullet", "A status-block field", "Citing a document"]

# The environment tables of the chain goal this one follows. The floor carried in from it drives a
# database and a cache, so the daemon is preflighted before this goal's first session; none of this
# goal's own checks needs it.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs", "examples/cache-shared-tls.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-db", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the Rust and Cargo cuts. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the Rust and Cargo cuts"
name = "the bounded-units test runs two hundred edits"
args = ["test", "-p", "nvs-cli", "--bin", "nvs", "units_held_stay_bounded"]
tests = [
  "units_held_stay_bounded_after_two_hundred_edits",
]

[[check]]
kind = "command"
stage = "2 the Rust and Cargo cuts"
name = "a crate with no doctest does not run rustdoc's test harness"
argv = ["git", "grep", "-n", "-F", "doctest = false", "--", "crates/nvs-stdlib/Cargo.toml", "crates/nvs-types/Cargo.toml"]
want = ["crates/nvs-stdlib/Cargo.toml:", "crates/nvs-types/Cargo.toml:"]

[[check]]
kind = "command"
stage = "2 the Rust and Cargo cuts"
name = "the workspace has a proof profile"
argv = ["git", "grep", "-n", "-F", "[profile.proof]", "--", "Cargo.toml"]
want = ["Cargo.toml:"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the foundation. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 the foundation"
name = "the tools type-check and their tests pass"
argv = ["bun", "nv", "selftest"]
want = ["nv selftest: the types check", "nv selftest: every test passes"]

# ---------------------------------------------------------------------------------------------------
# Stages 4 and 9 -- the records are the one home, and what a person reads is rendered from them.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "4 the records"
name = "every record is valid and every reference resolves"
argv = ["bun", "nv", "check"]
want = ["nv check: 0 findings"]

[[check]]
kind = "command"
stage = "4 the records"
name = "every rendered file is what the records render"
argv = ["bun", "nv", "render", "--check"]
want = ["render: every generated file is current"]

[[check]]
kind = "command"
stage = "4 the records"
name = "the chain order is one list of slugs"
argv = ["git", "ls-files", "data/chain.json"]
want = ["data/chain.json"]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the read-only tools. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 the read-only tools"
name = "brief routes a topic to the file that owns it"
argv = ["bun", "nv", "brief", "--where", "testing"]
want = ["docs/rules/testing.md"]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- one key for what a check reads, the keystone. Goal prose stage 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 one key"
name = "every probe in the table holds, each with a rerun and a keep list"
argv = ["bun", "nv", "impact", "--probe"]
want = [
  "test-module",
  "self-included-test-module",
  "card",
  "stdlib-code",
  "syntax-code",
  "host-code",
  "embedded-chapter",
  "driver-tool",
  "new-example",
  "editor",
  "impact probes: every probe holds",
]

[[check]]
kind = "command"
stage = "6 one key"
name = "a `--bin` test check is answered from verify's record"
argv = ["bun", "nv", "why", "nvs-cli script (units held stay bounded after many edits)"]
want = ["source: verify record"]

[[check]]
kind = "command"
stage = "6 one key"
name = "the conformance suite is answered from verify's record"
argv = ["bun", "nv", "why", "conformance (Core by name)"]
want = ["source: verify record"]

[[check]]
kind = "command"
stage = "6 one key"
name = "the fuzz target is keyed on the crates it uses"
argv = ["bun", "nv", "why", "the prefix fuzz target finds no panic in five minutes"]
want = ["source: package key", "nvs-syntax", "nvs-diagnostics", "fuzz/"]

[[check]]
kind = "command"
stage = "6 one key"
name = "ThreadSanitizer is keyed on the packages its script builds"
argv = ["bun", "nv", "why", "ThreadSanitizer is clean over nvs-host and nvs-runtime"]
want = ["source: package key", "nvs-host", "nvs-runtime", "tools/tsan.sh"]

# ---------------------------------------------------------------------------------------------------
# Stage 7 -- proofs in one pass, on a fast build. Goal prose stage 7.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "7 proofs"
name = "one proofs run verifies several groups"
argv = ["bun", "nv", "proofs", "--verify", "--group", "lang:types", "--group", "types:exception"]
want = ["lang:types", "types:exception", "nothing owed", "0 failed"]

[[check]]
kind = "command"
stage = "7 proofs"
name = "a floor proofs check is keyed on what it read"
argv = ["bun", "nv", "why", "proofs: lang:types"]
want = ["source: observed"]

# ---------------------------------------------------------------------------------------------------
# Stage 8 -- the writers and the driver. Goal prose stage 8.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "8 the driver"
name = "the chain is walkable, and its order is by slug"
argv = ["bun", "nv", "chain", "--check"]
want = ["chain: every goal is walkable"]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the cutover left nothing behind. Goal prose stage 9.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "9 the cutover"
name = "no goal file carries a number, and no copy of the live goal is tracked"
argv = ["bun", "nv", "audit", "goals"]
want = ["audit: no goal file carries a number", "audit: no copy of a goal's files is tracked"]

[[check]]
kind = "command"
stage = "9 the cutover"
name = "no check runs Python, and no check, directive or tool says dossier"
argv = ["bun", "nv", "audit", "checks"]
want = ["audit: no check runs python", "audit: nothing says dossier"]

[[check]]
kind = "command"
stage = "9 the cutover"
name = "every tracked text file is LF"
argv = ["bun", "nv", "audit", "eol"]
want = ["audit: every tracked text file is LF"]

# ---------------------------------------------------------------------------------------------------
# Stage 10 -- the playbook triage. Goal prose stage 10.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "10 the playbook"
name = "every bullet names a file and expires by a condition the tree decides"
argv = ["bun", "nv", "playbook", "--check"]
want = ["playbook: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "10 the playbook"
name = "a session is served the traps for the files it names"
argv = ["bun", "nv", "orient", "--traps", "tools/nv/main.ts"]
want = ["ranked from the whole playbook"]

# ---------------------------------------------------------------------------------------------------
# Stages 11 and 12 -- no Python, and nothing names it. Goal prose stages 11 and 12.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "11 CI, the website and the hooks"
name = "CI, the website and the git hooks run bun and nothing parses the data twice"
argv = ["bun", "nv", "audit", "ci"]
want = ["audit: no workflow or hook calls python", "audit: no website script parses a record"]

[[check]]
kind = "command"
stage = "12 no Python"
name = "no Python file is tracked beyond the launch shims, and no document names a Python tool"
argv = ["bun", "nv", "audit", "python"]
want = ["audit: no Python file is tracked beyond the launch shims", "audit: no document names a Python tool"]
