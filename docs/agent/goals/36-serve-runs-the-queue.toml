# Goal 36 -- `nvs serve` runs the queue's workers, and the drain stops them.
# The acceptance test, as data.
#
# `36-serve-runs-the-queue.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  "examples/queue.nvs",
]

[context]

modules = [
  # Stages 2 and 3 -- the workers, their stop condition, and `start`'s signature, which already
  # takes everything `serve.rs` holds.
  "crates/nvs-cli/src/worker.rs",
  # Stage 3 -- where the ticker is armed, three lines above where the workers go. The shape to copy,
  # and the `TaskRoot` NOT to copy.
  "crates/nvs-cli/src/serve.rs",
  # Stage 3 -- how `run_run` reads `queue_for` off the snapshot and calls `start`. The half that
  # already exists.
  "crates/nvs-cli/src/main.rs",
  # Stage 2 -- `Draining::is_draining` is the whole of what a worker needs, and the type's own doc
  # owns who may write the bit.
  "crates/nvs-server/src/serve.rs",
  # Stage 4 -- the table `queue` is missing from entirely; `lookup` answers Option and no row
  # governs it.
  "crates/nvs-config/src/directive.rs",
  # Stage 4 -- `queue_for` and `QueueBounds`, which is what a Boot carry would have to preserve.
  "crates/nvs-config/src/queue.rs",
  # Stage 4 -- where a changed `Boot` key is carried forward and named rather than applied.
  "crates/nvs-config/src/snapshot.rs",
  # Stage 3 -- `run_until_idle`'s report, whose `parked` is why a worker that ignores the drain is a
  # server that cannot be stopped.
  "crates/nvs-host/src/scheduler.rs",
]

rules = [
  "concurrency/one-process-serves-requests-schedules-and-jobs",
  "concurrency/who-runs-a-job-is-configuration",
  "core-classes/queue-storage-is-a-table",
  "0004",
]

adrs = []

shapes = ["A commit message", "A `.nvst` test case"]

milestones = ["M7:verify"]

playbook = [
  'Writing Novis itself > core is',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',
  'Running things > adding a',
  'Running things > target/release/nvs.exe is',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `36-serve-runs-the-queue.md`, holding what only that stage
# needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces. Every entry here is one this goal's own
# prose already names under that `## Stage N` heading; the base keeps what no single stage owns.
#
# These are the PROSE stage numbers, not the `[[check]]` blocks' `stage = "..."` labels, which may
# group several prose stages under one acceptance line. loop-authoring.md section 2 is the whole
# of it.
# ---------------------------------------------------------------------------------------------------

# Section 2 is the drain as the stop condition, and the drain rule is what a claimed job's
# run-to-completion is the same contract as.
[context.stage.2]
rules = ["http-server/the-server-block-is-boot-class", "concurrency/a-drain-closes-a-connection-cleanly"]
adrs = ["0154 §2"]

# Sections 1, 3 and 4: where it is armed, on which core, and why no lease.
[context.stage.3]
rules = [
  "concurrency/claiming-is-one-statement",
  "config/a-fleet-entry-fires-at-most-once-under-a-lease",
  "http-server/containment-does-not-end-at-the-helper",
  "config/a-scheduled-run-is-a-root-isolate",
]
adrs = ["0154 §1", "0154 §3", "0154 §4"]

# Section 5 is the four rows and their split.
[context.stage.4]
rules = [
  "config/reloadability-is-its-own-field",
  "config/three-changeability-classes",
  "config/a-reload-names-what-it-could-not-apply",
  "config/the-config-is-an-immutable-snapshot",
]
adrs = ["0154 §5"]

# Section 6 is why the name stays and the sentence changes. The rule is what makes a rename expensive.
[context.stage.5]
rules = ["packaging/a-service-is-one-stored-argv"]
adrs = ["0154 §6"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# This goal's own checks run a served process against a real queue, so both halves need the daemon --
# its own and goal `queue-purge`'s floor.
# This goal's own checks run a served process against a real queue, so it needs the daemon in its
# own right and not only for its floor.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the drain stops a worker, and `nvs run` is unchanged. ADR 0154 section 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the stop"
name = "nvs-cli (a worker reads the drain, and a run's worker still reads the script's exit)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "a_worker_handed_a_draining_handle_returns_at_the_top_of_its_next_turn",
  "a_worker_with_a_claim_in_flight_finishes_the_job_before_it_returns",
  "a_run_stops_its_workers_when_the_scripts_task_exits_exactly_as_before",
  "the_two_binaries_share_start_and_differ_in_one_predicate",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the arming. ADR 0154 sections 1, 3 and 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the arming"
name = "nvs-cli (serve arms the count once, with the worker's own task root)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "serve_arms_queue_workers_from_the_boot_snapshot_before_the_accept_loop_is_spawned",
  "an_armed_worker_holds_task_root_worker_and_not_the_tickers_request",
  "workers_is_armed_once_per_instance_and_never_once_per_core",
  "a_tree_with_no_queue_block_arms_no_worker_and_spawns_no_task",
  "workers_zero_arms_no_worker_and_is_not_an_error",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- `[queue]` joins the directive table. ADR 0154 section 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 the directives"
name = "nvs-config (four rows, System throughout, split Boot and Reload)"
args = ["test", "-p", "nvs-config"]
tests = [
  "every_queue_key_has_a_directive_row_and_lookup_answers_for_all_four",
  "connection_and_workers_are_boot_and_max_attempts_and_visibility_are_reload",
  "every_queue_row_is_system_class",
  "a_reload_that_changes_workers_carries_the_running_value_and_names_the_key",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the sentence. The name does not change.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 the help"
name = "nvs-cli (`serve --help` names all three subsystems and the command is still `serve`)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "the_serve_help_names_requests_schedules_and_queue_workers",
  "the_command_is_still_spelled_serve_and_service_is_still_the_other_namespace",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the fixture and the bounded shutdown case.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 served"
name = "nvs-cli (a job pushed to a served process is claimed, runs, and the process still exits)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "a_job_pushed_to_a_server_with_one_worker_reaches_succeeded",
  "a_served_process_with_workers_exits_within_its_deadline_once_the_drain_begins",
]

[[check]]
kind = "exact"
stage = "6 fixture"
file = "examples/queue.nvs"
want = [
  "enqueued",
  "claimed 1",
  "ran",
  "retried",
  "dead-lettered",
]

[[check]]
kind = "nvs-suite"
stage = "6 suites"
name = "the conformance tree"
args = ["test", "tests/conformance/"]

[[check]]
kind = "nvs-suite"
stage = "6 suites"
name = "the differential tree"
args = ["test", "tests/differential/"]
