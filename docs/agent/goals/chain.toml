# The chain stops adding surface here and starts closing what is behind it. The dossier writes no proof: it
# fires `dossier.py --emit-goals --append-chain` at this file, so ADR 0134's roster -- one goal per group
# of features owing four proofs -- lands on the end of the chain the driver is already walking, and
# `Chain.refresh()` in loop.py walks into it without a restart. Everything after goal 50 is generated;
# nothing after it is hand-written, and it is last because a proof is only worth writing over a feature
# that has stopped moving.
#
# **Numbered 50 rather than 21 on purpose**, leaving 21-49 free: a goal's number is its identity in
# every file that cites it, and `dossier.py`'s emitter numbers what it appends from `max(number) + 1`
# (`append_to_chain`), so the generated goals are 51 onward however many hand-written entries land in
# front of them. Inserting a new goal before this one therefore costs one `[[goal]]` block and nothing
# else -- which is not what it cost when this entry was 20 and every insert renumbered it.
[[goal]]
name = "50 dossier"
md = "docs/agent/goals/50-dossier.md"
toml = "docs/agent/goals/50-dossier.toml"
handoff = "docs/agent/goals/50-dossier.handoff.md"
milestone = "dossier"
# Its own check is one Python command. Its floor is goals 4-19, which is where the containers are.
preflight = "docker"
