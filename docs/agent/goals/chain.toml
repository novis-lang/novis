# The parity program's goal order, read by `python tools/loop.py --chain docs/agent/goals/chain.toml`.
#
# On GOAL REACHED the driver takes the next entry, runs `tools/goal-switch.py` against it so the goal that
# just passed becomes its floor, copies it into `docs/agent/loop-goal.md`/`.toml`, seeds the handoff from
# the entry's own `.handoff.md`, commits that switch, and starts the next session. README.md in this
# directory is the contract; this file is only the order.
#
# The order is a dependency chain, not a preference. `Core`'s pure half is what everything is written
# against; the reactor is what a socket, a driver and a listener all need; capabilities are what every
# capability-bearing member is gated on; the databases and the rest of Part II sit on both; the server
# sits on all of them.

[[goal]]
name = "1 core-depth"
md = "docs/agent/goals/1-core-depth.md"
toml = "docs/agent/goals/1-core-depth.toml"
handoff = "docs/agent/goals/1-core-depth.handoff.md"
milestone = "M4S"

[[goal]]
name = "2 concurrency"
md = "docs/agent/goals/2-concurrency.md"
toml = "docs/agent/goals/2-concurrency.toml"
handoff = "docs/agent/goals/2-concurrency.handoff.md"
milestone = "M5"

[[goal]]
name = "3 governance"
md = "docs/agent/goals/3-governance.md"
toml = "docs/agent/goals/3-governance.toml"
handoff = "docs/agent/goals/3-governance.handoff.md"
milestone = "M6"

# The first of the two goals with an external precondition, and the cheaper one: only its stage 6 needs a
# container, the Redis `Core\Cache`'s coherent tier and `Core\RateLimit`'s limiter both open. The
# preflight is here rather than at that stage because a run that reaches stage 6 six hours in and only
# then discovers there is no daemon has spent the six hours.
[[goal]]
name = "4 core-part-ii"
md = "docs/agent/goals/4-core-part-ii.md"
toml = "docs/agent/goals/4-core-part-ii.toml"
handoff = "docs/agent/goals/4-core-part-ii.handoff.md"
milestone = "M8"
preflight = "docker"

# The second, and the one it costs the most: ADR 0067 verifies four of the five drivers against real
# servers, so the driver preflights a reachable Docker daemon before this goal's first session and stops
# the run naming it rather than grinding against a check that cannot pass.
[[goal]]
name = "5 database"
md = "docs/agent/goals/5-database.md"
toml = "docs/agent/goals/5-database.toml"
handoff = "docs/agent/goals/5-database.handoff.md"
milestone = "M8"
preflight = "docker"

[[goal]]
name = "6 server"
md = "docs/agent/goals/6-server.md"
toml = "docs/agent/goals/6-server.toml"
handoff = "docs/agent/goals/6-server.handoff.md"
milestone = "M7"

# Post-parity: ADR 0131's temporary-directory sweep. It rides the same chain after the program's gate
# because its server half — the post-response sweep and the boot orphan sweep — needs the `nvs-server`
# goal 6 creates. Docker preflight because its floor carries goals 4-6's container-backed checks.
[[goal]]
name = "7 temp-sweep"
md = "docs/agent/goals/7-temp-sweep.md"
toml = "docs/agent/goals/7-temp-sweep.toml"
handoff = "docs/agent/goals/7-temp-sweep.handoff.md"
milestone = "post-parity"
preflight = "docker"

# Post-parity: `Core\Program::id()` — the program fingerprint the freeze/thaw design needs and userland
# gets. One member over hashes the artifact cache already computes; the smallest goal on the chain.
# Docker preflight because its floor carries goals 4-7's container-backed checks.
[[goal]]
name = "8 program-id"
md = "docs/agent/goals/8-program-id.md"
toml = "docs/agent/goals/8-program-id.toml"
handoff = "docs/agent/goals/8-program-id.handoff.md"
milestone = "post-parity"
preflight = "docker"

# Post-parity: `Core\Db\Schema`, closing ADR 0067's own *Revisiting* item. It is last for a reason that
# is not tidiness. Its acceptance property — apply a schema, introspect it back, get an empty plan —
# needs every driver finished, and SQLite has no connection path before goal 5 ends. And its stage 7
# retires `nvs queue migrate`'s four hand-written dialect lists, which goal 5 writes and freezes the
# output of: those checks ride in as this goal's floor and are what proves the replacement, so the
# throwaway DDL is the oracle rather than duplicated work. Docker preflight, and unlike goals 7 and 8
# it brings up every server — the round-trip property is asserted on all five backends.
[[goal]]
name = "9 schema"
md = "docs/agent/goals/9-schema.md"
toml = "docs/agent/goals/9-schema.toml"
handoff = "docs/agent/goals/9-schema.handoff.md"
milestone = "post-parity"
preflight = "docker"

# Post-parity: ADR 0136's typed `callable`. Last on the chain because it is the only entry that reaches
# the front end -- `nvs-syntax` through `nvs-codegen` -- and every goal before it writes callbacks whose
# rows this one rewrites; running it earlier would mean converting the same registry rows twice. Docker
# preflight because its floor is goal 9's, which brings up every backend.
[[goal]]
name = "10 typed-callable"
md = "docs/agent/goals/10-typed-callable.md"
toml = "docs/agent/goals/10-typed-callable.toml"
handoff = "docs/agent/goals/10-typed-callable.handoff.md"
milestone = "post-parity"
preflight = "docker"

# Post-parity: ADR 0137's doc comments. After goal 10 because both reach the front end and goal 10's
# signature work is the larger edit there, and because its stage 2 builds ADR 0099 s1's trivia layer --
# M4B's own tree item, landing early because a doc comment cannot be read without it. M4B then starts
# with that half done. Docker preflight because its floor is goal 10's.
[[goal]]
name = "11 doc-comments"
md = "docs/agent/goals/11-doc-comments.md"
toml = "docs/agent/goals/11-doc-comments.toml"
handoff = "docs/agent/goals/11-doc-comments.handoff.md"
milestone = "post-parity"
preflight = "docker"

# M4B, as four goals. It is order 6 of the milestone table and it sits here because everything it reads
# is now built: goal 11 landed the trivia layer, goal 10 the typed `callable`, and the request set is
# written against a language that can open a file and reach a database. The split is by file set, the
# way the parity program's was -- no manifest names both a parser module and a TypeScript tree.

# The tree half ADR 0099 s1 still owes: the `SyntaxIndex` and explicit recovery, plus the one home for a
# position (`utf16_col`/`offset_of`), the section lexer `.lspt` will share, and `nvs ast --json`.
# Everything after it is unwritable without this, which is why it is first.
[[goal]]
name = "12 resilient-tree"
md = "docs/agent/goals/12-resilient-tree.md"
toml = "docs/agent/goals/12-resilient-tree.toml"
handoff = "docs/agent/goals/12-resilient-tree.handoff.md"
milestone = "M4B"
preflight = "docker"

# The two M1 items scheduled after M4 and never taken -- ADR 0098's pipeline operator and ADR 0124's PHP
# 8.6 refusals. Here rather than anywhere else because goal 15's grammar must colour `|>` and `let`/`is`
# as things Novis REJECTS, and `|>` stops being one the moment 0098 lands. A grammar written against a
# surface that changes two goals later is written twice.
[[goal]]
name = "13 surface"
md = "docs/agent/goals/13-surface.md"
toml = "docs/agent/goals/13-surface.toml"
handoff = "docs/agent/goals/13-surface.handoff.md"
milestone = "M1"
preflight = "docker"

# `crates/nvs-lsp`: nine standard requests, one of Novis's own (ADR 0101's `nvs/redactions`) and two code
# actions, over `lsp-server` and `lsp-types` with no async runtime. Its stage 3 builds the `.lspt` case
# and `nvs lsp-test` BEFORE any handler, because this is the first thing the loop verifies that no
# program prints.
[[goal]]
name = "14 lsp-server"
md = "docs/agent/goals/14-lsp-server.md"
toml = "docs/agent/goals/14-lsp-server.toml"
handoff = "docs/agent/goals/14-lsp-server.handoff.md"
milestone = "M4B"
preflight = "docker"

# `editors/vscode` -- the first non-Rust source in the repository, and the last entry of M4B's four. Two
# TextMate grammars, the client, the Tasks and their problem matcher, the AST panel, `secret`
# concealment, and the extension-host tier that is memoized and never gates an iteration.
[[goal]]
name = "15 editor"
md = "docs/agent/goals/15-editor.md"
toml = "docs/agent/goals/15-editor.toml"
handoff = "docs/agent/goals/15-editor.handoff.md"
milestone = "M4B"
preflight = "docker"

