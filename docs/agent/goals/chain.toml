# it writes shapes whose spelling this one widens; running it earlier would mean writing them twice. Its
# stages 4-5 are proven over goal 16's `.nvst` request sections and goal 17's builder, so both have to
# exist first.
[[goal]]
name = "18 input-shapes"
md = "docs/agent/goals/18-input-shapes.md"
toml = "docs/agent/goals/18-input-shapes.toml"
handoff = "docs/agent/goals/18-input-shapes.handoff.md"
milestone = "M7"
