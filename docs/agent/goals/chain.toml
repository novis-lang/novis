handoff = "docs/agent/goals/17-test-request.handoff.md"
milestone = "M8"
preflight = "docker"

# ADR 0140's one converter from `array<mixed>` to a declared shape, and the two `Core\Request` members
# over it -- which is what stops a request reader's answer being `mixed`. Last because its stage 2 is
