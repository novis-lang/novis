# The parity program's goal order, and the only chain there is: `python tools/loop.py` reads this file
# always, not behind a flag.
#
# On GOAL REACHED the driver takes the next entry, runs `tools/goal-switch.py` against it so the goal that
# just passed becomes its floor, copies it into `docs/agent/loop-goal.md`/`.toml`, seeds the handoff from
# the entry's own `.handoff.md`, commits that switch, and starts the next session. README.md in this
# directory is the contract; this file is only the order.
#
# The order is a dependency chain, not a preference. `Core`'s pure half is what everything is written
# against; the reactor is what a socket, a driver and a listener all need; capabilities are what every
# capability-bearing member is gated on; the databases and the rest of Part II sit on both; the server
# sits on all of them.

[[goal]]
name = "1 core-depth"
md = "docs/agent/goals/1-core-depth.md"
milestone = "M4S"
retired = true

[[goal]]
name = "2 concurrency"
md = "docs/agent/goals/2-concurrency.md"
milestone = "M5"
retired = true

[[goal]]
name = "3 governance"
md = "docs/agent/goals/3-governance.md"
milestone = "M6"
retired = true

