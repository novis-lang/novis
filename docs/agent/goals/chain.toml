# goal 6 creates. Docker preflight because its floor carries goals 4-6's container-backed checks.
[[goal]]
name = "7 temp-sweep"
md = "docs/agent/goals/7-temp-sweep.md"
toml = "docs/agent/goals/7-temp-sweep.toml"
handoff = "docs/agent/goals/7-temp-sweep.handoff.md"
milestone = "post-parity"
preflight = "docker"

