# Goal 172 -- the description is owed. The acceptance test, as data.
#
# GENERATED by `python tools/dossier.py --emit-goals` -- do not hand-edit; re-run it.
# The sibling `.md` is the prose. One home each.

files = [
  # The fixtures this goal's own checks name. goal-switch.py unions the previous goal's
  # list into this one, so an empty list is fine -- the key is what has to be here, and
  # written across lines so the carried entries land in it rather than beside it.
]

[context]

modules = [
  "docs/examples/README.md",
  "tools/data/dossier-policy.toml",
  "tools/dossier.py",
]

rules = ["testing/feature-proofs", "testing/a-failing-proof-is-fixed-or-recorded", "0134", "0026", "0117", "0004", "0088"]

adrs = ["0134", "0079 §15"]

shapes = [
  "A `.nvst` test case",
  "Feature proofs — an example, an attack, a bench, a `covers:` marker",
  "A commit message",
]

playbook = [
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > another agent',
  'Writing a test case > a rule*',
  'Writing a test case > a -p*',
  'Running things > target/release/nvs.exe is',
]

plan = ["Open now", "Blocking"]

# The environment tables of `docs/agent/goals/71-dossier.toml`, the goal this one was
# appended behind: a generated goal runs that goal's whole acceptance list as its
# floor, so it needs the same containers and the same WSL target. Regenerated,
# never hand-edited.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs", "examples/cache-shared-tls.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-db", "tests/db"]

