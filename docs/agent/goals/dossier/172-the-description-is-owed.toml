[[check]]
kind = "command"
stage = "2 the description is owed"
name = "dossier: the description is owed and the whole roster owes nothing"
argv = ["python", "tools/dossier.py", "--gate"]
want = ["nothing owed in the whole roster", "hostile, about"]

