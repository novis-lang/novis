plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `35-editor-surfaces.md`, holding what only that stage needs.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# `nvs ast --json`'s frozen schema is the shape both of stage 2's take.
rules = ["ide/ast-json-schema-is-frozen"]

[context.stage.6]
# The one home for what a region gets and what it must never get.
rules = ["ide/a-template-region-gets-services-but-no-second-formatter"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's, not this goal's own: nothing here touches a database.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- the contributed-and-unanswered set. This runs red the day it is written and is what
# stops the next id being added and forgotten for a milestone. Goal prose stage 0.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "0 the catch-up"
name = "every contributed command is registered, and every setting is read"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "test:headless"]
want = ["grammar:", "contributions:", "protocol:", "0 failing"]

# `contributions:` gains the two assertions: every id in `contributes.commands` is registered by
# `activate`, and every key in `contributes.configuration` is read by the client or forwarded to the
# server. `nvs.lsp.debounce` is the one that fails both today.

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone: the two CLI surfaces. Rust checks, because both are the CLI's own output
# and neither needs an editor to be wrong. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the cli surfaces"
name = "check --json is the diagnostic record, and the text renderer is unchanged"
args = ["test", "-p", "nvs-cli"]
tests = [
  "check_json_emits_one_record_per_diagnostic_the_text_renderer_prints",
  "check_json_carries_the_code_span_severity_help_and_suggestions",
  "the_default_rendering_is_still_text",
]

[[check]]
kind = "cargo-named"
stage = "2 the cli surfaces"
name = "the test report locates every test, and can list without running"
args = ["test", "-p", "nvs-cli"]
tests = [
  "every_json_test_record_carries_its_declaring_file_and_line",
  "the_listing_mode_discovers_without_executing",
  "the_schema_version_is_two_and_junit_and_human_are_byte_identical",
]

# ---------------------------------------------------------------------------------------------------
# Stages 3-6 -- the client. One headless suite, `editors/vscode/test/surfaces/`, which
# `scripts/headless.mjs` discovers and prints as `surfaces:`. No editor: a Task's `problemMatcher` is
# a regex over recorded output, and a region request is a protocol answer. Goal prose stages 3-6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 the tasks"
name = "vscode (headless, with the surfaces suite)"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "test:headless"]
want = ["grammar:", "contributions:", "protocol:", "surfaces:", "0 failing"]

# `surfaces:` covers the problemMatcher against a recorded `nvs check` rendering with a real
# `error[E0301]` and its `-->` line; the AST panel's shell-out shape against a recorded
# `nvs ast --json`; the Test Explorer's discovery and run over recorded stage 2 output, including a
# failure becoming a test item's message; and the region client asking for `nvs/regions` and
# forwarding nothing outside a returned span.

[[check]]
kind = "nvs-suite"
stage = "6 the regions"
name = "the regions request is frozen as a case like every other answer"
args = ["lsp-test", "tests/lsp/"]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- and the formatter that must not appear. Goal prose stage 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 the regions"
name = "no formatting reaches a template region from either side"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "the_server_declares_no_formatting_provider",
  "a_region_answer_carries_a_span_and_a_language_and_nothing_else",
]

# ---------------------------------------------------------------------------------------------------
# The reference chapter, which stops naming what this goal answered. Goal prose stages 3-6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the regions"
name = "the one-file referen