# Goal 35 -- The extension answers everything it contributes
# The acceptance test, as data.
#
# `35-editor-surfaces.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# A `command` check is not a PROGRAM_KIND, so it runs ONCE between the legs rather than per leg.
# That is right here for the same reason it was right for goals 15 and 33: a TypeScript client has
# no calling convention, and the WSL leg exists for the one thing that does.

files = [
  # carried from the previous goal by tools/goal-switch.py; this goal names none of its own.
]

[context]

modules = [
  # The three unanswered ids at :62, and where stages 3-5 register their answers.
  "editors/vscode/src/extension.ts",
  # The frozen roster. Stage 3 adds `taskDefinitions` and `problemMatchers`; every id is added,
  # never renamed.
  "editors/vscode/package.json",
  # How a new suite directory becomes a ledger line: discovery, and the `name:` it prints.
  "editors/vscode/scripts/headless.mjs",
  # The dependency allowlist -- the reason a Test Explorer parses JSON the CLI already emits
  # rather than pulling a reporter library in.
  "editors/vscode/test/contributions/contributions.test.ts",
  # `json_document` at :1653 -- the schema stage 2 takes to version 2, and the two formats it
  # must leave untouched.
  "crates/nvs-cli/src/runner.rs",
  # `Command::Check`'s flags, and the front end whose diagnostics stage 2 renders a second way.
  "crates/nvs-cli/src/main.rs",
  # The `Diagnostic` record `--json` writes: code, span, severity, help, suggestions.
  "crates/nvs-diagnostics/src/lib.rs",
  # `TokenKind::InlineHtml` at :356 -- the span stage 6's regions request projects.
  "crates/nvs-syntax/src/lexer.rs",
  # The chapter stage 6 extends, and its § *What it does not do* this goal shortens.
  "docs/reference/tools/40-editor.md",
]

# The rules this goal implements. Every one of them is already landed; none is amended here.
rules = [
  "ide/tasks-carry-a-problem-matcher",
  "ide/contributions-are-frozen-and-only-ever-added",
  "ide/the-ast-panel-shells-out-to-the-cli",
  "ide/ast-json-schema-is-frozen",
  "ide/check-json-is-the-diagnostic-record-as-a-document",
  "ide/the-extension-builds-no-ui-the-editor-already-has",
  "ide/a-template-region-gets-services-but-no-second-formatter",
  "tooling/fmt-is-never-a-diagnostic",
  "ide/every-feature-is-staged-behind-its-dependency",
  "errors/renderings",
  # Stage 5 runs the case tree through the same explorer; this is what says the corpus is a roster
  # rather than a declaration.
  "ide/lspt-coverage-is-inferred",
]

adrs = []

shapes = ["A commit message", "A decision record", "A rule fragment"]

milestones = ["M10"]

playbook = [
  # This goal's own file set.
  "Tooling > editors/vscode/package.json's contributes",
  'Tooling > tools/verify.py runs',
  'Tooling > a textmate',
  'Writing a test case > a -p nvs-cli test',
  'Writing a test case > a test that asserts',
  'Tooling > a cargo-named acceptance',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
