# New refcount edges -- `allocate`'s array, a `Text`'s runs, the `*Info` and `Core\Ast\*` instances,
# a spawned child's handle -- and no cycle shape among them, so nothing is added to the skip list. A
# slice that adds a retain/release edge runs valgrind over its own cases (commands.md).
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's. None of this goal's own checks needs a daemon; the floor is goal `m8-db-queue`'s whole
# list, which carries the five-driver matrix and every container-backed check before it. The driver
# stops the run before the first session when the daemon is absent.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


