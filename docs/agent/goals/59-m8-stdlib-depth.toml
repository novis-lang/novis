# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the record: `array<T>` reads covariantly. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the record"
name = "the array rule states the covariant read the record decided"
argv = ["python", "tools/rules.py", "--show", "types/arrays"]
want = ["covariant"]

[[check]]
kind = "cargo-named"
stage = "2 the record"
name = "an array of a narrower element type is accepted where a wider one is read, and a write through it is still checked"
args = ["test", "-p", "nvs-types"]
tests = [
  "an_array_of_a_narrower_element_type_is_accepted_where_a_wider_one_is_read",
  "a_covariant_array_argument_is_not_restamped_at_the_call",
  "a_write_through_a_widened_array_view_is_checked_against_its_element_type",
]

[[check]]
kind = "nvs-suite"
stage = "2 the record"
name = "a string array reaches an int-or-string parameter, and Arr::flip takes one"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/lang/an-array-of-string-is-passed-where-an-array-of-int-or-string-is-read.nvst",
  "tests/conformance/core/arr-flip-takes-an-array-of-string-without-a-conversion.nvst",
]

