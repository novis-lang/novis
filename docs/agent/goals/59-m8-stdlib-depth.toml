# Goal 59 -- every class M8 names is as deep as its spec section
# The acceptance test, as data.
#
# `59-m8-stdlib-depth.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No example of its own: every stage is proven by a `.nvst` case or a named Rust test, and the
  # floor's examples are unioned in by goal-switch.py.
]

[context]

modules = [
  # `is_assignable` (:60), where `array<A>` widens to `array<B>`. Stage 2.
  "crates/nvs-types/src/expr/assign.rs",
  # `Core\Decimal`'s two rows today (:54-75) and its gap (:36-45). Stage 3.
  "crates/nvs-stdlib/src/decimal.rs",
  # The four `float` rounding members whose gap (:32-42) becomes a decision. Stage 3.
  "crates/nvs-stdlib/src/math.rs",
  # `decode_field`'s type roster and gap 1 (:128-143). Stage 5.
  "crates/nvs-stdlib/src/json.rs",
  # The codec erasure to `CodecTy::Opaque`, gap 1 (:44-71). Stage 5.
  "crates/nvs-types/src/derive.rs",
  # `Core\Reflect` (:112), `ClassInfo` (:293) and gaps 1-3 (:73-91). Stage 6.
  "crates/nvs-stdlib/src/reflect.rs",
  # `Core\Ast` and gaps 1 and 3 (:46, :60). Stage 7.
  "crates/nvs-stdlib/src/ast.rs",
  # Which productions are nodes -- the table the typed roster is derived from. Stage 7.
  "crates/nvs-syntax/src/walk.rs",
  # `Core\Cli\Text` (:1941) and gap 2 (:135-145). Stage 8.
  "crates/nvs-stdlib/src/cli.rs",
  # `Core\Out::capture`'s `{through:}` and its gap (:34-42). Stage 8.
  "crates/nvs-stdlib/src/out.rs",
  # The floor's uncaught-throw record (:94). Stage 9.
  "crates/nvs-runtime/src/floor.rs",
  # The model and its renderings; the HTML one is added beside `plain` and `json`. Stage 9.
  "crates/nvs-render/src/lib.rs",
  # `Core\Debug::dump` and gap 3 (:77-83). Stage 9.
  "crates/nvs-stdlib/src/debug.rs",
  # `DISPATCH_ROSTER` (:115), where a streaming reader and a `compareTo` row are listed. Stage 10.
  "crates/nvs-stdlib/src/instance.rs",
  # `Core\Csv` and gap 1 (:128). Stage 10.
  "crates/nvs-stdlib/src/csv.rs",
  # `Core\IO\File` (:1270) and `Core\IO\Lines` (:1627), the handle and the precedent. Stage 10.
  "crates/nvs-stdlib/src/io.rs",
  # The heap's three orderings and its gap (:40-47). Stage 10.
  "crates/nvs-stdlib/src/heap.rs",
