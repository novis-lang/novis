  "types/class-reference-variance",
  "types/conversion",
]
shapes = ["A decision record", "A rule fragment", "Citing a document"]

[context.stage.3]
rules = ["types/decimal", "types/arithmetic"]
adrs = ["0054 §3", "0054 §4"]
shapes = ["A `Core` member — the five edits", "A `.nvst` test case"]

[context.stage.4]
