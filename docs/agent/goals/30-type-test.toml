# Goal 30 -- `is` tests a value against a type.
# The acceptance test, as data.
#
# `30-type-test.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  "examples/type-test.nvs",
]

[context]

modules = [
  # Stage 0 + 2 -- `parse_instanceof` is where `is` already sits as a refusal, and where it becomes a
  # parse. The precedence slot does not move.
  "crates/nvs-syntax/src/parser/expr.rs",
  # Stage 2 -- `ExprKind::Conversion` is the node to copy: `as` already parses `expr <kw> Type`.
  "crates/nvs-syntax/src/ast.rs",
  # Stage 2 -- `parse_type`, which is the right-hand side. Not `parse_pipe`.
  "crates/nvs-syntax/src/parser/ty.rs",
  # Stage 0 -- the reserved set goal 13 put `is` into. `let` stays; `is` stops being refused here.
  "crates/nvs-syntax/src/token.rs",
  # Stage 3 -- `infer_instanceof` is the sibling AND the trap: its `!can_hold_an_object` refusal is
  # the reasoning that must NOT be copied. ADR 0150 section 6.
  "crates/nvs-types/src/expr/members.rs",
  # Stage 3 -- where the new node is checked and folded, beside the conversion arm.
  "crates/nvs-types/src/expr/mod.rs",
  # Stage 4 -- the four narrowing spellings this becomes the fifth of.
  "crates/nvs-types/src/locals.rs",
  # Stage 3 -- E0810/E0811/E0812. The E04xx and E07xx type bands are full; E08xx is the live one.
  "crates/nvs-diagnostics/src/lib.rs",
  # Stage 5 -- lowering, beside the conversion and instanceof arms whose walks are reused.
  "crates/nvs-ir/src/lower/expr.rs",
  # Stage 5 -- the tag comparison, and the descriptor walk already emitted for instanceof.
  "crates/nvs-codegen/src/emit.rs",
]

# 0150 is the design. 0124 is the reservation this goal is the other half of. 0007 is the type system
# the right-hand side is drawn from; 0047/0066 are narrowing; 0033 is the qualifier E0810 refuses;
# 0004 prices it.
rules = ["0150", "0124", "0007", "0047", "0066", "0033", "0004"]

# One entry per section: orient.py slices one heading per entry.
adrs = ["0150", "0150 section 6", "0150 section 9", "0150 section 10"]

shapes = ["A commit message", "A `.nvst` test case", "A diagnostic"]

playbook = [
  'Writing Novis itself > core is',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',
  'Running things > adding a',
  'Running things > target/release/nvs.exe is',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# This goal's own checks need no container -- a type test reads a tag. The daemon is its FLOOR's
# requirement, carried from goal 29.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone: one node, and the production `as` already has. `rule:types/type-test`.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 grammar"
name = "nvs-syntax (`is` parses a type, not an expression, and keeps its precedence slot)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  "is_parses_its_right_hand_side_with_parse_type_and_not_as_an_expression",
  "is_binds_at_the_same_level_as_instanceof_and_below_unary_not",
  "is_over_a_union_and_a_nullable_parses_as_one_type_and_not_as_a_comparison_chain",
  "is_no_longer_reports_the_reserved_word_refusal_and_let_still_does",
]

[[check]]
kind = "cargo-named"
stage = "2 grammar"
name = "nvs-syntax (a value where a type belongs is refused in the parser)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  "is_against_a_variable_is_e0812_and_its_help_names_instanceof",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the checker: total, and three refusals. `rule:types/type-test`, ADR 0150 section 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 checker"
name = "nvs-types (`is` is total: a knowable answer is not a diagnostic)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_statically_true_test_over_a_declared_type_checks_and_folds_to_true",
  "a_statically_false_test_over_a_declared_type_checks_and_folds_to_false",
  "neither_direction_reports_the_instanceof_subject_refusal",
  "a_test_over_a_union_member_and_over_a_non_member_both_check",
]

[[check]]
kind = "cargo-named"
stage = "3 checker"
name = "nvs-types (the three refusals, and the one it borrows)"
args = ["test", "-p", "nvs-types"]
tests = [
  "is_against_a_tainted_or_secret_qualifier_is_e0810",
  "is_against_void_or_never_is_e0811",
  "is_against_a_float_literal_reuses_the_literal_type_refusal_and_claims_no_new_code",
  "every_other_type_atom_is_accepted_on_the_right_of_is",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- narrowing, as the fifth spelling. `rule:types/narrowing`, ADR 0150 section 9.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 narrowing"
name = "nvs-types (`is` narrows the true edge alone)"
args = ["test", "-p", "nvs-types"]
tests = [
  "an_is_test_narrows_its_subject_on_the_true_edge",
  "an_is_test_does_not_narrow_the_false_edge_and_neither_does_instanceof",
  "a_write_inside_the_narrowed_block_widens_the_binding_again",
  "narrowing_never_changes_the_declared_type_of_the_binding",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- lowering and codegen: three shapes, no second walk.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 codegen"
name = "nvs-codegen (a tag test, the instanceof walk reused, and the array walk reused)"
args = ["test", "-p", "nvs-codegen"]
tests = [
  "a_scalar_test_emits_one_tag_comparison",
  "a_class_test_emits_the_same_descriptor_walk_instanceof_emits",
  "an_array_element_test_calls_the_same_walk_the_conversion_calls_and_not_a_second_one",
  "a_folded_test_emits_no_code_at_all",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the cases ADR 0150's Verification section names, and the reference heading.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "exact"
stage = "6 fixture"
file = "examples/type-test.nvs"
want = [
  "int=1",
  "uint=1",
  "int-of-uint=",
  "decimal=1",
  "string=1",
  "bytes-of-string=",
  "seven-is-int=",
  "seven-as-int=7",
  "narrowed=42",
  "class=1",
  "enum-case=1",
  "literal=1",
  "array-of-int=1",
]

[[check]]
kind = "command"
stage = "6 the reference"
name = "the `is` operator has a reference heading and a precedence row"
argv = ["python", "tools/reference.py", "--check"]

[[check]]
kind = "nvs-suite"
stage = "6 suites"
name = "the conformance tree"
args = ["test", "tests/conformance/"]

[[check]]
kind = "nvs-suite"
stage = "6 suites"
name = "the differential tree"
args = ["test", "tests/differential/"]
