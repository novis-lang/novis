# Goal 66 -- every gap the decision sheet answered is built to its answer
# The acceptance test, as data.
#
# `66-decided-closures.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# The gate is `owners.py --closes decided-closures`, not a count: goal `unowned-closures` was reached
# on `unowned: 0` with forty items tagged to it and none built, because a tag is what makes a count
# zero. The named tests below are the builds whose `Decided:` sentence leaves no choice; an item that
# is struck as a bound is proven by its item being gone, which `--closes` reads.

files = [
  # Every `examples/*.nvs` fixture an `exact` check below names. goal-switch.py unions the previous
  # goal's list into this one; this goal adds none of its own, because each item's proof is a unit
  # test beside the code it changes, or the item's own deletion.
]

[context]

modules = [
  # Every file holding an item this goal owns, grouped by stage. `grep -rn "owner: decided-closures"
  # crates/` is the same list with the item numbers; the comment on each is the build.
  # Stage 2 -- the runtime and the lowering.
  # gaps 14 (the collector) and 18 (a throw from an abandoned generator's `finally`).
  "crates/nvs-ir/src/lib.rs",
  # gaps 2 (concat reuses a solely-owned left), 5 and 7 (the collector).
  "crates/nvs-runtime/src/lib.rs",
  # gap 1: a 192-bit retry when the 128-bit fold overflows.
  "crates/nvs-runtime/src/decimal.rs",
  # gap 1: the `otlp` pusher behind `[metrics] endpoint`.
  "crates/nvs-runtime/src/metrics.rs",
  # gap 1 (a secret into an array element is refused at compile time), gap 2 (a bound, struck).
  "crates/nvs-runtime/src/record.rs",
  # gap 1: measured first; the trie only if the walk shows.
  "crates/nvs-runtime/src/routes.rs",
  # Stage 3 -- the checker and the front end.
  # gap 1: autoload roots resolved into the bundle at build time.
  "crates/nvs-diagnostics/src/embedded.rs",
  # gap 1: a roster of `Core` names handed to `nvs-hir` at construction.
  "crates/nvs-hir/src/hierarchy.rs",
  # gap 1: consts and literal concatenations folded before the graph walk.
  "crates/nvs-hir/src/requires.rs",
  # gap 1: a `type` alias is PascalCase, and `rule:types/type-alias` says so.
  "crates/nvs-syntax/src/casing.rs",
  # gap 1 (the alias form's targeted error), gaps 2 and 3 (M1's `use function` and keyword segments).
  "crates/nvs-syntax/src/lib.rs",
  # gap 1: the call-site emitter carries the parameter's own IR type.
  "crates/nvs-types/src/defaults.rs",
  # gap 1: the run-time default stays, struck as prose.
  "crates/nvs-types/src/response.rs",
  # Stage 4 -- the library.
  # gap 1: a node carries a position and no text.
  "crates/nvs-stdlib/src/ast.rs",
  # gap 1, with time.rs gap 1: the prepared-pattern channel, built once.
  "crates/nvs-stdlib/src/cldr.rs",
  "crates/nvs-stdlib/src/time.rs",
  # gap 1: empty, neutral values under a served request, struck as the contract.
  "crates/nvs-stdlib/src/cli.rs",
  # gap 1: the help renderer reaches the handler's signature at render time.
  "crates/nvs-stdlib/src/command.rs",
  # gaps 1 and 2: both struck -- the defaults apply, and the split stands.
  "crates/nvs-stdlib/src/db/mod.rs",
  # gap 1 (the descriptor widens), gap 2 (an explicit heap stack charged to the request).
  "crates/nvs-stdlib/src/json.rs",
  # gap 1: both registry gates widen past § 12 behind an outstanding-members ratchet.
  "crates/nvs-stdlib/src/lib.rs",
  # gap 1: a shared `Ebml` case.
  "crates/nvs-stdlib/src/mime.rs",
  # gap 1 (a UNC root shape), gap 2 (drive-relative stays one component, struck).
  "crates/nvs-stdlib/src/path.rs",
  # gap 1 (a queue behind its schema is refused at boot), gap 2 (the fifth counter).
  "crates/nvs-stdlib/src/queue.rs",
  # gap 1: `Core\Random\Seeded` per spec § 11.
  "crates/nvs-stdlib/src/random.rs",
  # gap 1 (`qual_of` reads the declared Qual), gaps 2 and 3 (M6's directive and bracket).
  "crates/nvs-stdlib/src/regex.rs",
  # gap 1 (struck), gap 2 (stated in the embedding contract and asserted when a Ctx is built).
  "crates/nvs-stdlib/src/test.rs",
  # gap 1: the bytes pair.
  "crates/nvs-stdlib/src/uuid.rs",
  # gap 1: a computed `namespaceUri()`.
  "crates/nvs-stdlib/src/xml.rs",
  # gap 1 (Zip64), gap 2 (CRC verified by default).
  "crates/nvs-stdlib/src/zip.rs",
  # M7's rendering-per-sink gap, seen from html.rs and response.rs.
  "crates/nvs-stdlib/src/html.rs",
  "crates/nvs-stdlib/src/response.rs",
  # M8's two: the four classes § 1's roster lacks, and a `protected` member reached from a subclass.
  "crates/nvs-stdlib/src/reflect.rs",
]

# What every stage's memory answer is written against.
rules = [
  "programs/memory-priority",
]

# Empty on purpose: the sections that argue this goal belong to single stages, below.
adrs = []

shapes = ["A commit message", "A code comment"]

milestones = []

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
  "Tooling > a loop-goal.toml check's -p",
  "Writing Novis itself > a crate's known-gap",
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `66-decided-closures.md`, holding what only that stage
# needs. `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends
# it to the base above -- an overlay adds and never replaces. These are the PROSE stage numbers, not
# the `[[check]]` blocks' `stage = "..."` labels. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# A runtime-raised throw's cost, what a tainted value may reach, and what a request's memory owes.
rules = ["errors/throw-is-not-slower", "security/tainted-sources"]

[context.stage.3]
# The alias rule the casing item amends, the rule M1's refusal names, and the one the bundle item
# is written against.
rules = [
  "types/type-alias",
  "classes/no-free-functions-or-constants",
  "programs/no-runtime-autoload",
]
shapes = ["A `.nvst` test case"]

[context.stage.4]
# Regex's two tiers and the directive class its budget joins, the sink the pattern is, and the
# auto-escape rule the rendering-per-sink gap sits under.
rules = [
  "core-classes/regex-two-tiers",
  "config/three-changeability-classes",
  "security/regex-pattern-is-a-sink",
  "core-classes/html-auto-escape",
]
shapes = ["A `Core` member", "A `.nvst` test case"]

# The collector and the string reuse are refcount edges; the skip list is the floor's.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's: it carries every closure goal's container-backed checks, goal `m8-db-queue`'s
# five-driver matrix among them. This goal's own checks need no daemon.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# The register -- the gate. First so a session sees at once what is still owed, and the reason this
# goal exists: a count could be met by a tag, and this cannot.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the register"
name = "no module-doc gap names this goal"
argv = ["python", "tools/owners.py", "--closes", "decided-closures"]
want = ["goal `decided-closures` owns no module-doc gap"]

[[check]]
kind = "command"
stage = "6 the register"
name = "no index row names this goal"
argv = ["python", "tools/playbook.py", "--closes", "decided-closures"]
want = ["goal `decided-closures` owns no docs/agent/carried-gaps.md row"]

[[check]]
kind = "command"
stage = "6 the register"
name = "no gap is owed to a milestone the program has passed"
argv = ["python", "tools/owners.py", "--check", "--past-is-an-error"]
want = ["names an owner the chain or the plan knows", "past-milestone: 0"]


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the runtime and the lowering. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the runtime"
name = "nvs-runtime (a solely-owned string is reused, a wide decimal retries, a cycle is reclaimed in flight)"
args = ["test", "-p", "nvs-runtime"]
tests = [
  "concat_reuses_a_solely_owned_left_operand",
  "a_decimal_division_past_128_bits_retries_at_192_and_is_exact",
  "a_cycle_is_reclaimed_near_the_memory_ceiling_while_the_request_runs",
]

[[check]]
kind = "cargo-named"
stage = "2 the runtime"
name = "nvs-server (an `otlp` endpoint receives the registry as a push)"
args = ["test", "-p", "nvs-server"]
tests = [
  "an_otlp_endpoint_receives_the_registry_as_a_push",
]


# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the checker and the front end. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the checker"
name = "nvs-types (a secret into an array element is refused, and an alias is PascalCase)"
args = ["test", "-p", "nvs-types"]
tests = [
  "a_secret_stored_into_an_array_element_is_refused_at_compile_time",
  "a_type_alias_that_is_not_pascal_case_is_refused",
]

[[check]]
kind = "cargo-named"
stage = "3 the checker"
name = "nvs-hir (a require path folds, and a Core name comes from the roster)"
args = ["test", "-p", "nvs-hir"]
tests = [
  "a_require_path_folds_a_const_and_a_literal_concatenation",
  "a_core_name_the_roster_lacks_is_refused_by_the_link_pass",
]

[[check]]
kind = "cargo-named"
stage = "3 the checker"
name = "nvs-syntax (M1's `use function` refusal, and every keyword spelling is a segment)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  "use_function_and_use_const_get_the_targeted_refusal",
  "every_keyword_spelling_is_a_name_segment_past_the_first",
]


# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the library. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 the library"
name = "nvs-stdlib (Zip64, a CRC, a seeded generator, a UUID's bytes, a UNC root, an EBML case)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_zip64_archive_is_read_through_its_extra_fields_and_end_record",
  "an_extracted_entry_whose_crc_mismatches_is_refused",
  "core_random_seeded_gives_the_same_sequence_for_the_same_seed",
  "a_uuid_round_trips_through_its_sixteen_bytes",
  "a_unc_path_round_trips_as_a_third_root_shape",
  "an_ebml_container_is_reported_as_ebml",
]

[[check]]
kind = "cargo-named"
stage = "4 the library"
name = "nvs-stdlib (JSON depth on a heap stack, the queue's fifth counter and boot refusal, a namespace URI)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "json_nesting_is_bounded_by_the_heap_stack_not_the_native_one",
  "queue_stats_has_a_fifth_counter",
  "a_queue_whose_schema_is_behind_is_refused_at_boot",
  "an_xml_element_answers_its_namespace_uri",
]

[[check]]
kind = "cargo-named"
stage = "4 the library"
name = "nvs-stdlib (the regex budget is a directive, and a literal pattern is prepared once)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "the_regex_step_budget_is_a_limits_directive_with_the_constant_as_its_default",
  "a_literal_cldr_pattern_is_prepared_at_compile_time_and_not_per_call",
]
