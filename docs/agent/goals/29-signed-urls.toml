# Goal 29 -- signing a URL, and the payload behind it.
# The acceptance test, as data.
#
# `29-signed-urls.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  "examples/signed-url.nvs",
]

[context]

modules = [
  # Stage 2 -- the new class: the canonical payload encoding every other member in this goal calls.
  "crates/nvs-stdlib/src/signature.rs",
  # Stage 2 -- the AEAD construction and `generateKey`, which the ring is made of.
  "crates/nvs-stdlib/src/crypto.rs",
  # Stage 2 -- the key ring, the base64 spelling and the one-refusal argument, all to be shared
  # rather than written a second time.
  "crates/nvs-stdlib/src/signed_cookie.rs",
  # Stages 2-4 -- the registry rows all five members are declared in, and `Qual`'s taint marks.
  "crates/nvs-stdlib/src/registry.rs",
  # Stage 3 -- `equivalent()`, the RFC 3986 6.2.2 normalization that is what gets signed, and the
  # module doc sentence that is rewritten when it gains its second caller.
  "crates/nvs-stdlib/src/uri.rs",
  # Stage 4 -- `url`/`urlAbsolute`, the mount prefix, and the launder mark the signed pair copies.
  "crates/nvs-stdlib/src/router.rs",
  # Stage 4 -- `Core\Request::route()`, the match `signedRoute` verifies against.
  "crates/nvs-stdlib/src/request.rs",
  # Stages 2-3 -- `Time\Instant`, which `until` is one of and `null` is the other.
  "crates/nvs-stdlib/src/time.rs",
  # Stages 2-4 -- `rule:core-api/shape-parameter`'s `CoreTy` shape arm, so `{keys, until}` is a declared shape and `until`
  # is a required key holding a nullable value rather than an undeclared `mixed`.
  "crates/nvs-types/src/core_lib.rs",
  # Stage 5 -- `ThrownClass`, which the two refusals are two arms of, beside the one `open` raises.
  "crates/nvs-runtime/src/throwable.rs",
]

# 0060 is the roster this is the fifth entry of; 0146 is the design; 0024/0033 are the two qualifier
# axes every row here is marked on; 0063 R5/R17 decides the names; 0096 is the written-not-omitted
# rule `until` copies; 0097/0102 are the mount prefix and the one match; 0004 prices it.
rules = ["0060", "0146", "0024", "0033", "0063", "0096", "0097", "0102", "0004"]

adrs = ["0146", "0060 §§1,4,5"]

shapes = ["A core class", "A commit message", "A .nvst case"]

playbook = [
  'Writing Novis itself > core is',
  'Tooling > a core class',
  'Running things > adding a',
  'Running things > target/release/nvs.exe is',
  'Running things > a leak whose',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',
  'Writing a test case > a multi-file',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > plan.py --get',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# This goal's own checks need no container -- a signature is computed over a key and reaches no
# store. The daemon is its FLOOR's requirement: stage 1 carries goals 4, 5 and 28's lists forward,
# and those verify drivers and a queue against real servers.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-stdlib", "crates/nvs-types", "crates/nvs-runtime"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone: `Core\Signature`, over a payload and never over text. `rule:core-api/signing-is-over-a-payload` section 1.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 signature"
name = "nvs-stdlib (a payload signs and verifies, and the encoding is canonical)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_payload_round_trips_through_sign_and_verify_unchanged",
  "the_canonical_encoding_sorts_keys_so_two_orderings_sign_identically",
  "an_int_one_and_a_string_one_encode_to_different_bytes",
  "the_token_is_unpadded_url_safe_base64_and_needs_no_further_escaping",
]

[[check]]
kind = "cargo-named"
stage = "2 signature"
name = "nvs-stdlib (the key ring is SignedCookie's, and verify answers tainted)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "sign_uses_the_newest_key_alone_and_verify_walks_the_whole_ring_in_order",
  "a_token_under_a_rotated_out_key_still_verifies_while_new_tokens_use_the_newest",
  "a_token_under_a_key_dropped_past_the_end_of_the_ring_fails",
  "a_verified_payload_reaching_a_query_text_position_is_refused_as_tainted",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- a `Uri` signs itself, over the form `compareTo` already defines. `rule:core-api/signing-is-over-a-payload` section 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 uri"
name = "nvs-stdlib (a signed Uri covers what compareTo normalizes, and only that)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_signed_uri_round_trips_and_one_appended_query_parameter_invalidates_it",
  "a_removed_query_parameter_invalidates_it",
  "reordering_the_query_still_verifies_because_ordering_is_not_canonical",
  "rewriting_an_escapes_hex_digits_in_the_other_case_still_verifies",
  "changing_or_adding_a_fragment_still_verifies_because_a_fragment_is_never_signed",
  "signing_calls_the_same_equivalent_that_compare_to_calls_and_not_a_second_one",
]

[[check]]
kind = "cargo-named"
stage = "3 uri"
name = "nvs-stdlib (the _sig parameter is reserved, single and self-excluding)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "signing_a_uri_that_already_carries_sig_replaces_it_rather_than_nesting",
  "a_url_carrying_two_sig_parameters_fails_under_either_of_them",
  "a_url_with_no_sig_fails_with_the_same_error_a_forged_one_raises",
  "verify_signature_answers_nothing_and_throws_rather_than_returning_a_bool",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the router pair, for the mount prefix and nothing else. `rule:core-api/signing-is-over-a-payload` section 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 router"
name = "nvs-stdlib (a signed route identity survives a remount, a signed path does not)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "url_signed_verifies_through_signed_route_after_the_mount_prefix_changes",
  "the_same_link_signed_as_a_path_stops_verifying_when_the_mount_moves",
  "signed_route_verifies_against_the_match_the_server_already_made_and_reparses_nothing",
  "url_signed_launders_for_the_url_path_sink_exactly_as_url_does",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- one refusal, except expiry, and the ordering that makes it safe. `rule:core-api/signing-is-over-a-payload` sections 3, 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 refusals"
name = "nvs-stdlib (expiry is the one distinguishable failure, and it is checked second)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "a_token_past_its_until_throws_the_expired_error",
  "a_token_both_forged_and_past_its_until_throws_the_invalid_error_not_the_expired_one",
  "every_other_way_of_not_being_authentic_raises_one_error_with_one_sentence",
]

[[check]]
kind = "nvs-suite"
stage = "5 refusals"
name = "until is written and never omitted"
args = ["test", "tests/conformance/core/signature/"]

[[check]]
kind = "cargo-named"
stage = "5 registered"
name = "nvs-stdlib (the three spec rows this goal owns are registered, and their keys are gone)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "every_part_one_spec_member_is_registered",
  "every_part_two_spec_class_is_registered",
  "every_outstanding_key_names_an_owner",
  "a_key_whose_member_is_now_registered_fails_as_a_stale_line",
]

[[check]]
kind = "nvs-suite"
stage = "5 suites"
name = "the conformance tree"
args = ["test", "tests/conformance/"]

[[check]]
kind = "nvs-suite"
stage = "5 suites"
name = "the differential tree"
args = ["test", "tests/differential/"]
