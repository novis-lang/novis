# Goal 51 -- a program holds a WebSocket to another server, opened like an outbound call and closed with the task that opened it
# The acceptance test, as data.
#
# `51-websocket-client.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No example of its own: a socket needs a peer, and every case below is answered by `Core\Test`'s
  # scripted peer or by a Rust loopback one.
]

[context]

modules = [
  # The row, the scheme roster (:262-263), the bag and the pin. Stage 4.
  "crates/nvs-stdlib/src/http.rs",
  # The connect, the TLS hand-off and the tunnel the handshake reuses. Stage 4.
  "crates/nvs-stdlib/src/http/transport.rs",
  # `Core\Socket`'s rows (:222-299) and `Message` (:446-517), the shapes stage 5 answers in.
  "crates/nvs-stdlib/src/socket.rs",
  # The outbound table the scripted peer joins. Stage 3.
  "crates/nvs-stdlib/src/test.rs",
  # Where every row and class is registered.
  "crates/nvs-stdlib/src/registry.rs",
  # `[http.client.socket]`'s two rows. Stage 5.
  "crates/nvs-config/src/directive.rs",
  # The server's framing over `tungstenite`, the precedent for the client half. Stages 4 and 5.
  "crates/nvs-server/src/socket.rs",
]

# Every stage works inside these three: the URL is a sink, no wait is unbounded, and the pin survives.
rules = [
  "security/outbound-url-is-a-sink",
  "http-server/no-spelling-for-an-unbounded-wait",
  "http-server/allow-url-pins-the-address",
]

adrs = []

shapes = [
  "A commit message",
  "A code comment",
]

milestones = ["M8:verify"]

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `51-websocket-client.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' `stage = "2 the record"` labels, which may group several prose stages under
# one acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The record: how the row and the class are spelled, how the two keys are classed, the server's half
# it answers in the shape of, and why a transport passes the admission test.
rules = [
  "core-api/verb-lexicon",
  "config/three-changeability-classes",
  "http-server/an-unsafe-or-unbounded-default-is-a-defect",
  "concurrency/a-connection-is-a-root-isolate",
  "security/protocol-admission-test",
]
shapes = ["A decision record", "A rule fragment", "Citing a document"]

[context.stage.3]
# The peer answers in-process, the way `Core\Test::request` already does.
rules = ["testing/in-process-request"]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.4]
# The handshake is a call: the one TLS client, and the redirect it does not follow.
rules = ["security/one-tls-client", "http-server/redirects-are-off-and-every-hop-is-re-pinned"]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.5]
# A payload is input, a resource never crosses an isolate, and nothing outlives the task that made it.
rules = [
  "security/tainted-sources",
  "classes/graph-copy",
  "concurrency/nothing-is-still-running-when-a-call-returns",
]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.6]
shapes = ["A rule fragment"]

# A socket is a host handle like any connection; no refcounted value crosses it. No cycle shape, so
# nothing is added to the skip list.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# None of this goal's own checks needs a daemon. The floor is goal `outbound-proxy`'s whole list, which
# carries goal `process-cache`'s shared-tier and session checks, and the daemons are theirs.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the record. Goal prose stage 2. Each check names a bare id, which stays true after stage 6
# flips the status.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the record"
name = "an outbound socket opened like an outbound call is a rule"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-is-opened-like-an-outbound-call"]
want = ["http-server/an-outbound-socket-is-opened-like-an-outbound-call"]

[[check]]
kind = "command"
stage = "2 the record"
name = "an outbound socket belonging to its task is a rule"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-belongs-to-the-task-that-opened-it"]
want = ["http-server/an-outbound-socket-belongs-to-the-task-that-opened-it"]

[[check]]
kind = "command"
stage = "2 the record"
name = "an outbound socket's bounds are a rule"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-is-bounded-by-idle-a-lifetime-and-a-message-cap"]
want = ["http-server/an-outbound-socket-is-bounded-by-idle-a-lifetime-and-a-message-cap"]

[[check]]
kind = "command"
stage = "2 the record"
name = "an outbound socket answered by a scripted peer is a rule"
argv = ["python", "tools/rules.py", "--show", "testing/an-outbound-socket-is-answered-by-a-scripted-peer"]
want = ["testing/an-outbound-socket-is-answered-by-a-scripted-peer"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the scripted peer. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "3 the scripted peer"
name = "a test answers a socket with a scripted peer, records what was sent, and never connects"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/test-answer-socket-plays-its-frames-and-records-what-was-sent.nvst",
  "tests/conformance/core/test-an-unanswered-socket-throws-and-never-connects.nvst",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the handshake. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "4 the handshake"
name = "a socket opens a ws or wss URL, reports its protocol, and each row refuses the other's schemes"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/http-socket-opens-a-wss-url-and-reports-its-protocol.nvst",
  "tests/conformance/core/http-socket-refuses-an-http-url-and-a-request-row-refuses-wss.nvst",
]

[[check]]
kind = "cargo-named"
stage = "4 the handshake"
name = "the handshake is pinned, carries its headers, goes through TLS and the tunnel, and follows no redirect"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "socket_handshake_connects_to_the_approved_address",
  "socket_handshake_carries_the_callers_headers_and_offered_protocols",
  "a_101_choosing_a_protocol_not_offered_is_refused",
  "a_redirect_answering_a_socket_handshake_is_a_runtime_error_naming_the_location",
  "wss_socket_completes_over_the_tls_client_under_the_calls_policy",
  "a_socket_is_opened_through_the_proxy_tunnel_when_one_is_configured",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the conversation and its bounds. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "5 the conversation"
name = "a socket receives tainted text and bytes as messages, and close ends the conversation"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/http-socket-receives-text-and-bytes-as-tainted-messages.nvst",
  "tests/conformance/core/http-socket-close-ends-the-conversation-and-receive-answers-null.nvst",
]

[[check]]
kind = "cargo-named"
stage = "5 the conversation"
name = "a socket is bounded by silence, a lifetime and a message cap, and closes with its task"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "socket_idle_ends_a_silent_peer",
  "socket_ping_keeps_a_quiet_live_peer_open",
  "socket_max_duration_ends_an_endless_conversation",
  "a_message_past_max_message_closes_the_socket_with_1009",
  "a_socket_is_closed_with_1001_when_its_task_ends",
  "two_receives_waiting_on_one_socket_is_a_logic_error",
]

[[check]]
kind = "cargo-named"
stage = "5 the conversation"
name = "the socket block's two keys are bounded and runtime-class"
args = ["test", "-p", "nvs-config"]
tests = [
  "http_client_socket_max_message_and_send_timeout_are_bounded_and_runtime_class",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the rulebook. Goal prose stage 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "an outbound socket opened like an outbound call is shipped"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-is-opened-like-an-outbound-call"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "an outbound socket belonging to its task is shipped"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-belongs-to-the-task-that-opened-it"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "an outbound socket's bounds are shipped"
argv = ["python", "tools/rules.py", "--show", "http-server/an-outbound-socket-is-bounded-by-idle-a-lifetime-and-a-message-cap"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "an outbound socket answered by a scripted peer is shipped"
argv = ["python", "tools/rules.py", "--show", "testing/an-outbound-socket-is-answered-by-a-scripted-peer"]
want = ["shipped"]
