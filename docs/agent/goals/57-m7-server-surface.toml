# Goal 57 -- everything M7 promised a deployment is there to run
# The acceptance test, as data.
#
# `57-m7-server-surface.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No example of its own. Every behaviour below either needs a server, a request or a service
  # manager, which a Rust test or a `.nvst` request section supplies, or is a compile-time refusal.
]

[context]

modules = [
  # The endpoint's creation, trust check and reload publish (:150, :241, :276). Stage 3.
  "crates/nvs-config/src/control.rs",
  # The operation roster (:26) that gains `config` and `status`. Stage 3.
  "crates/nvs-server/src/control.rs",
  # The `Ctl` command, `ServiceCommand` (:914) and `ConfigCommand` (:745). Stages 3 and 5.
  "crates/nvs-cli/src/main.rs",
  # The boot: control bind, drain, sd_notify, fleet leases (:753-763), the exporter's listener, the
  # end-to-end tests (:1570). Stages 3, 4, 9, 10 and 12.
  "crates/nvs-cli/src/serve.rs",
  # The service plan (:140), `image_path` (:372), `destination` (:553), the unit (:491-520). Stage 5.
  "crates/nvs-cli/src/service.rs",
  # `serve_on_this_core` (:1726), `Draining` (:473), the door that calls the registry. Stages 3 and 10.
  "crates/nvs-server/src/serve.rs",
  # `NvsListener`, which gains a Unix-domain accept. Stage 4.
  "crates/nvs-host/src/net.rs",
  # `html` and `sendFile` beside `text` (:273-295); gap 1 (:191). Stage 6.
  "crates/nvs-stdlib/src/response.rs",
  # The escape and `Markup` (:215); the owner-M7 gap (:73-90). Stage 6.
  "crates/nvs-stdlib/src/html.rs",
  # `OutputSink::Body` and the carrier it selects (:455-463). Stage 6.
  "crates/nvs-runtime/src/ctx/output.rs",
  # `body()` (:2582) and the buffering readers' shared hold (:2828). Stage 7.
  "crates/nvs-stdlib/src/request.rs",
  # `request` (:412-428, body :1650) and its module doc's owed half (:134-160). Stage 7.
  "crates/nvs-stdlib/src/test.rs",
  # The enum-capture set (:1787) and the link check (links.rs :424). Stage 8.
  "crates/nvs-types/src/routes.rs",
  "crates/nvs-types/src/links.rs",
  # `substitute` (:825) and gap 2 (:63). Stage 8.
  "crates/nvs-stdlib/src/router.rs",
  # `Leases` (:301), `arm`, the fallback and the not-yet list (:31-91). Stage 9.
  "crates/nvs-server/src/schedule.rs",
  # The per-core registry (:368, `of` :388) and `route::label`'s gap 2. Stage 10.
  "crates/nvs-server/src/metrics.rs",
  "crates/nvs-server/src/route.rs",
]

# Every stage works inside these two: one server shape and no third deployment, and a parameter that
# becomes an instruction is a sink.
rules = [
  "http-server/two-deployments-and-nothing-a-proxy-owns",
  "security/sink-predicate",
]

adrs = []

shapes = [
  "A commit message",
  "A code comment",
]

milestones = ["M7:verify"]

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
  # Checks naming a crate's tests, which every stage here writes.
  "Tooling > a loop-goal.toml check's -p",
  'Writing a test case > a -p <crate> check is',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `57-m7-server-surface.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' `stage = "2 the record"` labels, which may group several prose stages under
# one acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The record: the capture rule it narrows, the exporter rule it amends, the body rule `sendFile` obeys.
rules = [
  "routing/a-capture-narrows-to-a-closed-set",
  "observability/the-exporters-are-crates",
  "security/response-body-is-one-typed-member",
]
spec = ["01 §15"]
shapes = ["A decision record", "A rule fragment", "Citing a document"]

[context.stage.3]
# The socket, what it answers, and the one drain behind a stop and a reload.
rules = [
  "config/one-local-control-socket",
  "config/ctl-config-reports-the-live-snapshot",
  "concurrency/a-drain-closes-a-connection-cleanly",
  "concurrency/one-scheduler",
]
playbook = [
  'Writing a test case > a -p nvs-cli test',
  'Writing a test case > a -p nvs-server test can drive',
  'Writing a test case > a -p nvs-server test cannot',
]

[context.stage.4]
rules = ["http-server/a-unix-socket-listener", "http-server/the-server-block-is-boot-class"]

[context.stage.5]
# The namespace, what a stop and a PARAMCHANGE do, and why Linux prints.
rules = [
  "packaging/a-service-is-one-stored-argv",
  "packaging/a-service-answers-its-manager",
  "packaging/the-unit-is-printed-and-install-is-the-opt-in",
]
playbook = ['Writing Novis itself > a service', 'Writing a test case > a -p nvs-cli test']

[context.stage.6]
# Seven typed members, the HTML sink's escape, and which contexts bind it.
rules = [
  "security/response-body-is-one-typed-member",
  "core-classes/html-auto-escape",
  "tooling/echo-always-has-a-sink",
]
spec = ["01 §15"]
shapes = ["A `Core` member", "A `.nvst` test case"]
playbook = ["Writing Novis itself > a request's", 'Writing Novis itself > qual::sink needs']

[context.stage.7]
# The in-process request, a string is UTF-8, and which readers share the body.
rules = [
  "testing/in-process-request",
  "types/string-is-utf8",
  "http-server/buffering-readers-share-the-body-and-streaming-readers-consume-it",
]
spec = ["01 §15", "01 §13"]
shapes = ["A `Core` member", "A `.nvst` test case"]
playbook = ['Running things > nvs run --request', "Writing Novis itself > a request's"]

[context.stage.8]
rules = [
  "routing/a-capture-narrows-to-a-closed-set",
  "routing/a-request-reads-its-mount",
  "routing/an-origin-is-per-mount-and-checked-at-boot",
]
shapes = ["A `.nvst` test case"]
playbook = ['Writing Novis itself > a route table']

[context.stage.9]
# The lease, what the shared tier is, and the entry block's sub-caps.
rules = [
  "config/a-fleet-entry-fires-at-most-once-under-a-lease",
  "concurrency/a-cached-value-is-copied-across-the-boundary",
  "config/scheduled-work-is-a-config-block",
  "concurrency/cross-request-state-is-explicit",
]

[context.stage.10]
rules = [
  "observability/a-registry-is-per-core-and-nothing-reads-it",
  "observability/route-label-is-the-declared-name",
  "observability/the-exporter-is-a-feature-and-core-metrics-is-not",
]
playbook = ['Writing a test case > a -p nvs-server test can serve']

[context.stage.11]
rules = [
  "observability/four-kinds-become-a-span",
  "observability/an-inbound-traceparent-is-continued",
  "observability/trace-events-carry-a-kind",
]

[context.stage.12]
# The ceilings a runaway meets, the watchdog that sees it, and the hot-reload contract.
rules = [
  "errors/on-limit",
  "http-server/a-wedged-core-is-detected-by-its-deadline",
  "config/an-edit-reaches-the-next-request-without-a-restart",
]
playbook = [
  "Writing Novis itself > rule:errors/on-limit's roster",
  'Writing a test case > a memory-limit',
  'Running things > arevalidationthatwinspublishesandreadersneverblockonacompile fa',
]

[context.stage.13]
shapes = ["A rule fragment"]

# A socket is a host handle like any connection; no refcounted value crosses it. No cycle shape, so
# nothing is added to the skip list.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Both. Stage 9's lease is proved against the compose file's `redis`, because a set-if-absent and its
# expiry are a server's semantics rather than a fake's; and the floor is goal `m4b-editor`'s whole list,
# which carries goal `process-cache`'s shared-tier checks and the database goals' daemons.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


