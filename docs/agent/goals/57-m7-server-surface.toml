# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the control socket, `nvs ctl`, and the drain. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 the control socket"
name = "nvs ctl names its three operations"
argv = ["{nvs}", "ctl", "--help"]
want = ["reload", "config", "status"]

[[check]]
kind = "cargo-named"
stage = "3 the control socket"
name = "the endpoint answers reload, config and status, each carrying the version, one at a time"
args = ["test", "-p", "nvs-server"]
tests = [
  "a_config_request_is_answered_with_the_live_snapshot_and_each_origin",
  "a_status_request_reports_the_in_flight_count_and_whether_the_process_is_draining",
  "every_control_answer_carries_the_server_version",
  "two_reloads_on_one_endpoint_are_answered_one_after_the_other",
]

[[check]]
kind = "cargo-named"
stage = "3 the control socket"
name = "serve binds the socket, ctl drives it, a signal drains, and systemd is told each state"
args = ["test", "-p", "nvs-cli"]
tests = [
  "serve_binds_the_control_socket_the_tree_names_before_any_listener_accepts",
  "serve_refuses_to_boot_when_the_control_sockets_directory_is_writable_by_another_account",
  "ctl_reload_publishes_the_edited_tree_and_prints_what_it_could_not_apply",
  "ctl_config_prints_the_live_snapshot_with_each_directives_origin",
  "ctl_refuses_an_answer_from_a_server_of_another_version",
  "a_terminating_signal_drains_serve_and_every_connection_closes_cleanly",
  "sd_notify_messages_are_ready_then_reloading_and_ready_then_stopping",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the Unix listener. Goal prose stage 4. One test, both platforms: it binds where the rule
# admits a Unix socket and asserts the refusal where it does not, so it runs on every leg.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 the unix listener"
name = "a unix-socket listen entry binds with its mode where it is admitted and is refused once elsewhere"
args = ["test", "-p", "nvs-cli"]
tests = [
  "a_unix_socket_listen_entry_binds_with_its_mode_on_unix_and_is_refused_once_elsewhere",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- `nvs service`. Goal prose stage 5. Every test drives the recording manager; none needs
# administrator rights.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 the service"
name = "nvs service names every verb the rule lists"
argv = ["{nvs}", "service", "--help"]
want = ["install", "uninstall", "start", "stop", "status", "run", "unit"]

[[check]]
kind = "cargo-named"
stage = "5 the service"
name = "every verb is a plan of manager actions, every refusal runs first, and run answers its manager"
args = ["test", "-p", "nvs-cli"]
tests = [
  "service_install_on_windows_registers_the_encoded_image_path_a_virtual_account_and_preshutdown",
  "service_install_on_linux_writes_the_unit_then_runs_daemon_reload",
  "service_install_dry_run_prints_the_actions_and_touches_nothing",
  "service_uninstall_leaves_no_key_no_event_source_no_unit_and_no_acl",
  "service_start_stop_and_status_reach_the_manager_by_argv_with_no_shell",
  "service_status_reports_in_flight_and_drain_progress_from_the_control_socket",
  "service_run_turns_a_stop_into_a_drain_with_advancing_checkpoints",
  "service_run_turns_paramchange_into_the_reload",
  "every_install_refusal_runs_before_the_manager_is_touched",
]

