# Goal 40 -- An agent learns Novis from the binary, in three calls
# The acceptance test, as data.
#
# `40-agent-surface.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # goal-switch.py unions the previous goal's list into this one. This goal writes no
  # `examples/*.nvs` fixture of its own: what it ships is a CLI surface and a generated document,
  # both asserted from Rust and from the reference generator's own example harness.
]

[context]

modules = [
  # The subcommand enum every verb of `nvs agent` is added to, and the file that says what a
  # subcommand costs the CLI's surface.
  "crates/nvs-cli/src/main.rs",
  # The renderer over the registry document today. Stage 2 gives it the `capabilities` roster and
  # reads it from here; the four verbs join against what it emits.
  "crates/nvs-cli/src/meta.rs",
  # `CAPABILITIES` -- the one table saying what each member needs, written and tested and read by no
  # renderer. Stage 2 reads it. It is never edited: its shape is a security-review property.
  "crates/nvs-stdlib/src/registry.rs",
  # Where `E0309` is reported for a member that does not resolve, and so where stage 4's
  # did-you-mean is decided.
  "crates/nvs-hir/src/members.rs",
  # The capability denial's wording -- the four `format!`s that name the member, the capability and
  # the resource, and never name `nvs.toml`.
  "crates/nvs-runtime/src/capability.rs",
]

# The rules every stage of this goal works inside.
rules = [
  # This goal's first rule: what the surface is, what answers, and why the check loop is part of it.
  "tooling/an-agent-asks-the-binary",
  # The shape every renderer here joins, and the reason none of them is a source of truth.
  "tooling/one-json-several-renderers",
  # The table stage 2 reads and must not reshape -- its second paragraph is why a per-member field is
  # refused, and that argument is a security-review one rather than a taste.
  "security/capability-declaration-is-one-table",
]

adrs = []

shapes = [
  "A commit message",
  "A code comment",
  "A diagnostic",
  "A rule fragment",
]

milestones = ["M10:verify"]

playbook = [
  # This goal's own file set and tools.
  'Tooling > a core class',
  'Tooling > A moved module takes',
  'Tooling > Making a type `pub`',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > plan.py --get',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `40-agent-surface.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
# ---------------------------------------------------------------------------------------------------

# Stage 0 audits two `designed` rules against a binary that appears to ship them, and confirms the
# table's missing renderer. It needs the two rules themselves, not an argument about them.
[context.stage.0]
rules = [
  "tooling/nvs-doc-renders-and-decides-nothing",
  "tooling/meta-json-takes-a-program",
  "tooling/meta-json",
]

# The keystone argues from 0167's shape sections: what the four verbs are, and why the capability
# roster is a join rather than a field.
[context.stage.2]
adrs = ["0167 §1", "0167 §3"]
rules = [
  "tooling/the-index-is-one-line-per-member",
  "core-api/reference-card",
  "security/capability-check-at-the-door",
]

# Stage 3 writes the one document that ships to a stranger, and the harness that executes its claims
# is the reference generator's own.
[context.stage.3]
adrs = ["0167 §2"]
rules = [
  "tooling/a-primer-claim-is-executed",
  "types/grammar",
  "core-api/options-bag",
]

# Stage 4 writes two diagnostics, so it needs the shape a diagnostic takes and the band its codes
# come from.
[context.stage.4]
rules = [
  "errors/diagnostic-record",
  "security/capability-check-at-the-door",
]

# Stage 5 installs into someone else's tree. The precedent is the editor extension's install rule,
# which settled the same question one surface over: guide, never bundle.
[context.stage.5]
adrs = ["0167 §4"]
rules = [
  "tooling/an-adapter-carries-protocol-and-never-language",
  "ide/the-extension-guides-an-install-and-never-bundles-one",
]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Its floor's, not this goal's own: nothing here touches a database. The daemon is needed because
# goal 39's acceptance list -- carried in as stage 1 -- reaches the driver suites that do.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-cli", "crates/nvs-stdlib", "crates/nvs-hir"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- the catch-up. Two rules marked `designed` over surface the binary already ships, and one
# `shipped` rule naming two renderers that do not exist. Goal prose stage 0.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "0 the catch-up"
name = "the rulebook validates, so no rule audited in stage 0 was left in a state that contradicts it"
argv = ["python", "tools/rules.py", "--check"]

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. The registry answers a query, and the capability table finally has a
# renderer. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the surface"
name = "the registry document carries the capability roster, and a member joins to its row"
args = ["test", "-p", "nvs-cli"]
tests = [
  "the_meta_document_carries_a_capabilities_roster_beside_its_other_four",
  "every_capabilities_row_names_a_class_and_member_the_registry_holds",
  "no_member_row_gained_a_capability_field",
]

[[check]]
kind = "cargo-named"
stage = "2 the surface"
name = "the index is one line per member, and every line resolves through show"
args = ["test", "-p", "nvs-cli"]
tests = [
  "the_index_has_exactly_one_line_for_every_registered_member",
  "every_index_line_resolves_through_show",
  "a_gated_member_renders_its_capability_and_an_ungated_one_renders_none",
  "the_index_names_every_enum_exception_and_attribute_beside_the_members",
]

[[check]]
kind = "cargo-named"
stage = "2 the surface"
name = "find answers a namespaced query the shell would have mangled, and show refuses an unknown symbol"
args = ["test", "-p", "nvs-cli"]
tests = [
  "find_matches_a_backslashed_class_name_written_literally",
  "find_is_case_insensitive_over_the_class_and_member_name",
  "show_on_an_unknown_symbol_exits_non_zero_naming_the_nearest_matches",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the primer. Generated from marked chapter sections, and every claim in it executed
# against the compiler that ships with it. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the primer"
name = "the primer is assembled from marked sections and carries each part the investigation named"
args = ["test", "-p", "nvs-cli"]
tests = [
  "the_primer_carries_the_lookup_protocol_the_worked_program_and_the_refusal_table",
  "the_worked_program_shows_a_typed_local_a_foreach_binding_and_an_options_bag",
  "the_primer_names_the_capability_model_and_the_smallest_grant",
  "an_unmarked_chapter_section_is_not_lifted_into_the_primer",
]

[[check]]
kind = "command"
stage = "3 the primer"
name = "every refusal the primer states is refused, and every example in it runs and prints what it says"
argv = ["python", "tools/reference.py", "--primer", "--check"]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the two diagnostics. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "4 the diagnostics"
name = "the conformance tree, including this goal's did-you-mean and capability-help cases"
args = ["test", "tests/conformance/"]

[[check]]
kind = "cargo-named"
stage = "4 the diagnostics"
name = "a near-miss member suggests the registered name, and a distant one suggests nothing"
args = ["test", "-p", "nvs-hir"]
tests = [
  "an_unknown_member_one_edit_from_a_registered_one_suggests_it",
  "an_unknown_member_far_from_every_registered_one_suggests_nothing",
  "a_suggestion_never_names_a_member_of_a_different_class",
]

[[check]]
kind = "cargo-named"
stage = "4 the diagnostics"
name = "a capability denial names nvs.toml and the table the grant is written in"
args = ["test", "-p", "nvs-runtime"]
tests = [
  "an_ungranted_call_names_the_config_file_and_the_capability_table",
  "the_denials_own_subject_and_wording_are_unchanged",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the install, and the adapters. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 the install"
name = "init writes exactly the declared files, is idempotent, and clobbers nothing a user edited"
args = ["test", "-p", "nvs-cli"]
tests = [
  "init_in_an_empty_tree_writes_the_agents_stanza_and_nothing_else",
  "init_writes_the_claude_skill_when_that_harness_is_present",
  "init_run_twice_changes_nothing_the_first_run_wrote",
  "init_refuses_to_overwrite_a_stanza_that_has_been_edited",
]

[[check]]
kind = "cargo-named"
stage = "5 the install"
name = "no adapter states a language fact, and each one parses as its harness's format"
args = ["test", "-p", "nvs-cli"]
tests = [
  "every_adapter_names_the_agent_commands_and_the_check_loop",
  "no_adapter_contains_a_member_signature_a_type_name_or_a_refusal",
  "the_claude_skill_carries_a_name_and_a_description_in_its_front_matter",
]

[[check]]
kind = "command"
stage = "5 the install"
name = "a cold-start walk -- primer, find, show, check -- returns a resolving answer at every step"
argv = ["python", "tools/reference.py", "--agent-walk"]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- the rulebook. Goal prose stage 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "the rulebook validates, and none of this goal's four rules is still designed"
argv = ["python", "tools/rules.py", "--check"]

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "every generated chapter is current with the fragments and their topic entries"
argv = ["python", "tools/rules.py", "--render", "--check"]

[[check]]
kind = "command"
stage = "6 the rulebook"
name = "the record and the rulebook still agree on what this decision created"
argv = ["python", "tools/decisions.py", "--gate"]
