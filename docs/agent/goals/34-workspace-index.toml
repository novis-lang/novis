# Goal 34 -- The language server grows past its first closed list
# The acceptance test, as data.
#
# `34-workspace-index.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# Every check here is `cargo-named` or `nvs-suite`: this goal is one crate and one protocol, and
# neither has a calling convention, so nothing needs a per-leg program run.

files = [
  # carried from the previous goal by tools/goal-switch.py; this goal names none of its own.
]

[context]

modules = [
  # The four arms and the `Asked` enum stage 5 gives a fifth; `position` at :332 is what a cursor
  # after `Core\` falls into today.
  "crates/nvs-lsp/src/completion.rs",
  # The one place the declaration is written. Stage 0's trigger characters at :174, and every
  # capability stages 3-6 add.
  "crates/nvs-lsp/src/capabilities.rs",
  # The request router. One arm per method, and the shape each new request copies.
  "crates/nvs-lsp/src/server.rs",
  # `Analysed` -- `module`, `loaded`, `exprs`, `index`. Stage 2 widens the first from one graph to
  # the tree, and stages 3-6 read the rest unchanged.
  "crates/nvs-lsp/src/document.rs",
  # The resolution stages 3 and 4 point at a type rather than a name.
  "crates/nvs-lsp/src/definition.rs",
  # The registry row stage 4's signature help renders and stage 5's namespace arm enumerates.
  "crates/nvs-lsp/src/hover.rs",
  # The `Core` class and member tables both of those read.
  "crates/nvs-stdlib/src/registry.rs",
  # The rows stage 5's PHP-name layer joins against.
  "docs/spec/02-php-migration.md",
  # The `.lspt` format, and at :57 the corpus example that froze the recovery case that works and
  # never its mirror -- which is stage 0's whole story.
  "crates/nvs-lsp/src/lib.rs",
]

# The rules this goal implements, and the one its record amends.
rules = [
  "ide/five-features-are-one-reference-index",
  "ide/check-scope-defaults-to-open-documents",
  "ide/completion-offers-only-what-the-compiler-derived",
  "ide/every-feature-is-staged-behind-its-dependency",
  "ide/the-request-set-is-closed",
  "ide/three-of-four-item-shapes-insert-nothing",
  "php-migration/every-php-builtin-is-a-completion-candidate",
  "ide/an-lsp-answer-is-frozen-as-an-lspt-case",
  "ide/a-full-reanalysis-stays-under-a-bound",
  "ide/contributions-are-frozen-and-only-ever-added",
  # Named because a standing decision turns on it: nvs.toml completion is out of scope precisely
  # because this rule would have to be reopened to claim `.toml`.
  "ide/the-extension-claims-nvs-only",
]

# 0099 is the record this goal's own amends: SS 3 is the M4B request set, its admission test, and
# the inlay-hint deferral stage 6 reverses.
adrs = ["0099 §3"]

shapes = ["An `.lspt` case", "A commit message", "A decision record", "A rule fragment"]

milestones = ["M10"]

playbook = [
  # This goal's own file set.
  'Tooling > a reserved',
  'Writing a test case > a rust test can',
  'Writing a test case > a cursor',
  'Writing a test case > a -p nvs-lsp',
  "Writing a test case > a .lspt case's",
  'Writing Novis itself > exprtypetable::declaredty answers',
  'Running things > nvs-lsp gaining',
  'Tooling > a cargo-named check counts',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `34-workspace-index.md`, holding what only that stage needs.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The bound the index has to still hold once it is warm.
rules = ["ide/a-full-reanalysis-stays-under-a-bound", "ide/the-server-is-synchronous"]

[context.stage.3]
rules = ["classes/interface-default-methods", "classes/delegation-by-field"]

[context.stage.6]
# The deferral this stage reverses, in the record that wrote it.
adrs = ["0099 §3"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's, not this goal's own: nothing here touches a database.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 0 -- the two live defects. Both are `.lspt` cases, because both are an answer at a cursor and
# `rule:ide/an-lsp-answer-is-frozen-as-an-lspt-case` is where an answer is frozen. Goal prose stage 0.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "0 the catch-up"
name = "the lspt corpus, including a member list against every closing delimiter"
args = ["lsp-test", "tests/lsp/"]

[[check]]
kind = "cargo-named"
stage = "0 the catch-up"
name = "every declared trigger character has an arm that answers it"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "every_trigger_character_reaches_an_arm_that_is_not_the_position_list",
  "a_member_list_survives_a_receiver_at_the_end_of_a_block",
]

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. One construction site, and the structural test that says so. The bound is
# `rule:ide/a-full-reanalysis-stays-under-a-bound`'s, held with the index warm. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the index"
name = "one symbol index, built in one place, invalidated by what changed"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "the_crate_has_exactly_one_symbol_index_construction_site",
  "a_change_invalidates_the_file_and_its_readers_and_nothing_else",
  "a_warm_index_answers_within_the_reanalysis_bound",
  "check_scope_selects_the_tree_and_never_the_construction_site",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the five readers, and the test that there are five. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the readers"
name = "five features read the one index and none walks on its own"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "all_five_readers_query_the_one_index",
  "unused_member_dimming_is_silent_at_open_scope_and_correct_at_workspace_scope",
  "call_hierarchy_is_not_answered",
]

[[check]]
kind = "nvs-suite"
stage = "3 the readers"
name = "an lspt case per added request, at a cursor, frozen"
args = ["lsp-test", "tests/lsp/", "--coverage"]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the three that need no index, and the one deliberately not added. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 the unindexed three"
name = "signature help and the two type navigations answer from what hover already reads"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "signature_help_names_the_active_parameter_of_the_enclosing_call",
  "signature_help_renders_a_core_row_and_a_declared_list_the_same_way",
  "type_definition_and_implementation_resolve_through_the_graph",
  "declaration_is_not_answered_because_it_would_answer_identically",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the completion arms. The enumeration test is the gate
# `rule:ide/completion-offers-only-what-the-compiler-derived` names: every source must name a table
# the compiler builds for another reason. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 the arms"
name = "every completion source names a table the compiler already builds"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "every_completion_source_names_a_compiler_table",
  "no_completion_source_reads_a_directory_layout_or_the_network",
  "a_namespace_segment_offers_the_registry_and_the_index_and_no_keywords",
  "a_bare_name_offers_the_imports_in_force_and_the_declarations_in_the_index",
]

[[check]]
kind = "cargo-named"
stage = "5 the arms"
name = "the php-name table is one build-time join and refuses a spelling that matches nothing"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "every_php_builtin_in_the_oracle_inventory_is_a_candidate",
  "a_destination_spelling_that_matches_no_registry_member_fails_the_build",
  "three_of_the_four_item_shapes_insert_nothing",
]

# ---------------------------------------------------------------------------------------------------
# Stage 6 -- inlay hints, bounded to the two shapes whose idiom has stopped moving. Goal prose stage 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 the hints"
name = "inlay hints read the recorded types and offer only the two settled shapes"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "an_inferred_var_declaration_carries_its_type_as_a_hint",
  "a_literal_argument_carries_its_parameter_name",
  "no_hint_is_produced_from_anything_the_type_phase_did_not_record",
]
