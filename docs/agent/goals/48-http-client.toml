# Goal 48 -- a program talks to a real API: bodies, headers, streams and pooled connections
# The acceptance test, as data.
#
# `48-http-client.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No example of its own: a program that talks to a real API needs a network, and every case below
  # answers its calls from `Core\Test`'s table instead.
]

[context]

modules = [
  # The door, the five rows, the one bag (:343-386) and the reply class. Stages 4, 5 and 6.
  "crates/nvs-stdlib/src/http.rs",
  # The exchange, framing (:543-548), the header guard (:336-375) and the hop. Stages 6, 7 and 8.
  "crates/nvs-stdlib/src/http/transport.rs",
  # `decompress_within` (:522-533), the one gzip bound. Stage 7.
  "crates/nvs-stdlib/src/compress.rs",
  # The encode walk `json:` applies the outbound exemption to, and `decodeAs`'s one walk. Stages 4, 5.
  "crates/nvs-stdlib/src/json.rs",
  # `Core\Http\Method`'s eight cases (:123-151). Stage 4.
  "crates/nvs-stdlib/src/router.rs",
  # `Core\Test`'s rows (:357-373), where the table joins them. Stage 3.
  "crates/nvs-stdlib/src/test.rs",
  # `jsonAs` (:305-313) and `bodyStream` (:314-320), the precedents stages 5 and 6 copy.
  "crates/nvs-stdlib/src/request.rs",
  # Where every row is registered, and the qualifier spellings (:302-377).
  "crates/nvs-stdlib/src/registry.rs",
  # `reject_keyless_retry` and the decode-site roster (:1517-1528). Stages 4 and 5.
  "crates/nvs-types/src/expr/args.rs",
  # `check_decode_sites` (:803-830), which `Response::jsonAs` joins. Stage 5.
  "crates/nvs-types/src/derive.rs",
  # The `[http.client]` rows the four new keys join. Stages 6 and 7.
  "crates/nvs-config/src/directive.rs",
  # The TLS session a pooled connection keeps (stage 7), the roots and key log (stage 9), and the policy
  # value a relaxed call hands in (stage 10).
  "crates/nvs-host/src/tls.rs",
  # `HttpClient` (:507) and `CapNet` (:300): `[http.client.tls]` and the six new grants. Stages 9-11.
  "crates/nvs-config/src/tree.rs",
  # The precedent a `roots` file is resolved and trust-checked by (:14-21). Stage 9.
  "crates/nvs-config/src/db.rs",
  # `pin_host` (:167), which the address and TLS grants are asked beside. Stages 10 and 11.
  "crates/nvs-runtime/src/capability.rs",
]

# Every stage works inside these three: the URL is a sink and the pin survives everything, no wait is
# unbounded, and a hop is re-checked.
rules = [
  "security/outbound-url-is-a-sink",
  "http-server/no-spelling-for-an-unbounded-wait",
  "http-server/redirects-are-off-and-every-hop-is-re-pinned",
]

adrs = []

shapes = [
  "A commit message",
  "A code comment",
]

milestones = ["M8:verify"]

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `48-http-client.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' `stage = "2 the record"` labels, which may group several prose stages under
# one acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The record: the two records the client already stands on, how members are spelled, the row it moves,
# and the two rules the four new `[http.client]` keys' classes and shipped values answer to.
rules = [
  "core-api/verb-lexicon",
  "core-api/shape-rules",
  "config/three-changeability-classes",
  "http-server/an-unsafe-or-unbounded-default-is-a-defect",
  "security/one-tls-client",
  "security/capability-question-is-grant-and-scope",
]
adrs = ["0074", "0058"]
spec = ["01 §16"]
shapes = ["A decision record", "A rule fragment", "Citing a document"]

[context.stage.3]
# The table answers in-process, the way `Core\Test::request` already does.
rules = ["testing/in-process-request"]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.4]
# A secret may be sent, a body may carry what a user wrote, and a dynamic verb still owes its key.
rules = [
  "security/secret-sinks-refuse",
  "http-server/a-non-idempotent-retry-needs-an-idempotency-key",
  "core-api/options-bag",
]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.5]
# A reply is input, and a decode into a shape is held to the codec rule.
rules = ["security/tainted-sources", "security/derived-codec-qualifiers"]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.6]
# A body saved to disk is bounded the way every disk write is.
rules = ["http-server/there-is-no-temp-file", "core-classes/io-write-stream"]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.7]
# The pool's precedent, and the deadline a stale connection must not stretch.
rules = ["security/db-pool-reset-is-a-boundary", "http-server/one-deadline-covers-the-whole-call"]

[context.stage.8]
# What a trace carries, and what a header value may never reach.
rules = ["security/secret-sinks-refuse", "observability/an-outbound-call-propagates-traceparent"]

[context.stage.9]
# The trust roots: a trust-checked file, a System key, and the mode a key log is refused in.
rules = [
  "security/one-tls-client",
  "config/three-changeability-classes",
  "config/ownership-is-the-trust-boundary",
]

[context.stage.10]
# A relaxation is a grant with a scope, asked of the request's snapshot, over the one client.
rules = ["security/one-tls-client", "security/capability-question-is-grant-and-scope"]
shapes = ["A `Core` member"]

[context.stage.11]
# The address a call names is still judged, and a reply's certificate chain is input.
rules = [
  "security/net-address-policy",
  "http-server/allow-url-pins-the-address",
  "security/tainted-sources",
]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.12]
shapes = ["A rule fragment"]

# Every buffer is a `Core` buffer charged through `nvs_runtime::budget`, and a pooled connection is a
# host handle rather than a refcounted value. No cycle shape, so nothing is added to the skip list.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# None of this goal's own checks needs a daemon. The floor is goal `webcrypto`'s whole list, which
# carries goal `finish-response`'s served-path and queue checks, and the daemons are theirs.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


