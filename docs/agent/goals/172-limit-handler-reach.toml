# Goal 172 -- every resource FATAL reaches the program's onLimit handler
# The acceptance test, as data.
#
# `172-limit-handler-reach.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No fixture of this goal's own: what it proves is asserted by conformance cases, and the
  # floor's own `exact` checks carry the fixtures. goal-switch.py unions the previous goal's
  # list into this one.
]

[context]

modules = [
  # The seam that reports a breach a member's body raised, and the one place that runs the
  # handler for the breach found ahead of a body -- the two halves of this goal's question.
  "crates/nvs-runtime/src/abi.rs",
  # Where the handler is registered, run, and kept from running twice.
  "crates/nvs-runtime/src/ctx/hooks.rs",
  # The balance, the ceiling and what a refusal records -- `affords` is what the member's loop asks.
  "crates/nvs-runtime/src/budget.rs",
  # The drain whose per-element ask raised the breach this goal is about, and the `# Known gaps`
  # item that states it.
  "crates/nvs-runtime/src/sequence.rs",
  # The array write that DOES reach the handler, which is the shape to match.
  "crates/nvs-runtime/src/array.rs",
]

# The rule the implementation is catching up to, and the tier a resource limit sits at.
rules = ["errors/on-limit", "errors/escalation-ladder", "programs/memory-priority"]

adrs = []

shapes = ["A commit message", "A `.nvst` test case"]

milestones = []

playbook = [
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > another agent',
  'Writing a test case > a rule*',
  'Writing a test case > a -p*',
  'Running things > target/release/nvs.exe is',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `172-limit-handler-reach.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' own `stage = "..."` labels, which may group several prose stages under one
# acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

# The environment tables of `docs/agent/goals/71-dossier.toml`, the goal this one was
# appended behind: a generated goal runs that goal's whole acceptance list as its
# floor, so it needs the same containers and the same WSL target. Regenerated,
# never hand-edited.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs", "examples/cache-shared-tls.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor carried in from the goal ahead of this one drives a database and a cache, so the
# daemon this table names is preflighted before this goal's first session.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-db", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. Goal prose stage 2.
#
# The case named here does not exist yet: it is written by the session that makes the handler run,
# beside `arr-from-over-a-sequence-with-no-end-is-stopped-by-the-memory-ceiling.nvst`, which pins
# the stop and deliberately asserts nothing about the handler.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "2 the handler runs"
name = "a breach raised inside a member's own loop runs the program's onLimit handler"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/arr-from-over-a-sequence-with-no-end-runs-the-on-limit-handler.nvst",
]
