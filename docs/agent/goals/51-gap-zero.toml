# Goal 51 -- the gap register is derived, empty, and the index that held it is gone.
# The acceptance test, as data.
#
# `51-gap-zero.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# The `want` strings on this goal's own command checks ARE the specification of `tools/owners.py`'s
# output: the tool does not exist when this is written -- goal `gap-owners` builds it and this goal widens it --
# so these lines are what it must print, not a transcript of what it does print.

files = [
  # `goal-switch.py` unions goal `config-is-written`'s list in. This goal names one of its own: stage 5's streaming
  # read is the only item here that changes what a program can observe, and SQLite is the one driver
  # a fixture can reach without a container (playbook, `a .nvst case can reach a live SQLite
  # database`).
  "examples/db-stream.nvs",
]

[context]

modules = [
  # ---- Stage 2 and 7: the register itself, and every reader of the file that is deleted.
  # The tool this goal widens rather than replaces; goal `gap-owners` builds it.
  "tools/owners.py",
  # The derivation shape both of them follow -- a worklist read off the tree, never copied.
  "tools/holes.py",
  # `CARRIED_GAPS` and the `--check` section that reads the deleted file's *Owner* column.
  "tools/playbook.py",
  # `--check` asserts that file's existence, which is the one floor check this goal replaces.
  "tools/chain.py",
  # A milestone's `Carried by` cell is derived here, and "uncarried" is what a deferral is checked against.
  "tools/plan.py",
  # Stage 7's re-pointing is only proven by this: a dangling link to a deleted file is the failure mode.
  "tools/check-links.py",
  # Stage 8 -- where the terminal gate joins the ordered run.
  "tools/verify.py",
  # The index under audit. It is read in stage 0, derived against in stage 3, and deleted in stage 7.
  "docs/agent/carried-gaps.md",
  # Its sibling one level down, which survives: `nvs-ir`'s refusal sites are a register, not an index.
  "docs/agent/carried-refusals.md",

  # ---- Stage 5: the largest thing the register still owes, one file set.
  # Gaps 5, 6 and 8 -- `stream` on one driver, `serverVersion` on none, `queryAs<T>` refusing at run time.
  "crates/nvs-stdlib/src/db/mod.rs",
  # `stream_step` and `unstreamed`: the PostgreSQL arm and the throw the other four take.
  "crates/nvs-stdlib/src/db/stream.rs",
  # `runs` and `no_dialect`: the roster that answers `false` for two of the five backends.
  "crates/nvs-stdlib/src/queue.rs",
  # The driver with no wire, and the one a `.nvst` case can reach: stage 5's cheapest proof.
  "crates/nvs-db/src/sqlite.rs",
  # The parked cursor every other driver needs one of, and the only working example of it.
  "crates/nvs-db/src/pg.rs",
  # Gap 1 -- the matrix has no socket leg, so `AF_UNIX` is asserted against no real server.
  "crates/nvs-db/src/matrix.rs",

  # ---- Stage 6: the rest of the register, already grouped by the files each group shares.
  # `Core\Metrics` has no class row, so nothing can read the exporter that ships.
  "crates/nvs-stdlib/src/registry.rs",
  # `Core\Process::spawn`; `run` is registered and is the whole of what there is.
  "crates/nvs-stdlib/src/process.rs",
  # Gaps 2-4: the plural rosters that throw, the absent ordinals, the eight refused pattern letters.
  "crates/nvs-stdlib/src/cldr.rs",
  # `html-to-source`'s computed `$reason`, which waited on a diagnostic band that has since opened.
  "crates/nvs-stdlib/src/html.rs",
  # The syntax four -- the group that shares files with nothing else in this goal.
  "crates/nvs-syntax/src/lib.rs",
  # Gap 6 -- `nvs check` builds no grants, so the host diagnostic fires for nobody.
  "crates/nvs-types/src/intrinsics.rs",
  # The fleet lease that parses, boots and is not armed.
  "crates/nvs-server/src/schedule.rs",
  # A cycle whose only closing edge is inside an `array<T>` survives the teardown sweep.
  "crates/nvs-runtime/src/object.rs",
  # This crate's own gap list, and the pointer at :99 that stage 7 re-writes.
  "crates/nvs-stdlib/src/lib.rs",
]

# The ordering an owner decision is taken under, and the two rules stage 5 is written inside. A rule
# id prints the fragment, which is the rule; 0004 is here as a record because the priority ordering is
# the map every judgement in this goal is made against, not one rule.
rules = [
  "0004",
  "programs/memory-priority",
  "core-classes/db-statement-members",
]

# None in the base. Stage 5 is the only stage whose design is argued in a record section rather than
# in a rule, and its table below is where that section is named.
adrs = []

shapes = ["A commit message", "A decision record", "A rule fragment"]

milestones = []

playbook = [
  # This goal's own file set and tools.
  'Tooling > a core class',
  'Writing a test case > a rule*',
  'Writing a test case > a -p*',
  'Writing a test case > No `.nvst` case can reach a live queue',
  'Writing a test case > A `close`d SQLite',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `51-gap-zero.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces. These are the PROSE stage numbers, not the
# `[[check]]` blocks' `stage = "..."` labels, which group several prose stages under one line.
# ---------------------------------------------------------------------------------------------------

# The register's own two gates, one level apart: an outstanding spec key names an owner, and a
# module-doc gap does. This stage makes them one roster and drops the third owner kind.
[context.stage.2]
rules = ["core-api/tier-roster"]

# Stage 5 is the goal's one ADR slot. `db-one-api` specifies section 4's behaviour and deliberately
# does not specify how a driver parks read state, which is the hole the new record fills; the queue's
# fourth dialect is ordered by a rule instead and needs no number.
[context.stage.5]
rules = [
  "core-classes/db-one-api",
  "core-classes/queue-storage-is-a-table",
  "concurrency/enqueue-commits-with-your-write",
]
spec = ["01 §18"]

# The two items stage 4 must tell apart, and they are the worked examples of the rule in both
# directions: an open decision leaves the register for its own fragment, and a shipped rule with no
# fixture is a proof gap the dossier owns rather than a hole this goal closes.
[context.stage.4]
rules = [
  "security/arena-is-an-ownership-root",
  "routing/a-shared-name-is-one-endpoint-everywhere",
]

# The one item in stage 6 whose refusal is specified by a rule rather than by the module doc: the
# diagnostic band it waited on has since opened, which is what makes it closable here.
[context.stage.6]
rules = ["core-classes/html-to-source"]

# Nothing this goal writes changes what a program allocates: the register is a tool, and stage 5's
# streaming read reduces what a large result holds rather than growing it. The floor's entries are
# unioned in.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Both. Its own stage 5 verifies `Core\Queue`'s new dialects and `stream` against real servers, and
# its floor carries goals `core-part-ii` through `server`'s container-backed checks -- the five-driver matrix among them. The
# driver stops the run before the first session when the daemon is absent, which is the whole point:
# six hours spent grinding against a check that cannot pass is worse than a stop in the first minute.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 and stage 8 -- the register, and the gate that keeps it true. Goal prose stages 2, 3, 4, 8.
#
# This is the goal's whole claim, so it is one check and not a suite: if the roster is empty of
# goal-owned items and of untagged ones, every stage below it has landed by construction. The three
# zeros are separate `want` lines on purpose -- a tool that stopped counting one of them would
# otherwise pass by printing less.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the register"
name = "no recorded gap names a goal, is unowned, or is untagged"
argv = ["python", "tools/owners.py", "--check"]
want = [
  "0 item(s) owned by a goal",
  "0 item(s) unowned",
  "0 item(s) untagged",
]

# The five registers that survive stage 7. `carried-gaps.md` is deliberately not among them: it is
# deleted, and a tool that still read it would be reading a file that cannot exist.
[[check]]
kind = "command"
stage = "2 the register"
name = "one roster over every register there is"
argv = ["python", "tools/owners.py", "--registers"]
want = [
  "module docs",
  "carried-refusals.md",
  "outstanding keys",
  "guard-name-debt.md",
  "playbook until",
  "5 register(s)",
]

# A deferral is earned or it is not a deferral. The milestone exists, it is uncarried, and its own
# file states the scope -- the three halves a tool can check, with the judgement half in the prose.
[[check]]
kind = "command"
stage = "2 the register"
name = "every deferral names an uncarried milestone whose plan states the scope"
argv = ["python", "tools/owners.py", "--deferrals"]
want = ["every deferral names an uncarried milestone"]

# The chain and the plan still agree after the register changed what a milestone's file says.
[[check]]
kind = "command"
stage = "2 the register"
name = "plan.py: the index and the chain still agree"
argv = ["python", "tools/plan.py", "--check"]
want = ["every cell agreeing with the chain"]


# ---------------------------------------------------------------------------------------------------
# Stage 5 -- `Core\Db` and `Core\Queue`, which is what goal `database`'s stages 3 and 8 still owe.
#
# The SQLite legs are the ones a fixture can reach: a `.nvst` case opens a `:memory:` block and no
# `.nvst` case can reach a live queue, so the queue's new dialects are proven in `nvs-stdlib`'s own
# tests against the compose servers and the matrix.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 db and queue"
name = "nvs-stdlib (stream, streamAs and serverVersion on every driver)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "stream_answers_on_every_driver_or_names_its_recorded_refusal",
  "stream_holds_one_row_and_not_the_result_set_on_every_driver",
  "a_second_statement_on_a_streaming_connection_is_a_logic_error_on_every_driver",
  "stream_as_answers_rows_at_the_class_it_was_written_with",
  "server_version_answers_what_the_connection_kept",
]

[[check]]
kind = "cargo-named"
stage = "5 db and queue"
name = "nvs-stdlib (the queue roster is five backends, or names what each is waiting on)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "queue_runs_on_sqlite",
  "every_statement_the_queue_sends_has_a_sqlite_text",
  "an_enqueue_commits_with_the_write_on_sqlite",
  "no_dialect_names_the_construct_a_backend_is_waiting_on",
]

# The matrix is the only place a driver claim is checked against a real server, and its want list is
# where a leg that silently stopped running shows up.
[[check]]
kind = "command"
stage = "5 db and queue"
name = "the five-driver matrix, streaming included"
argv = ["python", "tools/db-matrix.py", "--all"]
want = ["mysql: ok", "mariadb: ok", "postgres: ok", "mssql: ok", "sqlite: ok"]

[[check]]
kind = "nvs-suite"
stage = "5 db and queue"
name = "conformance (the streaming read, over the driver a case can reach)"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/db-stream-walks-a-sqlite-result-one-row-at-a-time.nvst",
  "tests/conformance/core/db-stream-as-answers-rows-at-a-written-type.nvst",
  "tests/conformance/core/db-server-version-answers-what-the-connection-kept.nvst",
]

[[check]]
kind = "exact"
stage = "5 db and queue"
file = "examples/db-stream.nvs"
want = [
  "walked 3 rows",
  "held 1 row at a time",
  "second statement refused: LogicError",
]


# ---------------------------------------------------------------------------------------------------
# Stage 6 -- everything else the register names, one check per file-set group.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "6 the rest of the register"
name = "nvs-stdlib (the members that ship with no way to name them)"
args = ["test", "-p", "nvs-stdlib"]
tests = [
  "core_metrics_is_a_registered_class",
  "process_spawn_is_a_registered_member",
  "every_cldr_plural_roster_answers_rather_than_throwing",
  "an_ordinal_is_formatted_from_the_same_roster",
]

[[check]]
kind = "cargo-named"
stage = "6 the rest of the register"
name = "nvs-diagnostics (the refusals that waited on a diagnostic band)"
args = ["test", "-p", "nvs-diagnostics"]
tests = [
  "a_computed_reason_is_refused_where_the_rule_says_it_is",
  "eight_pattern_letters_are_accepted_rather_than_refused",
]

[[check]]
kind = "cargo-named"
stage = "6 the rest of the register"
name = "nvs-syntax (the four shapes M1's corpus parse still refuses)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  "a_goto_label_parses",
  "a_grouped_use_parses",
  "var_is_a_property_declarator",
  "an_enum_case_may_be_named_with_a_keyword",
]

[[check]]
kind = "cargo-named"
stage = "6 the rest of the register"
name = "nvs-types, nvs-server, nvs-runtime (grants, the fleet lease, the array cycle)"
args = ["test", "--workspace"]
tests = [
  "nvs_check_builds_the_grants_its_own_diagnostic_reads",
  "a_fleet_entry_fires_at_most_once_under_a_lease",
  "a_cycle_closed_through_an_array_is_swept_at_teardown",
]

[[check]]
kind = "cargo-named"
stage = "6 the rest of the register"
name = "nvs-db (the matrix has a socket leg)"
args = ["test", "-p", "nvs-db"]
tests = ["a_unix_socket_leg_reaches_a_real_server"]


# ---------------------------------------------------------------------------------------------------
# Stage 7 -- the index is gone, and nothing points at it.
#
# `check-links.py` is the whole proof of the re-pointing: a deleted file that six documents still
# name is the failure this goal is about, one level up. This REPLACES the floor check "the durable
# gap list exists and every entry names an owner", which asserted the file's existence; the goal
# prose's Standing decisions section is the argument for the one trade.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "7 the index is gone"
name = "the index that held the register no longer exists"
argv = ["python", "tools/owners.py", "--check"]
want = ["docs/agent/carried-gaps.md: absent, as the register requires"]

[[check]]
kind = "command"
stage = "7 the index is gone"
name = "nothing in the tree points at the deleted file"
argv = ["python", "tools/check-links.py"]
want = ["no missing target"]

[[check]]
kind = "command"
stage = "7 the index is gone"
name = "every entry is still one the driver can walk"
argv = ["python", "tools/chain.py", "--check"]

# The retired owner kind leaves no reader behind either: `playbook.py --check` loses the section that
# read the deleted file's *Owner* column and keeps everything else it does.
[[check]]
kind = "command"
stage = "7 the index is gone"
name = "the playbook's own checks survive the file that is gone"
argv = ["python", "tools/playbook.py", "--check"]
want = ["every bullet ends with a trailer this tool can read"]


# ---------------------------------------------------------------------------------------------------
# Stage 8 -- it stays true. The gate is in the ordered run, so a gap added with a goal owner fails
# before it is committed rather than two milestones later.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "8 it stays true"
name = "verify.py runs the register's gate"
argv = ["python", "tools/verify.py", "--list"]
want = ["owners.py --check"]

[[check]]
kind = "command"
stage = "8 it stays true"
name = "brief.py routes to the register and prints its count"
argv = ["python", "tools/brief.py", "--where", "gap"]
want = ["tools/owners.py"]
