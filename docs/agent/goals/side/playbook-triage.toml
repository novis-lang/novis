# Side goal playbook-triage -- every playbook bullet names its file and expires by itself
# The acceptance test, as data.
#
# `playbook-triage.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No fixture of this goal's own: every check runs a tool over the tree. The side run unions
  # main's floor fixtures into this list, so the key is what has to be here.
]

[context]

modules = [
  # `fragments`, `read`, `anchors`, `named_paths`, `score`, `run_check`; `--triage` is added here.
  "tools/playbook.py",
  # `run_playbook` and `PROMOTED_WHOLE`: the traps section of the pack, which Stage 3 changes.
  "tools/orient.py",
  # The contract every bullet is written against.
  "docs/agent/playbook.md",
]

rules = []

adrs = []

shapes = ["A commit message", "A playbook bullet"]

milestones = []

playbook = [
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a commit',
  'Tooling > another agent',
]

plan = []

# The environment tables of the chain goal this was written beside: main's carried floor drives a
# database and a cache, so the daemon is preflighted before this goal's first session. The side
# run gives the WSL leg a target dir of its own.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs", "examples/cache-shared-tls.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-db", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the triage tool. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the triage tool"
name = "playbook.py --triage prints a section's bullets and what each still owes"
argv = ["python", "tools/playbook.py", "--triage", "splitting-a-file"]
want = ["triage: splitting-a-file:"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- a session is served the traps for its own files. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 served by file"
name = "orient.py --traps ranks the whole playbook by the paths it is given"
argv = ["python", "tools/orient.py", "--traps", "tools/session.py"]
want = ["THE TRAPS THAT APPLY HERE", "ranked from the whole playbook by the 1 path(s)"]

# ---------------------------------------------------------------------------------------------------
# Stages 4 to 8 -- the triage, one section at a time. Goal prose stages 4 to 8.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "4 triage: divergences, splitting"
name = "every divergences bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "divergences"]
want = ["triage: divergences: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "4 triage: divergences, splitting"
name = "every splitting-a-file bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "splitting-a-file"]
want = ["triage: splitting-a-file: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "5 triage: running-things"
name = "every running-things bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "running-things"]
want = ["triage: running-things: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "6 triage: writing-novis"
name = "every writing-novis bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "writing-novis"]
want = ["triage: writing-novis: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "7 triage: tooling"
name = "every tooling bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "tooling"]
want = ["triage: tooling: every bullet names a file and declares a condition the tree decides"]

[[check]]
kind = "command"
stage = "8 triage: writing-a-test-case"
name = "every writing-a-test-case bullet names a file and declares a condition the tree decides"
argv = ["python", "tools/playbook.py", "--triage", "writing-a-test-case"]
want = ["triage: writing-a-test-case: every bullet names a file and declares a condition the tree decides"]

# ---------------------------------------------------------------------------------------------------
# Stage 9 -- the gate and the contract. Goal prose stage 9.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "9 the gate"
name = "playbook.py --check: every bullet names a file in the tree"
argv = ["python", "tools/playbook.py", "--check"]
want = ["none -- every bullet names a file in the tree"]

[[check]]
kind = "command"
stage = "9 the gate"
name = "playbook.py --check: no bullet takes `reviewed`"
argv = ["python", "tools/playbook.py", "--check"]
want = ["none -- no bullet takes `reviewed`"]
