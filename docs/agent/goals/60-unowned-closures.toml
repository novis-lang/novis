# Goal 60 -- every unowned gap is built to the answer its decision sheet gave
# The acceptance test, as data.
#
# `60-unowned-closures.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# Most of this goal's work is fixed by the user's decision sheet, whose answers land in the module docs
# before the first session, so the register is the goal's claim: `unowned: 0` (goal `gap-register`'s
# `label: N` format) means every item was built, struck as a stated bound, or honestly deferred. The
# named tests below are the builds that needed no decision.

files = [
]

[context]

modules = [
  # Stage 2 -- the lowering and the runtime.
  "crates/nvs-ir/src/lower/operator.rs",
  "crates/nvs-ir/src/lib.rs",
  "crates/nvs-runtime/src/budget.rs",
  "crates/nvs-runtime/src/object.rs",
  "crates/nvs-runtime/src/lib.rs",
  # Stage 3 -- the checker and the front end.
  "crates/nvs-hir/src/requires.rs",
  "crates/nvs-types/src/ctor_init.rs",
  "crates/nvs-types/src/lateinit.rs",
  "crates/nvs-types/src/intrinsics.rs",
  "crates/nvs-types/src/derive.rs",
  # Stage 4 -- the library.
  "crates/nvs-stdlib/src/compress.rs",
  "crates/nvs-stdlib/src/json.rs",
  "crates/nvs-stdlib/src/db/mod.rs",
  # Stage 5 -- server, configuration, cache, schema.
  "crates/nvs-config/src/cache.rs",
  "crates/nvs-server/src/bounds.rs",
  "crates/nvs-server/src/route.rs",
  "crates/nvs-db/src/catalog.rs",
]

rules = [
  "0004",
  "programs/memory-priority",
  "security/db-pool-reset-is-a-boundary",
  "core-classes/derive-attribute",
]

adrs = []

shapes = ["A commit message", "A code comment"]

milestones = []

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. PROSE stage numbers; loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The runtime-raised exception's full backtrace amends this rule (a deliberate answer on the sheet).
rules = ["security/tainted-sources", "errors/throw-is-not-slower"]

[context.stage.3]
# M1's `use function` / `use const` refusal names this rule.
rules = ["classes/no-free-functions-or-constants"]
shapes = ["A `.nvst` test case"]

[context.stage.4]
shapes = ["A `Core` member", "A `.nvst` test case"]

[context.stage.6]
milestones = ["M10:lead"]

# A constant-time compare and a hook marker are both refcount-neutral; the decided items each state
# what they spend in their own module doc.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Stage 5's schema items are proven against the compose servers, and the floor carries every closure
# goal's container-backed checks, goal `m8-db-queue`'s five-driver matrix among them.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# The register -- the goal's whole claim. Goal prose stages 2 to 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "6 the register"
name = "no module-doc gap is unowned"
argv = ["python", "tools/owners.py"]
want = ["unowned: 0"]

[[check]]
kind = "command"
stage = "6 the register"
name = "every deferral names a future milestone whose plan states the scope"
argv = ["python", "tools/owners.py", "--deferrals"]
want = ["every deferral names a future milestone whose plan states the scope"]

# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the builds that needed no decision.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the lowering and the runtime"
name = "a secret against a mixed compares in constant time, and a hooked property is reached by key"
args = ["test", "--workspace"]
tests = [
  "a_secret_compared_against_a_mixed_string_takes_the_constant_time_helper",
  "an_erased_key_write_runs_the_properties_set_hook",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the builds that needed no decision.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the checker"
name = "a require path decodes like its string, and the autoload probe trace reaches the unit key"
args = ["test", "-p", "nvs-hir"]
tests = [
  "a_require_path_decodes_every_escape_its_string_does",
  "a_file_created_where_autoload_probed_invalidates_the_unit",
]

# ---------------------------------------------------------------------------------------------------
# Stages 4 and 5 -- the builds that needed no decision.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "4 the library"
name = "conformance (an incremental inflate is bounded per stream)"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/core/compress-a-stream-inflates-chunk-by-chunk-under-one-bound.nvst",
]

[[check]]
kind = "cargo-named"
stage = "5 the server and the cache"
name = "the server's connection bounds are configured, and a rebuilt compiler is a new cache key"
args = ["test", "--workspace"]
tests = [
  "server_connection_bounds_are_read_from_the_server_block",
  "two_builds_of_one_release_version_key_their_units_apart",
]
