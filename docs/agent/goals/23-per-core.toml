# Goal 23 -- `nvs serve` takes every core, and the compiled unit is shared.
# The acceptance test, as data.
#
# `23-per-core.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

files = [
  # No new fixture: every check here is a unit test or a measurement, and what a fan-out must not
  # change is the output of every fixture the floor already froze.
]

[context]

modules = [
  # Stage 3 -- the command that binds one socket today, and the module doc stating the rule that goes.
  "crates/nvs-cli/src/serve.rs",
  # Stage 2 -- the compiled-unit cache: the `RefCell`, the revalidation policy, the compile counter.
  "crates/nvs-cli/src/script.rs",
  # Stages 2-3 -- `NvsListener::from_std` at :336, the constructor written for exactly this fan-out.
  "crates/nvs-host/src/net.rs",
  # Stage 3 -- `Worker::spawn(cpu, ...)` at :273 and the pinning handshake priced per process start.
  "crates/nvs-host/src/lib.rs",
  # Stage 3 -- the accept loop, the backoff and the drain probe that each become per core.
  "crates/nvs-server/src/serve.rs",
  # Stage 4 -- admission: where a connection is taken or refused, per core.
  "crates/nvs-server/src/admit.rs",
  # Stage 2 -- `UnitKey`, the digests and `[opcache] validate`, which the swap is addressed by.
  "crates/nvs-config/src/cache.rs",
  # Stage 3 -- `[server] listen`, and where a `workers` key joins it.
  "crates/nvs-config/src/server.rs",
  # Stage 4 -- the in-flight ceiling's relaxed atomic, already written for a fleet.
  "crates/nvs-server/src/bounds.rs",
]

# 0097 is the server this fans out; 0017 is the swap the shared unit must keep working; 0006 is what an
# isolate may share; 0042 and 0061 are the other readers of the same digests; 0004 is what it spends.
rules = ["0097", "0017", "0006", "0042", "0061", "0116", "0004"]

# 0097 whole -- its ceiling, its backoff and its h2c refusal all argue from balanced cores.
adrs = ["0097", "0017 §3a", "0017 §5"]

shapes = ["An ADR", "A commit message"]

playbook = [
  'Writing Novis itself > core is',
  'Tooling > a core class',
  'Running things > adding a',
  'Running things > target/release/nvs.exe is',
  'Running things > a leak whose',
  'Writing a test case > a rule',
  'Writing a test case > a -p',
  'Writing a test case > a test binary',
  'Writing a test case > a multi-file',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole adr',
  'Tooling > a plan field is patched',
  'Tooling > plan.py --get',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# Its own checks need no container. The floor is goal 22's, which is goals 4-6's -- the drivers, the
# Redis tier and the session store -- so the daemon is the floor's requirement and not this goal's.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-cli", "crates/nvs-host"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the unit is shared and the swap has one publisher.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 shared unit"
name = "nvs-cli (one unit, many readers, one publisher)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "a_compiled_unit_is_read_by_every_core_through_one_arc",
  "a_revalidation_that_wins_publishes_and_readers_never_block_on_a_compile",
  "a_reader_holding_the_old_unit_keeps_answering_until_it_drops_it",
  "a_stale_revalidation_does_not_overwrite_a_fresher_published_one",
  "the_compile_counter_counts_compiles_and_not_cores",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the fan-out.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 fan-out"
name = "nvs-cli (every listen entry is bound, on every core)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "every_entry_of_server_listen_is_bound_rather_than_the_first",
  "one_worker_is_spawned_per_core_and_each_takes_its_own_listener_handle",
  "a_server_workers_key_bounds_the_count_and_defaults_to_available_parallelism",
  "a_unix_domain_entry_is_refused_once_rather_than_once_per_core",
  "listen_and_port_flags_still_override_the_file_and_still_conflict",
]

[[check]]
kind = "cargo-named"
stage = "3 drain"
name = "nvs-server (the drain is fleet-wide)"
args = ["test", "-p", "nvs-server"]
tests = [
  "is_draining_answers_the_same_on_every_core",
  "the_process_exits_when_the_last_cores_in_flight_count_reaches_zero",
  "a_disconnected_clients_isolates_are_left_behind_on_no_core",
  "the_accept_backoff_runs_per_core_and_one_cores_backoff_does_not_stall_another",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- nothing leaks across a core.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 isolation"
name = "nvs-server (the state-bleed suite, parameterised by core)"
args = ["test", "-p", "nvs-server"]
tests = [
  "the_state_bleed_suite_passes_across_a_core_boundary",
  "the_in_flight_ceiling_is_fleet_wide_so_a_hot_core_cannot_refuse_while_neighbours_idle",
  "the_watchdog_fires_per_worker_and_a_stalled_core_does_not_stall_the_fleet",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the number. The measurement is the check: a fan-out that does not scale is one to delete.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "5 measured"
name = "nvs-cli (serve scales with cores, by the margin the bench names)"
args = ["test", "-p", "nvs-cli"]
tests = [
  "serve_throughput_scales_from_one_core_to_four_by_the_margin_this_test_names",
  "ten_thousand_concurrent_cold_requests_for_one_file_compile_it_exactly_once",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- nothing a fan-out does changes an answer.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "5 suites"
name = "the conformance tree"
args = ["test", "tests/conformance/"]

[[check]]
kind = "nvs-suite"
stage = "5 suites"
name = "the differential tree"
args = ["test", "tests/differential/"]
