# ---------------------------------------------------------------------------------------------------
# Stage 10 -- the rulebook, and no gap left under this goal's name.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "10 the rulebook"
name = "a stream's parked read is shipped"
argv = ["python", "tools/rules.py", "--show", "core-classes/a-stream-parks-its-read-on-the-connection"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "10 the rulebook"
name = "serverVersion's answer is shipped"
argv = ["python", "tools/rules.py", "--show", "core-classes/server-version-is-what-the-server-said"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "10 the rulebook"
name = "a unique key's null semantics are shipped"
argv = ["python", "tools/rules.py", "--show", "core-classes/a-unique-key-reads-nulls-as-distinct"]
want = ["shipped"]

[[check]]
kind = "command"
stage = "10 the rulebook"
name = "no gap on the tree is still owned by this goal"
argv = ["git", "grep", "-n", "-F", "owner: m8-db-queue", "--", "crates", "tools"]
exit = "nonzero"
