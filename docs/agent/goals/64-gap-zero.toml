# Goal 64 -- no gap is owed by anyone but a future milestone, and the index that held them is gone
# The acceptance test, as data.
#
# `64-gap-zero.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# Every zero is written `label: 0` on purpose: `want` is a substring match, and `0 unowned` would also
# match `10 unowned`. Goal `gap-register` fixes that summary format.

files = [
]

[context]

modules = [
  # The gate this goal makes fatal, and the index it stops reading. Stages 2 and 3.
  "tools/owners.py",
  # `CARRIED_GAPS` and the report over the deleted file's Owner column. Stage 3.
  "tools/playbook.py",
  # `HOMES` and `OWNERS_HOME`. Stage 3.
  "tools/brief.py",
  # A manifest naming the deleted file. Stage 3.
  "tools/orient.py",
  # Where the gate joins the ordered run. Stage 2.
  "tools/verify.py",
  # `--past` and `done`. Stage 5.
  "tools/plan.py",
  # A dangling link to the deleted file is the failure mode. Stage 3.
  "tools/check-links.py",
  # The index, read one last time and then deleted.
  "docs/agent/carried-gaps.md",
  # The owner column's gate, and its example slug. Stages 2 and 3.
  "crates/nvs-stdlib/tests/spec_registry_coverage.rs",
]

rules = [
  "0004",
  "programs/memory-priority",
]

adrs = []

shapes = ["A commit message", "A code comment"]

milestones = []

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking", "Done"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `64-gap-zero.md`. PROSE stage numbers; loop-authoring.md
# section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
rules = ["core-api/tier-roster"]

# Nothing this goal writes allocates at run time.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# None of this goal's own checks needs a daemon. Its floor carries every closure goal's checks, goal
# `m8-db-queue`'s five-driver matrix among them, so all five services are preflighted.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the gate becomes fatal. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the gate"
name = "no recorded gap is owed by anyone but a future milestone"
argv = ["python", "tools/owners.py", "--check"]
want = [
  "goal-owned: 0",
  "unowned: 0",
  "untagged: 0",
  "past-milestone: 0",
  "retired-owner: 0",
]

[[check]]
kind = "command"
stage = "2 the gate"
name = "every deferral names a future milestone whose plan states the scope"
argv = ["python", "tools/owners.py", "--deferrals"]
want = ["every deferral names a future milestone whose plan states the scope"]

[[check]]
kind = "cargo-named"
stage = "2 the gate"
name = "nvs-stdlib (a ratchet key is owned by a live goal or a future milestone, never unowned)"
args = ["test", "-p", "nvs-stdlib", "--test", "spec_registry_coverage"]
tests = ["unowned_is_no_longer_an_owner_for_a_key"]

[[check]]
kind = "command"
stage = "2 the gate"
name = "verify.py runs the register's gate"
argv = ["python", "tools/verify.py", "--list"]
want = ["owners.py --check"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the index is gone, and nothing points at it. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 the index is gone"
name = "the index that held the register no longer exists"
argv = ["python", "tools/owners.py", "--registers"]
want = ["docs/agent/carried-gaps.md: absent, as the register requires", "5 register(s)"]

[[check]]
kind = "command"
stage = "3 the index is gone"
name = "nothing in the tree points at the deleted file"
argv = ["python", "tools/check-links.py"]
want = ["no missing target"]

[[check]]
kind = "command"
stage = "3 the index is gone"
name = "the playbook's own checks survive the file that is gone"
argv = ["python", "tools/playbook.py", "--check"]
want = ["none -- every path any bullet names still exists"]

[[check]]
kind = "command"
stage = "3 the index is gone"
name = "every entry is still one the driver can walk"
argv = ["python", "tools/chain.py", "--check"]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- CI is green on main. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "4 ci is green"
name = "the latest CI run on main succeeded"
argv = ["gh", "run", "list", "--branch", "main", "--workflow", "ci.yml", "--limit", "1", "--json", "conclusion"]
want = ["\"conclusion\":\"success\""]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the past milestones are complete. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 past milestones"
name = "all eleven past milestones are complete"
argv = ["python", "tools/plan.py", "--past"]
want = ["11 of 11 past milestone(s) complete"]

[[check]]
kind = "command"
stage = "5 past milestones"
name = "plan.py: every cell agrees with the chain, done included"
argv = ["python", "tools/plan.py", "--check"]
want = ["every cell agreeing with the chain"]
