# Goal 179 -- CI is green on main
# The acceptance test, as data.
#
# `179-ci-green.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.

# None of its own: no check below is an `exact` one. goal-switch.py unions the floor's list in.
files = []

[context]

modules = [
  # The check itself: what counts as "the run is for this code", and which paths are bookkeeping.
  "tools/ci-green.py",
  # Which lane a path turns on -- the first thing to read when a leg ran that should not have, or
  # did not run and should have.
  "tools/ci-changes.py",
]

# The lanes, and what a leg is for. The workflow file is `.github/workflows/ci.yml`, which is not
# a root a manifest can name; the goal prose names it.
rules = ["testing/ci-lanes"]

adrs = []

shapes = ["A commit message"]

milestones = []

playbook = [
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
  'Running things > target/release/nvs.exe is',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `179-ci-green.md`, holding what only that stage needs.
#
# `orient.py` applies the table whose number `handoff.md`'s `## Next group` names and appends it to
# the base above -- an overlay adds and never replaces, so the base is what a session needs whatever
# stage it is on, and the way it gets smaller is by moving an entry down here. A stage with nothing
# of its own needs no table. Narrowable: rules, adrs, spec, shapes, playbook, milestones.
#
# These are the PROSE stage numbers, the `## Stage N` headings in this goal's `.md`. They are not
# the `[[check]]` blocks' `stage = "..."` labels, which may group several prose stages under one
# acceptance line. loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's, not this goal's own: its one check talks to GitHub. The driver preflights the daemon
# before this goal's first session, and this table being here is what says so.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "redis"]
memoize_on = ["crates/nvs-server", "crates/nvs-db", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the run exists, and it is this commit's. Goal prose stages 2 and 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 ci is green"
name = "the latest CI run on main succeeded for the code HEAD holds"
argv = ["python", "tools/ci-green.py"]
want = ["the latest ci.yml run on main succeeded, and it ran the code HEAD holds"]
