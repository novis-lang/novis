# Goal 36 -- The extension guides an install instead of shipping a binary
# The acceptance test, as data.
#
# `36-editor-install.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# A `command` check is not a PROGRAM_KIND, so it runs ONCE between the legs rather than per leg.
# That is right here for the same reason it was right for goal `editor`: a TypeScript client has no
# calling convention, and the WSL leg exists for the one thing that does.

files = [
  # carried from the previous goal by tools/goal-switch.py; this goal names none of its own.
]

[context]

modules = [
  # The client, and the two-way binary choice at `:98` this goal replaces with three.
  "editors/vscode/src/extension.ts",
  # `series`/`refusal` -- what the client speaks, and the sentence stage 4 re-points.
  "editors/vscode/src/version.ts",
  # The frozen roster the two new command ids join. Added to, never renamed.
  "editors/vscode/package.json",
  # How a new suite directory becomes a ledger line: discovery, and the `name:` it prints.
  "editors/vscode/scripts/headless.mjs",
  # The dependency allowlist -- the reason the release-matrix pin is Rust and not a YAML parser.
  "editors/vscode/test/contributions/contributions.test.ts",
  # The seven targets, the archive names, `SHA256SUMS`, and the attestation. Stage 2's other half.
  ".github/workflows/release.yml",
  # `--package`'s own naming, which is what the archive name in `install.ts` has to match.
  "tools/release.py",
  # The shape stage 2's pin copies: a Rust test holding two files in different languages together.
  "crates/nvs-lsp/tests/extension_reference.rs",
  # The chapter stage 5 extends, and its § *What it does not do* that this goal does not empty.
  "docs/reference/tools/40-editor.md",
]

# The rule this goal lands, the one it amends, and the one that governs the two new ids.
rules = [
  "ide/the-extension-guides-an-install-and-never-bundles-one",
  "ide/the-extension-runs-where-the-binary-is",
  "ide/contributions-are-frozen-and-only-ever-added",
  "ide/the-extension-refuses-a-binary-it-does-not-understand",
]

# Empty: 0155's sections each argue one stage's design and sit in that stage's table below.
adrs = []

shapes = ["A commit message"]

milestones = []

playbook = [
  # This goal's own file set.
  'Tooling > tools/verify.py runs',
  "Tooling > editors/vscode/package.json's contributes",
  'Tooling > a cargo-named check counts',
  'Tooling > a cargo-named acceptance',

  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]',
  'Tooling > a loop-goal.toml',
  'Tooling > orient.py prints',
  'Tooling > another session',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `36-editor-install.md`, holding what only that stage needs.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
# The series the client speaks is what the table has to fetch; § 4 is why it is not "latest".
adrs = ["0155 §4"]

[context.stage.3]
# § 5 is the hash check and what it refuses; it is the whole of this stage's design.
adrs = ["0155 §5"]

[context.stage.4]
# § 2 the order, § 3 the offer, § 6 why no `nvs.path` write, § 7 the status item, § 8 the two ids.
adrs = ["0155 §2", "0155 §3", "0155 §6", "0155 §7", "0155 §8"]

[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# The floor's, not this goal's own: nothing here touches a database. Goal `serve-runs-the-queue`'s acceptance list
# carries the driver's `serve`-and-queue checks, and those need the daemon before the first session.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the keystone. The table that turns a machine into an archive name, held to the workflow
# that builds those archives. Rust rather than TypeScript because reading the workflow means a YAML
# parser, and `contributions.test.ts`'s allowlist is what refuses a new dependency. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the platform table"
name = "the target table and the release matrix name the same archives"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "the_extension_target_table_matches_the_release_matrix",
  "every_claimed_platform_pair_resolves_to_an_archive_the_workflow_builds",
]

# ---------------------------------------------------------------------------------------------------
# Stages 3 and 4 -- the fetch, its refusal, and the chain that decides which binary answers. One
# suite, `editors/vscode/test/install/`, which `scripts/headless.mjs` discovers and prints as
# `install:`. No network in a case: the fetch takes an injected transport and the cases feed it a
# fixture archive, a good `SHA256SUMS` and a tampered one. Goal prose stages 3 and 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "3 the install"
name = "vscode (headless, with the install suite)"
cwd = "editors/vscode"
argv = ["npm", "run", "--silent", "test:headless"]
want = ["grammar:", "contributions:", "protocol:", "install:", "0 failing"]

# `install:` covers the tampered archive that must be refused with nothing left on disk, the series
# selector against a release list spanning several of them, the three-candidate order with a managed
# copy present, and the two commands being the only path to the network.

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the reference chapter's install section. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 the reference"
name = "the one-file reference still regenerates from the binary"
argv = ["python", "tools/reference.py", "--check"]

[[check]]
kind = "command"
stage = "5 the reference"
name = "the extension heading owes no proof"
argv = ["python", "tools/dossier.py", "--only", "tools:editor/the-vs-code-extension", "--gate"]
