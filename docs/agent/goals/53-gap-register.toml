# Goal 53 -- one register reads every place a gap is written, and a milestone is an owner
# The acceptance test, as data.
#
# `53-gap-register.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# The `want` strings on the tool checks ARE the specification of `owners.py --registers`,
# `--deferrals` and `plan.py --past`: none of those modes exists when this is written.

files = [
]

[context]

modules = [
  # The register this goal widens rather than replaces. Stage 2 and stage 4's warning.
  "tools/owners.py",
  # The derivation shape `owners.py` follows -- a worklist read off the tree, never copied.
  "tools/holes.py",
  # `--past`, `done` in a `Carried by` cell, and `--check` accepting it. Stage 5.
  "tools/plan.py",
  # `until:` bullets are one of the registers; the retired-owner report is the shape to match.
  "tools/playbook.py",
  # `--where gap` routes to the index today. Stage 6.
  "tools/brief.py",
  # The index that is still read until goal `gap-zero` deletes it.
  "docs/agent/carried-gaps.md",
  # The refusal register, one of the five.
  "docs/agent/carried-refusals.md",
  # The owner column's gate. Stage 3.
  "crates/nvs-stdlib/tests/spec_registry_coverage.rs",
]

rules = [
  "0004",
  "programs/memory-priority",
]

adrs = []

shapes = ["A commit message", "A code comment"]

milestones = []

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `53-gap-register.md`, holding what only that stage needs.
# These are the PROSE stage numbers; loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.3]
rules = ["core-api/tier-roster"]

[context.stage.4]
shapes = ["A code comment"]

# Nothing this goal writes allocates at run time: two tool modes and a test's match arm.
[valgrind]
skip = []

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# None of this goal's own checks needs a daemon; its floor carries goals `core-part-ii` through
# `websocket-client`'s container-backed checks, and the daemons are theirs.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "redis"]
memoize_on = ["crates/nvs-syntax", "crates/nvs-types", "crates/nvs-ir", "crates/nvs-codegen"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- one roster over every register. Goal prose stage 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "2 the roster"
name = "one roster over every register there is"
argv = ["python", "tools/owners.py", "--registers"]
want = [
  "module docs",
  "carried-refusals.md",
  "outstanding keys",
  "guard-name-debt.md",
  "playbook until",
  "carried-gaps.md",
  "6 register(s)",
]

[[check]]
kind = "command"
stage = "2 the roster"
name = "a past-milestone tag is counted, and every recorded gap names an owner"
argv = ["python", "tools/owners.py", "--check", "--untagged-is-an-error", "--reasons"]
# A zero is written `label: 0` on purpose: `want` is a substring match, and `0 untagged` would also
# match `10 untagged`.
want = [
  "past-milestone:",
  "untagged: 0",
]

[[check]]
kind = "command"
stage = "2 the roster"
name = "every deferral names a future milestone whose plan states the scope"
argv = ["python", "tools/owners.py", "--deferrals"]
want = ["every deferral names a future milestone whose plan states the scope"]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the ratchet test learns the same owner kinds. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "3 the ratchet"
name = "nvs-stdlib (a ratchet key may be owned by a future milestone and not by a past one)"
args = ["test", "-p", "nvs-stdlib", "--test", "spec_registry_coverage"]
tests = [
  "every_outstanding_key_names_an_owner",
  "a_future_milestone_owns_a_key_and_a_past_one_does_not",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- owed work is written under one heading. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "4 one heading"
name = "no module doc records owed work outside its Known gaps block"
argv = ["python", "tools/owners.py"]
want = ["sections outside Known gaps: 0"]

# ---------------------------------------------------------------------------------------------------
# Stage 5 and 6 -- a past milestone says whether it is complete, and routing. Goal prose stages 5, 6.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 past milestones"
name = "each past milestone reports whether it is complete"
argv = ["python", "tools/plan.py", "--past"]
want = ["M0", "M4S", "M4B", "M8", "past milestone(s) complete"]

[[check]]
kind = "command"
stage = "5 past milestones"
name = "plan.py: the index and the chain still agree"
argv = ["python", "tools/plan.py", "--check"]
want = ["every cell agreeing with the chain"]

[[check]]
kind = "command"
stage = "6 routing"
name = "brief.py routes a gap question to the register"
argv = ["python", "tools/brief.py", "--where", "gap"]
want = ["tools/owners.py"]
