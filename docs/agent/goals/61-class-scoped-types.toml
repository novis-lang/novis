# Goal 61 -- a shape a class owns is named inside it
# The acceptance test, as data.
#
# `61-class-scoped-types.md` is the prose. One home each.
#
# THE EXPECTED OUTPUT BELOW IS FROZEN; A FIXTURE'S *SOURCE* IS NOT.
#
# Every named test and every conformance case below is one this goal writes: none of them exists when
# the goal is queued, and writing each is how its item finishes.

files = [
  # goal-switch.py unions the previous goal's fixtures into this list; nothing here is new.
]

[context]

modules = [
  # The class-member dispatch and `parse_type_alias_decl`. Stage 2.
  "crates/nvs-syntax/src/parser/decl.rs",
  # `Owner::Name` in type position, the `TypeAtom::Member` site. Stage 2.
  "crates/nvs-syntax/src/parser/ty.rs",
  # `ClassMemberKind` gains the arm; `TypeAliasDecl` is reused. Stage 2.
  "crates/nvs-syntax/src/ast.rs",
  # The alias table and its collector, keyed by owner. Stage 2.
  "crates/nvs-hir/src/aliases.rs",
  # `declare`, `check_alias_is_not_a_bare_class`. Stages 2 and 3.
  "crates/nvs-hir/src/resolve.rs",
  # The doc-comment check over a `TypeAliasDecl`. Stage 2.
  "crates/nvs-hir/src/members.rs",
  # `lower_member_type`'s third meaning and `resolve_name_type`'s owner-first lookup. Stage 2.
  "crates/nvs-types/src/lower.rs",
  # The one new code, stage 3.
  "crates/nvs-diagnostics/src/lib.rs",
  # Layout of the member. Stage 4.
  "crates/nvs-fmt/src/lib.rs",
  # `user_alias_json`, nested under the owner. Stage 4.
  "crates/nvs-cli/src/meta.rs",
  # Go-to-definition on the member. Stage 4.
  "crates/nvs-lsp/src/definition.rs",
  # Document symbols nest it under the owner. Stage 4.
  "crates/nvs-lsp/src/symbols.rs",
  # Semantic tokens colour it as a type. Stage 4.
  "crates/nvs-lsp/src/semantic.rs",
  # Completion after `Owner::` in type position. Stage 4.
  "crates/nvs-lsp/src/completion.rs",
]

# The two rules every stage is written inside: what an alias is, and what a shape is.
rules = [
  "types/type-alias",
  "types/shape-type",
]

adrs = []

shapes = ["A commit message", "A code comment", "A `.nvst` test case"]

milestones = []

playbook = [
  # The process traps, by hand.
  'Tooling > the end',
  'Tooling > one call reads',
  'Tooling > a whole decision record',
  'Tooling > a plan field is patched',
  'Tooling > a commit',
  'Tooling > a [context]*',
  'Tooling > orient.py prints',
  'Tooling > another agent',
  # Ranked by `python tools/playbook.py --goal` against this goal's modules.
  "Tooling > a loop-goal.toml check's -p",
  'Tooling > a diagnostic constant',
  'Writing Novis itself > a type name a',
  'Writing a test case > a nvs-types test that compiles',
  'Writing a test case > a refusal only a',
  'Running things > nvs-lsp gaining',
]

plan = ["Open now", "Blocking"]


# ---------------------------------------------------------------------------------------------------
# THE STAGES. One table per prose stage in `61-class-scoped-types.md`, holding what only that stage
# needs. These are the PROSE stage numbers; loop-authoring.md section 2 is the whole of it.
# ---------------------------------------------------------------------------------------------------

[context.stage.2]
rules = [
  "types/alias-is-never-a-bare-class",
  "types/constant-in-type-position",
  "types/enum-case-type",
]

[context.stage.3]
rules = [
  "statements/nothing-gets-a-second-name",
  "classes/no-free-functions-or-constants",
]

[context.stage.4]
rules = [
  "tooling/fmt-novis-constructs",
  "tooling/meta-json-takes-a-program",
  "tooling/doc-comment-attaches-to-the-next-declaration",
]

[context.stage.5]
adrs = ["0015 §5"]
shapes = ["A rule fragment", "A decision record"]

# Nothing this goal writes exists past the checker; the skip list is the floor's.
[valgrind]
skip = ["examples/fatal.nvs", "examples/uncaught.nvs", "examples/cache-shared-socket.nvs", "examples/queue-sqlite.nvs"]

[wsl]
target_dir = "/var/tmp/nvs-target-wsl"

# None of this goal's own checks needs a daemon. Its floor carries goal `m8-db-queue`'s five-driver
# matrix, so all five services are preflighted.
[docker]
compose = "tests/db/compose.yaml"
services = ["postgres", "mysql", "mariadb", "mssql", "redis"]
memoize_on = ["crates/nvs-db", "crates/nvs-stdlib", "tests/db"]


# <<< goal-switch: floor checks are inserted below this line >>>


# ---------------------------------------------------------------------------------------------------
# Stage 2 -- the member, its key, and the two spellings. Goal prose stages 0 and 2.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "2 the member"
name = "nvs-syntax (a type alias parses as a member of a class, an interface and an enum)"
args = ["test", "-p", "nvs-syntax"]
tests = [
  "a_type_alias_is_a_class_member",
  "a_type_alias_is_an_interface_and_an_enum_member",
]

[[check]]
kind = "cargo-named"
stage = "2 the member"
name = "nvs-hir (the alias table keys a class-scoped alias by its owner)"
args = ["test", "-p", "nvs-hir"]
tests = [
  "a_class_scoped_alias_is_keyed_by_its_owner_and_not_by_a_namespace_path",
  "a_cycle_through_a_class_scoped_alias_is_refused",
  "a_class_scoped_alias_of_a_bare_class_is_refused",
]

[[check]]
kind = "cargo-named"
stage = "2 the member"
name = "nvs-types (the two spellings and the file-scope form are one type)"
args = ["test", "-p", "nvs-types"]
tests = [
  "owner_name_and_a_bare_name_inside_the_owner_lower_to_the_file_scope_shape",
  "an_alias_left_of_a_double_colon_expands_before_the_member_is_read",
]

[[check]]
kind = "nvs-suite"
stage = "2 the member"
name = "conformance (a class-scoped alias is transparent, agrees with the file-scope form, and is a member of all three bodies)"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/lang/a-class-scoped-type-alias-is-the-shape-it-names.nvst",
  "tests/conformance/lang/a-class-scoped-type-alias-agrees-with-the-file-scope-form.nvst",
  "tests/conformance/lang/an-interface-and-an-enum-own-a-type-alias-too.nvst",
  "tests/conformance/lang/an-alias-left-of-a-double-colon-names-its-enum.nvst",
]

# ---------------------------------------------------------------------------------------------------
# Stage 3 -- the refusals. Goal prose stage 3.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "nvs-suite"
stage = "3 the refusals"
name = "conformance (every refusal a class-scoped alias has is pinned by name)"
args = ["test", "tests/conformance/"]
cases = [
  "tests/conformance/reject/a-class-scoped-type-alias-takes-no-modifier.nvst",
  "tests/conformance/reject/a-class-scoped-type-alias-does-not-share-a-name-with-a-constant-or-a-case.nvst",
  "tests/conformance/reject/a-class-scoped-type-alias-is-not-inherited.nvst",
  "tests/conformance/reject/a-class-scoped-type-alias-of-a-bare-class-is-refused.nvst",
  "tests/conformance/reject/a-type-alias-declared-inside-a-body-is-refused-by-name.nvst",
]

# ---------------------------------------------------------------------------------------------------
# Stage 4 -- the tooling sees the member. Goal prose stage 4.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "cargo-named"
stage = "4 the tooling"
name = "nvs-fmt (a class-scoped alias has one layout and formats to itself)"
args = ["test", "-p", "nvs-fmt"]
tests = ["a_class_scoped_type_alias_has_one_layout"]

[[check]]
kind = "cargo-named"
stage = "4 the tooling"
name = "nvs-cli (nvs meta --json nests a class-scoped alias under its owner)"
args = ["test", "-p", "nvs-cli"]
tests = ["meta_json_nests_a_class_scoped_alias_under_its_owner"]

[[check]]
kind = "cargo-named"
stage = "4 the tooling"
name = "nvs-lsp (definition, symbols, semantic tokens and completion see the member)"
args = ["test", "-p", "nvs-lsp"]
tests = [
  "definition_of_owner_name_in_type_position_is_the_member",
  "document_symbols_nest_a_class_scoped_alias_under_its_owner",
  "a_class_scoped_alias_is_a_type_token",
  "completion_after_owner_double_colon_in_type_position_offers_the_alias",
]

# ---------------------------------------------------------------------------------------------------
# Stage 5 -- the rule and the record. Goal prose stage 5.
# ---------------------------------------------------------------------------------------------------

[[check]]
kind = "command"
stage = "5 the rule"
name = "the rulebook renders and every fragment the record names exists"
argv = ["python", "tools/rules.py", "--check"]

[[check]]
kind = "command"
stage = "5 the rule"
name = "the class-scoped alias is a shipped rule the pack can print"
argv = ["python", "tools/peek.py", "rule:types/class-scoped-alias"]
want = ["docs/rules/types/class-scoped-alias.md"]
