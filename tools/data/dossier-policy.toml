# What each kind of feature owes, and the features excused from one proof.
#
# `python tools/dossier.py --help` owns the mechanism; `tools/dossier.py`'s `POLICY` holds the
# defaults this file overrides. ADR 0134 is why the feature proofs exist at all.
#
# Three sections, all optional:
#
#   [all]                     every kind at once -- `perf = false` switches the proof off durably
#   [<kind>]                  one kind: member, lang, exception, enum, interface, tool, directive
#   [skip."<feature id>"]     one feature excused from one proof, with the reason as the value
#
# A skip is a recorded decision, not a gap: the reason prints in the audit, so "this cannot be
# measured" and "nobody wrote one" never look the same. Write it as a sentence a stranger can judge.

# ---------------------------------------------------------------------------------------------
# Per-kind overrides. Empty means the defaults in tools/dossier.py stand:
#   member    2 tests (>=1 from Rust), 3 examples, perf, 1 attack
#   lang      2 tests,                 3 examples, perf, 1 attack
#   exception 1 test,                  1 example,  --,   1 attack
#   enum      1 test,                  1 example,  --,   --
#   interface 1 test,                  1 example,  --,   --
#   tool      1 test,                  1 example,  --,   1 attack
#   directive 1 test,                  1 example,  --,   1 attack
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# What `--perf-report` lists under Candidates. Advisory, never a gate: a row is where a person
# with a profiler looks first. `outlier_factor` is how far above its group's median a member's
# `units` figure sits before it is listed; `ceiling.<complexity>` is an absolute `units` figure
# a bench declaring that complexity is listed past, whatever its neighbours cost. The unit is
# one iteration of benches/members/_calibration/unit.nvs. Empty means tools/dossier.py's REPORT.
# ---------------------------------------------------------------------------------------------

[report]
outlier_factor = 5

[report.ceiling]
constant = 100

# ---------------------------------------------------------------------------------------------
# Features excused from a proof.
# ---------------------------------------------------------------------------------------------

[skip]

# A program can end exactly once, so there is no loop to put the feature in: a bench would
# time process startup and JIT warm-up rather than `exit`, and re-measuring it would report
# movement in everything except the thing being measured.
[skip."lang:programs/ending-a-program"]
perf = "A program ends once, so nothing can be iterated: a bench here would measure startup, not `exit`."

# Every construct in this feature is a compile error, so no program containing one runs at all. A
# bench would have to be written out of the *replacements* — `Core\Str::length`, `as`, `[...]`,
# `require` — each of which is a feature of its own with its own figure.
[skip."lang:expressions/refused-in-expression-position"]
perf = "Every construct here is a compile error, so there is no program to iterate; the replacements carry their own figures."

# Every row of this table is an operator that does not compile, so a bench would have to iterate the
# replacements — `&&`, `!=`, `as`, `Core\Arr::underlay`, `Core\Str::at` — and each of those is a
# feature of its own that carries its own figure.
[skip."lang:expressions/operators-php-has-that-do-not-parse"]
perf = "Every operator here is a compile error, so there is no program to iterate; the replacements carry their own figures."

# Every name in this feature is one the compiler does not declare, so a program holding any of them
# never reaches the loop a bench needs. The replacements are `lang:iteration/the-two-interfaces` and
# `lang:iteration/materialising-a-sequence-core-arr-from`, and each carries its own figure.
[skip."lang:iteration/what-does-not-exist"]
perf = "Every name here is a compile error, so there is no program to iterate; the replacements carry their own figures."

# Every name in this feature is one the compiler does not declare or does not parse, so a program
# holding any of them never reaches the loop a bench needs. The replacements are
# `lang:concurrency/core-task-all-a-fixed-set-of-tasks`, `lang:concurrency/core-task-map-one-task-per-element`
# and `lang:concurrency/isolates-spawn-script-and-await`, and each carries its own figure.
[skip."lang:concurrency/what-does-not-exist"]
perf = "Every name here is a compile error, so there is no program to iterate; the replacements carry their own figures."

# All three refusals — a magic method, an anonymous class, a nested class — are compile errors, so no
# program holding one reaches the loop a bench needs. The replacements are `lang:classes/property-hooks`,
# `lang:classes/propertyobserver`, `lang:classes/stringable` and `lang:classes/declaring-a-class`, and
# each already carries its own figure.
[skip."lang:classes/what-a-class-cannot-declare"]
perf = "Every declaration here is a compile error, so there is no program to iterate; the replacements carry their own figures."

# A program reaches this ending exactly once, so a loop around it is impossible and a bench would
# report process startup and JIT warm-up moving instead. The cost of the throw itself is
# `lang:errors/throw`'s figure, measured against `rule:errors/throw-is-not-slower`, and what the
# floor does with the record afterwards is off the request path by construction.
[skip."lang:errors/an-uncaught-throw"]
perf = "A program ends once at an uncaught throw, so there is nothing to iterate; `lang:errors/throw` carries the throw's own figure."

# The same ending, reached from the other side, and the skip is the sibling's argument unchanged: a
# `FATAL` stops the request where it stands, so the loop a bench needs cannot be written around one.
# What is on the request path is the accounting that decides the breach, which every allocating
# member's own figure already carries, and `rule:errors/on-limit`'s handler runs once out of a
# reserve that exists so it can.
[skip."lang:errors/fatal-errors-limits-no-catch-sees"]
perf = "A `FATAL` stops the program where it stands, so there is nothing to iterate; the allocation accounting that reaches the ceiling is measured by every allocating member's own figure."

# `#[Api]` is read while the program is compiled and reaches nothing the running program can
# observe: `Core\Attributes::get` answers `null` for it, since `rule:attributes/api-adds-and-cannot-contradict`
# makes it compiler-recognized rather than a userland shape, and the document it feeds is written by
# `nvs build --openapi` without running anything. A loop could only iterate the annotated handler,
# which measures a method call. What the checking itself costs is compile time, which
# `benches/abi-probe/` and the compiler's own figures own.
[skip."lang:attributes/core-api-and-the-openapi-document"]
perf = "`#[Api]` is read while the program compiles and has no runtime surface to iterate; a loop here would measure the annotated method call instead."

# Recognizing a name is name resolution plus a lookup in `crates/nvs-types/src/derive.rs`'s closed
# table, and both are over before the program starts. What a recognized name reaches at run time is
# whatever it built — a codec, a route row, a command row — and each of those carries its own figure
# under this same group, so a loop written here would re-measure one of them and attribute it to the
# recognition. What the resolution itself costs is compile time, which `benches/abi-probe/` and the
# compiler's own figures own. The literal stays retrievable either way, and that read is
# `lang:attributes/reading-attributes-back-core-attributes-get-and-all`'s figure.
[skip."lang:attributes/the-names-the-compiler-acts-on"]
perf = "A name is recognized while the program compiles and reaches nothing at run time; a loop here would re-measure the codec, route or command row the recognized attribute built, each of which carries its own figure."

# The member dials the store an operator configured, and a sweep runs no such store: with none
# configured every iteration is the refusal rather than the tier, and with one configured the four
# counts are a round trip over a socket to a server this repository does not build, so the figure
# moves with that server's version and the link rather than with Novis. The two tiers this one is
# compared against are in memory and carry their own figures; what a shared read costs beside them
# is a deployment's own measurement, taken where its store actually is.
[skip."Core\\Cache::shared"]
perf = "The member dials a store the sweep does not run: unconfigured, every iteration measures the refusal, and configured, it measures another server and the network between them rather than Novis."
