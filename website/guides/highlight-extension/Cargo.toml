[package]
name = "highlight"
version = "0.1.0"
edition = "2024"
publish = false

# A `cdylib` builds one wasm file for `nvs ext build` to pack.
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
# The syntax highlighter. `default-syntaxes` contains the grammars of many
# languages. `regex-fancy` uses a regex library written in Rust, which builds
# for WebAssembly.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# This table makes the project its own workspace. Without it, a project inside
# another Cargo workspace is built as part of that workspace.
[workspace]
