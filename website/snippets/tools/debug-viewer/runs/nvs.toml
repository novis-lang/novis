# send-receipts runs once when the server starts, and it throws an error.
# alert-team runs after a scheduled job fails.
[server]
workers = 1

[db.team]
driver = "sqlite"
path = ":memory:"

[capabilities.db]
connect = ["team"]

[[schedule]]
name = "send-receipts"
on = "start"
script = "jobs/send-receipts.nvs"
scope = "host"

[[schedule]]
name = "alert-team"
on = "failed"
script = "jobs/alert-team.nvs"
scope = "host"

[schedule.grants.db]
connect = ["team"]
