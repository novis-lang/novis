[package]
name = "mwl-stdlib"
description = "MWL Tier 0 standard library: the `Core` namespace's native Rust members and the signature registry the compiler resolves them through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mwl-runtime.workspace = true
unicode-segmentation.workspace = true

# ---------------------------------------------------------------------------
# This crate cannot inherit the workspace lint policy, for exactly
# mwl-runtime's reason and no wider one: every `Core` member is an ADR 0002
# helper entry point, so it is an `extern "C"` function decoding raw pointers,
# which the workspace's `forbid` would make unwritable. `deny` instead, so each
# genuinely necessary block is allowed individually with a stated reason — the
# policy in docs/implementation-plan.md's "Unsafe policy" section, which names
# this crate. Nothing else here is unsafe: a member's body is ordinary safe
# Rust over `mwl-runtime`'s own safe handles.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
