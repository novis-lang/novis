[package]
name = "nvs-ext"
description = "Novis extensions: the `.nvsx` manifest and section reader, and the wasmtime host that loads and runs a component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# No doc comment in this crate has a runnable example, so `cargo test` does
# not run rustdoc over it. A crate that gains one deletes this table.
doctest = false

[features]
default = ["engine", "pack"]
# The wasmtime host. The checker and the language server read manifests and
# never instantiate, so they take this crate with `default-features = false`
# and do not link wasmtime. `component-model` for a component guest, `async`
# for a call the request's coroutine polls, `pooling-allocator` for one slot
# per instance. wasmtime's defaults already carry all three; naming them keeps
# them on if the workspace entry ever turns the defaults off.
engine = [
    "dep:nvs-config",
    "dep:wasmtime",
    "dep:wasmtime-wasi-io",
    "dep:rand",
    "wasmtime/component-model",
    "wasmtime/async",
    "wasmtime/pooling-allocator",
]
# The packer behind `nvs ext build`, which componentizes a core module with
# `wit-component`. A loader that never packs leaves it off.
pack = ["dep:wit-component", "dep:wit-parser"]

[dependencies]
# The entry's grants and the caller's capabilities, which `grants` intersects.
nvs-config = { workspace = true, optional = true }
rand ={ workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasmparser.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi-io = { workspace = true, optional = true }
wit-component = { workspace = true, optional = true }
wit-parser = { workspace = true, optional = true }

[build-dependencies]
# `build.rs` compiles the packer's source files into itself, so it takes their
# dependencies, and `sha2` for the built-in components' pins.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasmparser.workspace = true
wit-component.workspace = true
wit-parser.workspace = true

[dev-dependencies]
# The failure tests pin the class and limit names this crate hands the host to
# the runtime's own spellings. A dev-dependency only: the library never links it.
nvs-runtime.workspace = true
# How the fixture test reaches `tests/conformance/ext/fixtures/`.
nvs-repo.workspace = true
wat.workspace = true
# The WASI test builds one probe component per WASI interface from the WIT
# alone: `dummy-module` makes the core module a world needs.
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser.workspace = true
# The outbound HTTP test sends a guest's request as `nvs serve` does, through
# `nvs_stdlib::extension_send` under a context built from an `nvs.toml` text.
# `nvs-stdlib` takes this crate as a dev-dependency only, so neither library
# links the other.
nvs-stdlib.workspace = true
toml.workspace = true
# The same test's untrusted `https` origin: a self-signed certificate and the
# server end of its handshake, on the provider `nvs-host` already carries.
rcgen.workspace = true
rustls.workspace = true
# The native arm of `image_guest`: the image component's codec core built for
# the host, run on the same input and plan as the guest.
nvs-image.workspace = true
# The QR checks of `image_analysis` read each code back to its data.
rqrr.workspace = true

# Times both arms of `image_guest` in a release build and, with `--record`,
# writes `benches/results/image-guest.json`. Its own loop rather than
# criterion's, because the figure it commits is one median per arm.
[[bench]]
name = "image_guest"
harness = false
required-features = ["engine", "pack"]

[[test]]
name = "image_guest"
required-features = ["engine", "pack"]

[[test]]
name = "builtin"
required-features = ["engine", "pack"]

[[test]]
name = "image_decode"
required-features = ["engine", "pack"]

[[test]]
name = "cache"
required-features = ["engine", "pack"]

[[test]]
name = "call"
required-features = ["engine"]

[[test]]
name = "convert"
required-features = ["engine", "pack"]

[[test]]
name = "failure"
required-features = ["engine"]

[[test]]
name = "fixtures"
required-features = ["engine", "pack"]

[[test]]
name = "files"
required-features = ["engine"]

[[test]]
name = "http"
required-features = ["engine"]

[[test]]
name = "grants"
required-features = ["engine"]

[[test]]
name = "load"
required-features = ["engine", "pack"]

[[test]]
name = "pack"
required-features = ["engine", "pack"]

[[test]]
name = "wasi"
required-features = ["engine"]

# @generated by `bun nv lints` -- edit `[workspace.lints]` in the root manifest.
# This crate is on that command's `UNSAFE_CRATES` roster, so it restates the
# workspace table with `unsafe_code = "deny"`: cargo will not let a manifest
# inherit `[workspace.lints]` and override one entry, and `forbid` is not
# something an individual `#[allow(unsafe_code, reason = ...)]` can relax.

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
