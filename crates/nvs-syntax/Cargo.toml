[package]
name = "nvs-syntax"
build = "../../tools/build/tests_without_pdb.rs"
description = "Lexer and parser for Novis: dual-mode source (inline HTML + code), AST with spans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nvs-diagnostics.workspace = true
# The `rule:security/bidi-predicate` check, which the lexer calls per source span. It lives in
# `nvs-render` rather than here because `rule:errors/diagnostic-record` makes
# that crate the leaf both the runtime and the front end depend on, and
# `rule:errors/record-transformations` routes the rendering's
# bidi transformation through the same predicate — so the module moved down
# there when `rule:errors/engine-floor` became a dependent, and this is the
# edge that keeps it one implementation instead of two.
nvs-render.workspace = true

[dev-dependencies]
insta.workspace = true
# How this crate's tests reach files outside the package.
nvs-repo.workspace = true

[lints]
workspace = true
