[package]
name = "nvs-syntax"
description = "Lexer and parser for Novis: dual-mode source (inline HTML + code), AST with spans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nvs-diagnostics.workspace = true
# ADR 0087's bidi predicate, which the lexer calls per source span. It lives in
# `nvs-render` rather than here because ADR 0092 § 1 makes that crate the leaf
# both the runtime and the front end depend on, and § 5 routes the rendering's
# bidi transformation through the same predicate — so the module moved down
# there when ADR 0020 § 6's tier-4 floor became a dependent, and this is the
# edge that keeps it one implementation instead of two.
nvs-render.workspace = true

[dev-dependencies]
insta.workspace = true
# How this crate's tests reach files outside the package.
nvs-repo.workspace = true

[lints]
workspace = true
