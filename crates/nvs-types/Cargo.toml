[package]
name = "nvs-types"
description = "Novis type checker: interned declared types, local definite assignment, the arithmetic result-type table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nvs-diagnostics.workspace = true
nvs-syntax.workspace = true
nvs-hir.workspace = true
nvs-stdlib.workspace = true
rustc-hash.workspace = true

# `core_lib.rs`'s `process_exec_is_deny_by_default` reads the capability a
# registry row names, and ADR 0118 § 3 puts that enum in `nvs-config` -- so the
# assertion has to name `Cap::ProcessExec` itself rather than a string. A
# dev-dependency and not a dependency: the checker resolves signatures and asks
# nothing of the configuration.
[dev-dependencies]
nvs-config.workspace = true

[lints]
workspace = true
