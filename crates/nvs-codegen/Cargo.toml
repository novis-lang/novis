[package]
name = "nvs-codegen"
description = "Novis's baseline Cranelift backend: lowers nvs-ir to native code behind the ADR 0002 calling convention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nvs-ir.workspace = true
nvs-runtime.workspace = true
nvs-stdlib.workspace = true
cranelift.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
nvs-diagnostics.workspace = true
nvs-syntax.workspace = true
nvs-hir.workspace = true
nvs-types.workspace = true

# ---------------------------------------------------------------------------
# This crate cannot inherit the workspace lint policy. Handing a JIT-compiled
# code pointer back as a callable function is a transmute, and there is no
# safe spelling of it — the workspace's `forbid` would make a JIT
# unimplementable. `deny` instead, so each genuinely necessary block is
# allowed individually with a stated reason — the policy in
# docs/implementation-plan.md's "Unsafe policy" section, which names this
# crate alongside nvs-runtime.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
