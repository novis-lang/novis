[package]
name = "nvs-cli"
description = "The nvs command-line binary: ast/check (M1-M2), run (M3), test (M4), info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nvs"
path = "src/main.rs"

[dependencies]
nvs-diagnostics.workspace = true
nvs-syntax.workspace = true
nvs-hir.workspace = true
nvs-types.workspace = true
nvs-ir.workspace = true
nvs-codegen.workspace = true
nvs-runtime.workspace = true
# `nvs run` executes its program inside a task rather than on the main thread's
# stack, because ADR 0072 § 1's children are children *of the calling task* and
# there has to be one. `main.rs`'s § *What `run` executes* owns the rest.
nvs-host.workspace = true
nvs-test.workspace = true
# `nvs meta --json` prints the `Core` registry, which is `nvs-stdlib`'s data
# read directly — ADR 0117 § 2 makes this binary the owner of that contract.
nvs-stdlib.workspace = true
clap.workspace = true
# ADR 0085's document, built and written as JSON rather than as text — the
# workspace manifest owns why this crate and not another.
serde_json.workspace = true

[lints]
workspace = true
