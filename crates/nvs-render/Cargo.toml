[package]
name = "nvs-render"
description = "ADR 0092's one diagnostic record model and its renderings: the closed node tree every developer-facing output is built from, and the plaintext view of it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# No doc comment in this crate has a runnable example, so `cargo test` does
# not run rustdoc over it. A crate that gains one deletes this table.
doctest = false

# This crate depends on no `nvs-*` crate, and that is the property ADR 0092 § 1
# asks of it: the model sits below both the runtime and the compiler front end,
# so every edge to it runs downward. ADR 0087's bidi predicate, which ADR 0092
# § 5 routes through rather than restating, lives in `src/bidi.rs` for that
# reason — it moved down out of `nvs-syntax` when the tier-4 floor became a
# dependent, and `nvs-syntax` reads it from here now.
[dependencies]
# ADR 0020 § 6 chose JSON over `logfmt` because the escaping has to be correct
# on the first and only attempt at the true floor, and JSON's is a solved,
# mechanical problem — so the JSON rendering (`src/json.rs`) delegates every
# quote, every escape and every number to the same crate `Core\Json::encode`
# reaches, rather than hand-rolling a second answer in the one place there is
# no second attempt.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
