[package]
name = "nvs-server"
description = "The built-in HTTP server: a socket to a root isolate and back"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The h1 framing, and the one dependency in this tree ADR 0051 § 4's first
# question answers "yes" to. The workspace `Cargo.toml`'s comment above it is
# where that is argued, including why `default-features = false` is what keeps
# `tokio` out of the graph rather than a tidiness choice.
hyper.workspace = true
# The parking stream this crate adapts, and the `block_on` that drives the
# future over it. `src/io.rs` is the whole of the seam; ADR 0138 is its
# specification.
nvs-host.workspace = true
# ADR 0097 § 5's four waits, resolved: `nvs_config::server::Waits` is the clock a connection is
# bounded by, and this crate takes it rather than four `Duration`s so that the ADR's numbers have
# one home and the boot refusal of an unbounded one lives beside the block it reads. Not a new
# crate in the graph — `nvs-host` and `nvs-runtime` both already rest on it.
nvs-config.workspace = true
# A connection is a task, and a task carries a `Ctx` — `src/serve.rs` spawns one
# child per connection through `nvs_host::spawn_child`, which is where ADR 0072
# § 1's tree comes from. Not a second runtime dependency: `nvs-host` already
# rests on this one, and what is used here is the three names that spell a task.
nvs-runtime.workspace = true
# The workspace's clock, and `src/schedule.rs` reaches it for the same reason
# `nvs_config::schedule` does: ADR 0073 § 6's next fire is a `Zoned` in the
# entry's own zone, and the ticker asks `Cron::next_after` for one rather than
# counting minutes itself. Not a new crate in the graph — `nvs-config` already
# rests on it, and what is named here is the two types that spell an instant.
jiff.workspace = true
# ADR 0083 § 1's framing, over the stream `hyper` hands back at the upgrade.
# `src/socket.rs` is the whole of the seam; the workspace `Cargo.toml`'s comment
# above this crate's name is where the choice is argued, including why a
# synchronous codec is the one that fits a parking stream.
tungstenite.workspace = true
# One draw per open event stream: `src/bounds.rs` spreads the reconnection hint
# a stream is opened with, so a drained fleet does not come back in lockstep.
# Not a new crate in the graph and no question reopened under
# `rule:packaging/a-c-dependency-answers-two-questions` — `nvs-runtime`,
# `nvs-stdlib` and `nvs-cli` all already draw from it.
rand.workspace = true

# `rule:observability/the-exporter-is-a-feature-and-core-metrics-is-not`'s split,
# declared in the crate the encoder lives in. `exporter` gates `src/prometheus.rs`
# and nothing else: `src/metrics.rs` is compiled into every build, so a
# `Core\Metrics` call reaches the same registry whichever build ran it, and what a
# build without this feature loses is the reader rather than the accumulator.
#
# On by default, which is what makes the server distribution the ordinary build and
# `--no-default-features` the deliberate one. The feature enables no dependency,
# because the exposition format is written here against its specification
# (`docs/decisions/0186.md` § *Investigation*) and the transport is the `hyper` this
# crate already rests on; what it saves a CLI binary is the encoder itself.
[features]
default = ["exporter"]
exporter = []

[dev-dependencies]
# Test-only, and it stays that way: `src/control.rs`'s reload case builds the two snapshots a swap
# is between, and a snapshot carries both its typed tree and the `toml::Table` that tree was
# derived from -- `nvs_config::snapshot::Current::publish` compares the untyped half key by key, so
# a case that wrote only the typed one would be comparing a table that was never written. Nothing
# in this crate's own code names a TOML value; the configuration reaches it as
# `nvs_config::snapshot::Snapshot` and never as a document.
toml.workspace = true
# Test-only, and for one type: `src/control.rs`'s `config` case builds the snapshot a live read is
# rendered from, and a snapshot says where every leaf was written as a `resolve::Origin`, whose
# `SourceId` half only a `SourceMap` hands out. Nothing in this crate's own code names either -- the
# origin column is `nvs_config::audit`'s to render and this crate passes the snapshot whole -- so the
# vocabulary is needed only to *build* a tree that has origins in it. Not a new crate in the graph:
# `nvs-config`, `nvs-runtime` and `nvs-host` all already rest on it.
nvs-diagnostics.workspace = true
# Test-only, and for one seam: `rule:observability/a-log-record-carries-trace-ids-when-a-trace-is-active` has a log record carry the trace id this crate's
# `src/trace.rs` decided at the door, and a record is a `nvs_render::Record` at a
# `nvs_render::Level`. Nothing in this crate's own code names either — the door writes a
# `TraceContext` and the stamping is `nvs_runtime::Ctx::stamp_envelope`'s — so the vocabulary is
# needed only to *read the record back* in the case that pins the two halves together. Not a new
# crate in the graph: `nvs-runtime`, `nvs-host` and `nvs-config` all already rest on it.
nvs-render.workspace = true

# This crate inherits the workspace lint policy unchanged, `unsafe_code =
# "forbid"` included. That is a decision and not an omission: the obvious way to
# fill `hyper`'s `ReadBufCursor` is to hand the socket its uninitialised bytes
# through an `unsafe` cast, and `src/io.rs`'s own docs say what taking the copy
# instead spends and why the ordering in AGENTS.md puts it that way round.
[lints]
workspace = true
