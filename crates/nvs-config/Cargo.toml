[package]
name = "nvs-config"
build = "../../tools/build/tests_without_pdb.rs"
description = "The directive registry and the `nvs.toml` tree behind it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# No doc comment in this crate has a runnable example, so `cargo test` does
# not run rustdoc over it. A crate that gains one deletes this table.
doctest = false

# `toml` + `serde` are ADR 0064 § 1's format decision, and both refusals § 3
# makes are their default behaviour rather than machinery of ours. Both are pure
# Rust, so ADR 0051 § 4's two questions do not arise.
#
# `blake3` is ADR 0078 § 4's own spelling of both cache keys; `src/cache.rs` is
# the only thing in this crate that hashes anything.
#
# `nvs-render` is here for one type: `[log] level` names one of ADR 0092 § 2's
# five levels, and that roster's home is the enum the record carries. A copy of
# it under `src/log.rs` would be a second roster to keep in step, which is the
# failure the module doc there already names for the target's grammar. The edge
# runs downward — `nvs-render` depends on no `nvs-*` crate at all.
#
# `jiff` is the workspace's clock, and `src/schedule.rs` reaches it for ADR 0073 § 6: a
# `[[schedule]]` entry's next fire is a civil minute in a named IANA zone, and the two
# DST rules that section pins are that crate's own disambiguation. It is here rather
# than in the scheduler because the expression is already read here, at boot — one
# reader, which is that module's doc comment's argument.
[dependencies]
# The alphabet `[http] csrf_key` is written in: `src/http.rs` decodes it so the
# boot can refuse a value that is not a key, which is what keeps
# `rule:security/csrf-is-on-by-default`'s token half from being silently
# unarmed. No new crate reaches the tree — `nvs-runtime`, `nvs-host`, `nvs-db`
# and `nvs-stdlib` all name it.
base64.workspace = true
blake3.workspace = true
jiff.workspace = true
nvs-diagnostics.workspace = true
# `resolve::Disk` records each configuration file it reads and each path it
# tests when `NVS_FOOTPRINT_LOG` names a log.
nvs-footprint.workspace = true
nvs-render.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# How this crate's tests reach files outside the package.
nvs-repo.workspace = true

# ADR 0103 § 6's ownership check is the platform's own question, and `std` asks
# neither half of it: `src/trust.rs` owns what each one is.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# `unsafe_code` is `deny` rather than the workspace's `forbid` because § 6's
# check is four `advapi32` calls and a `geteuid`, each carrying its own
# `#[expect]` with the reason it is sound.

# @generated by `bun nv lints` -- edit `[workspace.lints]` in the root manifest.
# This crate is on that command's `UNSAFE_CRATES` roster, so it restates the
# workspace table with `unsafe_code = "deny"`: cargo will not let a manifest
# inherit `[workspace.lints]` and override one entry, and `forbid` is not
# something an individual `#[allow(unsafe_code, reason = ...)]` can relax.

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
