[package]
name = "nvs-config"
build = "../../tools/build/tests_without_pdb.rs"
description = "The directive registry and the `nvs.toml` tree behind it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# No doc comment in this crate has a runnable example, so `cargo test` does
# not run rustdoc over it. A crate that gains one deletes this table.
doctest = false

# `toml` + `serde` are `rule:config/the-file-is-nvs-toml-and-it-is-toml`'s format
# decision, and both refusals of
# `rule:config/a-duplicate-key-is-an-error-and-so-is-an-unknown-one` are their default behaviour rather than machinery of ours. Both are pure
# Rust, so `rule:packaging/a-c-dependency-answers-two-questions`'s two questions do not arise.
#
# `blake3` is the hash both cache keys in `src/cache.rs` are written in
# (`rule:config/the-extension-set-is-in-every-unit-key`), and `src/data.rs`
# hashes the data folder's `nvs.toml` with it to tell a template nobody changed
# from an operator's file.
#
# `nvs-render` is here for one type: `[log] level` names one of
# `rule:errors/log-level`'s five levels, and that roster's home is the enum the record carries. A copy of
# it under `src/log.rs` would be a second roster to keep in step, which is the
# failure the module doc there already names for the target's grammar. The edge
# runs downward — `nvs-render` depends on no `nvs-*` crate at all.
#
# `jiff` is the workspace's clock, and `src/schedule.rs` reaches it for
# `rule:config/a-missed-fire-is-skipped-and-a-dst-edge-fires-once`: a `[[schedule]]`
# entry's next fire is a civil minute in a named IANA zone, and the two DST rules that
# rule pins are that crate's own disambiguation. It is here rather
# than in the scheduler because the expression is already read here, at boot — one
# reader, which is that module's doc comment's argument.
[dependencies]
# The alphabet `[http] csrf_key` is written in: `src/http.rs` decodes it so the
# boot can refuse a value that is not a key, which is what keeps
# `rule:security/csrf-is-on-by-default`'s token half from being silently
# unarmed. No new crate reaches the tree — `nvs-runtime`, `nvs-host`, `nvs-db`
# and `nvs-stdlib` all name it.
base64.workspace = true
blake3.workspace = true
jiff.workspace = true
nvs-diagnostics.workspace = true
# `resolve::Disk` records each configuration file it reads and each path it
# tests when `NVS_FOOTPRINT_LOG` names a log.
nvs-footprint.workspace = true
nvs-render.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# How this crate's tests reach files outside the package.
nvs-repo.workspace = true

# `rule:config/ownership-is-the-trust-boundary`'s ownership check is the platform's own question, and `std` asks
# neither half of it: `src/trust.rs` owns what each one is.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# The SID of `NT SERVICE\<name>` is a SHA-1 of the name, computed before the service exists.
sha1.workspace = true

# `unsafe_code` is `deny` rather than the workspace's `forbid` because that rule's
# check is four `advapi32` calls and a `geteuid`, each carrying its own
# `#[expect]` with the reason it is sound.

# @generated by `bun nv lints` -- edit `[workspace.lints]` in the root manifest.
# This crate is on that command's `UNSAFE_CRATES` roster, so it restates the
# workspace table with `unsafe_code = "deny"`: cargo will not let a manifest
# inherit `[workspace.lints]` and override one entry, and `forbid` is not
# something an individual `#[allow(unsafe_code, reason = ...)]` can relax.

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
