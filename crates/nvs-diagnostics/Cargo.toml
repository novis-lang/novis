[package]
name = "nvs-diagnostics"
description = "Source positions, source maps and diagnostic rendering for Novis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anstyle.workspace = true
# `SourceMap::load` records each file it reads when `NVS_FOOTPRINT_LOG` names a log.
nvs-footprint.workspace = true
# `src/record.rs` builds `rule:errors/diagnostic-record`'s record, and the terminal text renders from it.
nvs-render.workspace = true

[dev-dependencies]
insta.workspace = true
# `tests/every_code_is_tested.rs` reads every test in `crates/` and `tests/`.
nvs-repo.workspace = true

[lints]
workspace = true
