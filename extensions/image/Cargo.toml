[package]
name = "nvs-image"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The image component built into every `nvs` binary: `nvs:image/codec`, compiled for `wasm32-wasip2`"

# `cdylib` is the wasm file the build packs; `rlib` lets the codec core's tests
# run on the host, where the WIT glue is not compiled.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
avif-parse = "2.1"
barcoders = { version = "2.0.0", default-features = false }
# HOLD (revisit 2026-11-30): 2.0 is out, and `image` 0.25.10, the latest, needs `color_quant` ^1.1.
color_quant = "1.1"
datamatrix = "0.3.3"
fast_image_resize = { version = "6.1", default-features = false, features = ["std", "only_u8x4"] }
# HOLD (revisit 2026-11-30): 0.14 is out, and `usvg` 0.49.0, the latest, which `resvg` shapes text with, needs ^0.12.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
# Rasterises a PDF page (`rule:core-classes/pdf-page-is-an-image-source`): pure Rust, and it builds
# for `wasm32-wasip2`. Its default features are off: the Liberation fonts under `extensions/fonts/`
# replace `embed-fonts`, and `embed-cmaps` and `simd` are not taken.
hayro = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jxl-oxide = { version = "0.12", default-features = false }
kamadak-exif = "0.6"
libc = "0.2"
# HOLD (revisit 2026-11-30): 0.9 is out, and `image` 0.25.10, the latest, needs `moxcms` ^0.8.
moxcms = "0.8"
qrcode = { version = "0.14", default-features = false }
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
ravif = { version = "0.13", default-features = false }
resvg = { version = "0.49", default-features = false, features = ["text"] }
unicode-bidi = "0.3"
zune-core = "0.5"
zune-jpeg = "0.5"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# This crate is not a member of the repository's workspace (its `exclude` names
# `extensions`), and this table makes it a workspace of its own, so `cargo`
# never resolves it for the host as part of the tree's ordinary build.
[workspace]
