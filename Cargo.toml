[workspace]
resolver = "3"
members = ["crates/*", "benches/*"]
# `benches/userland/` holds the Novis and PHP sources of the userland benchmark
# pair — `.nvs`/`.php` files a harness runs, not a Rust crate — so the
# `benches/*` glob above would otherwise look for a `Cargo.toml` that will
# never exist and fail the whole workspace before a single crate is read.
# `benches/members/` is the same shape for the per-feature figures its own
# README describes, and `benches/serve/` for the twin pair `tools/bench.py
# --serve-vs-fpm` runs under two servers and the `echo.nvs` case
# `tools/bench-load.py` verifies against. `benches/serve-probe/` next to it is a
# crate and is not excluded: it is that leg's generator. `benches/proxied/` is compose files,
# an nginx and a PHP configuration and a Dockerfile, for the same reason.
# `benches/results/` is the one nothing in the repository creates: the loop's
# acceptance sweep writes a `--record` row there and `.gitignore` covers it, so
# it appears for the first time on a machine that has run the sweep and on no
# other — which is a build that breaks for one person and nobody else.
# The failure is the whole workspace
# rather than that one directory: `cargo` reads the glob before it reads a
# crate, so a `.nvs` tree under `benches/` that is not listed here breaks every
# build in the repository.
exclude = ["benches/userland", "benches/members", "benches/serve", "benches/proxied",
           "benches/results"]

# ---------------------------------------------------------------------------
# Shared package metadata. Every crate inherits these with `x.workspace = true`.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["The Novis authors"]
repository = "https://github.com/novis-lang/novis"
homepage = "https://novis-lang.org"
description = "Novis — a programming language for the web. Secure by design: untrusted data is tracked, secrets can't leak, downloaded code does only what you allow. Fast, for web servers and the command line"
keywords = ["language", "jit", "web", "php", "compiler"]
categories = ["compilers", "development-tools"]

# ---------------------------------------------------------------------------
# Single source of truth for dependency versions.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal ---
nvs-diagnostics = { path = "crates/nvs-diagnostics", version = "0.0.1" }
nvs-syntax = { path = "crates/nvs-syntax", version = "0.0.1" }
nvs-hir = { path = "crates/nvs-hir", version = "0.0.1" }
nvs-types = { path = "crates/nvs-types", version = "0.0.1" }
nvs-ir = { path = "crates/nvs-ir", version = "0.0.1" }
nvs-codegen = { path = "crates/nvs-codegen", version = "0.0.1" }
nvs-render = { path = "crates/nvs-render", version = "0.0.1" }
nvs-runtime = { path = "crates/nvs-runtime", version = "0.0.1" }
nvs-host = { path = "crates/nvs-host", version = "0.0.1" }
# The one internal entry that turns a member's defaults off. `nvs-server`'s
# `exporter` is the workspace's only feature, and turning it off here is what makes
# the dependent's own feature the single switch for it: `nvs-cli` is the only
# dependent, its `exporter` — on by default — forwards to this one, and
# `cargo tree -p nvs-cli --no-default-features -f "{p} feats={f}"` is what shows
# the crate then reached with no features at all.
nvs-server = { path = "crates/nvs-server", version = "0.0.1", default-features = false }
nvs-config = { path = "crates/nvs-config", version = "0.0.1" }
nvs-db = { path = "crates/nvs-db", version = "0.0.1" }
nvs-stdlib = { path = "crates/nvs-stdlib", version = "0.0.1" }
nvs-test = { path = "crates/nvs-test", version = "0.0.1" }
# Dev-only: how a test reaches a file outside its own package, recorded for `bun nv verify`.
nvs-repo = { path = "crates/nvs-repo", version = "0.0.1" }
nvs-lsp = { path = "crates/nvs-lsp", version = "0.0.1" }
nvs-fmt = { path = "crates/nvs-fmt", version = "0.0.1" }

# --- codegen backend (versions validated by the M0 spikes) ---
cranelift = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"
# The second `Module` behind the one lowering walk — ADR 0042 § 2's relocatable
# object payload. Same version as its four siblings above, and it must stay so:
# they share `cranelift-codegen`'s types.
cranelift-object = "0.135"
# The reader for what that one writes, and a test dependency only: an object's
# relocation table is the evidence that an address was left for a loader rather
# than baked in. Same version `cranelift-object` already resolved to.
object = { version = "0.39", default-features = false, features = ["read", "std"] }

# --- coroutines (stackful; validated on windows-msvc by the M0 spike) ---
corosensei = "0.2"

# --- CPU affinity (ADR 0106 § 6's "one scheduler of our own pinned per core") ---
# Pinning is three different syscalls — `sched_setaffinity`, `thread_policy_set`,
# `SetThreadAffinityMask` — and getting the CPU *set* is a fourth per platform.
# ADR 0051 § 4's first question is "no": nothing attacker-controlled reaches a
# core id, so what decides this is the pure-Rust default, and `core_affinity` is
# pure Rust with no C: it declares the bindings itself against `libc` on unix
# and `winapi` on Windows, both of which are already in this tree's lock file,
# and adds three crates to it — itself, `num_cpus` and `hermit-abi`, all
# MIT/Apache-2.0. The alternative was declaring those three externs here, which would put an
# `unsafe` FFI block per platform in `nvs-host` for code with no Novis-specific
# content in it. `crates/nvs-host/src/affinity.rs` owns what pinning is allowed
# to fail at.
core_affinity = "0.8"

# --- readiness (ADR 0115: the reactor reports readiness, and a stream parks) ---
# epoll, kqueue and a poll of `\Device\Afd` through IOCP are three mechanisms
# with one contract, and writing that contract three times is the alternative.
# `mio` is the readiness layer and *not* an async runtime — no executor, no task
# type, no `Future`, no `tokio` anywhere in its graph — which is why reaching
# for it is not the `BLOCKED` the goal reserves for "this needs async";
# docs/decisions/0115.md
# § 1 is the home of that reasoning. ADR 0051 § 4's first question is "no":
# a registration carries a descriptor and an interest set, so nothing
# attacker-controlled reaches it. Pure Rust with no build script and no C — it
# declares its own bindings against `libc` and `windows-sys`, both already in
# this tree's lock file. `crates/nvs-host/src/reactor.rs` owns the parking
# contract above it.
mio = { version = "1", features = ["os-poll", "net"] }

# --- HTTP/1 framing (ADR 0097 § 1: a development server and a proxied origin) ---
# The one dependency in this file that ADR 0051 § 4's first question answers
# **yes** to: every octet `hyper` parses arrived from the network, and framing is
# where request smuggling lives. That is the reason to take it rather than a
# reason to refuse it — § 4's escalation is about *C*, and the confinement clause
# has nothing to bite on here: `hyper` is pure Rust with no C, no build script
# and no `unsafe` outside its own audited buffer handling, so the memory-safety
# half of the question does not arise and what is left is the semantic half. On
# that, its record is the exceptional one § 4 asks for — continuously fuzzed, and
# the most-exercised h1 implementation in the language, against a hand-rolled
# parser of ours that would be exercised by this repository alone.
# `docs/plan/design.md`'s refusal to own FCGI framing is the same argument and
# `docs/agent/loop-goal.md` § *Two things every session must hold* applies it here.
#
# **`default-features = false` is load-bearing, not tidiness.** With `http1`,
# `server` and `client` the graph is `http`, `http-body`, `bytes`,
# `futures-core`, `futures-channel`, `pin-project-lite`, `httparse`, `httpdate`,
# `itoa`, `smallvec`, `atomic-waker`, `want` and `try-lock` — all pure Rust and
# all MIT. No `http2`: ADR 0097 § 1 dropped h2c, and that feature is the one
# `h2` comes from. `client` is on for the one client in this tree that is not an
# application's: `nvs ctl` is the other end of
# `rule:config/one-local-control-socket`'s endpoint, and an operator surface
# framed by a parser of ours would be a parser of ours to get right. What a
# program makes outbound requests with is `Core\Http\Client`, which is `ureq`'s
# and stays there.
#
# **`tokio` is in the lock file, and it is not a runtime.** `hyper` 1.11 depends
# on `tokio` unconditionally with `features = ["sync"]` — one `oneshot` in
# `src/upgrade.rs`, on the h1 server path — and tokio's own default feature set
# is empty, so what is compiled is its synchronisation primitives and *nothing*
# else: no `rt`, no `net`, no `time`, no executor, no reactor, no `spawn`. That
# is the distinction ADR 0072 actually draws, and it survives: this binary still
# has exactly one scheduler, `nvs-host`'s, and the connection future is driven
# by `nvs_host::block_on` on the coroutine that owns the connection (ADR 0138)
# over `crates/nvs-server/src/io.rs`'s adapters. h1 needs no `Executor` and
# `serve_connection` spawns nothing.
#
# The alternative — pinning `hyper` to the last release before that dependency
# became unconditional — buys the *name* out of the lock file and pays for it in
# unpatched HTTP framing, which AGENTS.md's ordering refuses: priority 1 is not
# traded for anything, least of all for a string. What guards the real rule is a
# test over the lock file's *feature set*, and `docs/agent/handoff.md` names the
# open decision about what that test is called.
hyper = { version = "1", default-features = false, features = [
    "http1",
    "server",
    "client",
] }

# --- RFC 6455, over the connection h1 handed back (ADR 0083 § 1) ---
# The framing crate, and ADR 0051 § 4's first question answers "yes" for exactly
# the reason it does above: masking, fragmentation, control frames, UTF-8
# validation and the close handshake are a wire protocol whose bugs are security
# bugs, and owning one is refused here as it is for h1.
#
# **Synchronous, over `nvs_host::NvsTcp` with no adapter.**
# `tungstenite::WebSocket::from_raw_socket` wants a `Read + Write` and the
# parking stream is one, so a read that would block hands the core back and the
# codec never learns that it suspended. That is why this crate and not
# `tokio-tungstenite`, which wants the executor ADR 0072 says this binary does
# not have.
#
# Default features, which is TLS-free: `handshake` is what
# `derive_accept_key` lives behind, and everything the set pulls — `http`,
# `httparse`, `data-encoding`, `sha1`, `rand` — is already in this lock file for
# `hyper`, `Core\Hash` and `Core\Random`. No `native-tls` and no `rustls`,
# because a `wss://` listener is a TLS listener and ADR 0097 § 1 has none.
tungstenite = "0.30"

# --- the configuration's trust boundary (ADR 0103 § 6) ---
# § 6 is "no account but this one, root or an administrator may write it", and
# neither half of it is in `std`: the effective uid is a `libc` call, and Windows
# has no mode bits at all, so the same question there is the owner SID plus the
# DACL. ADR 0051 § 4's first question is "no" — what reaches these calls is a
# path an operator wrote in `nvs.toml`, never a value a request chose, and the
# answer is a refusal to start rather than anything a script observes. Both are
# pure Rust with no C and no build script, and both are already in this tree's
# lock file. `crates/nvs-config/src/trust.rs` owns which ACEs Windows accepts.
#
# ADR 0086 § 3 draws on the same two for the terminal profile, and the same two
# answers apply: `crates/nvs-runtime/src/terminal.rs` asks the operating system
# how wide the controlling terminal is, which is an `ioctl` on Unix and two
# console calls on Windows with no `std` spelling of either. Nothing a request
# chose reaches them — the arguments are a standard file descriptor and a stack
# out-parameter — and the answer is a column count.
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # `GlobalMemoryStatusEx`: ADR 0106 § 13's admission arithmetic divides the memory budget by the
    # per-request cap, and on Windows this is the one call that answers what the budget is.
    "Win32_System_SystemInformation",
    # `ACCESS_ALLOWED_ACE_TYPE` and `ACCESS_DENIED_ACE_TYPE`: ADR 0103 § 6's trust check walks a
    # DACL itself rather than paying `GetEffectiveRightsFromAclW` per principal, and these two name
    # the entries it accounts for. `crates/nvs-config/src/trust.rs` is the one caller.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # `K32GetProcessMemoryInfo`: `Core\Os::residentBytes` is ADR 0148 § 12's `ru_maxrss`, and the
    # peak working set is what Windows keeps in its place. `crates/nvs-runtime/src/os.rs` is the one
    # caller, and it takes the `kernel32` entry point so that no import library is added with it.
    "Win32_System_ProcessStatus",
    # `CreateNamedPipeW`: ADR 0078 § 3's control endpoint is a named pipe on Windows, created with
    # a security descriptor of its own so that "mode 0600" holds where there is no mode.
    # `crates/nvs-config/src/control.rs` is the one caller.
    "Win32_System_Pipes",
    # `ConnectNamedPipe`, `ReadFile` and `WriteFile`: the same endpoint's accept and its duplex
    # stream. Every one of the three names `OVERLAPPED` in its signature and is gated on this
    # feature because of it, even though the control pipe is synchronous and passes a null pointer
    # for it. `crates/nvs-config/src/control.rs` is the one caller.
    "Win32_System_IO",
    # `CreateServiceW`, `ChangeServiceConfig2W`, `ControlService` and `QueryServiceStatusEx`:
    # ADR 0093 § 3's registration is the SCM's own state and has no file to write, so installing a
    # service *is* these calls. § 4's `PRESHUTDOWN`, delayed auto-start, description and failure
    # actions are configuration levels on the handle `CreateServiceW` returns.
    # `crates/nvs-cli/src/service.rs` is the one caller.
    "Win32_System_Services",
    # `RegCreateKeyExW` and `RegDeleteTreeW`: ADR 0093 § 4's event-log source is a subkey under
    # `SYSTEM\CurrentControlSet\Services\EventLog\Application` and nothing else, so registering one
    # at install and removing it at uninstall are a key write and a key delete.
    # `crates/nvs-cli/src/service.rs` is the one caller.
    "Win32_System_Registry",
    # `EVENTLOG_ERROR_TYPE` and its siblings: the `TypesSupported` value that subkey carries names
    # the record types the event viewer will render, so a source registered without them shows an
    # administrator nothing. `crates/nvs-cli/src/service.rs` is the one caller.
    "Win32_System_EventLog",
] }

# --- TLS over the parking stream (ADR 0051 § 3's "TLS via `rustls`") ---
# `nvs-host`'s stream is a plain `Read`/`Write`, so a TLS client over it is a
# wrapper and not a transport: `crates/nvs-host/src/tls.rs` is that wrapper and
# owns everything below in argued form. `Core\Http\Client`'s `https` and
# `Core\Mail`'s `STARTTLS` are both it.
# ADR 0051 § 4's first question is **yes** — a record layer is exactly where
# attacker-controlled bytes land — so this is accepted under its second, on the
# same footing as that section's SQLite. `rustls` and `rustls-webpki`, which are
# where TLS's historical failures actually live (state machine, framing, path
# building, name verification), are pure Rust. The primitives are not: the
# default `aws-lc-rs` provider is a C library built by `cmake` and is off, and
# `ring` — BoringSSL's pregenerated assembly behind a Rust API — is the provider
# instead. BoringSSL is continuously fuzzed under OSS-Fuzz and carries formally
# verified field arithmetic, which is the "demonstrable, exceptional
# verification record" that question asks for; its standing fallback of
# confining the code to wasm is not available, because a TLS client owns the
# socket it reads.
# `webpki-roots` is the trust anchor set, compiled in rather than read from the
# host: the same binary then trusts the same certificates everywhere, and a
# distroless image that ships no `ca-certificates` still verifies. `tls.rs`'s
# module doc is the home of that decision and of what an operator adds to it.
# `rcgen` issues certificates on the same provider, so the two share one crypto
# implementation: the handshake tests' peers, and the chain
# `Core\Test::tlsSession` describes (ADR 0217), which puts it in the shipped
# binary. It is reached from that one member and never from a request.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
    "tls12",
] }
webpki-roots = "1"
# `x509-parser` is the one thing `rustls` does not hand back. ADR 0180 § 11's
# `tlsPin` is the SHA-256 of a peer's SubjectPublicKeyInfo, and a custom
# verifier is given the certificate as raw DER, so something has to find that
# field: the alternative is a hand-written DER walk over attacker-controlled
# bytes on the one path whose answer decides whether a peer is believed. Pure
# Rust with no build script and no C — its `ring` feature is the only one that
# would add any, and it is off — so ADR 0051 § 4's second question never opens.
# It adds no crate this lock file did not already hold.
# `crates/nvs-host/src/tls.rs` is the one caller.
x509-parser = { version = "0.18", default-features = false }
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "ring",
    # `Certificate::pem`, for the one test that writes a bundle to a file rather than handing a
    # `CertificateDer` straight to a root store: `nvs_host::tls::anchors_from` reads PEM off disk
    # because that is what an operator writes, and a test that skipped the encoding would be
    # asserting against a path nothing runs.
    "pem",
] }

# --- extension sandbox (M9). Built on the same cranelift version above;
# --- spike #4 confirmed wasmtime 48 and cranelift 0.135 coexist.
# --- See docs/decisions/0003.md.
wasmtime = "48"

# --- the language server's wire and its vocabulary (ADR 0099 §§ 1-5) ---
# `rule:ide/the-server-is-synchronous` is "a reader thread, a writer thread, one
# analysis thread, and no async runtime", and this crate is exactly that shape:
# `Connection::stdio()` spawns the two io threads and hands back a pair of
# `crossbeam-channel` endpoints, so the server is a `for msg in receiver` loop
# on the thread that called it. No executor, no task type, no `Future` — the
# distinction ADR 0072 draws is not even reachable here. It is rust-analyzer's
# own framing layer, extracted by its authors for this use, and the alternative
# is owning `Content-Length` framing plus the
# `initialize`/`initialized`/`shutdown`/`exit` state machine, which is a wire
# protocol whose bugs are silent hangs.
# ADR 0051 § 4's first question is "no": the bytes arrive from the editor that
# launched this process over its own stdin, not from the network, and an editor
# that frames badly is a broken editor rather than an attacker. Pure Rust, no
# build script, no C, MIT OR Apache-2.0. It adds one crate to the lock file —
# `crossbeam-channel`, whose `crossbeam-utils` is already there.
# `crates/nvs-lsp/src/server.rs` owns the loop above it.
lsp-server = "0.10"
# The protocol's own structures, which is a translation of the specification and
# not a design of ours: `ServerCapabilities` alone is ~90 fields, every one of
# them a serde shape the client compares against by name. Writing them here
# would be re-deriving LSP 3.17 from prose, and a field spelled wrong is a
# capability the editor silently never uses — the failure mode `rule:ide/the-request-set-is-closed`'s
# closed list exists to make visible.
# Two of its dependencies are a second version of one this tree already has, and
# both are named here rather than discovered: `bitflags` 1 (the tree's own is 2,
# and 1.3.2 is already in the lock file for another crate) and `fluent-uri` 0.1
# (`Core\Uri` is on 0.4). `deny.toml`'s `multiple-versions` is `warn`, and
# neither duplicate reaches Novis's own code — a `Uri` in a request is parsed by
# `lsp-types` and handed on as a path. Pure Rust, no build script, no C, MIT.
lsp-types = "0.97"

# --- core utilities ---
anyhow = "1"
thiserror = "2"
bitflags = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
indexmap = "2"
rustc-hash = "2"
# Two consumers, one crate: ADR 0042's on-disk artifact cache keys on it, and
# spec § 11's `Core\Digest::Blake3` computes it — the second is what finally put
# it in `Cargo.lock`. `pure` and no default features on purpose: blake3 ships
# hand-written assembly built through `cc` by default, and ground-rules.md
# § *Pure-Rust dependencies by default* is not spent on a hash that is already
# faster than SHA-256 in its portable form. `std` is added back because
# `default-features = false` is what turns the assembly off.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

# --- sorting by key (`Core\Arr::sort`'s natural-order rows) ---
# A stable sort for keys that map to an ordered integer or a byte string, radix
# where the key allows it, AVX2/BMI2 chosen at run time.
# `crates/nvs-stdlib/src/sort.rs` owns why the member has two sorts and which
# subjects reach this one; docs/perf/brainsort-evaluation.md is the measurement.
# `rule:packaging/a-c-dependency-answers-two-questions`'s first question is
# "yes" — every value a program sorts reaches it — and the crate is pure Rust
# with no dependencies and no C, so the record the rule asks of C is written here
# by analogy for its `unsafe`: the vector kernels and the record buffers are
# about two hundred and sixty `unsafe` sites, and the crate's own CI runs clippy
# with warnings denied, Miri under strict provenance over the library and its
# suites, AddressSanitizer over the vector build, a 32-bit leg, a `no_std` leg
# and a libFuzzer job with a persisted corpus. Its `build.rs` declares one `cfg`
# and reads nothing. The process-wide block cache it keeps by default is turned
# off at the seam, for the reason that module states.
brainsort = "0.5"

# --- Arbitrary-magnitude integers (`Core\BigInt`) ---
# ADR 0054 § 5 names this crate by name as what replaces `gmp` and the integer
# half of `bcmath`; `crates/nvs-stdlib/src/bigint.rs` owns the class built over
# it. Pure Rust with no build script and no C, so
# `rule:packaging/a-c-dependency-answers-two-questions` is answered at its first
# question, and `num-integer` beside it is the `Integer` trait `gcd` and `lcm`
# are members of — the same authors, the same graph, already in `Cargo.lock`
# under `der-parser` and `mysql_common`.
num-bigint = "0.5"
num-integer = "0.1"

# --- Memory-mapped files (ADR 0042 § 3's read path) ---
# The cache verifies an artifact by hashing it where the page cache already put
# it, rather than by reading it into a buffer first — that ADR's *Investigation*
# weighs the two and picks this one. Pure Rust over the platform's own calls
# (`libc`, `windows-sys`), no C and no build script, so ground-rules.md
# § *Pure-Rust dependencies by default* has nothing to spend here.
memmap2 = "0.9"

# --- Instruction-cache maintenance for freshly written code (ADR 0042 § 3) ---
# The aarch64 half of `nvs_codegen::make_executable`: invalidating the cache
# lines under bytes that were data a moment ago, and serializing the fetch
# pipeline on every core that might run them. `cranelift-jit` already runs this
# same crate inside `finalize_definitions`, so both of the ways Novis publishes
# code go through one implementation rather than two spellings of a sequence
# whose failure mode is executing a stale line. It is already in the tree as
# that crate's own dependency, so naming it here adds no crate and no C.
# Upstream marks it internal to wasmtime and unsupported elsewhere; the pin is
# what answers that, and `nvs_codegen::make_executable` is the one call site.
wasmtime-internal-jit-icache-coherence = "48"

# --- Unicode text segmentation (ADR 0009 § 2's grapheme granularity) ---
# UAX #29 extended grapheme cluster boundaries, which `string`'s default
# length/indexing unit is defined by. Pure Rust, no build script, no C.
# `crates/nvs-runtime/src/graphemes.rs` owns why this crate and not another.
unicode-segmentation = "1"

# --- Unicode case folding (`Core\Str::fold`) ---
# Full case folding is a table, not an algorithm: `str::to_lowercase` answers
# the lower-case *mapping*, which is a different function — it leaves `ß`
# alone where folding turns it into `ss`, so a caseless comparison built on it
# is wrong for exactly the strings people notice. `caseless` is that table and
# nothing else, from the same `unicode-rs` org as `unicode-segmentation`
# above, pure Rust with no build script and no C. ICU4X's `icu_casemap` is the
# maintained alternative and was rejected on size: a data-baking subtree for
# one member, where this is one crate over `unicode-normalization`, which
# `Core\Str::normalize` needs next anyway.
caseless = "0.2"

# --- Unicode normalization (`Core\Str::normalize`) ---
# UAX #15's four normal forms are the same shape of problem as folding above:
# a table plus the canonical-ordering algorithm, not something a member can
# derive. `unicode-normalization` is the reference implementation from the
# same `unicode-rs` org as the two crates above, pure Rust with no build
# script and no C, and it is already in the tree as `caseless`'s own
# dependency — naming it here is the difference between depending on a crate
# and depending on another crate's choice of one. ICU4X's `icu_normalizer`
# was rejected for `icu_casemap`'s reason and would not be cheaper for having
# been rejected twice.
unicode-normalization = "0.1"

# --- Unicode display width (ADR 0086 § 3's `Core\Cli::displayWidth`) ---
# UAX #11's East_Asian_Width table, plus the zero-width classes a column
# count needs beside it — combining marks, Hangul medial and trailing jamo,
# default-ignorables — and the emoji ZWJ sequences that are one column pair
# however many code points they are. Every one of those is data on a Unicode
# version, not something a member can derive, and the third of the three
# measures ADR 0009 § 2 leaves open: bytes and grapheme clusters are ours,
# terminal columns are the renderer's. From the same `unicode-rs` org as the
# three crates above, pure Rust, no build script, no C, and already in this
# tree's lock file as `wasm-encoder`'s dependency — naming it here is the
# difference between depending on a crate and depending on another crate's
# choice of one. `default-features = false` drops the `cjk` half: the
# alternate width for East Asian *ambiguous* characters is a property of the
# locale the terminal is in, and Novis has no ambient locale at all
# (ADR 0051 § 3, which dropped `setlocale` for saying so).
unicode-width = { version = "0.2", default-features = false }

# --- regular expressions (ADR 0056's two tiers, both named by the user) ---
# `regex` is the linear-time default: a finite-automata engine that cannot be
# made to backtrack exponentially, which is the whole point of that ADR.
# `fancy-regex` is the budgeted opt-in tier, reached only by a pattern the
# linear engine cannot express (lookaround, backreferences); it wraps `regex`
# itself, so the two share one syntax and one Unicode table set rather than
# disagreeing about what a pattern means. Both pure Rust, no C, no build
# script. `crates/nvs-stdlib/src/regex.rs` owns why these two and not others.
regex = "1"
fancy-regex = "0.19"

# --- dates, times and the IANA zone database (spec § 4, named by the user) ---
# `jiff`'s type set maps almost one-to-one onto that section's
# `Instant`/`DateTime`/`Duration`/`Zone`, and it is the one Rust date crate
# that treats a civil time and an absolute one as different types — which is
# the distinction § 4 is built on. Pure Rust, no C, and it bundles the IANA
# database on a platform that has none (Windows) rather than shelling out.
# `crates/nvs-stdlib/src/time.rs` owns why this crate and not another.
jiff = "0.2"

# --- JSON (spec § 6) ---
# RFC 8259 is an external specification, so it is a dependency rather than a
# hand-written parser (docs/ground-rules.md § *Implementation invariants*). `serde_json`
# is the only Rust JSON crate that is simultaneously the ecosystem default,
# pure Rust with no build script, and driveable *without* its own `Value` tree
# — `Core\Json::decode` builds an `NvsArray` straight from a visitor, so no
# document is ever materialized twice. `serde` itself is the visitor trait it
# is driven through. `derive` is on for exactly one consumer, `nvs-config`'s
# block tree: ADR 0064 § 3's unknown-key refusal *is* `deny_unknown_fields`, an
# attribute on a struct rather than machinery we write, so the macro replaces
# code here rather than adding any.
# `raw_value` is what lets an ADR 0054 `decimal` be written as an exact JSON
# number rather than a lossy `f64`, and `unbounded_depth` is what lets section
# 6 of docs/spec/01-core-library.md have its own `maxDepth` be the bound
# rather than the crate's fixed 128.
# `crates/nvs-stdlib/src/json.rs` owns why this crate and not another, and what
# keeps an unbounded depth safe.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }

# --- configuration (ADR 0064 § 1: `nvs.toml` is TOML, read through `serde`) ---
# Pure Rust, and both of ADR 0064 § 3's refusals are its default behaviour: it
# rejects a duplicate key itself and `deny_unknown_fields` rejects an unknown
# one, so neither is machinery `nvs-config` writes or can get wrong.
toml = "0.9"

# --- randomness (spec § 11: `Core\Random` is a CSPRNG, always) ---
# That section keeps none of PHP's insecure generators, so there is no tier
# here that may be fast at the cost of predictable — which makes the choice a
# generator that is *both*. `rand`'s `ThreadRng` is ChaCha12 seeded from the OS
# and reseeded every 64 KiB, so a draw is userspace arithmetic rather than a
# syscall, and its bounded-sampling and shuffling code is the analysed
# implementation of the one piece of security-relevant arithmetic this class
# needs. `unbiased` turns the default's documented 1-in-2^64 modulo bias into
# exactness for the price of a rejection branch taken that often; a CSPRNG
# member should not carry a stated bias at all. Pure Rust, no C, no build
# script — ADR 0051 § 4's first question is "no" here, since a member takes a
# count or a pair of bounds and nothing attacker-shaped reaches it.
# `crates/nvs-stdlib/src/random.rs` owns why this crate and not `getrandom`
# alone.
rand = { version = "0.10", features = ["unbiased"] }

# --- UUIDs (spec § 11's second table) ---
# RFC 9562's version and variant nibbles are an external specification, and
# `Uuid::parse` is a member attacker-controlled text reaches, so neither the
# layout nor the reader is hand-written (docs/ground-rules.md
# § *Implementation invariants*). `uuid` is the crate the Rust ecosystem
# already reads for both, it is pure Rust with no build script and no C, and it
# adds no crate to this tree at all — it is already in Cargo.lock under
# `debugid`, which `wasmtime` pulls.
# `v4`/`v7` are deliberately **off**: those features exist to give `uuid` its
# own `getrandom`-backed generator, and `Core` has one CSPRNG (`rand`, above)
# and one clock (`jiff`). This crate is reached through `uuid::Builder`, which
# takes bits and a timestamp from those two and lays out the nibbles.
# `crates/nvs-stdlib/src/uuid.rs` owns why this crate and not a hand-written
# layout.
uuid = { version = "1", default-features = false, features = ["std"] }

# --- digests and MACs (spec § 11's `Core\Hash` and `Core\Digest`) ---
# Every one of these is an external specification with published test vectors
# and a decade of cryptanalysis attached (docs/ground-rules.md
# § *Implementation invariants*), and `Core\Hash::of` is a member request bodies
# reach — so ADR 0051 § 4's first question is "yes" here and its second one is
# what picks the crates. The RustCrypto family is pure Rust with no build
# script and no C, so § 4's confine-to-wasm branch never opens: it is the
# ecosystem's audited default, it is verified against each algorithm's own NIST
# or RFC vectors in its own test suite, and one `digest` trait set drives all
# four hashes plus the HMAC construction, so `Core\Digest` dispatches over one
# shape rather than four hand-fitted APIs.
# `crc32fast` is not from that family and not a hash at all — it is the
# checksum spec § 11 keeps for interop, and that crate is the one the Rust
# ecosystem already reads for it (pure Rust, SIMD chosen at run time).
# `subtle` is what makes `Core\Hash::equals` constant-time: the comparison is
# three lines, and the reason it is a dependency rather than three lines here
# is that an optimiser is free to turn the obvious loop back into an early
# exit, which is the entire bug `hash_equals` exists to avoid. That crate's
# whole purpose is the optimisation barrier that stops it.
# The `0.10`/`0.12` line rather than the newer majors on purpose: `sha2`,
# `crc32fast` and `digest 0.10` are already in this tree's lock file, pulled in
# by the cranelift/wasmtime side, so pinning to what is there adds four crates
# instead of eleven and keeps one `digest` trait version rather than two.
# `crates/nvs-stdlib/src/hash.rs` owns why this set and what `Core\Digest`
# carries.
#
# `sha3` and `crc32c` are the two additions the roster earned, and each is
# § 4's two questions answered separately. `sha3` is FIPS 202 — a published
# specification with NIST's own vectors, from the same RustCrypto family and
# the same `digest 0.10` trait set, so all four Keccak cases reach `digest_of`
# *and* `hmac_of` with no hand-fitting. `crc32c` is the Castagnoli checksum S3
# and GCS stamp objects with, so it is interop this runtime meets rather than
# a table hash; it is pure Rust with a run-time SSE4.2 check, exactly the shape
# `crc32fast` already has.
sha2 = "0.10"
sha1 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
hmac = "0.12"
crc32fast = "1"
crc32c = "0.6"
subtle = "2"

# --- password hashing (`Core\Password`, ADR 0051 § 3's framework-privileged half) ---
# Argon2id is a memory-hard KDF: a table of `m` KiB filled in `t` passes, with a
# published specification (RFC 9106) and known-answer vectors, and it is the one
# primitive in this tree where writing it ourselves would be indefensible —
# a subtly wrong Blake2b-long or a mis-indexed reference block still produces
# stable, verifiable hashes, so the bug is silent and permanent in every stored
# credential. ADR 0051 § 4's first question is "yes": `verify` and `needsRehash`
# are handed a stored hash string, and `hash` a password, both of which are
# attacker-influenced, so the second question picks the crate. `argon2` is
# RustCrypto's, pure Rust with no build script and no C, and it adds eleven
# crates to the lock file — itself, `password-hash`, `phc`, `base64ct`,
# `blake2`, `cmov`, `ctutils`, `hybrid-array` and the `digest 0.11`/
# `crypto-common 0.2`/`block-buffer 0.12` trait set, all MIT/Apache-2.0. That
# last three is the cost worth naming: `sha2` and friends above are pinned to
# `digest 0.10` on purpose, and this is a **second** copy of those traits in
# the tree. It is not shared code duplicated — `Core\Digest`'s algorithms and
# Argon2's internal Blake2b are different implementations either way — so what
# it costs is compile time and lock-file surface, not a divided abstraction,
# and the alternative was pinning `argon2` to a release older than its own
# published vectors.
#
# `getrandom` is off deliberately: the salt is drawn through
# `crate::random`'s own seam so this tree has exactly one CSPRNG, which is also
# what lets a test pin a hash. `password-hash` stays on because the PHC string
# is what `Core\Password` stores — the algorithm, the version and the cost
# parameters travel with the digest, which is the whole mechanism `needsRehash`
# reads. `crates/nvs-stdlib/src/password.rs` owns the parameters and why.
argon2 = { version = "0.6", default-features = false, features = [
    "alloc",
    "password-hash",
] }

# --- reading a PHP-stored bcrypt hash (`Core\Password::verify`, ADR 0129 § 1) ---
# bcrypt is the algorithm PHP's `PASSWORD_DEFAULT` has written since 5.5, so a
# migrating application's user table is a column of `$2y$` strings and this is
# the crate that reads one. ADR 0051 § 4's first question is "yes" for the same
# reason it was for `argon2` — `verify` is handed a stored hash and a password,
# both attacker-influenced — and the second question picks `bcrypt`: pure Rust
# with no build script and no C, `subtle`'s constant-time comparison on the
# digest, and the eksblowfish schedule is exactly the kind of loop where our own
# off-by-one would be silent and permanent in a credential column we cannot
# reproduce. It adds three crates — itself, `blowfish` (RustCrypto's, under its
# `bcrypt` feature) and `byteorder`, all MIT/Apache-2.0 — plus a second copy of
# `base64`, 0.23 beside the 0.22 the tree already pins for `Core\Encoding`.
# `blowfish` rides the `cipher 0.5` that arrived with `chacha20poly1305`, so the
# cipher traits are shared rather than duplicated; the base64 copy is the one
# real duplicate, and it is compile-time surface rather than a divided
# abstraction, since neither alphabet is the other's — bcrypt's is its own
# non-standard one, which is why the encoder cannot simply be `Core\Encoding`'s.
#
# `getrandom` is **on** here, where it is deliberately off for `argon2` and
# `chacha20poly1305` above, because this crate makes it non-optional behind
# `alloc`: its salt generator lives there and `verify` cannot be reached
# without it. Nothing draws through it — ADR 0129 § 2 is that Novis never
# *writes* a bcrypt hash, so the generating half of this crate has no call site
# — and the crate is already in this tree's lock file for `rand`'s own OS seed,
# so the one CSPRNG rule `crate::random` owns is untouched.
# `crates/nvs-stdlib/src/password.rs` owns the read roster and its ceiling.
bcrypt = { version = "0.19", default-features = false, features = [
    "alloc",
    "zeroize",
] }

# --- authenticated encryption (`Core\Crypto`, ADR 0051 § 3's AEAD-only surface) ---
# ADR 0051 § 4's first question is "yes" and then some: `open` is handed a
# sealed message an attacker chose, and refusing a forgery is the member's whole
# contract — so the second question picks the crate, and it picks the one whose
# tag comparison is somebody's maintained job rather than ours.
# `chacha20poly1305` is RustCrypto's, pure Rust with no build script and no C,
# and it verifies against RFC 8439's own vectors and the XChaCha20-Poly1305
# draft's. `crates/nvs-stdlib/src/crypto.rs` owns why the construction is the
# extended-nonce one rather than the RFC's 96-bit original.
#
# The cost is six crates — itself, `aead`, `cipher`, `inout`, `poly1305` and
# `universal-hash` — and no second copy of anything: the `chacha20` cipher
# underneath is already in this tree's lock file, because `rand` 0.10's own
# generator is ChaCha12 from that same crate, and `crypto-common 0.2` and
# `ctutils` arrived with `argon2` above. All MIT/Apache-2.0.
#
# `getrandom` is off for `argon2`'s reason above and the same one again: the
# nonce is drawn through `crate::random`'s seam, so this tree has one CSPRNG and
# a `#[Test(seed: …)]` reproduces a sealed message byte for byte.
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
] }

# --- the interoperable half of `Core\Crypto` (ADR 0179's roster) ---
# Every crate here is in this tree because the other end is a browser or a token
# issuer, not because Novis needs a second way to do what `chacha20poly1305`
# above already does better. ADR 0051 § 4's first question is "yes" for all of
# them — a sealed message, a JWE token and a JWKS document are each attacker-
# shaped — and its second question is answered the way the digest family answers
# it: RustCrypto, pure Rust, no build script and no C, so § 4's confine-to-wasm
# branch never opens, and each crate verifies against its own specification's
# published vectors. `getrandom` is off throughout for `chacha20poly1305`'s
# reason: a nonce, a salt and a key are drawn through `crate::random`'s seam, so
# this tree has one CSPRNG and a `#[Test(seed: …)]` reproduces a token. That is
# what keeps `p256` off its `std` feature, which implies `getrandom`; `alloc`
# carries everything a member here reaches.
# `crates/nvs-stdlib/src/crypto.rs` owns which member reaches which crate.
#
# `aes-gcm` is WebCrypto's `AES-GCM` and JWE's `A256GCM`, the one content
# encryption a browser and this runtime both have; it rides the `aead 0.6` and
# `cipher 0.5` that arrived with `chacha20poly1305`. `aes-kw` is RFC 3394 and is
# never a member: PBES2 wraps a content key with it and nothing else does.
# `p256` is the one curve every WebCrypto implementation ships, and it is here
# for agreement and for key validation and encoding — **its curve arithmetic has
# never been independently audited**, which its own README states and ADR 0179
# § 8 accepts, because the alternative is not a better implementation but no
# P-256 at all, and the crate is written constant-time. `x25519-dalek` is the
# agreement half of the curve `ed25519-dalek` already signs on in this tree's
# lock file, so it shares that crate's `curve25519-dalek` and adds nothing else.
# `hkdf` and `pbkdf2` are generic over the digest family's 0.11 line, which is
# what the `sha2-v11` row is for: `Core\Hash` dispatches over `digest 0.10` and
# cannot be either crate's type parameter, so the other major has to be
# nameable from Rust. That row adds no crate — `sha2 0.11`, `hmac 0.13` and
# `digest 0.11` are in this tree's lock file already, and `pbkdf2 0.13` is one
# of the crates that put them there — and it is a second row rather than a
# migration of `Core\Hash`, which would rewrite four hash members and their
# vectors for no change in behaviour.
aes-gcm = { version = "0.11", default-features = false, features = [
    "aes",
    "alloc",
] }
aes-kw = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = [
    "alloc",
    "arithmetic",
    "ecdh",
    "pkcs8",
] }
x25519-dalek = { version = "3", default-features = false, features = [
    "precomputed-tables",
    "static_secrets",
    "zeroize",
] }
hkdf = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2-v11 = { package = "sha2", version = "0.11", default-features = false }

# --- JWS's signature algorithms (ADR 0179 § 8) ---
# This row adds no crate: `ring` is already linked as the `rustls` provider
# above, and this is `nvs-stdlib` reaching it directly for RSASSA-PKCS1-v1_5,
# RSASSA-PSS, ECDSA over P-256 and Ed25519 — the four algorithms a JWS verifier
# meets, and the ones no pure-Rust crate in this graph covers for RSA. ADR 0051
# § 4 is answered exactly as the `rustls` block answers it, on the same two
# facts: attacker bytes reach a token verifier by construction, and BoringSSL's
# OSS-Fuzz record and formally verified field arithmetic are the same record.
# `tools/nv/cmd/gen-attribution.ts`'s `C_DEPENDENCIES` is where that answer is written
# down for the gate that enforces it. Every AEAD, KDF and key agreement stays
# with the RustCrypto block above; this crate signs and verifies and does
# nothing else here.
ring = "0.17"

# --- base64 (spec § 7's `Core\Encoding` base64 pair and its URL-safe variant) ---
# RFC 4648's alphabets, its padding rules and its URL-safe variant are an
# external specification, and `fromBase64` is a member attacker-controlled text
# reaches — so ADR 0051 § 4's first question is "yes" and the second one is what
# picks the crate. `base64` is pure Rust with no build script and no C, it is
# the crate the ecosystem already reads for this, and it adds nothing to this
# tree at all: it is already in Cargo.lock under `wasmtime-internal-cache`.
# What it buys over the twenty lines a sextet table would take is the *decoder*:
# a canonical-padding mode and a trailing-bits check, both of which are the
# non-obvious half of RFC 4648 § 3.5 and both of which spec § 7's throw-rather-
# than-substitute rule needs stated exactly.
# `crates/nvs-stdlib/src/encoding.rs` owns why this crate and not another, and
# which engine each of the four members is.
base64 = "0.22"

# --- base32 (spec § 7's `Core\Encoding` base32 pair, which TOTP needs) ---
# RFC 4648 § 6, and the same ADR 0051 § 4 answer base64 gets one block up:
# attacker-controlled text reaches `fromBase32`, so the decoder is not
# hand-written. `data-encoding` is the pick over a base32-only crate because it
# is the one that states each rule this module has to decide *separately* —
# padding, trailing bits, symbol translation — as a checked `Specification`
# rather than folding them into one alphabet constant, which is what lets
# `fromBase32` be lenient about case and padding while staying strict about
# everything that could change the octets. Pure Rust, no build script, no C,
# no dependencies of its own.
# `crates/nvs-stdlib/src/encoding.rs` owns what each of those three rules is
# set to and why.
data-encoding = "2"

# --- legacy text encodings (spec § 7's `Core\Encoding` text trio) ---
# `Charset`'s roster is the WHATWG Encoding Standard's index rather than a list
# the spec curates, and this crate *is* that standard: it is the reference
# implementation Firefox ships, so "which encodings exist" and "what each byte
# means" are a dependency update here rather than a table for Novis to maintain
# and get wrong. ADR 0051 § 4's second question applies -- a decoder is reached
# by attacker-controlled bytes -- and it is answered the same way SQLite
# answers it: pure Rust, no build script, no C, and a test corpus that is the
# standard's own. Already in this tree's lock file under `wasmtime`.
# `crates/nvs-stdlib/src/encoding.rs` owns which five cases this crate does
# *not* decide, and why.
encoding_rs = "0.8"

# --- csv (spec § 12's `Core\Csv::parse`) ---
# RFC 4180 plus the two knobs every real dialect turns is a grammar, and
# ground-rules.md's "an external specification is a dependency rather than a
# hand-written parser" applies to the *reader*: quoted fields, doubled quotes,
# an embedded separator, an embedded CRLF and a file that ends mid-quote are
# exactly the corners a hand-written scanner gets wrong one at a time. ADR
# 0051 § 4's first question is "yes" -- an uploaded spreadsheet is
# attacker-controlled -- and the second one does not arise, because
# `csv-core` is pure Rust: no build script, no C, `no_std`, and `memchr` its
# only dependency, which this tree already carries under `regex`. It is the
# parsing core of the `csv` crate the ecosystem reads for this, split out so a
# caller owns its own buffers, which is what lets the member allocate once per
# field into an `NvsStr` instead of through a `String` it would then copy.
# `crates/nvs-stdlib/src/csv.rs` owns why the *writing* half takes no
# dependency and what each of the three options is set to.
csv-core = "0.1"

# --- uri (spec § 12's `Core\Uri::parse` and the `Uri` instance) ---
# RFC 3986 is a grammar with an external specification, so ground-rules.md's
# "anything with an external specification is a dependency rather than a
# hand-written parser" settles half the question; what is left is *which*
# specification, because there are two and they are not a strict and a lax
# reading of one thing. `url` implements the WHATWG URL Standard -- what a
# browser does with text typed into an address bar -- and it rewrites its input
# on the way through: lower-casing the host, punycoding a non-ASCII one,
# dropping a port that matches the scheme's default, removing dot segments,
# turning `\` into `/` for the schemes it calls special. It also cannot hold a
# relative reference without a base. `Uri::parse` replaces `parse_url` and
# answers "what are the components of this text", so every one of those
# rewrites would be an answer about a URI the caller never sent, and
# `$uri->resolve(string $reference)` is defined over exactly the relative
# references `url` cannot represent. `fluent-uri` implements RFC 3986 itself:
# it parses a URI *reference*, borrows every component as written, normalizes
# only when asked, and carries § 5's reference resolution. ADR 0051 § 4's first
# question is "yes" -- a request line is attacker-controlled -- and the second
# does not arise, because the crate is pure Rust with no build script: its two
# dependencies are `borrow-or-share` and `ref-cast`, both of which exist only
# to hand back a borrowed component without copying it, which is the property
# that lets a member write one `NvsStr` per component instead of two.
# `crates/nvs-stdlib/src/uri.rs` owns what the member does and does not do with
# what this crate answers.
fluent-uri = "0.4"

# --- HTML parsing (`rule:core-classes/html-parsing`, ADR 0122) ---
# The WHATWG parsing algorithm is the specification a browser implements, and
# `rule:core-classes/html-parsing` takes it whole: `Core\Html::parse` never
# fails, because implied tags, error recovery and foster parenting are the
# *specified* output rather than a guess. A hand-written parser could not make
# that promise -- the value of the algorithm is that every conforming
# implementation agrees, and agreement is not something a second implementation
# of ours would have.
#
# `rule:packaging/a-c-dependency-answers-two-questions`'s first question is
# "yes" and its second does not arise: a document reaching this parser is
# attacker-controlled by definition, and the whole graph is pure Rust with no C
# in it, so the memory-safety half of the question has nothing to bite on. That
# is the answer the rule asks for rather than a reason to leave it unasked. It
# is Servo's parser, driven by a browser and continuously fuzzed, and ADR 0122's
# *In short* names it as the engine `Novis\Pdf` shares -- so the language and
# its PDF renderer parse HTML identically, which is one behaviour to document
# and one parser to fuzz rather than two.
#
# Default features, which is the tokenizer and the tree builder alone. It adds
# seventeen crates to the lock file, MIT or Apache-2.0 every one: `markup5ever`,
# then the ones that exist to make a tag name cheap to compare and a text cheap
# to share (`tendril`, `web_atoms`, `string_cache`, `phf`, `precomputed-hash`,
# `new_debug_unreachable`, `siphasher`) and the mutex behind `string_cache`'s
# dynamic atom table (`parking_lot`). One build script, `web_atoms`', which runs
# `phf_codegen` and `string_cache_codegen` over the fixed HTML and SVG name sets
# to emit a perfect hash -- code generation from a table in the crate, reading
# nothing from the environment.
#
# **The sample DOM is not among them** -- `markup5ever_rcdom` is a separate
# crate this row does not take, because `crates/nvs-stdlib/src/html.rs` drives
# the tree builder through a `TreeSink` of its own into `crate::xml`'s `Parsed`
# nodes. That is the boundary `rule:core-classes/html-parsing`'s one-node-family
# clause needs: building someone else's DOM and walking it into ours would hold
# the document twice and put a second node family in the crate for the length of
# a parse.
html5ever = "0.39"

# --- compression (spec § 17's `Core\Compress`, ADR 0166's bound) ---
# Three crates for five codec cases, and `rule:packaging/a-c-dependency-answers-two-questions`'s first
# question is "yes" for every one of them: a compressed body is attacker-controlled
# by definition, which is the whole reason the class is Tier 0. So the second
# question does not arise -- all three are pure Rust with no build script and no
# C to audit, and none takes the audited-C exception.
#
# `flate2` carries three of the five: gzip (RFC 1952), zlib (RFC 1950) and raw
# deflate (RFC 1951), which differ only in the header around one stream.
# `default-features = false` with `rust_backend` named back on is load-bearing
# rather than tidy: the default set is `flate2/zlib`, which resolves onto
# `libz-sys` and would put a C library in the default binary's graph. It is also
# what `mysql_common` needs -- that crate selects a backend through its own
# default set, so turning its defaults off leaves `flate2` with a
# `compile_error!` until this row picks `miniz-oxide` by feature unification.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Brotli (RFC 7932), from the Dropbox implementation, whose own summary is that
# all included code is safe. `default-features = false` keeps the C ABI shims
# (`ffi-api`) and the benchmark harness out of the graph; `std` is the allocator
# and the `Read`/`Write` wrappers `crates/nvs-stdlib/src/compress.rs` decodes
# through, which is how the output bound is applied *during* the decode rather
# than to a buffer that has already been allocated.
brotli = { version = "9", default-features = false, features = ["std"] }
# Zstandard (RFC 8878), and the one place the pure-Rust answer costs something:
# `zstd` is the reference C library behind bindings, and `ruzstd` is a Rust
# decoder with a younger encoder beside it. That trade is priority 1 over
# priority 3 in AGENTS.md's ordering and is not a close call -- a zstd frame
# reaching this crate is untrusted input, and the C library's own history of
# out-of-bounds reads is what the first question is asking about. `hash` is on
# with the default set: a frame's checksum is verified rather than skipped.
ruzstd = "0.9"

# --- database wire (ADR 0132 § 2) ---
# The rule that picked these: a codec is borrowed, a state machine is written.
# Message framing, value encoding and authentication mechanisms are large,
# fiddly and identical for everyone, and that is precisely what a sans-IO crate
# is; sequencing -- what to send next, what a park mid-message means, when a
# connection is reusable -- is `crates/nvs-db`'s own, and borrowing that half is
# what would have dragged an async runtime in. `sqlx`, `tokio-postgres` and
# `tiberius` each need a runtime that spawns, so none of them is reachable from
# a thread-per-core host at all; that is structural and not a preference.
#
# ADR 0051 § 4's first question is "yes" for all of these -- a server's response
# bytes are attacker-controlled the moment the server is -- which is the whole
# reason the framing is borrowed from a crate that is fuzzed rather than
# written here a fifth time.
#
# There is no TDS entry: SQL Server's protocol has no sans-IO crate, and the one
# implementation is async over `futures-io` with its TLS behind `tokio-rustls`,
# so `nvs-db` writes TDS 7.4 by hand.
postgres-protocol = "0.6"
postgres-types = "0.2"
# `default-features = false` is load-bearing and not tidiness: this crate's
# default set contains `flate2/zlib`, which resolves `flate2` onto `libz-sys` and
# would put a C library in the default binary's graph. `tools/nv/cmd/gen-attribution.ts`
# would then fail on an unrecorded C dependency, and recording it would be
# recording one nothing asked for -- the protocol's optional compression is a
# feature ADR 0067 does not offer. With the default off, `flate2` is
# `miniz-oxide` and the whole graph stays pure Rust; `derive` goes with it, and
# nothing here derives a row from a struct.
#
# The two features named back on are MariaDB's authentication plugins, and ADR
# 0051 § 4 names this exact case in advance: `client_ed25519` and `parsec` reach
# attacker-controlled data, so the answer is a Rust implementation of the plugin
# or a documented refusal to support that auth method. `mysql_common` has both,
# pure Rust -- `curve25519-dalek` behind the first, `ed25519-dalek`, `pbkdf2` and
# `rand` behind the second -- so this is the first outcome and not the second,
# and `crates/nvs-db/src/maria.rs`'s roster is what the features are for. Left
# off, the plugins still *parse* and their `run` answers `FeatureRequired`, which
# would refuse the connection with a message about a Cargo feature rather than
# about MariaDB.
mysql_common = { version = "0.38", default-features = false, features = [
  "client_ed25519",
  "client_parsec",
] }
# The two crates a sans-IO codec is *called through*, rather than codecs of their
# own. `postgres-protocol` frames into a `BytesMut` and hands back its message
# bodies as fallible iterators, so a caller that does not name these two cannot
# read a server's error text or the mechanisms it offered -- which is the whole
# of what `crates/nvs-db/src/pg.rs` reports when a connection is refused. Both
# are pure Rust with no build script, `fallible-iterator` has no dependencies at
# all, and the version here is `postgres-protocol`'s own: a second major would
# be a second trait, and the iterator impls would silently not apply.
bytes = "1"
fallible-iterator = "0.2"
# The one C dependency this goal adds, pre-answered under ADR 0051 § 4's second
# question and recorded against it. The slice that first takes this as a
# dependency of `nvs-db` also adds its row to `tools/nv/cmd/gen-attribution.ts`'s
# `C_DEPENDENCIES` ledger, in the same commit: that gate fails on an unrecorded
# C crate in the graph *and* on a recorded one that is not in it, so the two
# halves cannot be split across sessions. A version here is not a graph edge --
# nothing resolves a workspace dependency no crate names.
#
# `bundled` is not optional here and is the security-relevant half of the
# choice: without it the crate links whatever `libsqlite3` the host happens to
# ship, so the version an audit was written against and the version a
# deployment runs are unrelated, and ADR 0051 § 4's verification record belongs
# to *SQLite's own* build under its own configuration. Compiling the
# amalgamation ourselves makes the shipped engine a fact of this repository's
# lockfile, and it is also what lets the crate build on a machine with no
# SQLite installed at all.
# `column_decltype` is the second required feature and is ADR 0067 § 9's: that
# section maps a SQLite column off what the *schema* declared it as, because a
# storage class cannot say whether `20260903` was meant as a number or a date.
# Without this feature `sqlite3_column_decltype` is not exposed at all and the
# map has nothing to key on.
# `hooks` is the third and is what lets a write report the key of the row *it*
# inserted: `sqlite3_update_hook` names the rowid of every row a statement
# inserts, where `sqlite3_last_insert_rowid` names the connection's last one
# whoever wrote it. `crates/nvs-db/src/sqlite.rs` § *Which statement inserted a
# row* is the choice and what it costs. The feature is Rust alone -- it adds no
# C to the graph, since the amalgamation `bundled` compiles already carries the
# hook.
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "hooks"] }

# --- cli / diagnostics rendering ---
# Diagnostic layout is hand-written in nvs-diagnostics (the output format is
# part of the language's UI and should not shift with a dependency bump), so
# only the styling primitives and terminal detection are external.
clap = { version = "4", features = ["derive", "wrap_help"] }
anstream = "0.6"
anstyle = "1"

# --- dev / test ---
insta = "1"
proptest = "1"
criterion = "0.7"

# ---------------------------------------------------------------------------
# Lint policy, and the one home for it. Most crates take it wholesale with
# `[lints] workspace = true`.
#
# The crates that need `unsafe` cannot: `forbid` is not something a site-level
# `#[allow]` can relax, and cargo refuses a manifest that inherits this table
# and overrides one entry of it --
#
#     error: cannot override `workspace.lints` in `lints`, either remove the
#            overrides or `lints.workspace = true` and manually specify the lints
#
# -- so they restate the whole table with `unsafe_code = "deny"` and allow each
# block individually with a reason. `bun nv lints` generates those
# copies from this table and `--check` fails on drift, in the `lint` CI job and
# in `nv verify`; a lint added here reaches every crate through it. That
# command's `UNSAFE_CRATES` is the roster of crates that may override and the one
# home for it -- three prose copies of that list had gone stale, naming four
# crates while seven carried `unsafe`. docs/plan/design.md § *Unsafe policy* is
# the reasoning.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness-adjacent pedantry we do want.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"    # user-facing output belongs in nvs-cli, not libraries
print_stderr = "warn"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
[profile.dev]
# `catch_unwind` at the helper and worker-task boundaries is how Novis contains
# a runtime panic to one request (ADR 0106 § 2 moved the outer one out to the
# task root). `panic = "abort"` would break that guarantee, so unwinding is
# mandatory in every profile. See docs/adr/0003.
panic = "unwind"
# Line tables only, for Novis's own crates: a panic location and a backtrace still name file and
# line, which is what every `debug_assert` and the owner stamp in `nvs-runtime` report through, so
# the debug build keeps the checks that make it worth building. What goes is the type and variable
# info a debugger steps with, and on windows-msvc that was most of every test binary's PDB -- the
# bulk of a build, some sixty binaries each carrying the same crates. A session that needs to step
# sets `CARGO_PROFILE_DEV_DEBUG=2` for that one build. The dependency wall below is at `debug = 0`
# already, and the bench profile keeps `debug = true` for its own reasons.
debug = "line-tables-only"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only" # keep backtraces useful in production builds
# Integer overflow is checked in release too, workspace-wide. Measured on this tree with a per-package
# override: `decimal` add+mul+sub 27.8 -> 28.1 ns, array append 170.5 -> 169.9, `NvsStr::new` 30.4 -> 29.9,
# scalar `Value` arithmetic 1.19 -> 1.11 -- every delta inside the +/-1.8% seen between two *baseline*
# runs, so there is no cost to weigh against it. What it buys is the class behind php-src's CVSS-9.8 bugs
# (`ldap_escape` CVE-2024-8932, the `pdo_firebird` quoter CVE-2024-11236): a size computation that wraps
# silently becomes a panic, which `catch_unwind` contains to one request per ADR 0002, instead of a wrong
# length nothing reports. Intentional wraparound is spelled `wrapping_*`. The cast half of the same
# discipline is already enforced -- `[workspace.lints.clippy]` below carries `cast_possible_truncation`,
# `cast_possible_wrap` and `cast_sign_loss`, and `nv verify` runs clippy with `-D warnings`.
overflow-checks = true

# Compiling Novis's own dependencies with optimisation makes debug builds of the
# compiler usable; Cranelift is unbearably slow otherwise.
#
# `debug = 0` applies to dependencies only -- Novis's own crates keep their line
# tables (`[profile.dev]` above), so a backtrace through this repository's code
# is unchanged. What it drops is the debug info for code nobody here steps into,
# and on windows-msvc that is nearly all of it: the linker copies the debug
# info of every linked object into each binary's PDB, so cranelift and wasmtime
# were being written into all ~60 test binaries at once. Measured 2026-08-25:
# 3.9 GB of PDBs per build generation before, 1.7 GB after, and a session's own
# `nv verify` went 51s -> 43s rather than paying for it: there is less debug
# info to link and to load. The one-time cost is that every dependency
# recompiles once, 2m20s here. See tools/disk.py on why generations pile up.
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.bench]
inherits = "release"
debug = true

# The build the feature proofs run on: release's code, without release's link. Thin LTO over one
# codegen unit is what makes a release relink slow, and a proof binary is rebuilt after nearly every
# edit, so this profile turns both off and compiles incrementally. Overflow checks stay on and debug
# assertions stay off, as in release, so a proof sees the arithmetic a shipped binary does. What
# differs is inlining across crates: a behaviour that depends on it shows up only on release, which
# the gate-open sweep builds. The disk cost is one more build tree, `target/proof/`, as large as
# `target/release/` plus its incremental caches, which `bun nv disk` counts on a line of its own.
[profile.proof]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
overflow-checks = true
debug-assertions = false
