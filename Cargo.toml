[workspace]
resolver = "3"
members = ["crates/*", "benches/*"]
# `benches/userland/` holds the Novis and PHP sources of the userland benchmark
# pair — `.nvs`/`.php` files a harness runs, not a Rust crate — so the
# `benches/*` glob above would otherwise look for a `Cargo.toml` that will
# never exist and fail the whole workspace before a single crate is read.
exclude = ["benches/userland"]

# ---------------------------------------------------------------------------
# Shared package metadata. Every crate inherits these with `x.workspace = true`.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["The Novis authors"]
repository = "https://github.com/nvs-lang/nvs"
homepage = "https://github.com/nvs-lang/nvs"
description = "Novis — the web-native programming language: JIT-compiled, memory-safe, for web and CLI"
keywords = ["language", "jit", "web", "php", "compiler"]
categories = ["compilers", "development-tools"]

# ---------------------------------------------------------------------------
# Single source of truth for dependency versions.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal ---
nvs-diagnostics = { path = "crates/nvs-diagnostics", version = "0.0.1" }
nvs-syntax = { path = "crates/nvs-syntax", version = "0.0.1" }
nvs-hir = { path = "crates/nvs-hir", version = "0.0.1" }
nvs-types = { path = "crates/nvs-types", version = "0.0.1" }
nvs-ir = { path = "crates/nvs-ir", version = "0.0.1" }
nvs-codegen = { path = "crates/nvs-codegen", version = "0.0.1" }
nvs-runtime = { path = "crates/nvs-runtime", version = "0.0.1" }
nvs-stdlib = { path = "crates/nvs-stdlib", version = "0.0.1" }
nvs-test = { path = "crates/nvs-test", version = "0.0.1" }

# --- codegen backend (versions validated by the M0 spikes) ---
cranelift = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"

# --- coroutines (stackful; validated on windows-msvc by the M0 spike) ---
corosensei = "0.2"

# --- extension sandbox (M9). Built on the same cranelift version above;
# --- spike #4 confirmed wasmtime 48 and cranelift 0.135 coexist.
# --- See docs/adr/0003-extension-system.md.
wasmtime = "48"

# --- core utilities ---
anyhow = "1"
thiserror = "2"
bitflags = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
indexmap = "2"
rustc-hash = "2"
blake3 = "1"

# --- Unicode text segmentation (ADR 0009 § 2's grapheme granularity) ---
# UAX #29 extended grapheme cluster boundaries, which `string`'s default
# length/indexing unit is defined by. Pure Rust, no build script, no C.
# `crates/nvs-stdlib/src/granularity.rs` owns why this crate and not another.
unicode-segmentation = "1"

# --- Unicode case folding (`Core\Str::fold`) ---
# Full case folding is a table, not an algorithm: `str::to_lowercase` answers
# the lower-case *mapping*, which is a different function — it leaves `ß`
# alone where folding turns it into `ss`, so a caseless comparison built on it
# is wrong for exactly the strings people notice. `caseless` is that table and
# nothing else, from the same `unicode-rs` org as `unicode-segmentation`
# above, pure Rust with no build script and no C. ICU4X's `icu_casemap` is the
# maintained alternative and was rejected on size: a data-baking subtree for
# one member, where this is one crate over `unicode-normalization`, which
# `Core\Str::normalize` needs next anyway.
caseless = "0.2"

# --- Unicode normalization (`Core\Str::normalize`) ---
# UAX #15's four normal forms are the same shape of problem as folding above:
# a table plus the canonical-ordering algorithm, not something a member can
# derive. `unicode-normalization` is the reference implementation from the
# same `unicode-rs` org as the two crates above, pure Rust with no build
# script and no C, and it is already in the tree as `caseless`'s own
# dependency — naming it here is the difference between depending on a crate
# and depending on another crate's choice of one. ICU4X's `icu_normalizer`
# was rejected for `icu_casemap`'s reason and would not be cheaper for having
# been rejected twice.
unicode-normalization = "0.1"

# --- regular expressions (ADR 0056's two tiers, both named by the user) ---
# `regex` is the linear-time default: a finite-automata engine that cannot be
# made to backtrack exponentially, which is the whole point of that ADR.
# `fancy-regex` is the budgeted opt-in tier, reached only by a pattern the
# linear engine cannot express (lookaround, backreferences); it wraps `regex`
# itself, so the two share one syntax and one Unicode table set rather than
# disagreeing about what a pattern means. Both pure Rust, no C, no build
# script. `crates/nvs-stdlib/src/regex.rs` owns why these two and not others.
regex = "1"
fancy-regex = "0.19"

# --- dates, times and the IANA zone database (spec § 4, named by the user) ---
# `jiff`'s type set maps almost one-to-one onto that section's
# `Instant`/`DateTime`/`Duration`/`Zone`, and it is the one Rust date crate
# that treats a civil time and an absolute one as different types — which is
# the distinction § 4 is built on. Pure Rust, no C, and it bundles the IANA
# database on a platform that has none (Windows) rather than shelling out.
# `crates/nvs-stdlib/src/time.rs` owns why this crate and not another.
jiff = "0.2"

# --- JSON (spec § 6) ---
# RFC 8259 is an external specification, so it is a dependency rather than a
# hand-written parser (docs/adr/ground-rules.md § *Implementation invariants*). `serde_json`
# is the only Rust JSON crate that is simultaneously the ecosystem default,
# pure Rust with no build script, and driveable *without* its own `Value` tree
# — `Core\Json::decode` builds an `NvsArray` straight from a visitor, so no
# document is ever materialized twice. `serde` itself is the visitor trait it
# is driven through; nothing here uses its derive macro, though `serde_core`
# names `serde_derive` as a never-built `cfg(any())` dependency, so the
# generated notice attributes it anyway.
# `raw_value` is what lets an ADR 0054 `decimal` be written as an exact JSON
# number rather than a lossy `f64`, and `unbounded_depth` is what lets section
# 6 of docs/spec/01-core-library.md have its own `maxDepth` be the bound
# rather than the crate's fixed 128.
# `crates/nvs-stdlib/src/json.rs` owns why this crate and not another, and what
# keeps an unbounded depth safe.
serde = "1"
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }

# --- randomness (spec § 11: `Core\Random` is a CSPRNG, always) ---
# That section keeps none of PHP's insecure generators, so there is no tier
# here that may be fast at the cost of predictable — which makes the choice a
# generator that is *both*. `rand`'s `ThreadRng` is ChaCha12 seeded from the OS
# and reseeded every 64 KiB, so a draw is userspace arithmetic rather than a
# syscall, and its bounded-sampling and shuffling code is the analysed
# implementation of the one piece of security-relevant arithmetic this class
# needs. `unbiased` turns the default's documented 1-in-2^64 modulo bias into
# exactness for the price of a rejection branch taken that often; a CSPRNG
# member should not carry a stated bias at all. Pure Rust, no C, no build
# script — ADR 0051 § 4's first question is "no" here, since a member takes a
# count or a pair of bounds and nothing attacker-shaped reaches it.
# `crates/nvs-stdlib/src/random.rs` owns why this crate and not `getrandom`
# alone.
rand = { version = "0.10", features = ["unbiased"] }

# --- UUIDs (spec § 11's second table) ---
# RFC 9562's version and variant nibbles are an external specification, and
# `Uuid::parse` is a member attacker-controlled text reaches, so neither the
# layout nor the reader is hand-written (docs/adr/ground-rules.md
# § *Implementation invariants*). `uuid` is the crate the Rust ecosystem
# already reads for both, it is pure Rust with no build script and no C, and it
# adds no crate to this tree at all — it is already in Cargo.lock under
# `debugid`, which `wasmtime` pulls.
# `v4`/`v7` are deliberately **off**: those features exist to give `uuid` its
# own `getrandom`-backed generator, and `Core` has one CSPRNG (`rand`, above)
# and one clock (`jiff`). This crate is reached through `uuid::Builder`, which
# takes bits and a timestamp from those two and lays out the nibbles.
# `crates/nvs-stdlib/src/uuid.rs` owns why this crate and not a hand-written
# layout.
uuid = { version = "1", default-features = false, features = ["std"] }

# --- digests and MACs (spec § 11's `Core\Hash` and `Core\Digest`) ---
# Every one of these is an external specification with published test vectors
# and a decade of cryptanalysis attached (docs/adr/ground-rules.md
# § *Implementation invariants*), and `Core\Hash::of` is a member request bodies
# reach — so ADR 0051 § 4's first question is "yes" here and its second one is
# what picks the crates. The RustCrypto family is pure Rust with no build
# script and no C, so § 4's confine-to-wasm branch never opens: it is the
# ecosystem's audited default, it is verified against each algorithm's own NIST
# or RFC vectors in its own test suite, and one `digest` trait set drives all
# four hashes plus the HMAC construction, so `Core\Digest` dispatches over one
# shape rather than four hand-fitted APIs.
# `crc32fast` is not from that family and not a hash at all — it is the
# checksum spec § 11 keeps for interop, and that crate is the one the Rust
# ecosystem already reads for it (pure Rust, SIMD chosen at run time).
# `subtle` is what makes `Core\Hash::equals` constant-time: the comparison is
# three lines, and the reason it is a dependency rather than three lines here
# is that an optimiser is free to turn the obvious loop back into an early
# exit, which is the entire bug `hash_equals` exists to avoid. That crate's
# whole purpose is the optimisation barrier that stops it.
# The `0.10`/`0.12` line rather than the newer majors on purpose: `sha2`,
# `crc32fast` and `digest 0.10` are already in this tree's lock file, pulled in
# by the cranelift/wasmtime side, so pinning to what is there adds four crates
# instead of eleven and keeps one `digest` trait version rather than two.
# `crates/nvs-stdlib/src/hash.rs` owns why this set and what `Core\Digest`
# carries.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
crc32fast = "1"
subtle = "2"

# --- base64 (spec § 7's `Core\Encoding` base64 pair and its URL-safe variant) ---
# RFC 4648's alphabets, its padding rules and its URL-safe variant are an
# external specification, and `fromBase64` is a member attacker-controlled text
# reaches — so ADR 0051 § 4's first question is "yes" and the second one is what
# picks the crate. `base64` is pure Rust with no build script and no C, it is
# the crate the ecosystem already reads for this, and it adds nothing to this
# tree at all: it is already in Cargo.lock under `wasmtime-internal-cache`.
# What it buys over the twenty lines a sextet table would take is the *decoder*:
# a canonical-padding mode and a trailing-bits check, both of which are the
# non-obvious half of RFC 4648 § 3.5 and both of which spec § 7's throw-rather-
# than-substitute rule needs stated exactly.
# `crates/nvs-stdlib/src/encoding.rs` owns why this crate and not another, and
# which engine each of the four members is.
base64 = "0.22"

# --- base32 (spec § 7's `Core\Encoding` base32 pair, which TOTP needs) ---
# RFC 4648 § 6, and the same ADR 0051 § 4 answer base64 gets one block up:
# attacker-controlled text reaches `fromBase32`, so the decoder is not
# hand-written. `data-encoding` is the pick over a base32-only crate because it
# is the one that states each rule this module has to decide *separately* —
# padding, trailing bits, symbol translation — as a checked `Specification`
# rather than folding them into one alphabet constant, which is what lets
# `fromBase32` be lenient about case and padding while staying strict about
# everything that could change the octets. Pure Rust, no build script, no C,
# no dependencies of its own.
# `crates/nvs-stdlib/src/encoding.rs` owns what each of those three rules is
# set to and why.
data-encoding = "2"

# --- legacy text encodings (spec § 7's `Core\Encoding` text trio) ---
# `Charset`'s roster is the WHATWG Encoding Standard's index rather than a list
# the spec curates, and this crate *is* that standard: it is the reference
# implementation Firefox ships, so "which encodings exist" and "what each byte
# means" are a dependency update here rather than a table for Novis to maintain
# and get wrong. ADR 0051 § 4's second question applies -- a decoder is reached
# by attacker-controlled bytes -- and it is answered the same way SQLite
# answers it: pure Rust, no build script, no C, and a test corpus that is the
# standard's own. Already in this tree's lock file under `wasmtime`.
# `crates/nvs-stdlib/src/encoding.rs` owns which five cases this crate does
# *not* decide, and why.
encoding_rs = "0.8"

# --- csv (spec § 12's `Core\Csv::parse`) ---
# RFC 4180 plus the two knobs every real dialect turns is a grammar, and
# ground-rules.md's "an external specification is a dependency rather than a
# hand-written parser" applies to the *reader*: quoted fields, doubled quotes,
# an embedded separator, an embedded CRLF and a file that ends mid-quote are
# exactly the corners a hand-written scanner gets wrong one at a time. ADR
# 0051 § 4's first question is "yes" -- an uploaded spreadsheet is
# attacker-controlled -- and the second one does not arise, because
# `csv-core` is pure Rust: no build script, no C, `no_std`, and `memchr` its
# only dependency, which this tree already carries under `regex`. It is the
# parsing core of the `csv` crate the ecosystem reads for this, split out so a
# caller owns its own buffers, which is what lets the member allocate once per
# field into an `NvsStr` instead of through a `String` it would then copy.
# `crates/nvs-stdlib/src/csv.rs` owns why the *writing* half takes no
# dependency and what each of the three options is set to.
csv-core = "0.1"

# --- uri (spec § 12's `Core\Uri::parse` and the `Uri` instance) ---
# RFC 3986 is a grammar with an external specification, so ground-rules.md's
# "anything with an external specification is a dependency rather than a
# hand-written parser" settles half the question; what is left is *which*
# specification, because there are two and they are not a strict and a lax
# reading of one thing. `url` implements the WHATWG URL Standard -- what a
# browser does with text typed into an address bar -- and it rewrites its input
# on the way through: lower-casing the host, punycoding a non-ASCII one,
# dropping a port that matches the scheme's default, removing dot segments,
# turning `\` into `/` for the schemes it calls special. It also cannot hold a
# relative reference without a base. `Uri::parse` replaces `parse_url` and
# answers "what are the components of this text", so every one of those
# rewrites would be an answer about a URI the caller never sent, and
# `$uri->resolve(string $reference)` is defined over exactly the relative
# references `url` cannot represent. `fluent-uri` implements RFC 3986 itself:
# it parses a URI *reference*, borrows every component as written, normalizes
# only when asked, and carries § 5's reference resolution. ADR 0051 § 4's first
# question is "yes" -- a request line is attacker-controlled -- and the second
# does not arise, because the crate is pure Rust with no build script: its two
# dependencies are `borrow-or-share` and `ref-cast`, both of which exist only
# to hand back a borrowed component without copying it, which is the property
# that lets a member write one `NvsStr` per component instead of two.
# `crates/nvs-stdlib/src/uri.rs` owns what the member does and does not do with
# what this crate answers.
fluent-uri = "0.4"

# --- cli / diagnostics rendering ---
# Diagnostic layout is hand-written in nvs-diagnostics (the output format is
# part of the language's UI and should not shift with a dependency bump), so
# only the styling primitives and terminal detection are external.
clap = { version = "4", features = ["derive", "wrap_help"] }
anstream = "0.6"
anstyle = "1"

# --- dev / test ---
insta = "1"
proptest = "1"
criterion = "0.7"

# ---------------------------------------------------------------------------
# Lint policy. Safe crates opt in wholesale via `lints.workspace = true`.
# The two crates that need `unsafe` (nvs-runtime, nvs-codegen) declare their
# own `[lints]` with `unsafe_code = "deny"` and narrow module-level allows,
# so every unsafe block is a deliberate, reviewable exception. The policy is
# recorded in docs/adr/README.md.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness-adjacent pedantry we do want.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"    # user-facing output belongs in nvs-cli, not libraries
print_stderr = "warn"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
[profile.dev]
# `catch_unwind` at the helper and request boundaries is how Novis contains a
# runtime panic to one request. `panic = "abort"` would break that guarantee,
# so unwinding is mandatory in every profile. See docs/adr/0003.
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only" # keep backtraces useful in production builds
# Integer overflow is checked in release too, workspace-wide. Measured on this tree with a per-package
# override: `decimal` add+mul+sub 27.8 -> 28.1 ns, array append 170.5 -> 169.9, `NvsStr::new` 30.4 -> 29.9,
# scalar `Value` arithmetic 1.19 -> 1.11 -- every delta inside the +/-1.8% seen between two *baseline*
# runs, so there is no cost to weigh against it. What it buys is the class behind php-src's CVSS-9.8 bugs
# (`ldap_escape` CVE-2024-8932, the `pdo_firebird` quoter CVE-2024-11236): a size computation that wraps
# silently becomes a panic, which `catch_unwind` contains to one request per ADR 0002, instead of a wrong
# length nothing reports. Intentional wraparound is spelled `wrapping_*`. The cast half of the same
# discipline is already enforced -- `[workspace.lints.clippy]` below carries `cast_possible_truncation`,
# `cast_possible_wrap` and `cast_sign_loss`, and `tools/verify.py` runs clippy with `-D warnings`.
overflow-checks = true

# Compiling Novis's own dependencies with optimisation makes debug builds of the
# compiler usable; Cranelift is unbearably slow otherwise.
#
# `debug = 0` applies to dependencies only -- Novis's own crates keep full debug
# info, so a backtrace or a debugger session through this repository's code is
# unchanged. What it drops is the debug info for code nobody here steps into,
# and on windows-msvc that is nearly all of it: the linker copies the debug
# info of every linked object into each binary's PDB, so cranelift and wasmtime
# were being written into all ~60 test binaries at once. Measured 2026-08-25:
# 3.9 GB of PDBs per build generation before, 1.7 GB after, and a session's own
# `verify.py` went 51s -> 43s rather than paying for it: there is less debug
# info to link and to load. The one-time cost is that every dependency
# recompiles once, 2m20s here. See tools/disk.py on why generations pile up.
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.bench]
inherits = "release"
debug = true
