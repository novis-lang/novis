[package]
name = "nvs-abi-probe"
description = "Architecture invariants and cost baselines for Novis's calling convention, coroutines and extension sandbox"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The wasm probes pull in wasmtime, which is ~1 minute of build time we do not
# want on every `cargo build` for the ~18 months before M9. CI runs a dedicated
# job with this feature on; day-to-day work on the front end does not pay for it.
wasm-probe = ["dep:wasmtime"]

[dependencies]
anyhow.workspace = true
cranelift.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
corosensei.workspace = true
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
# How this crate's tests reach files outside the package.
nvs-repo.workspace = true
# The typed-arithmetic-loop guards in `tests/perf_guards.rs` compile
# `examples/arith.nvs` through the real pipeline: ADR 0007's "mandatory types
# pay for themselves" is a claim about what the *compiler* emits, so a
# hand-built approximation of it would not test the claim. Dev-only, so nothing
# shipped depends on this crate depending on the compiler.
nvs-diagnostics.workspace = true
nvs-syntax.workspace = true
nvs-hir.workspace = true
nvs-types.workspace = true
nvs-ir.workspace = true
nvs-codegen.workspace = true
nvs-runtime.workspace = true
# The raise guard prices what a `throw` renders for its own backtrace frame,
# and the site it renders from is a `nvs_render::Source` the compiled unit
# baked — so the fixture encodes a real one rather than a byte string shaped
# like one.
nvs-render.workspace = true
# ADR 0009 § 2's granularity guard measures the seam `Core\Str` actually calls
# (`nvs_stdlib::granularity`), not a re-implementation of it — the same reason
# the arithmetic guards compile the real fixture.
nvs-stdlib.workspace = true
# The isolation bench's third arm measures ADR 0006's boundary itself rather
# than the coroutine standing in for it, and `nvs_host::Isolate` is that
# boundary — the same reason the granularity guard above links the real seam.
nvs-host.workspace = true

[[bench]]
name = "abi"
harness = false

[[bench]]
name = "coroutine"
harness = false

[[bench]]
name = "isolation"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "wasm_boundary"
harness = false
required-features = ["wasm-probe"]

# ---------------------------------------------------------------------------
# This crate cannot inherit the workspace lint policy: calling JIT-compiled
# code requires transmuting a code pointer to a function pointer, and the probe
# helpers dereference pointers that codegen supplies. `deny` rather than the
# workspace's `forbid`, so the handful of genuinely necessary blocks can be
# allowed individually with a stated reason.
#
# This does not widen Novis's own unsafe surface: the crate is `publish = false`,
# is not a dependency of any shipped crate, and exists only to check that the
# platform still behaves the way the ADRs assume.
# ---------------------------------------------------------------------------

# @generated by tools/lints.py -- edit `[workspace.lints]` in the root manifest.
# This crate is on that script's `UNSAFE_CRATES` roster, so it restates the
# workspace table with `unsafe_code = "deny"`: cargo will not let a manifest
# inherit `[workspace.lints]` and override one entry, and `forbid` is not
# something an individual `#[allow(unsafe_code, reason = ...)]` can relax.

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
checked_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
