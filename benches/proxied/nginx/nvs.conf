# nginx in front of `nvs serve`. `benches/proxied/README.md` owns why there is a proxy here at all.
#
# This file and `php.conf` beside it are kept deliberately line-for-line parallel: everything outside
# the one `location` block is identical, so a diff between them shows the backend directive and
# nothing else. A tuning change made to one and forgotten in the other is the quietest way for this
# benchmark to start lying, and a two-line diff is what makes that visible.

# Fixed rather than `auto`. `auto` reads the *host's* core count, not the container's `cpus` budget,
# so on this box it would start 16 workers inside a 4-core allowance and spend the difference on
# scheduling. Both stacks pin the same number against the same budget.
worker_processes 4;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Off, and this is a measurement decision rather than tidiness: an access log is a write per
    # request, and at tens of thousands of requests a second it measures the container's filesystem
    # in the middle of a number about a language runtime.
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # The generator holds its connections open, so nginx must too or the run measures handshakes.
    # 10k is comfortably above any `--requests` this leg takes, which keeps the count of accepts a
    # constant instead of a function of the request count.
    keepalive_timeout 65;
    keepalive_requests 10000;

    # The pool nginx keeps to the backend. Without it every proxied request opens a new upstream
    # connection and the benchmark reports connection setup on both sides of the proxy.
    # 16, matching `php.conf` exactly. Nothing on this side requires it -- `nvs serve` multiplexes
    # its connections over its workers and no connection binds anything -- but the two files are
    # kept line-for-line parallel so that a diff between them shows the backend and nothing else,
    # and a proxy tuned differently for the two peers is the benchmark measuring the proxy.
    upstream backend {
        server nvs:8080;
        keepalive 16;
    }

    server {
        listen 80 backlog=4096;
        server_name _;

        location / {
            proxy_pass http://backend;

            # Both are required for the `keepalive` above to have any effect: HTTP/1.0 is the
            # default to an upstream and has no persistent connection, and the inbound `Connection`
            # header is otherwise forwarded and closes the pooled one.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ADR 0097 § 6's forwarded-header walk is what reads these, and they are set because a
            # proxied origin that is never told the client is not the deployment this file exists to
            # measure. `nvs serve` only trusts them from a peer `[server] trusted_proxies` names, so
            # on the default configuration below they are parsed and ignored -- which is the correct
            # cost to be paying here, since an operator who configures trust pays the same parse.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
