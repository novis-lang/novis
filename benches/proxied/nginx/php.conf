# nginx in front of PHP-FPM. `benches/proxied/README.md` owns why there is a proxy here at all.
#
# This file and `nvs.conf` beside it are kept deliberately line-for-line parallel: everything outside
# the one `location` block is identical, so a diff between them shows the backend directive and
# nothing else. A tuning change made to one and forgotten in the other is the quietest way for this
# benchmark to start lying, and a two-line diff is what makes that visible.

# Fixed rather than `auto`. `auto` reads the *host's* core count, not the container's `cpus` budget,
# so on this box it would start 16 workers inside a 4-core allowance and spend the difference on
# scheduling. Both stacks pin the same number against the same budget.
worker_processes 4;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Off, and this is a measurement decision rather than tidiness: an access log is a write per
    # request, and at tens of thousands of requests a second it measures the container's filesystem
    # in the middle of a number about a language runtime.
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # The generator holds its connections open, so nginx must too or the run measures handshakes.
    # 10k is comfortably above any `--requests` this leg takes, which keeps the count of accepts a
    # constant instead of a function of the request count.
    keepalive_timeout 65;
    keepalive_requests 10000;

    # The pool nginx keeps to the backend. Without it every proxied request opens a new upstream
    # connection and the benchmark reports connection setup on both sides of the proxy.
    #
    # **16, and it must stay well under `pm.max_children`.** A FastCGI worker that is holding a
    # keep-alive connection is *bound* to it and accepts nothing else, so an idle pool larger than
    # the worker count starves the pool it is meant to serve: requests are accepted by the kernel
    # and answered by nobody. With `worker_processes 4` this caps idle upstream connections at 64,
    # and `bun nv bench-proxied` never renders fewer than 96 children.
    upstream backend {
        server php:9000;
        keepalive 16;
    }

    server {
        listen 80 backlog=4096;
        server_name _;

        location / {
            fastcgi_pass backend;

            # Required for the `keepalive` above to have any effect on a FastCGI upstream: without
            # it nginx closes the upstream connection after every response and the pool is inert.
            fastcgi_keep_conn on;

            include /etc/nginx/fastcgi_params;

            # The script is named here as a literal and is never derived from the request URI. That
            # is the ordinary hardening for a FastCGI deployment, and here it also keeps the two
            # stacks comparable: the Novis side cannot derive a path from a URL at all
            # (ADR 0097 § 2), so letting nginx do it on this side would be measuring a document-root
            # walk against a table lookup rather than measuring two runtimes.
            fastcgi_param SCRIPT_FILENAME /app/hello.php;
            fastcgi_param SCRIPT_NAME /hello.php;
            fastcgi_param DOCUMENT_ROOT /app;
        }
    }
}
