; PHP's side of the comparison, tuned to its own advantage. `benches/proxied/README.md` § *Tuning is
; a variable we own* is the rule this file follows: where a setting has a defensible range, take the
; end that favours PHP, because a benchmark of oneself against a badly configured peer measures the
; configuration.
;
; OPcache is compiled into `php:8.5.9-fpm` and off until an ini turns it on, so without this file the
; baseline would be PHP recompiling `hello.php` on every request -- a number roughly an order of
; magnitude below what anyone runs in production, and the most flattering possible mistake for us to
; make by accident.
;
; **There is deliberately no `zend_extension=opcache` line.** In this image OPcache is linked in
; statically -- `php -m` lists it with no ini at all -- so that directive finds no `opcache.so` and
; PHP prints `Failed loading Zend extension 'opcache'` on every invocation. The keys below still take
; effect either way, which is what makes the mistake worth a comment: the warning goes to stderr, the
; benchmark runs, and nothing in the result says the peer was misconfigured.

opcache.enable=1

; Off, because nothing here runs PHP from the command line and enabling it would only add a second
; compilation of the same file at a moment nothing is timing.
opcache.enable_cli=0

; Far above what one small file needs. The point is that the cache can never fill and start evicting
; mid-run, which would show up as a stall no line of the record could explain.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000

; **The production setting, and the one that matters most here.** With timestamp validation on, every
; request stats the file to see whether it changed; off, the compiled form is trusted for the life of
; the process. Leaving it on would have PHP paying a syscall per request that the Novis side does not
; pay -- ADR 0017's `never` mode is the same decision, and this leg holds both peers to it.
opcache.validate_timestamps=0

; Tracing JIT with a buffer it cannot exhaust. `bun nv bench`'s other leg runs PHP in the same mode
; and calls it `php_mode: jit`; this leg records the ini values instead, because here they are ours.
opcache.jit=tracing
opcache.jit_buffer_size=128M

; Fewer preliminary runs before the tracing JIT commits, so the compiled form is reached early in a
; run rather than partway through it. The alternative is a warm-up phase in the driver, and a peer
; that is warm by its own configuration is a cleaner arrangement than one the harness has to nurse.
opcache.jit_hot_func=64
opcache.jit_hot_loop=64
