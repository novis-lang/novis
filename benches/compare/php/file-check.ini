; PHP's own file check, on, for every case and row of the comparison. `compose.php.yaml` mounts this
; after `benches/proxied/php/opcache.ini`, which turns the check off for the proxied leg.
;
; These are PHP's defaults: opcache checks a file's timestamp at most once per `revalidate_freq`
; seconds, so a copied file is live within two seconds and no request pays a stat in between. Novis
; runs its own check at its default too, once per `[opcache] revalidate_freq` (`2s`) in the background.
; The comparison sets both servers that take a new file without a restart at the same rate, so a speed
; case and the live-edit and deploy rows all measure the same configuration of PHP.

opcache.validate_timestamps=1
opcache.revalidate_freq=2
