# Node.js: nginx with TLS in front of `node:http`, with `node:cluster` starting one worker per CPU of the budget.
#
# One file per peer, as `benches/proxied/` has, so two stacks are never up at once by accident.
# nginx and `oha` come from `compose.common.yaml`. `bun nv bench-compare` sets every variable below.

name: nvs-compare-node

services:
  app:
    image: node:26.13.1-trixie-slim

    cpus: ${BACKEND_CPUS:?the driver sets BACKEND_CPUS}

    # The `loop`, `memory` and `flood` rows' cap, as `compose.nvs.yaml` says.
    mem_limit: ${BACKEND_MEMORY:?the driver sets BACKEND_MEMORY}
    memswap_limit: ${BACKEND_MEMORY:?the driver sets BACKEND_MEMORY}

    # Started again when it exits, as `compose.nvs.yaml` says.
    restart: unless-stopped

    # `node/serve.mjs` forks this many cluster workers. One per CPU of the budget is the cluster
    # documentation's own example.
    # `APP_DIR` is the folder `serve.mjs` imports the case from, as `compose.nvs.yaml` says. The deploy
    # programs read their part count from `DEPLOY_PARTS`.
    environment:
      WORKERS: ${BACKEND_CPUS:?the driver sets BACKEND_CPUS}
      APP_DIR: ${APP_DIR:?the driver sets APP_DIR}
      DEPLOY_PARTS: ${DEPLOY_PARTS:-}

    volumes:
      # The case's folder read-only, or the deploy rows' `site` volume, as `compose.nvs.yaml` says.
      - ${APP_SOURCE:?the driver sets APP_SOURCE}:/app:${APP_MOUNT_MODE:?the driver sets APP_MOUNT_MODE}
      - ./node/serve.mjs:/srv/serve.mjs:ro
      - ./deploy/deploy.sh:/srv/deploy.sh:ro

    command: ["node", "/srv/serve.mjs"]

    # A TCP connect, made by Node itself because the slim image has no curl: not every case has a
    # route at `/`.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(8080, '127.0.0.1').on('connect', function () { this.end() }).on('error', () => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 2s

  nginx:
    extends: { file: compose.common.yaml, service: nginx }
    depends_on:
      app:
        condition: service_healthy

  oha:
    extends: { file: compose.common.yaml, service: oha }

# The deploy rows' program, as `compose.nvs.yaml` says.
volumes:
  site: {}
