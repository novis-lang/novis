# Bun: nginx with TLS in front of `Bun.serve`, one process per CPU of the budget sharing the port.
#
# One file per peer, as `benches/proxied/` has, so two stacks are never up at once by accident.
# nginx and `oha` come from `compose.common.yaml`. `bun nv bench-compare` sets every variable below.

name: nvs-compare-bun

services:
  app:
    image: oven/bun:1.4.3-slim

    cpus: ${BACKEND_CPUS:?the driver sets BACKEND_CPUS}

    # The `loop` and `memory` rows' cap, as `compose.nvs.yaml` says.
    mem_limit: ${BACKEND_MEMORY:?the driver sets BACKEND_MEMORY}
    memswap_limit: ${BACKEND_MEMORY:?the driver sets BACKEND_MEMORY}

    # Started again when it exits, as `compose.nvs.yaml` says.
    restart: unless-stopped

    # `bun/serve.ts` starts this many processes, each with `reusePort`. One per CPU of the budget is
    # Bun's own advice for using more than one core.
    # `APP_DIR` is the folder `serve.ts` imports the case from, as `compose.nvs.yaml` says. The deploy
    # programs read their part count from `DEPLOY_PARTS`.
    environment:
      WORKERS: ${BACKEND_CPUS:?the driver sets BACKEND_CPUS}
      APP_DIR: ${APP_DIR:?the driver sets APP_DIR}
      DEPLOY_PARTS: ${DEPLOY_PARTS:-}

    volumes:
      # Read-only, as `compose.nvs.yaml` says.
      - ./${TREE:?the driver sets TREE}/${CASE:?the driver sets CASE}:/app:${APP_MOUNT_MODE:?the driver sets APP_MOUNT_MODE}
      - ./bun/serve.ts:/srv/serve.ts:ro

    command: ["bun", "/srv/serve.ts"]

    # A TCP connect, made by Bun itself because the slim image has no curl: not every case has a
    # route at `/`.
    healthcheck:
      test: ["CMD", "bun", "-e", "(await Bun.connect({ hostname: '127.0.0.1', port: 8080, socket: { data() {} } })).end()"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 2s

  nginx:
    extends: { file: compose.common.yaml, service: nginx }
    depends_on:
      app:
        condition: service_healthy

  oha:
    extends: { file: compose.common.yaml, service: oha }
