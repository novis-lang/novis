# nginx in front of PHP-FPM, which speaks FastCGI and nothing else.
#
# This file and `http.conf` beside it are kept line-for-line parallel: everything outside the
# `upstream` block and the backend directives in `location /` is identical, so a diff between them shows
# the backend and nothing else. `benches/proxied/nginx/php.conf` is why each tuning line is what it is,
# and why `keepalive 16` must stay well under the pool's `pm.max_children`.

# Fixed rather than `auto`, which reads the host's core count and not the container's `cpus` budget.
worker_processes 4;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream backend {
        server app:9000;
        keepalive 16;
    }

    server {
        # TLS 1.3 only, and HTTP/1.1: what a browser reaches, terminated where every peer's
        # deployment terminates it. The certificate is self-signed and `oha` runs with `--insecure`.
        listen 443 ssl backlog=4096;
        server_name _;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # The healthcheck's, answered by nginx alone so the stack is ready whatever routes a case has.
        location = /.nginx-health {
            return 204;
        }

        location / {
            fastcgi_pass backend;
            fastcgi_keep_conn on;

            include /etc/nginx/fastcgi_params;

            # One script per case, named as a literal and never derived from the URI. Every route of a
            # case is that script's to dispatch, as every route is one program's on the other peers.
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app;
        }
    }
}
