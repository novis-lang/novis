# nginx in front of PHP-FPM for the `deploy-switch` row, which serves a `current` link to a release.
#
# This file and `fastcgi.conf` beside it are kept line-for-line parallel: everything outside `location /`'s
# `root` and the two lines that name the script is identical, so a diff between them shows the switch and
# nothing else. `$realpath_root` is the link resolved once per request, so PHP-FPM sees the release's own
# path and every file of one request comes from one release. It is what PHP's deploy tools document for a
# symlink switch, and `benches/compare/README.md` is why the row uses it.

# Fixed rather than `auto`, which reads the host's core count and not the container's `cpus` budget.
worker_processes 4;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream backend {
        server app:9000;
        keepalive 16;
    }

    server {
        # TLS 1.3 only, and HTTP/1.1: what a browser reaches, terminated where every peer's
        # deployment terminates it. The certificate is self-signed and `oha` runs with `--insecure`.
        listen 443 ssl backlog=4096;
        server_name _;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # The healthcheck's, answered by nginx alone so the stack is ready whatever routes a case has.
        location = /.nginx-health {
            return 204;
        }

        location / {
            root /app/current;

            fastcgi_pass backend;
            fastcgi_keep_conn on;

            include /etc/nginx/fastcgi_params;

            # One script per case, named as a literal and never derived from the URI. Every route of a
            # case is that script's to dispatch, as every route is one program's on the other peers.
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }
    }
}
