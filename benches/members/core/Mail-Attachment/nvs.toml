# The benches send mail through this block. `capture = true` keeps each message
# and sends nothing, so no mail leaves the computer.
[mail.shop]
capture = true
from = "shop@example.com"

[capabilities.mail]
send = ["shop"]

# The benches may read files in the `files` folder beside this file, and no other file.
[capabilities.fs]
read = ["files"]
