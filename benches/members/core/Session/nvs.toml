# The session benches use the Redis server on this computer at port 16379 as
# the session store, and allow the program to use it. No `// requires:` value
# names Redis yet, so a sweep on a computer without it fails these benches.
[capabilities.cache]
shared = true

[session]
backend = "shared"

[cache.shared]
url = "redis://127.0.0.1:16379"
