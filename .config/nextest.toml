# cargo-nextest's settings. CI's `test` job runs the workspace's tests under the `ci` profile, and the
# Miri jobs under `miri` (`.github/workflows/ci.yml`). Each test is a process of its own, so a test
# that fails, hangs or crashes its process fails alone and the run goes on to list every other result.

# The one test that starts Windows PowerShell twice and waits for the first one to print. Under
# nextest every core runs a test from any binary, and on the 4-core Windows runner PowerShell's start
# went past 60 seconds under the whole workspace's load. Alone it took about 14 seconds there, and
# reserving every test thread keeps every other test off the machine for those seconds.
[[profile.default.overrides]]
filter = 'binary(run_command) & test(=a_spawned_process_holds_none_of_nvs_s_handles_and_only_it_ends_when_nvs_is_killed)'
threads-required = 'num-test-threads'

[profile.ci]
# Every failure in the run is listed, not only the first one.
fail-fast = false

[profile.miri]
fail-fast = false
# Each Miri process loads the whole test crate, about 1 GB resident on `nvs-stdlib`, and nextest
# starts one per CPU by default. Sixteen of them swap on a 16-CPU machine with 16 GB; eight are
# about 9 GB. CI's runner has 4 CPUs and is bound by them, so the cap costs it no time.
test-threads = 8
# A test still running after five minutes is stopped and reported as a failure. A test that is only
# slow under Miri takes a smaller input under `cfg!(miri)` instead.
slow-timeout = { period = "60s", terminate-after = 5 }

# `bun nv deep`'s Miri units, on a machine faster than CI's runner. CI runs each crate in shards of 4
# threads, and a test there took more than four times as long as here: 74 s here passed, and over
# 300 s there failed. So a test is stopped here at 60 s, a fifth of CI's bound.
[profile.miri-deep]
inherits = "miri"
slow-timeout = { period = "30s", terminate-after = 2 }
