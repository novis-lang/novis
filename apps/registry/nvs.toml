# The accounts and passkeys are kept in the SQLite file `registry.sqlite`, next to this file.
# Novis creates the file when the first request opens the database.
[db.registry]
driver = "sqlite"
path = "registry.sqlite"

# A request may read `hosting.json`, which has the address of the site and the other settings
# of this installation. It may read and write the archives in `builds`, which `nvs registry build` writes.
# It may read and write `work`, where the registry makes and signs the public files, and `files`,
# the store that `nvs pkg` reads them from. It may write `backup`, the store for the copies of the
# database. The tests read `fixtures`.
[capabilities.fs]
read = ["hosting.json", "builds", "work", "files", "backup", "fixtures"]
write = ["builds", "work", "files", "backup"]

# The scheduled work runs the scripts in `jobs`.
[capabilities.script]
spawn = ["jobs/"]

# Once a day, the registry signs every index file again and sends the index files to every store.
# It also adds to the log every release that a failed publish left out.
# The registry runs on one computer, because its database is one SQLite file.
[[schedule]]
name = "daily"
cron = "0 3 * * *"
script = "jobs/daily.nvs"
scope = "host"

# Every minute, the registry checks whether to copy its database to the backup store.
# It copies when `backupMinutes` from `hosting.json` have passed and something changed.
[[schedule]]
name = "backup"
cron = "* * * * *"
script = "jobs/backup.nvs"
scope = "host"

# Every minute, the registry sends the webhook messages that failed again.
# A message gets five tries over about seven hours.
[[schedule]]
name = "webhooks"
cron = "* * * * *"
script = "jobs/webhooks.nvs"
scope = "host"

# The program may open this database and no other.
[capabilities.db]
connect = ["registry"]
