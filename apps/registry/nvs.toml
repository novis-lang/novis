# The accounts and passkeys are kept in the SQLite file `registry.sqlite`, next to this file.
# Novis creates the file when the first request opens the database.
[db.registry]
driver = "sqlite"
path = "registry.sqlite"

# A request may read `hosting.json`, which has the address of the site and the other settings
# of this installation. It may read and write the archives in `builds`, which `nvs registry build` writes.
# It may read and write `work`, where the registry makes and signs the public files, and `files`,
# the store that `nvs pkg` reads them from. It may write `backup`, the store for the copies of the
# database. The tests read `fixtures`.
[capabilities.fs]
read = ["hosting.json", "builds", "work", "files", "backup", "fixtures"]
write = ["builds", "work", "files", "backup"]

# The program may open this database and no other.
[capabilities.db]
connect = ["registry"]
