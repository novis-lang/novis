# The server runs with the settings for production.
[mode]
default = "production"

# No line the server writes has the address of the sender, not even a line for an error.
[log]
client_ip = false

# The server listens on port 8141. The other apps in this repository use other ports,
# so all of them can run at the same time.
# Caddy runs on the same machine and sends each request from 127.0.0.1. The server reads
# the address of the sender from Caddy's `X-Forwarded-For` header.
[server]
listen = ["127.0.0.1:8141"]
trusted_proxies = ["127.0.0.1"]

# A report has at most 4096 bytes. The server does not read a larger body into memory.
[limits]
request_body = "4K"

# The weekly totals are kept in the SQLite file `telemetry.sqlite`, next to this file.
# Novis creates the file when the first request opens the database.
[db.telemetry]
driver = "sqlite"
path = "telemetry.sqlite"

# The tests use this database. It is kept in memory and deleted when the tests end.
[db.scratch]
driver = "sqlite"
path = ":memory:"

# A request may read these two files and no other file. `known.toml` has the values a report
# may name. `REVISION` has the commit that the footer shows.
[capabilities.fs]
read = ["known.toml", "REVISION"]

# The program may open these two databases and no other.
[capabilities.db]
connect = ["telemetry", "scratch"]
