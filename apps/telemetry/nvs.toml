# The server runs with the settings for production.
[mode]
default = "production"

# No line the server writes has the address of the sender, not even a line for an error.
[log]
client_ip = false

# A report has at most 4096 bytes. The server does not read a larger body into memory.
[limits]
request_body = "4K"

# The weekly totals are kept in the SQLite file `telemetry.sqlite`, next to this file.
# Novis creates the file when the first request opens the database.
[db.telemetry]
driver = "sqlite"
path = "telemetry.sqlite"

# The tests use this database. It is kept in memory and deleted when the tests end.
[db.scratch]
driver = "sqlite"
path = ":memory:"

# The program may open these two databases and no other.
[capabilities.db]
connect = ["telemetry", "scratch"]
