# The settings that change on a production server. `production.toml` reads this file
# after `../nvs.toml`, so each line here replaces the line of the same name there.

# Production mode. Error pages do not show the message of an error,
# and the server sends no file and runs no `.nvs` file by its path.
[mode]
default = "production"

[server]
# Only programs on this machine can connect. The reverse proxy is one of them.
listen = ["127.0.0.1:8144"]
# On Linux, a Unix socket is better. Write these two lines in place of `listen` above,
# and add the account of the proxy to the group of the server:
#
#     listen = ["/run/chat/nvs.sock"]
#     socket_mode = "0660"

# The proxy connects from this address. Novis then reads `X-Forwarded-Proto` and
# `X-Forwarded-For` from it. Without this line, every WebSocket gets the status 403,
# because the `Origin` of the browser starts with `https` and Novis sees `http`.
# Keep this line with a Unix socket too: an empty list reads no forwarded header.
trusted_proxies = ["127.0.0.1"]

# The database is outside the folder of the app. The account of the service may write
# here, and it does not need to write to the code of the app.
[db.chat]
path = "/var/lib/chat/chat.sqlite"

# A request and a WebSocket connection may each use at most 32 MB of memory.
# `App::socket` gives each connection a lower limit of 8 MB.
# This file sets no `wall_time`. That limit also applies to a WebSocket connection,
# so it would close every chat after that time.
[limits]
memory = "32M"

# No program may raise its memory limit above 64 MB.
[limits.hard]
memory = "64M"
