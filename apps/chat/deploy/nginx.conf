# nginx in front of Chat. Copy this file to /etc/nginx/conf.d/chat.conf and write your own
# host name in place of chat.example.com. The certificate paths are the ones of Let's Encrypt.

# Each client address may send 20 requests per second, with short bursts of up to 100.
limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/s;
# Each client address may keep 20 connections open. Each open room page needs one.
limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

# A WebSocket request sends "Connection: upgrade" to Novis.
# Every other request sends an empty value, so the connection to Novis stays open.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream chat {
    server 127.0.0.1:8144;
    # With a Unix socket, write this line in place of the line above:
    # server unix:/run/chat/nvs.sock;

    # Keep up to 16 unused connections to Novis open for each nginx worker.
    keepalive 16;
    # Shorter than the 75 seconds after which Novis closes an unused connection.
    keepalive_timeout 60s;
}

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The forms of Chat are small. A larger body gets the status 413.
    client_max_body_size 64k;
    # The same limit as `header_timeout` in Novis.
    client_header_timeout 10s;

    limit_req zone=chat burst=100 nodelay;
    limit_req_status 429;
    limit_conn chat_conn 20;
    limit_conn_status 429;

    location / {
        proxy_pass http://chat;
        # A WebSocket starts from an HTTP/1.1 request, so nginx must speak HTTP/1.1 to Novis.
        proxy_http_version 1.1;
        # Novis compares the `Origin` of the browser with this host. Keep it unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx closes a connection that sends nothing for 60 seconds by default.
        # 6 minutes is longer than the 5 minutes after which Novis closes a quiet WebSocket.
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;
    }
}
