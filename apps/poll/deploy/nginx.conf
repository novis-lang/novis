# The proxy for the poll on nginx. Copy this file to /etc/nginx/conf.d/poll.conf.
# Change poll.example.com to the host name of your server, and the paths of the certificate.

upstream poll {
    # Novis listens on this Unix socket. It is `listen` in deploy/production.toml.
    # For a server on TCP, write `server 127.0.0.1:8145;` here.
    server unix:/run/poll/nvs.sock;

    # Keep up to 16 unused connections to Novis open for each nginx worker.
    keepalive 16;
    # Shorter than the 75 seconds after which Novis closes an unused connection.
    keepalive_timeout 60s;
}

# Plain HTTP only sends the browser to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name poll.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poll.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/poll.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poll.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A new poll or a vote is a small form. Novis allows larger bodies, but this app needs no more.
    client_max_body_size 64k;

    location / {
        proxy_pass http://poll;
        # These two lines keep the connections to Novis open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Novis compares `Origin` with this host and this scheme. Keep both lines.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# Event streams need no setting. Novis sends `X-Accel-Buffering: no`, so nginx sends each event at once.
# On a quiet stream, Novis writes a keep-alive line every 15 seconds with the default settings.
# So nginx does not close a stream when nobody votes for a while.
